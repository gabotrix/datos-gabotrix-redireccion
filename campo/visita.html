<html lang="es" data-theme="light">
<head><script>
/* Guardián del dominio viejo (v2, 29-sep-2026).

   Lo que un teléfono guardó sin enviar vive en el almacenamiento de ESTE dominio, y el nuevo no puede leerlo. La v1
   se quedaba aquí con un aviso amarillo mientras hubiera algo «sin enviar», y contaba como tal cualquier visita no
   enviada, también las vacías de «Nueva visita»: casi nadie salía nunca. La v2 se lleva el trabajo en vez de
   esperar a que se acabe:

     1. Pendiente es solo lo que tiene contenido: una visita terminada («lista») o una pasada del primer paso.
     2. Sin nada pendiente, directo al dominio nuevo.
     3. Con pendientes y con señal: primero se deja a la app enviar las terminadas, como hace siempre (hasta un
        minuto). Lo que quede se sube como borrador a campo-borrador —respuestas y cada fotografía, como la copia de
        respaldo que la app ya hace— y se pasa al dominio nuevo. Allí sale «Hay trabajo guardado en el servidor» y
        cada visita vuelve con «Traer», fotos incluidas.
     4. Sin señal, o si algo no sube: la app funciona aquí como siempre, sin aviso, y se reintenta al volver a abrir.
     5. Una visita con documentos (PDF) no cabe en un borrador: esa se envía desde aquí, y solo entonces sale una nota.

   Nada se borra de este teléfono: lo subido queda anotado (psismo.migradoAlNuevo, con la hora de su último cambio)
   para no volver a subirlo, y si la visita cambiara después se subiría otra vez.

   v3 (29-sep-2026): el iPhone de un ingeniero, con 253 MB de visitas guardadas, mostraba «Ocurrió un problema varias
   veces» y no abría. La v2 leía TODAS las visitas de una vez (getAll, fotos incluidas) mientras la app hacía lo
   mismo, y las volvía a leer cada 4 s esperando las terminadas: dos o tres copias de todo en memoria, y Safari cierra
   la página. Ahora se recorren de una en una y solo se guarda lo ligero (id, estado, paso); cada visita se lee
   entera en el momento de subirla y se suelta después.
   Y si el teléfono no alcanza a leer sus visitas (una lectura que no termina), la v2 lo tomaba por «no hay nada» y
   se iba al dominio nuevo, dejando el trabajo atrás sin forma de volver a él. Ahora no leer no es «no hay nada»: se
   queda aquí, sin aviso, como sin señal. */
(function () {
  var NUEVO = 'https://manizalesconstruye.camacolcaldas.com';
  var API = 'https://ymbzpuxyvquvawfdntly.supabase.co/functions/v1/campo-borrador';
  var LS_MIGRADO = 'psismo.migradoAlNuevo';
  var ESPERA_LISTAS = 60000;
  window.__DOMINIO_VIEJO__ = true;

  /* La dirección con la que se abrió, tomada ya: al arrancar, la app limpia la barra (replaceState) y el ancla y los
     parámetros se perderían antes de irse. */
  var RUTA = location.pathname, BUSQUEDA = location.search, ANCLA = location.hash;
  function token() { try { return localStorage.getItem('psismo.token') || ''; } catch (e) { return ''; } }
  function tokenDelEnlace() { try { return new URLSearchParams(BUSQUEDA).get('e') || ''; } catch (e) { return ''; } }
  /* El enlace personal lleva ?e=<token>. Quien abre desde el icono no lo trae: se le pone el que el teléfono guardó,
     para que en el dominio nuevo no tenga que volver a pedir su enlace. */
  function destino() {
    var q = BUSQUEDA, t = token();
    if (t && !tokenDelEnlace()) q = (q ? q + '&' : '?') + 'e=' + encodeURIComponent(t);
    return NUEVO + RUTA + q + ANCLA;
  }
  function vete() { location.replace(destino()); }
  function leeJSON(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function migrado() { return leeJSON(LS_MIGRADO) || {}; }
  function anotaMigrado(v) { var m = migrado(); m[v.id] = v.tocada || 0; try { localStorage.setItem(LS_MIGRADO, JSON.stringify(m)); } catch (e) {} }

  function esFoto(x) { return typeof x === 'string' && /^data:image\/(jpeg|png|webp);base64,/i.test(x); }
  function esAdjunto(x) {
    if (!Array.isArray(x) || !x.length) return false;
    return x.some(function (y) { return (typeof y === 'string' && y.slice(0, 5) === 'data:') || (y && typeof y === 'object' && typeof y.datos === 'string'); });
  }
  function tieneDocumentos(v) {
    var D = v.D || {};
    return Object.keys(D).some(function (k) {
      return Array.isArray(D[k]) && D[k].some(function (y) { return (y && typeof y === 'object' && typeof y.datos === 'string') || (typeof y === 'string' && y.slice(0, 5) === 'data:' && !esFoto(y)); });
    });
  }
  function pendiente(v) { return !!(v && v.id && v.estado !== 'enviada' && (v.estado === 'lista' || (v.paso || 0) > 0)); }
  function porSubir(v) { return pendiente(v) && migrado()[v.id] !== (v.tocada || 0); }

  /* La base del teléfono, sin crearla si no existe: { d } abierta, { vacia } si no hay nada, o null si no se pudo
     abrir (bloqueada, rota o sin permiso). */
  function abreBase() {
    return new Promise(function (ok) {
      if (!window.indexedDB) return ok({ vacia: true });
      var listo = false, s, nueva = false;
      var reloj = setTimeout(function () { fin(null); }, 8000);
      function fin(r) {
        if (listo) { if (r && r.d) try { r.d.close(); } catch (e) {} return; }
        listo = true; clearTimeout(reloj); ok(r);
      }
      try { s = indexedDB.open('psismo'); } catch (e) { return fin(null); }
      s.onupgradeneeded = function (ev) { if (ev.oldVersion === 0) { nueva = true; try { s.transaction.abort(); } catch (e) {} } };
      s.onerror = function (ev) { try { ev.preventDefault(); } catch (e) {} fin(nueva ? { vacia: true } : null); };
      s.onblocked = function () { fin(null); };
      s.onsuccess = function () {
        var d = s.result;
        /* Que la app pueda abrir o actualizar la base aunque esta lectura siga en curso. */
        d.onversionchange = function () { try { d.close(); } catch (e) {} };
        if (!d.objectStoreNames.contains('visitas')) { try { d.close(); } catch (e) {} return fin({ vacia: true }); }
        fin({ d: d });
      };
    });
  }
  /* Lo que hace falta para decidir, sin las fotos: es lo único que se guarda de cada visita mientras se recorren. */
  function ligera(v) {
    return { id: v.id, estado: v.estado, paso: v.paso || 0, tocada: v.tocada || 0, docs: tieneDocumentos(v) };
  }
  /* Las visitas de IndexedDB de una en una (cursor), quedándose solo con lo ligero. El reloj se reinicia con cada
     visita leída: un teléfono con cientos de megas tarda, pero avanza; lo que no avanza en 15 s es que no se puede. */
  function leeLigero() {
    return abreBase().then(function (b) {
      if (!b) return null;
      if (b.vacia) return [];
      return new Promise(function (ok) {
        var l = [], listo = false, reloj = null;
        function fin(x) { if (listo) return; listo = true; clearTimeout(reloj); try { b.d.close(); } catch (e) {} ok(x); }
        function arma() { clearTimeout(reloj); reloj = setTimeout(function () { fin(null); }, 15000); }
        arma();
        try {
          var c = b.d.transaction('visitas', 'readonly').objectStore('visitas').openCursor();
          c.onsuccess = function () {
            var k = c.result;
            if (!k) return fin(l);
            if (k.value && k.value.id) l.push(ligera(k.value));
            arma(); k.continue();
          };
          c.onerror = function (ev) { try { ev.preventDefault(); } catch (e) {} fin(null); };
        } catch (e) { fin(null); }
      });
    });
  }
  /* Una visita entera (con sus fotos), solo cuando toca subirla. Sin IndexedDB, la del respaldo. */
  function leeUna(id) {
    return abreBase().then(function (b) {
      if (!b || b.vacia) return null;
      return new Promise(function (ok) {
        var listo = false, reloj = setTimeout(function () { fin(null); }, 30000);
        function fin(x) { if (listo) return; listo = true; clearTimeout(reloj); try { b.d.close(); } catch (e) {} ok(x); }
        try {
          var r = b.d.transaction('visitas', 'readonly').objectStore('visitas').get(id);
          r.onsuccess = function () { fin(r.result || null); };
          r.onerror = function (ev) { try { ev.preventDefault(); } catch (e) {} fin(null); };
        } catch (e) { fin(null); }
      });
    }).then(function (v) { return v || respaldo()[id] || null; });
  }
  /* El respaldo de localStorage: las respuestas sin las fotos. Es lo que usa la app cuando IndexedDB no abre. */
  function respaldo() {
    var t = leeJSON('psismo.visitas') || {}, porId = {};
    Object.keys(t).forEach(function (k) { if (t[k] && t[k].id) porId[t[k].id] = t[k]; });
    return porId;
  }
  /* Las visitas de este teléfono en ligero: las de IndexedDB y, además, las que solo estén en el respaldo. null si
     IndexedDB existe y no se pudo leer: eso NO es «no hay nada», y quien llama se queda aquí. */
  function visitas() {
    return leeLigero().then(function (idb) {
      if (idb === null) return null;
      var porId = {}, R = respaldo();
      Object.keys(R).forEach(function (k) { porId[k] = ligera(R[k]); });
      idb.forEach(function (v) { porId[v.id] = v; });   /* la de IndexedDB manda: es la que lleva las fotos */
      return Object.keys(porId).map(function (k) { return porId[k]; });
    });
  }

  function pide(cuerpo) {
    var ctl = window.AbortController ? new AbortController() : null;
    var reloj = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
    return fetch(API, {
      method: 'POST', signal: ctl ? ctl.signal : undefined,
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify(cuerpo)
    }).then(function (r) { if (reloj) clearTimeout(reloj); if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function titulo(v) {
    var r = v.resumen;
    if (typeof r === 'string' && r) return r.slice(0, 200);
    if (r && typeof r === 'object') return String(r.direccion || r.codigo || 'Visita sin dirección').slice(0, 200);
    return 'Visita sin dirección';
  }
  function fotosDe(v) {
    var D = v.D || {}, l = [];
    Object.keys(D).forEach(function (k) {
      if (!Array.isArray(D[k]) || !/^[\w-]+$/.test(k)) return;
      D[k].forEach(function (x, i) { if (esFoto(x)) l.push({ campo: k, orden: i, datos: x }); });
    });
    return l;
  }
  /* Una visita al servidor: las respuestas y después cada foto. Si algo falla, no se da por subida. Se lee entera
     aquí, de la base, y al terminar se suelta: en memoria nunca hay más de una visita con sus fotos. */
  function sube(ligeraV, avance) {
    return leeUna(ligeraV.id).then(function (v) {
      if (!v) throw new Error('no se pudo leer ' + ligeraV.id);
      var R = {};
      Object.keys(v.D || {}).forEach(function (k) { if (k !== 'clave_dispositivo' && !esAdjunto(v.D[k])) R[k] = v.D[k]; });
      var fotos = fotosDe(v);
      return pide({ accion: 'guarda', visita: v.id, asignacion: v.asignacion || null, respuestas: R,
                    paso: v.paso || 0, resumen: titulo(v), dispositivo: ('dominio viejo · ' + (navigator.userAgent || '')).slice(0, 80) })
        .then(function () {
          return fotos.reduce(function (cadena, f, i) {
            return cadena.then(function () {
              avance(i + 1, fotos.length);
              return pide({ accion: 'foto', visita: v.id, campo: f.campo, orden: f.orden, datos: f.datos });
            });
          }, Promise.resolve());
        })
        .then(function () { anotaMigrado(v); return true; });
    });
  }

  /* ---- lo que se ve: una capa mientras se sube, y la nota de los documentos */
  var capa = null, parar = false;
  function muestra(txt) {
    if (!document.body) return;
    if (!capa) {
      capa = document.createElement('div');
      capa.id = 'mudanza';
      capa.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:rgba(15,36,71,.92);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center');
      capa.innerHTML = '<div style="max-width:340px"><div style="font-weight:700;font-size:17px;margin-bottom:8px">La app cambió de dirección</div>' +
        '<div id="mudanzaTxt"></div><div style="font-size:12.5px;opacity:.8;margin-top:10px">No cierre la app. Su trabajo sigue guardado en este teléfono.</div>' +
        '<button type="button" id="mudanzaNo" style="margin-top:18px;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:600 14px system-ui,sans-serif">Seguir aquí por ahora</button></div>';
      document.body.appendChild(capa);
      document.getElementById('mudanzaNo').onclick = function () { parar = true; quita(); };
    }
    document.getElementById('mudanzaTxt').textContent = txt;
  }
  function quita() { if (capa) { capa.remove(); capa = null; } }
  function notaDocumentos(n) {
    if (!document.body || document.getElementById('notaDominio')) return;
    try { if (sessionStorage.getItem('psismo.notaDominioCerrada') === '1') return; } catch (e) {}
    var b = document.createElement('div');
    b.id = 'notaDominio';
    b.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99998;background:#0f2447;color:#fff;font:600 13px/1.4 system-ui,sans-serif;padding:10px 52px 10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2)');
    b.innerHTML = '<div>' + (n === 1 ? 'Una visita tiene documentos adjuntos' : n + ' visitas tienen documentos adjuntos') +
      ' y se envía' + (n === 1 ? '' : 'n') + ' desde aquí. Cuando se envíe' + (n === 1 ? '' : 'n') + ', la app pasará sola a la dirección nueva.</div>' +
      '<button type="button" aria-label="Cerrar" style="position:absolute;top:50%;right:6px;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font:700 22px/40px system-ui,sans-serif;padding:0">×</button>';
    b.querySelector('button').onclick = function () { try { sessionStorage.setItem('psismo.notaDominioCerrada', '1'); } catch (e) {} b.remove(); };
    document.body.appendChild(b);
  }
  function cuandoHayCuerpo(fn) { if (document.body) fn(); else document.addEventListener('DOMContentLoaded', fn); }
  function espera(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

  /* Las terminadas las envía la app sola al arrancar con señal: se le da tiempo antes de subir nada. */
  function esperaListas(ids, desde) {
    return visitas().then(function (l) {
      if (l === null) throw new Error('no se pudieron leer las visitas');
      var quedan = l.filter(function (v) { return ids[v.id] && v.estado === 'lista'; }).length;
      if (!quedan || parar || Date.now() - desde > ESPERA_LISTAS) return l;
      muestra('Enviando ' + (quedan === 1 ? 'la visita terminada' : 'las ' + quedan + ' visitas terminadas') + '…');
      return espera(4000).then(function () { return esperaListas(ids, desde); });
    });
  }

  function mudanza() {
    return visitas().then(function (l) {
      /* sin poder leerlas no se sabe si hay trabajo aquí: se queda, sin aviso, y se reintenta al volver a abrir */
      if (l === null) return;
      var p = l.filter(porSubir);
      if (!p.length) return vete();
      if (!token() || navigator.onLine === false) return;        /* sin señal: se trabaja aquí, sin aviso */
      var ids = {}; p.forEach(function (v) { ids[v.id] = true; });
      return new Promise(function (ok) { cuandoHayCuerpo(ok); }).then(function () {
        var hayListas = p.some(function (v) { return v.estado === 'lista'; });
        muestra('Revisando las visitas de este teléfono…');
        return (hayListas ? esperaListas(ids, Date.now()) : Promise.resolve(l)).then(function (l2) {
          var resto = l2.filter(function (v) { return ids[v.id] && porSubir(v); });
          var conDocs = resto.filter(function (v) { return v.docs; }), subir = resto.filter(function (v) { return !v.docs; });
          var fallos = 0;
          return subir.reduce(function (cadena, v, i) {
            return cadena.then(function () {
              if (parar) return;
              var base = 'Pasando su trabajo a la dirección nueva: visita ' + (i + 1) + ' de ' + subir.length;
              muestra(base + '…');
              return sube(v, function (k, n) { muestra(base + ' · foto ' + k + ' de ' + n + '…'); })
                .catch(function () { fallos++; });
            });
          }, Promise.resolve()).then(function () {
            if (parar) return;
            if (!fallos && !conDocs.length) {
              muestra(subir.length
                ? 'Listo. En la dirección nueva toque «Traer» en ' + (subir.length === 1 ? 'la visita' : 'cada visita') + ' para seguir donde la dejó.'
                : 'Listo. Abriendo la dirección nueva…');
              return espera(subir.length ? 3500 : 800).then(vete);
            }
            quita();
            if (conDocs.length) notaDocumentos(conDocs.length);
            /* si algo no subió, se reintenta al volver a abrir la app, sin aviso */
          });
        });
      });
    }).catch(function () { quita(); });
  }
  mudanza();
})();

</script>

/* Sistema de diseño de la sala de datos (design-harmony-hub): DM Sans + Space Grotesk, tokens oklch, radio 1rem, píldoras.
   Sin cargas externas: tipografías y logo van incrustados para que la app abra sin conexión. */
:root{
  --radius:1rem;
  --background:oklch(0.975 0.004 247); --surface:oklch(1 0 0); --surface-2:oklch(0.96 0.008 247);
  --foreground:oklch(0.245 0.075 253); --muted-fg:oklch(0.51 0.025 250); --ink-3:oklch(0.62 0.02 250);
  --primary:oklch(0.245 0.075 253); --primary-fg:oklch(0.99 0 0); --secondary:oklch(0.845 0.174 89);
  --border:oklch(0.89 0.012 247); --input:oklch(0.88 0.014 247); --muted:oklch(0.95 0.008 247); --accent-soft:oklch(0.93 0.035 91);
  --verde:oklch(0.55 0.15 145); --amarillo:oklch(0.62 0.15 80); --rojo:oklch(0.6 0.22 22); --naranja:oklch(0.71 0.18 45);
  --verde-bg:color-mix(in oklab,oklch(0.82 0.19 132) 22%,white); --amarillo-bg:color-mix(in oklab,oklch(0.84 0.16 88) 25%,white);
  --rojo-bg:color-mix(in oklab,oklch(0.6 0.22 22) 12%,white); --info-bg:color-mix(in oklab,var(--primary) 8%,white);
  --gen:var(--muted-fg); --eval:oklch(0.45 0.1 240); --rep:oklch(0.5 0.12 80); --dem:var(--primary);
  --shadow-card:0 1px 2px color-mix(in oklab,var(--foreground) 6%,transparent),0 14px 34px -26px color-mix(in oklab,var(--foreground) 32%,transparent);
  --shadow-panel:0 18px 40px -28px color-mix(in oklab,var(--foreground) 30%,transparent);
  --font-sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  /* alias del código existente */
  --paper:var(--background); --card:var(--surface); --ink:var(--foreground); --ink-2:var(--muted-fg);
  --rule:var(--border); --rule-2:oklch(0.93 0.01 247); --field:var(--surface); --sel:var(--primary); --sel-ink:var(--primary-fg); --sombra:var(--shadow-card);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --background:oklch(0.18 0.02 250); --surface:oklch(0.23 0.02 250); --surface-2:oklch(0.27 0.02 250);
  --foreground:oklch(0.95 0.01 247); --muted-fg:oklch(0.72 0.02 250); --ink-3:oklch(0.6 0.02 250);
  --primary:oklch(0.845 0.174 89); --primary-fg:oklch(0.2 0.05 253); --border:oklch(0.32 0.02 250); --input:oklch(0.35 0.02 250); --muted:oklch(0.3 0.02 250);
  --accent-soft:oklch(0.3 0.04 90); --verde-bg:oklch(0.3 0.06 145); --amarillo-bg:oklch(0.32 0.06 80); --rojo-bg:oklch(0.3 0.08 22); --info-bg:oklch(0.28 0.04 250);
  --verde:oklch(0.75 0.15 145); --amarillo:oklch(0.8 0.15 80); --rojo:oklch(0.72 0.18 22); --eval:oklch(0.75 0.1 240);
}}
:root[data-theme="dark"]{
  --background:oklch(0.18 0.02 250); --surface:oklch(0.23 0.02 250); --surface-2:oklch(0.27 0.02 250);
  --foreground:oklch(0.95 0.01 247); --muted-fg:oklch(0.72 0.02 250); --ink-3:oklch(0.6 0.02 250);
  --primary:oklch(0.845 0.174 89); --primary-fg:oklch(0.2 0.05 253); --border:oklch(0.32 0.02 250); --input:oklch(0.35 0.02 250); --muted:oklch(0.3 0.02 250);
  --accent-soft:oklch(0.3 0.04 90); --verde-bg:oklch(0.3 0.06 145); --amarillo-bg:oklch(0.32 0.06 80); --rojo-bg:oklch(0.3 0.08 22); --info-bg:oklch(0.28 0.04 250);
  --verde:oklch(0.75 0.15 145); --amarillo:oklch(0.8 0.15 80); --rojo:oklch(0.72 0.18 22); --eval:oklch(0.75 0.1 240);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-color:var(--border)}
body{background:var(--background);color:var(--foreground);font-size:14px;line-height:1.45;font-family:var(--font-sans);overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
h1,h2,h3,.dsp{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit}

/* ---------- lienzo ---------- */
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
@media (min-width:900px){body{padding:12px 20px}.app{max-width:760px;min-height:calc(100vh - 24px)}}

/* ---------- marca (misma cabecera del visor) ---------- */
.marca{display:flex;align-items:center;gap:12px;padding:12px 16px 4px}
.marca .logo{height:40px;width:40px;border-radius:999px;background:oklch(0.245 0.075 253);display:grid;place-items:center;flex:none;overflow:hidden}
.marca .logo img{height:20px;width:auto;display:block}
.marca b{font-family:var(--font-display);font-weight:600;font-size:14px;display:block;line-height:1.2}
.marca span{font-size:10px;color:var(--muted-fg);letter-spacing:.04em}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--background) 94%,transparent);backdrop-filter:blur(8px);padding:10px 16px 0}
.toprow{display:flex;align-items:center;gap:10px;min-height:36px}
.mod{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--muted-fg));font-weight:600;white-space:nowrap;flex:0 1 auto;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.top h2{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paso-n{font:600 10.5px var(--font-display);color:var(--foreground);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
.barra{height:4px;background:var(--muted);border-radius:999px;margin:10px 0 8px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--secondary);transition:width .25s ease;width:0}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}
.salir{width:32px;height:32px;flex:none;border:1px solid var(--border);background:var(--surface);border-radius:50%;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.sinred{color:var(--amarillo);font-size:11px;line-height:1}

/* ---------- cuerpo: un panel por paso, campos separados por líneas ---------- */
main{flex:1;margin:0 12px 12px;padding:2px 16px 10px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
@media (min-width:900px){main{margin:0 0 12px;padding:6px 24px 16px}}
.f{padding:14px 0 15px;border-top:1px solid var(--border)}
.f:first-child,.sechead + .f,.nota + .f{border-top:0}
.f.err,.f.err-hijo{border-left:3px solid var(--rojo);padding-left:12px;margin-left:-15px}
.lab{display:block;font:600 10px var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:2px}
.req{color:var(--rojo)}
.hint{font-size:12px;color:var(--muted-fg);margin:2px 0 0;line-height:1.45}
/* «Puede marcar varias»: píldora bajo la etiqueta, para que se lea antes de tocar */
.varias{display:inline-flex;align-items:center;gap:6px;margin:4px 0 0;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--foreground);font:600 11px var(--font-sans);line-height:1.3}
.varias::before{content:"";width:9px;height:9px;flex:none;border-radius:2px;border:1.5px solid currentColor;box-shadow:3px -3px 0 -1.5px var(--accent-soft),3px -3px 0 0 currentColor}
/* datos del edificio traídos de otra visita: la oferta, arriba del paso, y la marca de cada dato traído */
.oferta{margin:12px 0 4px;padding:12px 14px;border:1px solid var(--primary);border-radius:calc(var(--radius) - 4px);background:var(--info-bg);font-size:12.5px;line-height:1.5}
.oferta p{margin:0 0 10px}
.oferta .bts{display:flex;flex-wrap:wrap;gap:8px}
.oferta .big{flex:1;min-width:120px;width:auto;margin:0}
.traido{display:inline-flex;align-items:center;margin:4px 0 0;padding:3px 10px;border-radius:999px;background:var(--info-bg);color:var(--foreground);font:600 11px var(--font-sans);line-height:1.3}
/* lo traído de otro paso: de dónde vino y los dos botones, a mano del pulgar */
.arrastre{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 0;padding:8px 10px;border-radius:calc(var(--radius) - 6px);background:var(--info-bg);color:var(--foreground);font:600 12px var(--font-sans);line-height:1.35}
.arrastre span{flex:1 1 100%}
.arrastre button{flex:1;min-height:36px;border:1px solid var(--primary);border-radius:999px;background:var(--surface);color:var(--foreground);font:600 12px var(--font-sans)}
.arrastre button+button{border-color:var(--border)}
.ctl{margin-top:8px}
.msg{font-size:12px;color:var(--rojo);margin-top:6px;font-weight:600;display:none}
.err > .msg{display:block}

/* segmentado en píldora */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;max-width:100%}
.seg button{min-height:34px;padding:6px 14px;border:0;background:none;border-radius:999px;font-weight:500;font-size:12.5px;color:var(--muted-fg);transition:background .15s,color .15s}
.seg button:hover{color:var(--foreground)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}

/* escala de daño */
.esc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.esc button{min-height:54px;border:1px solid transparent;background:var(--surface-2);border-radius:calc(var(--radius) - 4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px}
.esc button .g{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1}
.esc button .p{font-size:10px;color:var(--muted-fg)}
.esc button[aria-pressed="true"]{color:#fff}
.esc button[aria-pressed="true"] .p{color:rgba(255,255,255,.9)}
.esc button[data-v="n"][aria-pressed="true"]{background:var(--primary)}
.esc button[data-v="l"][aria-pressed="true"]{background:oklch(0.62 0.16 145)}
.esc button[data-v="m"][aria-pressed="true"]{background:var(--naranja)}
.esc button[data-v="s"][aria-pressed="true"]{background:var(--rojo)}
.esc-na{width:100%;margin-top:6px;min-height:40px;border:1px dashed var(--border);background:transparent;color:var(--muted-fg);border-radius:calc(var(--radius) - 4px);font-size:11.5px;padding:6px 10px}
.esc-na[aria-pressed="true"]{background:var(--surface-2);border-style:solid;border-color:var(--muted-fg);color:var(--foreground);font-weight:600}

/* ---------- firma trazada con el dedo ---------- */
.firma{display:block}
.firma-lienzo{display:block;width:100%;height:170px;background:#fff;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);touch-action:none;cursor:crosshair}
.firma-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.firma-guia{font-size:11.5px;color:var(--muted-fg)}
.firma-borra{min-height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);color:var(--foreground);border-radius:999px;font-size:12px;font-weight:600}
.firma-borra:disabled{opacity:.45}

/* opciones en lista */
.cards{display:flex;flex-direction:column;gap:6px}
@media (min-width:900px){.cards{display:grid;grid-template-columns:1fr 1fr}}
.cards button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--border);background:var(--surface);border-radius:calc(var(--radius) - 4px);font-size:13px;line-height:1.3;transition:background .15s}
.cards button:hover{background:var(--surface-2)}
.cards button::before{content:"";width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--input)}
.cards button[aria-pressed="true"]{border-color:var(--primary);background:var(--info-bg)}
.cards button[aria-pressed="true"]::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--surface)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:6px 12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--foreground)}
.chips button:hover{background:var(--surface-2)}
.chips button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
/* pisos: lo marcado que ya no está entre los del paso 3 se ve distinto, para poder quitarlo */
.chips button.fuera,.chips button.fuera[aria-pressed="true"]{border-style:dashed;border-color:var(--rojo);background:var(--rojo-bg);color:var(--foreground)}
.pisos-falta .big{margin-top:8px}

/* entradas */
.inp,select.inp,textarea.inp{width:100%;min-height:42px;padding:9px 12px;background:var(--surface);border:1px solid var(--input);border-radius:calc(var(--radius) - 6px);-webkit-appearance:none;appearance:none;font-size:15px}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted-fg) 50%),linear-gradient(135deg,var(--muted-fg) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus-visible,button:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.uni{display:flex;align-items:center;gap:10px}
.uni .inp{flex:1}
.uni span{font-family:var(--font-mono);font-size:12.5px;color:var(--muted-fg);min-width:26px}

/* contador */
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:42px;height:42px;border:1px solid var(--border);background:var(--surface);border-radius:50%;font-size:20px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center}
.cnt button:active{background:var(--surface-2)}
.cnt input{flex:1;text-align:center;font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-height:42px}

/* cámara */
.cam{display:flex;flex-wrap:wrap;gap:8px}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
  border-radius:calc(var(--radius) - 6px);background:var(--surface-2)}
.doc-t{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--surface);
  background:var(--muted-fg);border-radius:4px;padding:3px 5px}
.doc-n{flex:1 1 auto;font-size:13.5px;line-height:1.3;word-break:break-word}
.doc-k{flex:0 0 auto;font-size:11.5px;color:var(--muted-fg);white-space:nowrap}
.doc-x{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--rojo);font-size:16px;line-height:1;padding:0}
.add-doc{min-height:44px;border:1.5px dashed var(--input);border-radius:calc(var(--radius) - 6px);
  background:var(--surface-2);color:var(--muted-fg);font-size:14px}
/* Un botón no es texto. Con el dedo apoyado sobre «Adjuntar documento», Android convertía la presión larga en selección de la palabra, abría COPIAR / COMPARTIR y el click nunca llegaba: el botón parecía muerto (Antonio, 22 y 24-sep). Los campos de texto no se tocan: ahí copiar sí sirve. */button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.add-doc b{font-weight:400;font-size:17px}
#aviso-trabajo{display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:var(--foreground);color:var(--surface);padding:10px 18px;border-radius:999px;
  font-size:13.5px;line-height:1.3;max-width:86vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none}
.cam .add{width:80px;height:80px;border:1.5px dashed var(--input);border-radius:calc(var(--radius) - 6px);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted-fg);text-align:center}
.cam .add b{font-size:20px;font-weight:400;line-height:1}
.cam figure{position:relative;margin:0;width:80px;height:80px}
.cam .tope{align-self:center;font-size:11px;color:var(--muted-fg);opacity:.8}
.cam img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--radius) - 6px);display:block;border:1px solid var(--border)}
.cam .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--rojo);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}

/* gps */
.gps button,.gps a.secundario{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border:1px solid var(--border);background:var(--surface);color:var(--foreground);border-radius:999px;font-weight:600;font-size:12.5px}
.gps button:hover{background:var(--surface-2)}
.gps .fix{margin-top:8px;font-family:var(--font-mono);font-size:12px;color:var(--muted-fg);line-height:1.6}
.gps .mala{color:var(--rojo);font-weight:600}
.gps .buena{color:var(--verde);font-weight:600}

/* subcampos */
.sub{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.sub .lab{color:var(--muted-fg)}
.sub.err{border-top-color:var(--rojo)}
.sub.err .lab{color:var(--rojo)}

/* notas */
.nota{background:var(--surface-2);border-left:3px solid var(--primary);border-radius:calc(var(--radius) - 6px);padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--muted-fg);margin:10px 0}
.nota b{color:var(--foreground)}
.nota.v{background:var(--verde-bg);border-color:var(--verde)}
.nota.a{background:var(--amarillo-bg);border-color:var(--amarillo)}
.nota.r{background:var(--rojo-bg);border-color:var(--rojo)}
/* la cuenta de cada tipo y el total del apartado: cifras que se comprueban, en negro y alineadas */
.nota.cuenta{background:var(--surface);border-color:var(--rep);color:var(--foreground);font-variant-numeric:tabular-nums}
.sechead{font:600 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--foreground);margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--border)}

/* ---------- barra inferior ---------- */
.bot{position:sticky;bottom:0;z-index:20;background:color-mix(in oklab,var(--background) 94%,transparent);backdrop-filter:blur(8px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end}
.bot button{min-height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface)}
.bot .sig{flex:1;background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.bot .sig i{font-style:normal;font-weight:500;opacity:.82}
@media (min-width:900px){.bot .sig{flex:none;min-width:200px}}
.bot button[disabled]{opacity:.4}

/* ---------- pantallas ---------- */
.pantalla{padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
@media (min-width:900px){.pantalla{padding:16px 24px 28px}}
.pantalla h1{font-size:22px;line-height:1.15}
.lede{font-size:13px;color:var(--muted-fg);line-height:1.5}
.big{width:100%;min-height:44px;border-radius:999px;font-weight:600;font-size:13px;background:var(--primary);color:var(--primary-fg);border:1px solid var(--primary);transition:opacity .15s}
@media (min-width:900px){.big{width:auto;align-self:flex-start;padding:0 22px}}
.big:hover{opacity:.92}
.big.sec{background:var(--surface);color:var(--foreground);border-color:var(--border)}
.eyebrow{font:600 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg)}
.veredicto{border-radius:calc(var(--radius) - 4px);padding:14px 16px;border-left:3px solid;background:var(--surface-2)}
.veredicto .t{font-family:var(--font-display);font-size:18px;font-weight:600}
.veredicto .d{font-size:12.5px;margin-top:4px;line-height:1.5;color:var(--muted-fg)}
.vv{background:var(--verde-bg);border-color:var(--verde)} .vv .t{color:var(--verde)}
.va{background:var(--amarillo-bg);border-color:var(--amarillo)} .va .t{color:var(--amarillo)}
.vr{background:var(--rojo-bg);border-color:var(--rojo)} .vr .t{color:var(--rojo)}
.vn{background:var(--info-bg);border-color:var(--eval)} .vn .t{color:var(--eval)}
.res{background:var(--surface-2);border-radius:calc(var(--radius) - 4px);overflow:hidden}
.res div{display:flex;justify-content:space-between;gap:14px;padding:9px 12px;border-top:1px solid var(--rule-2);font-size:12.5px}
.res div:first-child{border-top:0}
.res span:first-child{color:var(--muted-fg);flex:none;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.res span:last-child{text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.json{width:100%;min-height:130px;font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:calc(var(--radius) - 6px);padding:10px;line-height:1.5;resize:vertical}
.aviso{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.aviso code{background:var(--muted);padding:1px 5px;border-radius:4px;font-size:11px}

/* ---------- bandeja ---------- */
.red{border-radius:999px;padding:3px 9px;font:600 9.5px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.red::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in oklab,currentColor 25%,transparent)}
.red.on{background:var(--verde-bg);color:var(--verde)}
.red.off{background:var(--amarillo-bg);color:var(--amarillo)}
.seccion{display:flex;align-items:baseline;gap:8px;margin:8px 0 -4px}
.seccion h2{font:600 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-fg)}
.cuenta{font:600 11px var(--font-display);color:var(--foreground);font-variant-numeric:tabular-nums}
.lista{display:flex;flex-direction:column;gap:6px}
/* minmax(0,1fr) y no 1fr: «1fr» es minmax(auto,1fr) y ese auto deja que una tarjeta con texto
   largo se pase de su mitad y estruje a la de al lado. Con 0 manda la columna, no el contenido. */
@media (min-width:900px){.lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.fila{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:calc(var(--radius) - 4px);padding:10px 8px 10px 12px;cursor:pointer;min-height:56px;transition:background .15s}
.fila:hover{background:var(--muted)}
.fila:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.fila-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fila-txt b{font:600 13px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-txt span{font-size:11.5px;color:var(--muted-fg);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow-wrap:anywhere}
.fila-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chip{font:600 9.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.b{background:var(--surface);border:1px solid var(--border);color:var(--muted-fg)}
.chip.l{background:var(--amarillo-bg);color:var(--amarillo)}
.chip.e{background:var(--verde-bg);color:var(--verde)}
.mini{font-size:10.5px;color:var(--ink-3)}
.tirar{width:32px;height:32px;flex:none;border:0;background:transparent;color:var(--ink-3);font-size:20px;line-height:1;border-radius:50%;padding:0}
.tirar:active{background:var(--muted);color:var(--rojo)}
.plegable{border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.plegable summary{font-size:12.5px;color:var(--muted-fg);cursor:pointer;padding:6px 0;min-height:32px;display:flex;align-items:center;font-weight:600}
.plegable .big{margin-top:8px}
.pie{padding:0 16px 14px;font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
[hidden]{display:none!important}

.gps .secundario{margin-top:8px;text-decoration:none;background:var(--card,transparent);border-color:var(--border,#ccc);font-weight:500}
.mapapunto{height:300px;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--border,#ccc);background:rgba(128,128,128,.12)}
.mapapunto .sinmapa{display:grid;place-items:center;height:100%;padding:16px;text-align:center;font-size:13px;opacity:.75}

/* ---------- historial del predio y visor de fotos ---------- */
.enlace{display:flex;align-items:center;justify-content:center;text-decoration:none}
.previa{background:var(--card,transparent);border:1px solid var(--border,#ccc);
  border-radius:10px;padding:12px 14px;margin-top:8px}
.previa-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.previa-cab .cuando{font-size:12px;opacity:.7;margin-left:auto}
.previa-datos{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.85;margin-bottom:6px}
.previa-txt{margin:6px 0 0;font-size:13.5px;line-height:1.5}
.previa-fotos{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.previa-fotos button{min-height:38px;padding:0 14px;border-radius:8px;font-size:13.5px;
  border:1px solid var(--border,#ccc);background:transparent}
.previa-aviso{margin:6px 0 0;font-size:11.5px;opacity:.6}

/* ---------- contactos del predio (después de aceptar el tratamiento de datos) ---------- */
.contacto{background:var(--card,transparent);border:1px solid var(--border,#ccc);border-radius:10px;padding:10px 14px;margin-top:8px}
.contacto .c-nombre{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.contacto .c-rol{font-size:12.5px;opacity:.75;margin-top:2px;overflow-wrap:anywhere}
.contacto .c-tels{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.contacto .c-tels a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;
  border:1px solid var(--primary);color:var(--primary);font-weight:600;font-size:14px;text-decoration:none;font-variant-numeric:tabular-nums}
.contacto.sin-tel{opacity:.72}
.contacto.sin-tel .c-sintel{font-size:12px;opacity:.8;margin-top:4px}
.tratamiento{white-space:pre-line;font-size:13.5px;line-height:1.55;background:var(--surface-2);border-radius:10px;
  padding:12px 14px;margin-top:8px;max-height:52vh;overflow:auto;overflow-wrap:anywhere}
.acepto{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:12px 2px;font-size:13.5px;line-height:1.45;cursor:pointer}
.acepto input{width:24px;height:24px;flex-shrink:0;margin:0}
#contactos .big{margin-top:8px}
#contactos .big:disabled{opacity:.4;cursor:default}
.visor{position:fixed;inset:0;background:rgba(6,10,14,.94);z-index:2000;display:none;
  align-items:center;justify-content:center;padding:16px}
.visor.abierto{display:flex;flex-direction:column}
.visor img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px}
.visor-x{position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;line-height:1}
.visor-cap{color:#fff;font-size:13px;opacity:.85;margin-bottom:10px;text-align:center}
.visor-carga{color:#fff;opacity:.8;font-size:14px}

.mapaficha{height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--border,#ccc);
  background:rgba(128,128,128,.12);margin-top:12px}
.leyenda{margin:6px 2px 0;font-size:11.5px;line-height:1.5;color:var(--muted-fg)}
.previa-recs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.previa-recs b{font-size:13px;margin-right:2px}
.previa-recs span{font-size:12.5px;padding:3px 9px;border-radius:20px;
  background:rgba(128,128,128,.16);overflow-wrap:anywhere}
.previa-txt,.previa-datos{overflow-wrap:anywhere}

/* ---------- onboarding ---------- */
.onb{text-align:center}
.onb .eyebrow{justify-content:center}
.onb h1{margin-top:2px}
.onb .lede{max-width:34rem;margin-left:auto;margin-right:auto}
.onb-art{margin:6px auto 16px;max-width:19rem}
.onb-art svg{width:100%;height:auto;display:block}
.onb-dots{display:flex;gap:7px;justify-content:center;margin:20px 0 16px}
.onb-dots i{width:7px;height:7px;border-radius:99px;background:var(--border);transition:width .18s,background .18s}
.onb-dots i.ya{background:var(--ink-3)}
.onb-dots i.on{width:22px;background:var(--primary)}
/* ---------- visor del informe del predio ---------- */
.inf-capa{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--background)}
.inf-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--primary);color:var(--primary-fg)}
.inf-top .inf-tit{flex:1;min-width:0}
.inf-top b{display:block;font-family:var(--font-display);font-size:14px;line-height:1.2}
.inf-top span{display:block;font-size:10px;opacity:.75;font-family:var(--font-mono);letter-spacing:.02em}
.inf-x{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid color-mix(in oklab,var(--primary-fg) 35%,transparent);background:transparent;color:var(--primary-fg);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.inf-pdf{flex:none;min-height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--secondary);color:oklch(0.245 0.075 253);font-weight:700;font-size:12.5px}
.inf-marco{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:oklch(0.93 0.008 247)}
.inf-marco iframe{width:100%;height:100%;border:0;display:block;background:transparent}
.inf-pie{margin:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--muted-fg);background:var(--surface);border-top:1px solid var(--border)}

/* ---------- mapa de trabajo (el de la sala, en el teléfono) ---------- */
main.mapa{margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:var(--surface-2);overflow:hidden}
@media (min-width:900px){main.mapa{margin:0;border-radius:var(--radius);border:1px solid var(--border)}}
.mapa-lienzo{position:relative;flex:1;min-height:380px;overflow:hidden;background:var(--surface-2)}
.ml-caja{position:absolute;inset:0}
.ml-caja canvas{outline:none}
.maplibregl-ctrl-attrib{font-size:9px}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{max-width:62vw}

.mapa-sup{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;gap:8px;padding:10px 10px 0;pointer-events:none}
.ml-volver{pointer-events:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--foreground);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.mapa-chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mapa-chips::-webkit-scrollbar{display:none}
.mapa-chips button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(6px);font-size:12px;font-weight:600;color:var(--foreground);box-shadow:var(--shadow-card);display:inline-flex;align-items:center;gap:6px}
.mapa-chips button i{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--muted);color:var(--muted-fg)}
.mapa-chips button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.mapa-chips button.on i{background:color-mix(in oklab,var(--primary-fg) 22%,transparent);color:var(--primary-fg)}

.mapa-bts{position:absolute;right:10px;bottom:var(--hoja,96px);transition:bottom .2s ease;z-index:5;display:flex;flex-direction:column;gap:6px}
.mapa-bts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(6px);color:var(--foreground);font-size:12px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.mapa-bts button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}

.con-hoja .mapa-leyenda{opacity:0;pointer-events:none}
.mapa-paso{position:absolute;left:10px;right:60px;bottom:66px;z-index:5;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);box-shadow:var(--shadow-card)}
.mapa-paso button{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:var(--muted);color:var(--foreground);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.mapa-paso span{flex:1;min-width:0;text-align:center;line-height:1.15}
.mapa-paso b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapa-paso i{display:block;font-style:normal;font-size:9.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.con-hoja .mapa-paso{opacity:0;pointer-events:none}
.mapa-leyenda{position:absolute;left:10px;bottom:34px;z-index:4;display:flex;align-items:center;gap:5px;flex-wrap:wrap;max-width:58vw;padding:5px 9px;border-radius:999px;background:color-mix(in oklab,var(--surface) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--border);font-size:10px;color:var(--muted-fg);box-shadow:var(--shadow-card)}
.mapa-leyenda i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:4px}
.mapa-leyenda i:first-child{margin-left:0}
/* la leyenda se abre: afectación, sus predios y su zona no caben en una píldora */
button.mapa-leyenda{min-height:36px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--foreground);cursor:pointer;flex-wrap:nowrap;white-space:nowrap;max-width:calc(100% - 76px)}
button.mapa-leyenda .ley-flecha{font-size:9px;margin-left:2px;color:var(--muted-fg)}
.mapa-ley{position:absolute;left:10px;bottom:78px;z-index:6;width:min(300px,calc(100% - 76px));max-height:calc(100% - 150px);overflow:auto;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-panel);font-size:12px;line-height:1.35}
.mapa-ley h3{font:600 9.5px var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg);margin:10px 0 6px}
.mapa-ley h3:first-child{margin-top:0}
.mapa-ley div{display:flex;align-items:center;gap:8px;margin:4px 0}
.mapa-ley i{flex:none;width:14px;height:14px;border-radius:3px;display:inline-block}
.mapa-ley p{margin:8px 0 0;font-size:11px;color:var(--muted-fg)}
.con-hoja .mapa-ley{display:none}
i.ley-borde{background:transparent!important;border:2.5px dashed #e0102b;box-sizing:border-box}
i.ley-fuera{background:repeating-linear-gradient(45deg,#6b7280 0 2px,#e5e7eb 2px 5px)!important}
i.ley-punto{border-radius:50%!important;border:2px solid #fff;box-shadow:0 0 0 1px #9aa5b4}
.mh-datos div.ancho{flex-basis:100%}
.mh-datos div.ancho b{white-space:normal}
.chip.af{background:color-mix(in oklab,var(--c) 26%,var(--surface));color:var(--foreground);border:1px solid var(--c)}
/* su zona, en la pantalla de sus predios */
.zona-card{margin:18px 0 6px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
.zona-card h2{font-family:var(--font-display);font-size:17px;line-height:1.2;margin:4px 0 2px}
.zona-card .big{margin-top:10px}
.zona-bts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zona-bts .big{margin-top:8px}
.zona-card .aviso:empty{display:none}
/* viviendas sin ficha propia: la lista de las declaradas y el armado de la lista */
.dec-lista{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.dec-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border:1px solid var(--border);border-radius:calc(var(--radius) - 6px);background:var(--surface)}
.dec-fila b{display:block;font-size:14px;line-height:1.25}
.dec-fila i{display:block;font-style:normal;font-size:11.5px;color:var(--muted-fg)}
.dec-fila .big{width:auto;flex:none;padding:0 18px;margin:0}
/* registro sin daños: la lista de fichas se marca con el dedo, cada fila de 48 px o más */
label.sd-fila{min-height:48px;cursor:pointer;justify-content:flex-start;gap:12px}
label.sd-fila input{width:22px;height:22px;flex:none;accent-color:var(--primary)}
label.sd-fila.hecha{opacity:.55;cursor:default}
.sd-todas{display:flex;gap:8px;margin:6px 0 2px}
.sd-todas .big{margin:0;min-height:44px}
.dec-arma{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.dec-arma label,.dec-lbl{display:block;font-size:12px;color:var(--muted-fg);line-height:1.35}
.dec-arma .inp{margin-top:4px;width:100%;box-sizing:border-box}
#decLista{width:100%;box-sizing:border-box;min-height:170px;font-size:16px;line-height:1.5;margin-top:6px}

.mapa-carga{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:color-mix(in oklab,var(--background) 88%,transparent)}
.mc-caja{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:280px;font-size:12.5px;color:var(--muted-fg)}
.mc-caja b{font-family:var(--font-display);font-size:14px;color:var(--foreground)}
.mc-caja i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--muted);border-top-color:var(--primary);animation:mgira .8s linear infinite}
.mc-mal i{display:none}
@keyframes mgira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mc-caja i{animation:none}}

.mapa-hoja{position:absolute;left:8px;right:8px;bottom:8px;z-index:7;padding:14px 14px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-panel);animation:msube .22s ease}
@keyframes msube{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mapa-hoja{animation:none}}
.mh-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted-fg);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.mh-top{display:flex;align-items:flex-start;gap:10px;padding-right:30px}
.mh-tit{min-width:0;flex:1}
.mh-tit b{display:block;font-family:var(--font-display);font-size:15px;line-height:1.2}
.mh-tit span{display:block;font-size:11.5px;color:var(--muted-fg);margin-top:2px}
.mh-datos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mh-datos div{flex:1 1 44%;min-width:0;padding:6px 9px;border-radius:calc(var(--radius) - 8px);background:var(--surface-2);border:1px solid var(--border)}
.mh-datos span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg)}
.mh-datos b{display:block;font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh-bts{display:flex;gap:8px;margin-top:12px}
.mh-bts .big{flex:1;margin:0}
.mh-bts a.big{display:flex;align-items:center;justify-content:center;text-decoration:none}

/* ---------- visita enviada: verla, corregirla, completarla ---------- */
.rev{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;padding:10px 12px;border-radius:calc(var(--radius) - 4px);background:var(--info-bg);border-left:3px solid var(--eval)}
.rev.edita{background:var(--amarillo-bg);border-color:var(--amarillo)}
.rev-t{font-size:12.5px;line-height:1.45}
.rev-t span{color:var(--muted-fg)}
.rev-b{display:flex;flex-wrap:wrap;gap:6px}
.rev-b button{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--foreground);font-size:12px;font-weight:600}
.rev-b button.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.rev-b button:disabled{opacity:.45}
/* Al verla, los controles van desactivados y tienen que leerse como respuestas, no como botones
   apagados: lo elegido conserva su color y lo demás se atenúa. */
.seg button:disabled,.cards button:disabled,.chips button:disabled,.esc button:disabled,.esc-na:disabled{cursor:default}
.seg button:disabled[aria-pressed="false"],.cards button:disabled[aria-pressed="false"],.chips button:disabled[aria-pressed="false"],.esc button:disabled[aria-pressed="false"],.esc-na:disabled[aria-pressed="false"]{opacity:.5}
.inp:disabled{background:var(--surface-2);color:var(--foreground);-webkit-text-fill-color:var(--foreground);opacity:1}
.cnt button:disabled,.gps button:disabled{opacity:.4}
/* «Dato nuevo»: la pregunta nació después de la visita. Va en la etiqueta, por CSS, para no tocar la
   línea que la pinta (la comparten otras ramas del mismo lote). */
.f.nuevo > .lab::after,.sub.nuevo > .lab::after{content:"Dato nuevo";margin-left:8px;padding:2px 7px;border-radius:999px;background:var(--amarillo-bg);color:var(--amarillo);letter-spacing:.04em;font-size:9.5px}
.cam figure.remota{cursor:zoom-in}
.cam .sinurl{display:grid;place-items:center;width:100%;height:100%;border:1px dashed var(--border);border-radius:calc(var(--radius) - 6px);font-size:10px;color:var(--muted-fg);text-align:center}
.firma-img{display:block;width:100%;max-width:340px;height:auto;background:#fff;border:1px solid var(--border);border-radius:calc(var(--radius) - 4px)}
.cambios{background:var(--surface-2);border-radius:calc(var(--radius) - 4px);overflow:hidden}
.cambios div{padding:9px 12px;border-top:1px solid var(--rule-2);font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.cambios div:first-child{border-top:0}
.cambios b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);font-weight:600}
.cambios s{color:var(--muted-fg)}
/* índice de pasos: el avance de la visita, paso por paso */
.paso-n{cursor:pointer}
.indice{position:fixed;inset:0;z-index:70;background:rgba(6,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.indice-caja{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-panel)}
.indice-cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.indice-cab div{flex:1;min-width:0}
.indice-cab b{display:block;font-family:var(--font-display);font-size:16px}
.indice-cab span{display:block;font-size:12px;color:var(--muted-fg);margin-top:2px;line-height:1.45}
.indice-x{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:16px;line-height:1;padding:0}
.indice ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.indice li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:42px;padding:8px 10px;border:1px solid var(--border);background:var(--surface);color:var(--foreground);border-radius:calc(var(--radius) - 6px);font-size:13px}
.indice li button.aqui{border-color:var(--primary);background:var(--info-bg)}
.indice li button:disabled{opacity:.45}
.indice li span{flex:1;min-width:0}
.indice li i{flex:none;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.indice li i.ok{background:var(--verde-bg);color:var(--verde)}
.indice li i.falta{background:var(--rojo-bg);color:var(--rojo)}
.indice li i.mira{background:var(--amarillo-bg);color:var(--amarillo)}
/* ---------- envío al finalizar, PDF a la vista y lo que falta (notas del 23-sep) ---------- */
/* El PDF era una píldora de 26 px con letra de 10: en campo, con guantes y sol, no se atinaba. Ahora
   los botones de las listas van debajo del texto, de 46 px (revisión de Julián del 23-sep). */
.chip.f{background:var(--rojo-bg);color:var(--rojo)}
/* «Sus visitas enviadas» en el teléfono: la tarjeta apilada (ver filaEnviada). Los botones, de 46 px y
   parejos; los dos de abajo se ponen uno debajo del otro si no caben lado a lado. */
.envs .fila{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
.env-cab{display:flex;flex-direction:column;gap:3px;min-width:0}
.env-cab b{font:600 14.5px/1.3 var(--font-display);overflow-wrap:anywhere}
.env-cab span{font-size:12.5px;line-height:1.4;color:var(--muted-fg);overflow-wrap:anywhere}
.env-chips{display:flex;flex-wrap:wrap;gap:6px}
.env-chips .chip{font-size:10.5px;padding:4px 9px}
.env-porque,.env-falta{margin:0;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.env-porque{color:var(--muted-fg)}
.env-falta{color:var(--rojo)}
.env-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.env-acc button{flex:1 1 96px;min-height:46px;padding:0 12px;border-radius:999px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-size:13.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.env-acc .env-pri{flex-basis:100%;background:var(--primary);color:var(--primary-fg)}
.env-acc .pdf::before{content:"\2193";font-size:15px;line-height:1}
.env-acc button:active{opacity:.8}
/* Arriba de la visita enviada o corregida: los mismos botones de dedo, «Editar» / «Guardar cambios» a
   todo el ancho y los demás de dos en dos. Eran píldoras de 34 px con letra de 12. */
.rev-b{gap:8px}
.rev-b button{flex:1 1 128px;min-height:44px;padding:0 10px;font-size:13px;white-space:nowrap}
.rev-b button.pri{flex-basis:100%}
/* La bandeja: el PDF de una visita ya enviada, debajo y a todo el ancho; la × de borrar, de 44 px
   (la cruz se ve igual, lo que crece es dónde se puede tocar). */
.fila.con-bts{flex-wrap:wrap}
.fila-bts{flex:1 0 100%;display:flex;gap:8px;padding-right:4px}
.fila-bts .pdf{flex:1;min-height:46px;padding:0 12px;border-radius:999px;border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-size:13.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.fila-bts .pdf::before{content:"\2193";font-size:15px;line-height:1}
.fila-bts .pdf:active{opacity:.8}
.tirar{width:44px;height:44px}
.fila[data-a="abrir"] .fila-txt b{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
/* el aviso de envío: la primera frase, en negrita, en su renglón; lo demás sigue en línea */
.envio > b:first-child{display:block;margin-bottom:2px}
/* el dato al que se acaba de saltar: además del rojo de lo que falta, un halo para encontrarlo */
.f.aqui,.sub.aqui{box-shadow:0 0 0 3px var(--secondary);border-radius:8px}
/* «Siguiente dato que falta» va en la barra de abajo, en su propio renglón: flotando encima del paso
   tapaba los botones de la pregunta siguiente. */
.bot{flex-wrap:wrap}
#sigFalta{order:-1;flex:1 0 100%;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--rojo);color:#fff;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

     bucket, que tiene su propia lista y rechaza lo demás. Lo único que hacía el filtro era

<script>/* Almacén local de visitas.
   IndexedDB aguanta las fotografías; localStorage no (unos 5 MB y solo texto).
   Si el navegador no da IndexedDB se degrada a localStorage sin fotos, que es
   peor pero no pierde las respuestas. */
window.ALMACEN = (function () {
  'use strict';

  var NOMBRE = 'psismo', VERSION = 1, db = null, hayIDB = false;
  try { hayIDB = !!window.indexedDB; } catch (e) { hayIDB = false; }

  // Abrir la base tarda: en un teléfono con cientos de fotografías guardadas, un par de segundos.
  // Mientras tanto `db` está vacía y quien leyera caería en el respaldo de localStorage, que no
  // tiene las visitas de IndexedDB. Eso pasaba al arrancar: «Sus predios» se pinta con la sesión
  // guardada antes de que la base abra, la tarjeta «Hay trabajo guardado en el servidor» creía que
  // las visitas no estaban en el teléfono, y «Traer» las pisaba con la copia del servidor, que no
  // lleva fotografías. Del 23 al 25-sep se perdieron así las fotos de cinco ingenieros. Por eso
  // cada lectura y escritura espera a `listo` (ver `trasAbrir`).
  //
  // Si la base no abre en ESPERA ms se da por perdida y se trabaja con el respaldo toda la sesión:
  // mejor eso que dejar la aplicación esperando para siempre. Una apertura que llegue después se
  // cierra, para no mezclar a mitad de camino dos almacenes con visitas distintas.
  var ESPERA = 20000;
  function abre() {
    return new Promise(function (ok, mal) {
      if (!hayIDB) return mal('sin indexeddb');
      var tarde = false;
      var reloj = setTimeout(function () { tarde = true; mal('no abrió a tiempo'); }, ESPERA);
      var s = indexedDB.open(NOMBRE, VERSION);
      s.onupgradeneeded = function () {
        var d = s.result;
        if (!d.objectStoreNames.contains('visitas')) d.createObjectStore('visitas', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('ajustes')) d.createObjectStore('ajustes', { keyPath: 'k' });
      };
      s.onsuccess = function () {
        clearTimeout(reloj);
        if (tarde) { try { s.result.close(); } catch (e) {} return; }
        db = s.result; ok(db);
      };
      s.onerror = function () { clearTimeout(reloj); mal(s.error); };
      s.onblocked = function () { clearTimeout(reloj); mal('bloqueada'); };
    });
  }

  // Nada lee ni escribe antes de saber qué almacén hay. `API.listo` nunca falla: si la base no
  // abre, resuelve igual y `db` queda vacía, que es lo que manda al respaldo.
  function trasAbrir(fn) {
    return API.listo.then(function () { return fn(); });
  }

  // Hay teléfonos donde la base ABRE y luego no deja escribir. Ahí `db` quedaba puesta y todo
  // seguía yendo a IndexedDB —donde fallaba—, así que el respaldo en localStorage existía y no se
  // usaba nunca: el ingeniero perdía la visita entera. Si la prueba de escritura falla se suelta la
  // base y se trabaja con el respaldo, que guarda las respuestas aunque no las fotografías.
  function renuncia() {
    if (!db) return;
    try { db.close(); } catch (e) {}
    db = null; API.conFotos = false;
    console.warn('IndexedDB abre pero no escribe: se pasa al respaldo en localStorage');
  }

  function pide(almacen, modo, fn) {
    return new Promise(function (ok, mal) {
      if (!db) return mal('sin base');
      var t = db.transaction(almacen, modo), s = t.objectStore(almacen), r = fn(s);
      t.oncomplete = function () { ok(r && r.result !== undefined ? r.result : null); };
      t.onerror = function () { mal(t.error); };
      t.onabort = function () { mal(t.error || 'abortada'); };
    });
  }

  // ---- respaldo en localStorage, sin fotografías
  function lsLee(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsPon(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  // Lo único que no cabe en el respaldo: una lista de fotografías (data URL) o de documentos.
  function esAdjunto(x) {
    if (!Array.isArray(x) || !x[0]) return false;
    if (typeof x[0] === 'string') return x[0].slice(0, 5) === 'data:';
    // Los documentos tampoco: son megabytes y el respaldo son cinco. Si entraran, no fallaría
    // el documento: fallaría la escritura entera y se perderían también las respuestas.
    return typeof x[0] === 'object' && typeof x[0].datos === 'string';
  }
  // Se guarda la visita ENTERA menos los adjuntos, dentro de D y fuera. Antes se copiaba una lista
  // fija —id, estado, creada, tocada, paso, resumen— y lo demás se perdía al guardar, `asignacion`
  // incluida. evaluaPredio() la pone y enviaPendientes() relee las visitas de aquí, así que en los
  // teléfonos que trabajan con este respaldo cada visita salía con `asignacion: null`:
  // recibir-visita no cerraba el predio ni lo enlazaba con la visita, el predio se quedaba en
  // «empezado» y había que cerrarlo a mano. Tampoco salía «Seguir con la visita empezada», que la
  // busca por su asignación. Una lista de lo que se guarda se queda atrás en cuanto la visita gana
  // una propiedad; la de lo que no se guarda, no.
  function sinFotos(v) {
    var c = {};
    Object.keys(v).forEach(function (k) {
      if (k !== 'D' && !esAdjunto(v[k])) c[k] = v[k];
    });
    c = JSON.parse(JSON.stringify(c));
    c.D = {};
    Object.keys(v.D || {}).forEach(function (k) {
      if (!esAdjunto(v.D[k])) c.D[k] = v.D[k];
    });
    return c;
  }

  var API = {
    conFotos: false,

    visitas: {
      guarda: function (v) {
        v.tocada = Date.now();
        return trasAbrir(function () {
          if (db) return pide('visitas', 'readwrite', function (s) { return s.put(v); });
          var t = lsLee('psismo.visitas') || {};
          t[v.id] = sinFotos(v); lsPon('psismo.visitas', t);
        });
      },
      lee: function (id) {
        return trasAbrir(function () {
          if (db) return pide('visitas', 'readonly', function (s) { return s.get(id); });
          return (lsLee('psismo.visitas') || {})[id] || null;
        });
      },
      todas: function () {
        return trasAbrir(function () {
          if (db) return pide('visitas', 'readonly', function (s) { return s.getAll(); })
            .then(function (l) { return (l || []).sort(function (a, b) { return b.tocada - a.tocada; }); });
          var t = lsLee('psismo.visitas') || {};
          return Object.keys(t).map(function (k) { return t[k]; })
            .sort(function (a, b) { return b.tocada - a.tocada; });
        });
      },
      borra: function (id) {
        return trasAbrir(function () {
          if (db) return pide('visitas', 'readwrite', function (s) { return s.delete(id); });
          var t = lsLee('psismo.visitas') || {}; delete t[id]; lsPon('psismo.visitas', t);
        });
      }
    },

    perfil: {
      guarda: function (p) {
        lsPon('psismo.perfil', p);                       // duplicado: se lee al arrancar sin esperar
        return trasAbrir(function () {
          if (db) return pide('ajustes', 'readwrite', function (s) { return s.put({ k: 'perfil', v: p }); });
        });
      },
      lee: function () { return lsLee('psismo.perfil') || {}; }
    },

    // Escribe y vuelve a leer. Tener IndexedDB no es poder usarla: en incógnito y dentro del
    // navegador que abre otra aplicación, la API está y la escritura falla o se tira al salir.
    // Espera a la apertura: antes, el diagnóstico del arranque corría con la base aún cerrando
    // y mandaba «idb: false» de teléfonos que sí guardaban.
    prueba: function () {
      return trasAbrir(function () {
        if (!db) return false;
        return pide('ajustes', 'readwrite', function (s) { return s.put({ k: '__prueba', v: Date.now() }); })
          .then(function () { return pide('ajustes', 'readonly', function (s) { return s.get('__prueba'); }); })
          .then(function (r) {
            if (r) return true;
            renuncia(); return false;
          })
          .catch(function () { renuncia(); return false; });
      });
    },

    // cuánto espacio ocupa lo guardado, para avisar antes de que se llene
    uso: function () {
      if (navigator.storage && navigator.storage.estimate) {
        return navigator.storage.estimate().then(function (e) {
          return { usado: e.usage || 0, cuota: e.quota || 0 };
        }).catch(function () { return null; });
      }
      return Promise.resolve(null);
    },

    // pedir al navegador que no borre los datos si le falta espacio
    persiste: function () {
      if (navigator.storage && navigator.storage.persist) {
        return navigator.storage.persist().catch(function () { return false; });
      }
      return Promise.resolve(false);
    }
  };

  API.listo = abre().then(function () {
    API.conFotos = true;
    return true;
  }).catch(function () {
    db = null; API.conFotos = false;
    return false;
  });

  return API;
})();
</script>
