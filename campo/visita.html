    E.pasos.forEach(function (p) {
      if (!PASOS_SIN_DANOS[p.id]) { sinEl(p); return; }
      if (p.id === 's5_ocupantes' || p.id === 'z2_resumen') {
        p.campos.forEach(function (f) { if (!CAMPOS_SIN_DANOS[f.name]) sinEl(f); });
      }
    });
    var soloSi = "${sin_danos}='si'";
    E.pasos.forEach(function (p) {
      var reparado = soloSi + " and ${sin_danos_situacion}='reparado'";
      if (p.id === 's5_ocupantes') p.campos.unshift({ name: 'nota_sin_danos', tipo: 'nota', kind: 'vivo', relevant: soloSi,
        texto: 'Registro sin daños o ya reparado | ${sin_danos_unidades} | Deja constancia de que no se afectó, o de que se ' +
               'afectó y ya quedó reparado por completo: quién atendió, una fotografía y su firma. No lleva evaluación de ' +
               'daños ni presupuesto. Si queda algún daño sin reparar, salga y use «Evaluar este predio».' },
        { name: 'sin_danos_situacion', label: '¿Cómo está hoy?', tipo: 'select_one', relevant: soloSi, req: true,
          lista: 'sd_situacion', ui: 'tarjetas', valida: ". != 'en_reparacion'",
          vmsg: 'Si todavía se está reparando, el daño sigue ahí: salga y use «Evaluar este predio».',
          ayuda: 'Si registra varias unidades a la vez, todas quedan con esta misma respuesta.' },
        { name: 'nota_en_reparacion', tipo: 'nota', kind: 'ayuda',
          relevant: soloSi + " and ${sin_danos_situacion}='en_reparacion'",
          texto: 'Esto no es un registro sin daños | Si todavía se está reparando, hay daño que clasificar. Salga con la ' +
                 'flecha y use «Evaluar este predio»: en la clasificación (A.6) marque que hay reparaciones en curso y, en ' +
                 'reparabilidad, mida solo lo que falta.' },
        { name: 'reparado_que', label: '¿Qué se reparó?', tipo: 'select_multiple', relevant: reparado, req: true,
          lista: 'sd_reparado_que', ui: 'chips' },
        { name: 'reparado_quien', label: '¿Quién hizo la reparación?', tipo: 'select_one', relevant: reparado, req: true,
          lista: 'sd_reparado_quien', ui: 'tarjetas' },
        { name: 'reparado_detalle', label: 'Qué daño tuvo y cómo quedó', tipo: 'text', relevant: reparado, req: false,
          ui: 'parrafo', ayuda: 'Opcional. Por ejemplo: «fisuras en el muro de la sala, ya resanadas y pintadas».' });
      if (p.id === 's6_fotos') p.campos.unshift({ name: 'nota_sin_danos_foto', tipo: 'nota', kind: 'ayuda',
        relevant: soloSi + " and ${sin_danos_situacion}!='reparado'",
        texto: 'La foto es la constancia | Una del interior o de la fachada que muestre que no hay daño. Si registra ' +
               'varias unidades a la vez, sirve una general; puede agregar hasta cuatro.' },
        { name: 'nota_reparado_foto', tipo: 'nota', kind: 'ayuda', relevant: reparado,
          texto: 'La foto es la constancia | Al menos una de lo que se reparó, donde se vea cómo quedó. Puede agregar ' +
                 'hasta cuatro.' });
      // En vez de res_datos, que enseña el código de registro de la localización (aquí no se diligencia).
      if (p.id === 'z2_resumen') p.campos.splice(3, 0, { name: 'res_sin_danos', tipo: 'nota', kind: 'vivo',
        relevant: soloSi + " and ${sin_danos_situacion}!='reparado'",
        texto: 'SIN DAÑOS | Queda registrada como habitable, sin daño y sin intervención ni presupuesto. | ' +
               '${sin_danos_unidades} | Dirección: ${direccion} | Fecha y hora: ${fecha_texto}' },
        { name: 'res_reparado', tipo: 'nota', kind: 'vivo', relevant: reparado,
          texto: 'YA REPARADO | Queda registrada como habitable, con la marca de que se afectó con el sismo y ya se ' +
                 'reparó por completo. Sin evaluación ni presupuesto. | ${sin_danos_unidades} | Dirección: ${direccion} | ' +
                 'Fecha y hora: ${fecha_texto}' });
    });
  })();

  // En reparación (29-sep): la evaluación clasifica el estado de hoy, y ahora dice también si hay obra en
  // curso, para que una casa a medio reparar no se lea igual que una que nadie ha tocado.
  (function reparacionEnCurso() {
    var a6 = E.pasos.filter(function (p) { return p.id === 'a6_clasificacion'; })[0];
    if (!a6) return;
    var i = a6.campos.map(function (f) { return f.name; }).indexOf('eva_clasif_habitabilidad');
    if (i < 0) return;
    a6.campos.splice(i + 1, 0, { name: 'eva_en_reparacion', label: '¿Se están haciendo reparaciones en este momento?',
      tipo: 'select_one', relevant: null, req: true, lista: 'si_no', ui: 'segmentado',
      ayuda: 'La clasificación es del estado de hoy. Si hay obra en curso, en reparabilidad mida solo lo que falta por reparar.' });
  })();

  var idxCampo = {};
  E.pasos.forEach(function (p) {
    p.campos.forEach(function (f) {
      idxCampo[f.name] = f;
      (f.subs || []).forEach(function (s) { idxCampo[s.name] = s; });
    });
  });

  // ---------------------------------------------------------------- pasos
  function pasosVisibles() { return E.pasos.filter(visible); }

  // ---------------------------------------------------------------- controles
  function ctlSelectUno(f, val, clase) {
    var ops = opciones(f), h = '';
    if (clase === 'esc') {
      var NOM = { n: 'Ninguno', l: 'Leve', m: 'Moderado', s: 'Severo' };
      // "No aplica" no es un peldaño más de la escala: a una casa de bahareque se
      // le preguntaba por riostras y nodos, y la única salida era "Ninguno", que
      // se lee como "existe y está sano". Va aparte, debajo, para que la
      // gradación N → S siga leyéndose como gradación.
      var na = null;
      ops.forEach(function (o) {
        if (o.v === 'na') { na = o; return; }
        h += '<button type="button" data-a="uno" data-n="' + esc(f.name) + '" data-v="' + esc(o.v) +
             '" aria-pressed="' + (val === o.v ? 'true' : 'false') + '">' +
             '<span class="g">' + esc(o.l) + '</span><span class="p">' + esc(NOM[o.v] || '') + '</span></button>';
      });
      h = '<div class="esc">' + h + '</div>';
      if (na) {
        h += '<button type="button" class="esc-na" data-a="uno" data-n="' + esc(f.name) +
             '" data-v="' + esc(na.v) + '" aria-pressed="' + (val === na.v ? 'true' : 'false') +
             '">' + esc(na.l) + ' &middot; la edificaci&oacute;n no tiene este elemento</button>';
      }
      return h;
    }
    if (clase === 'lista') {
      h = '<option value="">Seleccione…</option>';
      ops.forEach(function (o) {
        h += '<option value="' + esc(o.v) + '"' + (val === o.v ? ' selected' : '') + '>' + esc(o.l) + '</option>';
      });
      return '<select class="inp" data-a="sel" data-n="' + esc(f.name) + '">' + h + '</select>';
    }
    // Las mismas tarjetas sirven para una respuesta o para varias: lo único que cambia es qué
    // acción lleva cada botón y cómo se decide si está puesta. Así el paso 4 no cambia de aspecto
    // por dentro de una visita a otra.
    var varias = f.tipo === 'select_multiple';
    var puestas = varias ? (Array.isArray(val) ? val : []) : null;
    ops.forEach(function (o) {
      var on = varias ? puestas.indexOf(o.v) > -1 : val === o.v;
      h += '<button type="button" data-a="' + (varias ? 'multi' : 'uno') + '" data-n="' + esc(f.name) +
           '" data-v="' + esc(o.v) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
           esc(o.l) + '</button>';
    });
    return '<div class="' + (clase === 'seg' ? 'seg' : 'cards') + '">' + h + '</div>';
  }

  // Opciones que se excluyen con todas las demás dentro de una selección
  // múltiple. Van por código, no por etiqueta.
  var EXCLUSIVAS = ['ninguna', 'ninguno', 'no_aplica'];

  // Cuántas fotografías admite el campo, leído de su propia validación
  // (count-selected(.)<=N). Así el tope vive en un solo sitio: si cambia la
  // regla, el botón cambia con ella.
  function topeFotos(f) {
    var m = /count-selected\s*\(\s*\.\s*\)\s*<=\s*(\d+)/.exec(f.valida || '');
    return m ? Number(m[1]) : 0;
  }

  // Una selección múltiple se ve igual que una de una sola respuesta: las mismas tarjetas, las
  // mismas píldoras. El 22-sep, 25 de 87 visitas ya marcaban varios materiales, así que el motor
  // lo permite; lo que falta es que se note antes de tocar. Va bajo la etiqueta, en cada campo de
  // varias respuestas, también en los que se pintan dentro de otro (material → sistema).
  function pistaVarias(f) {
    return f && f.tipo === 'select_multiple' ? '<p class="varias">Puede marcar varias</p>' : '';
  }

  function ctl(f, sub) {
    var n = f.name, val = D[n], u = f.ui, h = '';
    if (val === undefined) val = '';

    // En una visita enviada las fotografías, la firma y los documentos están en el servidor, no en
    // el teléfono: se pintan con su URL firmada y nunca pasan por D como si fueran locales.
    if (REV && esAdjuntoRev(f)) h = adjuntoEnviado(f);
    else if (u === 'segmentado') h = ctlSelectUno(f, val, 'seg');
    else if (u === 'escala') h = ctlSelectUno(f, val, 'esc');
    else if (u === 'tarjetas') h = ctlSelectUno(f, val, 'cards');
    else if (u === 'lista') h = ctlSelectUno(f, val, 'lista');
    else if (u === 'pisos') h = ctlPisos(f, val);
    else if (u === 'chips') {
      var sel = Array.isArray(val) ? val : [];
      h = '<div class="chips">' + opciones(f).map(function (o) {
        return '<button type="button" data-a="multi" data-n="' + esc(n) + '" data-v="' + esc(o.v) +
               '" aria-pressed="' + (sel.indexOf(o.v) > -1 ? 'true' : 'false') + '">' + esc(o.l) + '</button>';
      }).join('') + '</div>';
    }
    else if (u === 'contador') {
      // En una obligatoria no se pone placeholder: un 0 gris se lee como respuesta
      // dada. "Número de sótanos" salía con un 0 puesto y al pulsar Siguiente
      // saltaba "Complete este dato" sobre un campo que parecía contestado.
      // Con `defecto` el gris es ese valor, porque vacío vale eso: «¿cuántas columnas tienen estas
      // medidas?» vacío es una, y la cuenta del tipo lo dice.
      h = '<div class="cnt"><button type="button" data-a="mas" data-n="' + esc(n) + '" data-d="-1">&minus;</button>' +
          '<input class="inp" type="number" inputmode="numeric" data-a="txt" data-n="' + esc(n) +
          '" value="' + esc(val) + '"' + (obligatorio(f) ? '' : ' placeholder="' +
          esc(f.defecto != null ? f.defecto : 0) + '"') + '>' +
          '<button type="button" data-a="mas" data-n="' + esc(n) + '" data-d="1">+</button></div>';
    }
    else if (u === 'numero') {
      // Texto, no number: con el teclado en español el navegador descarta lo que lleva coma y
      // el.value se queda vacío, así que el dato desaparece sin un solo aviso. inputmode decimal
      // sigue sacando el teclado numérico; la coma la resolvemos nosotros al leer.
      var campo = '<input class="inp" type="text" inputmode="decimal" data-a="txt" data-num="1" data-n="' +
                  esc(n) + '" value="' + esc(numTexto(val)) + '">';
      h = f.unidad ? '<div class="uni">' + campo + '<span>' + esc(f.unidad) + '</span></div>' : campo;
    }
    else if (u === 'numerico') {
      // cédulas y celulares son cadenas de dígitos, no cantidades: con type="number"
      // se pierden los ceros a la izquierda y la validación por regex deja de cuadrar
      h = '<input class="inp" type="text" inputmode="numeric" pattern="[0-9]*" data-a="txt" data-n="' +
          esc(n) + '" value="' + esc(val) + '">';
    }
    else if (u === 'parrafo') {
      h = '<textarea class="inp" rows="' + filasPara(val) + '" data-a="txt" data-n="' +
          esc(n) + '">' + esc(val) + '</textarea>';
    }
    else if (u === 'fecha') h = '<input class="inp" type="date" data-a="txt" data-n="' + esc(n) + '" value="' + esc(val) + '">';
    else if (u === 'fechahora') h = '<input class="inp" type="datetime-local" data-a="txt" data-n="' + esc(n) + '" value="' + esc(val) + '">';
    else if (u === 'codigo') {
      h = '<input class="inp" type="text" inputmode="text" autocapitalize="characters" data-a="txt" data-n="' +
          esc(n) + '" value="' + esc(val) + '" placeholder="Escriba el c&oacute;digo">';
      // Agrupado debajo, para comprobarlo de un vistazo sin tener que contar dígitos.
      var legible = codigoLegible(val);
      if (legible) {
        h += '<p class="hint" style="margin:6px 0 0;font-family:var(--font-mono);' +
             'letter-spacing:.02em">' + esc(legible) + '</p>';
      }
    }
    else if (u === 'camara') {
      var fotos = Array.isArray(val) ? val : [];
      h = '<div class="cam">' + fotos.map(function (src, i) {
        return '<figure><img src="' + src + '" alt=""><button type="button" class="del" data-a="quitafoto" data-n="' +
               esc(n) + '" data-i="' + i + '" aria-label="Quitar foto">&times;</button></figure>';
      }).join('');
      // Con el tope alcanzado se retira el botón en vez de dejar añadir y
      // reprochárselo después: el error salía al pulsar Siguiente, tres
      // fotografías más tarde.
      var tope = topeFotos(f);
      h += (tope && fotos.length >= tope)
        ? '<div class="tope">' + (tope === 1 ? 'Una sola imagen.' : 'Ya están las ' + tope + '.') + '</div>'
        : '<button type="button" class="add" data-a="foto" data-n="' + esc(n) +
          '" data-tope="' + tope + '"><b>+</b>' +
          (fotos.length ? 'Otra' : 'Tomar foto') + '</button>' +
          // La galería es para lo que ya está hecho: fotos de otra aplicación, o del predio al
          // que se volvió sin señal. Va al lado y no escondida en un menú.
          '<button type="button" class="add" data-a="galeria" data-n="' + esc(n) +
          '" data-tope="' + tope + '"><b>&#8593;</b>Galer&iacute;a</button>';
      h += '</div>';
    }
    else if (u === 'documentos') {
      var docs = Array.isArray(val) ? val : [];
      h = '<div class="docs">' + docs.map(function (d, i) {
        return '<div class="doc"><span class="doc-t">' + esc(etiquetaDoc(d.tipo)) + '</span>' +
               '<span class="doc-n">' + esc(d.nombre || 'documento') + '</span>' +
               '<span class="doc-k">' + esc(pesoLegible(pesaDoc(d))) + '</span>' +
               '<button type="button" class="doc-x" data-a="quitadoc" data-n="' + esc(n) +
               '" data-i="' + i + '" aria-label="Quitar documento">&times;</button></div>';
      }).join('');
      h += (docs.length >= MAX_DOCS
        ? '<div class="tope">Ya est\u00e1n los ' + MAX_DOCS + ' documentos que caben.</div>'
        : '<button type="button" class="add-doc" data-a="documento" data-n="' + esc(n) +
          '"><b>+</b> Adjuntar documento</button>');
      h += '</div>';
    }
    else if (u === 'firma') h = pintaFirma(f, val);
    else if (u === 'punto') h = pintaPunto(f, val);
    else if (u === 'gps') {
      h = '<div class="gps"><button type="button" data-a="gps" data-n="' + esc(n) + '">' +
          (val ? 'Volver a ubicar' : 'Obtener ubicaci&oacute;n') + '</button>';
      if (val && val.lat) {
        var buena = val.acc <= 20;
        h += '<div class="fix">' + val.lat.toFixed(6) + ', ' + val.lon.toFixed(6) + '<br>' +
             '<span class="' + (buena ? 'buena' : 'mala') + '">precisi&oacute;n ' + Math.round(val.acc) + ' m' +
             (buena ? ' — suficiente' : ' — espere a que baje de 20 m') + '</span></div>';
      }
      h += '</div>';
    }
    else if (u === 'clave') {
      h = '<input class="inp mono" type="text" spellcheck="false" autocapitalize="off" ' +
          'autocomplete="off" data-a="txt" data-n="' + esc(n) + '" value="' + esc(val) +
          '" placeholder="Pegue aquí la clave">';
    }
    else h = '<input class="inp" type="text" data-a="txt" data-n="' + esc(n) + '" value="' + esc(val) + '">';

    // Solo lectura: al ver una visita enviada, todo; al corregirla, lo que no se corrige (la ficha,
    // la fecha, la firma, el perfil). Va en el propio HTML y no después sobre el DOM, para que no
    // haya ni un instante en que el control se pueda tocar. Los subcampos deciden por su cuenta.
    if (REV && !esAdjuntoRev(f) && soloLecturaRev(f)) h = desactiva(h);

    // subcampos que se despliegan dentro del mismo control
    if (!sub) h += pintaSubs(f, val);
    // Control encadenado (material → sistema) dentro de la misma tarjeta, y debajo los subcampos
    // de la hija. La hija se pinta con ctl(hija, true), que no pinta subcampos, así que el «¿cuál?»
    // del sistema (sop_cubierta_otro, sist_entrepiso_otro…) estaba en el esquema y nunca salía en
    // pantalla: el 22-sep, 15 visitas marcaron «Otro» en el soporte de la cubierta sin poder decir cuál.
    if (!sub && f.cadena && idxCampo[f.cadena] && val) {
      var hija = idxCampo[f.cadena];
      h += '<div class="sub' + claseNuevo(hija) + '" data-campo="' + esc(hija.name) + '">' +
           '<label class="lab">' + esc(hija.label) + (obligatorio(hija) ? ' <span class="req">*</span>' : '') + '</label>' +
           pistaVarias(hija) + marcaTraido(hija.name) + marcaArrastre(hija.name) +
           '<div class="ctl">' + ctl(hija, true) + '</div>' +
           '<p class="msg">' + esc(hija.vmsg || 'Complete este dato') + '</p></div>' +
           pintaSubs(hija, D[hija.name]);
    }
    return h;
  }

  // Los subcampos que abre una respuesta: el «¿cuál?» de un «Otro», la fotografía de un daño, los
  // datos del propietario. Solo los de las opciones que están marcadas.
  function pintaSubs(f, val) {
    var h = '';
    (f.subs || []).forEach(function (s) {
      var activo = s.cuando.some(function (c) { return SEL(val, c); });
      if (!activo) return;
      h += '<div class="sub' + claseNuevo(s) + '" data-campo="' + esc(s.name) + '">' +
           '<label class="lab">' + esc(s.label) + (obligatorio(s) ? ' <span class="req">*</span>' : '') + '</label>' +
           pistaVarias(s) + marcaTraido(s.name) + marcaArrastre(s.name) +
           (s.ayuda ? '<p class="hint">' + esc(s.ayuda) + '</p>' : '') +
           '<div class="ctl">' + ctl(s, true) + '</div>' +
           '<p class="msg">' + esc(s.vmsg || 'Complete este dato') + '</p></div>';
    });
    return h;
  }

  // `alerta` en el esquema la pinta en ámbar aunque no diga «uso restringido»: son los avisos de B.6
  // de que algo se puede estar contando dos veces.
  function claseNota(t, alerta) {
    if (alerta) return ' a';
    var s = t.toUpperCase();
    if (s.indexOf('NO HABITABLE') > -1 || s.indexOf('ROJO') > -1) return ' r';
    if (s.indexOf('USO RESTRINGIDO') > -1 || s.indexOf('AMARILLO') > -1) return ' a';
    if (s.indexOf('HABITABLE') > -1 || s.indexOf('VERDE') > -1) return ' v';
    return '';
  }

  // ---------------------------------------------------------------- pintar paso
  function pintaPaso(mantenSitio) {
    var vis = pasosVisibles();
    if (iPaso >= vis.length) return pintaFin();
    var p = vis[iPaso];
    var col = { gen: 'var(--gen)', eval: 'var(--eval)', rep: 'var(--rep)', dem: 'var(--dem)' }[p.mod];
    var top = document.getElementById('top');
    top.hidden = false; document.getElementById('bot').hidden = false;
    top.style.setProperty('--c', col);
    var nombreMod = { gen: 'General', eval: 'Evaluación', rep: 'Reparabilidad', dem: 'Demolición' }[p.mod];
    // Con la ficha a la vista en cada paso no hay forma de llenar la unidad equivocada sin darse cuenta.
    document.getElementById('mod').textContent =
      D.unidad_label ? (nombreMod + ' · ' + D.unidad_label) : nombreMod;
    document.getElementById('titulo').textContent = p.titulo;
    // El número de paso lleva el avance de toda la visita y abre el índice (✓ / falta por paso):
    // la barra de abajo solo dice en qué paso se está, no cuánto queda por llenar.
    var av = avance(), pasoN = document.getElementById('pasoN');
    pasoN.textContent = (iPaso + 1) + '/' + vis.length + ' · ' + av.pct + ' %';
    pasoN.setAttribute('aria-label', 'Paso ' + (iPaso + 1) + ' de ' + vis.length + ', avance ' + av.pct +
                       ' %. Abre el índice de pasos');
    document.getElementById('barra').style.width = ((iPaso + 1) / vis.length * 100) + '%';

    // la oferta de traer los datos del edificio de otra visita, arriba, mientras no se decida
    var h = tarjetaEdificio(p);
    p.campos.forEach(function (f) {
      if (f.tipo === 'calc' || f.tipo === 'auto') return;
      if (f.esHija) return;                       // se pinta dentro de su madre
      if (!visible(f)) return;
      if (f.tipo === 'nota' && f.kind === 'cuenta') { h += notaCuenta(f); return; }
      if (f.tipo === 'nota') {
        var txt = f.kind === 'vivo' ? interpola(f.texto) : esc(f.texto);
        // La nota viva se queda con su plantilla puesta, para poder refrescarla al teclear sin
        // repintar el paso entero — repintar mientras alguien escribe le quita el foco.
        h += '<div class="nota' + claseNota(f.texto, f.alerta) + '"' +
             (f.kind === 'vivo' ? ' data-vivo="' + esc(f.texto) + '"' : '') + '>' +
             txt.replace(/ \| /g, '<br>') + '</div>';
        return;
      }
      h += '<div class="f' + claseNuevo(f) + '" data-campo="' + esc(f.name) + '">' +
           '<label class="lab">' + esc(f.label) + (obligatorio(f) ? ' <span class="req">*</span>' : '') + '</label>' +
           pistaVarias(f) + marcaTraido(f.name) + marcaArrastre(f.name) +
           (f.ayuda ? '<p class="hint">' + esc(f.ayuda) + '</p>' : '') +
           '<div class="ctl">' + ctl(f) + '</div>' +
           '<p class="msg">' + esc(f.vmsg || 'Complete este dato') + '</p></div>';
    });

    // El aviso del entorno también aquí. Estaba solo en la bandeja, en los predios y en el
    // buscador: al entrar al formulario desaparecía, y el formulario es donde se pasan las horas
    // y donde se toman las fotografías. Va delante del paso, no al pie.
    // En una visita enviada el aviso del almacén local no aplica: sus fotos están en el servidor.
    document.getElementById('main').innerHTML = (REV ? bandaRev(av) : avisoEntorno()) + (h ||
      '<div class="nota">Este apartado no aplica para esta visita.</div>');
    montaFirmas();          // el lienzo se recrea en cada repintado
    // En una visita enviada lo que falta se señala al entrar al paso, sin esperar a «Siguiente»:
    // de eso se trata abrirla. Sin telemetría: no es un error de quien llena, es la revisión.
    if (REV) marca(valida(), true);
    pintaSigFalta();
    document.getElementById('bAtras').disabled = iPaso === 0;
    refrescaRed();
    // Cuánto falta, dicho ANTES de pulsar y no después. Un obligatorio sin responder se ve
    // igual que uno opcional hasta que bloquea: el asterisco es un punto rojo de 10 px dentro
    // de un rótulo gris. En el piloto eso costó 182 pulsaciones rechazadas en 43 visitas, y la
    // mitad de ellas fue un único campo sin contestar — casi siempre el último del paso.
    //
    // valida() no toca el DOM: sólo lee D y devuelve la lista, así que se puede llamar en cada
    // repintado sin efectos colaterales.
    var faltan = valida().length;
    document.getElementById('bSig').innerHTML =
      esc(iPaso === vis.length - 1 ? (REV ? 'Ver el resumen' : 'Revisar y cerrar') : 'Siguiente') +
      (faltan ? ' <i>&middot; ' + (faltan === 1 ? 'falta 1' : 'faltan ' + faltan) + '</i>' : '');
    if (!mantenSitio) window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- validar
  function pideValor(f) {
    var v = D[f.name];
    return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
  }
  function valida() {
    var p = pasosVisibles()[iPaso];
    return p ? validaPaso(p) : [];
  }
  // Lo mismo que valida(), para un paso cualquiera y no solo el que está en pantalla: el índice de
  // pasos lo pide para todos. `cuenta`, si viene, recibe cada obligatorio visible —lleno o no—,
  // que es con lo que se saca el porcentaje de avance.
  function validaPaso(p, cuenta) {
    var malos = [];
    function revisa(f, dentro) {
      if (!dentro && !visible(f)) return;
      // obligatorio() y no f.req: un campo con req_si (la matrícula que no coincide) también cuenta
      // para el avance, y falta igual que uno obligatorio siempre.
      var ob = obligatorio(f);
      if (ob && cuenta) cuenta(f);
      if (ob && pideValor(f)) { malos.push([f.name, 'Complete este dato']); return; }
      if (f.valida && !pideValor(f) && ev(f.valida, D[f.name]) === false) {
        malos.push([f.name, f.vmsg || 'Valor fuera del rango permitido']);
      }
      // Los botones de pisos salen del paso 3: lo marcado que ya no está entre ellos (se bajaron
      // los pisos allí) no puede irse con la visita como si la edificación lo tuviera.
      if (f.ui === 'pisos' && !pideValor(f)) {
        var fuera = pisosFuera(f);
        if (fuera.length) {
          malos.push([f.name, 'Marcó ' + fuera.map(etiquetaPiso).join(', ') + ', que no está entre los ' +
                      'pisos del paso 3. Quítel' + (fuera.length === 1 ? 'o' : 'os') + ' o corrija el paso 3.']);
        }
      }
    }
    function revisaSubs(f) {
      (f.subs || []).forEach(function (s) {
        if (s.cuando.some(function (c) { return SEL(D[f.name], c); })) revisa(s, true);
      });
    }
    p.campos.forEach(function (f) {
      if (f.tipo === 'calc' || f.tipo === 'auto' || f.tipo === 'nota' || f.esHija) return;
      if (!visible(f)) return;
      revisa(f);
      revisaSubs(f);
      // la hija encadenada y sus propios subcampos, que se pintan dentro de esta tarjeta
      if (f.cadena && D[f.name] && idxCampo[f.cadena]) {
        revisa(idxCampo[f.cadena], true);
        revisaSubs(idxCampo[f.cadena]);
      }
    });
    return malos;
  }
  // `callado`: señalar sin anotarlo como error de validación ni mover la pantalla. Es lo que hace
  // falta al abrir una visita enviada, donde lo que falta se enseña y no es un tropiezo de nadie.
  function marca(malos, callado) {
    var main = document.getElementById('main');
    [].forEach.call(main.querySelectorAll('.err, .err-hijo'), function (e) {
      e.classList.remove('err'); e.classList.remove('err-hijo');
    });
    malos.forEach(function (m) {
      var el = main.querySelector('[data-campo="' + m[0] + '"]');
      if (!el) return;
      el.classList.add('err');
      // si el fallo está en un subcampo, la tarjeta que lo contiene también se marca:
      // de lo contrario el botón parece muerto y no se ve dónde está el problema
      var tarjeta = el.closest('.f');
      if (tarjeta && tarjeta !== el) tarjeta.classList.add('err-hijo');
      var msg = el.querySelector('.msg'); if (msg) msg.textContent = m[1];
    });
    if (malos.length && !callado) {
      var vsP = pasosVisibles()[iPaso];
      malos.forEach(function (m) {
        anota('error_validacion', { campo: m[0], paso: vsP ? vsP.titulo : '',
                                    detalle: { mensaje: m[1] } });
      });
      var pr = main.querySelector('.err, .err-hijo');
      if (pr) pr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // ---------------------------------------------------------------- «Dato nuevo»
  // La fecha de la visita en la hora del teléfono. En UTC, una visita de las siete de la noche del
  // 22 sería del 23, y un campo nacido el 23 no saldría como «Dato nuevo» en ella. Admite la forma
  // de PostgREST («…T14:58:30.453+00:00») y la de Postgres en texto («… 14:58:30.453+00»).
  function fechaLocal(x) {
    var d = typeof x === 'number' ? new Date(x)
      : new Date(String(x || '').replace(' ', 'T').replace(/(:\d\d(?:\.\d+)?)([+-]\d\d)$/, '$1$2:00'));
    if (isNaN(d)) return '';
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function fechaDeLaVisita() {
    if (REV) return REV.creadaEn || '';
    return visita && visita.creada ? fechaLocal(visita.creada) : '';
  }
  // «Dato nuevo»: la pregunta nació (su «desde») después del día de la visita. Sirve en una enviada
  // y también en un borrador que se empezó antes de que la pregunta existiera.
  function esNuevo(f) {
    var c = fechaDeLaVisita();
    return !!(c && f && f.desde && String(f.desde).slice(0, 10) > c);
  }
  function claseNuevo(f) { return esNuevo(f) ? ' nuevo' : ''; }

  // ---------------------------------------------------------------- avance (nota #37)
  // Cuánto le falta a la visita abierta, paso por paso, con las reglas de HOY: obligatorios visibles
  // vacíos, valores que la regla del campo rechaza, y cuántos de los que faltan son preguntas que no
  // existían el día de la visita. En una enviada, lo que falta y no se puede corregir (la firma) va
  // aparte: decir «faltan 2» cuando uno no tiene arreglo manda a buscar lo imposible.
  function avance() {
    var out = { pasos: [], req: 0, faltan: 0, revisar: 0, nuevos: 0, bloqueados: 0, sinFirma: false, pct: 100 };
    pasosVisibles().forEach(function (p) {
      var e = { id: p.id, titulo: p.titulo, falta: [], revisar: [], nuevos: [], bloqueados: [] };
      validaPaso(p, function () { out.req++; }).forEach(function (m) {
        var f = idxCampo[m[0]] || { name: m[0] };
        if (!pideValor(f)) { e.revisar.push(m[0]); return; }
        if (REV && bloqueadoRev(m[0])) {
          e.bloqueados.push(m[0]);
          if (m[0] === 'evaluador_firma') out.sinFirma = true;
          return;
        }
        e.falta.push(m[0]);
        if (esNuevo(f)) e.nuevos.push(m[0]);
      });
      out.faltan += e.falta.length; out.revisar += e.revisar.length;
      out.nuevos += e.nuevos.length; out.bloqueados += e.bloqueados.length;
      out.pasos.push(e);
    });
    // Hacia abajo: con un 99,6 % no puede salir «100 %» si algo falta.
    out.pct = out.req ? Math.floor(100 * (out.req - out.faltan - out.bloqueados) / out.req) : 100;
    if (out.pct > 99 && (out.faltan || out.bloqueados)) out.pct = 99;
    return out;
  }

  function textoFaltan(av) {
    var t = [];
    if (av.faltan) {
      t.push((av.faltan === 1 ? 'Falta 1 dato' : 'Faltan ' + av.faltan + ' datos') +
        (av.nuevos ? ' (' + (av.nuevos === 1 ? '1 es una pregunta nueva'
          : av.nuevos + ' son preguntas nuevas') + ' del formulario)' : ''));
    }
    if (av.revisar) t.push(av.revisar === 1 ? '1 valor por revisar' : av.revisar + ' valores por revisar');
    if (av.sinFirma) t.push('llegó sin firma, y la firma no se añade después');
    else if (av.bloqueados) t.push(av.bloqueados === 1 ? '1 dato que no se corrige' : av.bloqueados + ' datos que no se corrigen');
    return t.length ? t.join(' · ') : 'No falta ningún dato.';
  }

  // ---------------------------------------------------------------- índice de pasos
  // Cada paso visible con ✓ o con lo que le falta, y el porcentaje. Sirve igual en una visita en
  // curso que en una enviada. En una en curso solo se salta hacia atrás o hasta el primer paso con
  // algo pendiente: pasar de paso sigue exigiendo lo de siempre, y el índice no puede ser un atajo
  // para cerrar una visita a medias. En una enviada se va a cualquier paso: es para mirarla.
  function alcanzable(av) {
    if (REV) return av.pasos.length - 1;
    var i = 0;
    while (i < av.pasos.length && !av.pasos[i].falta.length && !av.pasos[i].revisar.length) i++;
    return Math.max(iPaso, Math.min(i, av.pasos.length - 1));
  }
  function estadoPaso(p) {
    if (p.falta.length) return ['falta', p.falta.length === 1 ? 'falta 1' : 'faltan ' + p.falta.length];
    if (p.revisar.length) return ['mira', 'revisar ' + p.revisar.length];
    if (p.bloqueados.length) return ['mira', p.bloqueados.indexOf('evaluador_firma') > -1 ? 'sin firma' : 'no se corrige'];
    return ['ok', '✓'];
  }
  function indiceHTML() {
    var av = avance(), hasta = alcanzable(av);
    var h = '<div class="indice-caja" role="dialog" aria-label="Avance de la visita">' +
      '<div class="indice-cab"><div><b>Avance ' + av.pct + ' %</b><span>' + esc(textoFaltan(av)) + '</span></div>' +
      '<button type="button" class="indice-x" data-a="cierraindice" aria-label="Cerrar">&times;</button></div><ol>';
    av.pasos.forEach(function (p, i) {
      var est = estadoPaso(p);
      h += '<li><button type="button" data-a="irpaso" data-i="' + i + '"' + (i === iPaso ? ' class="aqui"' : '') +
           (i > hasta ? ' disabled' : '') + '><span>' + esc(p.titulo) + '</span><i class="' + est[0] + '">' +
           est[1] + '</i></button></li>';
    });
    h += '</ol>';
    if (!REV && hasta < av.pasos.length - 1) {
      h += '<p class="leyenda">Los pasos en gris se abren al completar los anteriores: se llega a ellos' +
           ' con «Siguiente», como siempre.</p>';
    }
    return h + '</div>';
  }
  function abreIndice() {
    if (vista !== 'paso') return;
    var caja = document.getElementById('indicePasos');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'indicePasos'; caja.className = 'indice';
      document.body.appendChild(caja);
    }
    caja.innerHTML = indiceHTML();
    caja.hidden = false;
  }
  function cierraIndice() {
    var caja = document.getElementById('indicePasos');
    if (caja) caja.hidden = true;
  }
  function irAPaso(i) {
    cierraIndice();
    if (!(i >= 0 && i <= alcanzable(avance()))) return;
    if (REV) REV.aviso = '';
    vista = 'paso'; iPaso = i; pintaPaso();
  }

  // El índice vive fuera de #main (encima de todo), así que sus botones se escuchan en document.
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.id === 'indicePasos') return cierraIndice();       // el fondo oscuro cierra
    var b = t && t.closest ? t.closest('[data-a]') : null;
    if (!b) return;
    if (b.dataset.a === 'cierraindice') return cierraIndice();
    // Solo los renglones del índice (data-i, la posición). El «Ir al paso 3» del control de pisos
    // también es irpaso, pero con data-p (el id del paso), y lo atiende el manejador de #main.
    if (b.dataset.a === 'irpaso' && b.dataset.i !== undefined) return irAPaso(Number(b.dataset.i));
  });
  document.getElementById('pasoN').addEventListener('click', abreIndice);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cierraIndice(); });

  // ---------------------------------------------------------------- guardar
  // Se guarda en cada cambio, con un respiro para no escribir en cada tecla.
  var pendiente = null;
  function guardaVisita(yaMismo) {
    if (!visita) return Promise.resolve();
    visita.D = D; visita.paso = iPaso; visita.resumen = resumenCorto();
    if (pendiente) { clearTimeout(pendiente); pendiente = null; }
    subeBorrador(yaMismo);
    if (yaMismo) return ALMACEN.visitas.guarda(visita).catch(avisaNoGuarda);
    pendiente = setTimeout(function () {
      pendiente = null; ALMACEN.visitas.guarda(visita).catch(avisaNoGuarda);
    }, 400);
    return Promise.resolve();
  }
  // ---------------------------------------------------------------- respaldo en el servidor
  //
  // El teléfono deja de ser el único sitio donde vive la visita a medias. Hace falta porque el
  // almacén local FALLA: a los 17 ingenieros les ha pasado que IndexedDB abre y no deja escribir,
  // y entonces la app trabaja con localStorage, que guarda las respuestas y no las fotografías.
  //
  // Sube SOLO LAS RESPUESTAS. Las fotografías son la segunda entrega: son megabytes y esto se
  // reescribe a cada rato, así que van aparte y de una en una.
  //
  // Su propio respiro, más largo que el del guardado local: el local cuesta milisegundos y este
  // cuesta una petición. Si no hay señal no se intenta — no se encola, porque el borrador se
  // reescribe entero en la siguiente y encolar versiones viejas no aporta nada.
  var pendienteServidor = null, ultimoSubido = 0;
  function respuestasSinAdjuntos() {
    var out = {};
    Object.keys(D || {}).forEach(function (k) {
      var x = D[k];
      if (Array.isArray(x) && typeof x[0] === 'string' && x[0].slice(0, 5) === 'data:') return;
      if (Array.isArray(x) && x[0] && typeof x[0] === 'object' && typeof x[0].datos === 'string') return;
      if (NO_ES_RESPUESTA[k]) return;
      out[k] = x;
    });
    return out;
  }
  // Una linea para reconocer la visita en la tarjeta de recuperar. `resumenCorto()` no sirve:
  // devuelve el objeto que pinta la ficha de la bandeja, y al mandarlo se guardaba
  // "[object Object]" — que es justo lo que no ayuda a decidir si traerla.
  function tituloBorrador() {
    var r = resumenCorto();
    return (r.direccion || r.codigo || 'Visita sin dirección') +
           (r.municipio ? ' · ' + r.municipio : '');
  }
  function subeBorrador(yaMismo) {
    if (!visita || !token() || navigator.onLine === false) return;
    if (visita.estado === 'enviada') return;
    // En el primer paso todavía no hay nada que respaldar: a lo sumo el código del predio. Subirla
    // desde ahí llenaba el servidor de visitas vacías —seis de Marcelo Hoyos entre el 22 y el
    // 23-sep, cada vez que tocaba «Nueva visita» y volvía a salir—, y como el teléfono no siempre
    // las conserva, la tarjeta de recuperar se las ofrecía en cada apertura. La copia del teléfono
    // se guarda igual; la del servidor empieza en cuanto se pasa al segundo paso.
    if (iPaso === 0) return;
    if (pendienteServidor) { clearTimeout(pendienteServidor); pendienteServidor = null; }
    var manda = function () {
      pendienteServidor = null; ultimoSubido = Date.now();
      fetch(API_BORRADOR, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
        body: JSON.stringify({
          accion: 'guarda', visita: visita.id, asignacion: visita.asignacion || null,
          respuestas: respuestasSinAdjuntos(), paso: iPaso, resumen: tituloBorrador(),
          dispositivo: (navigator.userAgent || '').slice(0, 80)
        })
      }).catch(function () { /* sin señal o caído: el local ya lo tiene, se reintenta al siguiente cambio */ });
    };
    if (yaMismo) return manda();
    pendienteServidor = setTimeout(manda, 4000);
  }
  // Al enviar, el borrador del servidor sobra: la copia buena pasa a ser la de `visitas`, y uno
  // que sobreviva al envío reaparece como «trabajo sin terminar» sobre algo ya entregado.
  // Una fotografía al servidor, SOLO si este teléfono no puede guardarla.
  //
  // Con el almacén local sano la foto ya está a salvo y subirla ahora seria mandar los mismos
  // megabytes dos veces: una aquí y otra al enviar la visita. Cuando `conFotos` es false, en
  // cambio, la foto vive únicamente en la memoria de la pestaña — se pierde al recargar — y esta
  // copia es la única que queda. Es el caso de las 4 visitas de Marcelo con cero fotografías.
  function subeFoto(campo, orden, datos) {
    if (ALMACEN.conFotos) return;            // el teléfono la guarda: no hace falta duplicarla
    if (!visita || !token() || navigator.onLine === false) return;
    fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'foto', visita: visita.id, campo: campo, orden: orden, datos: datos })
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      anota('diagnostico', { campo: campo, detalle: { foto_al_servidor: true } });
    }).catch(function (e) {
      // Que esto falle importa: sin el almacén local y sin esta copia, la fotografía no está en
      // ninguna parte. Queda anotado para que se vea desde el tablero.
      anota('foto_falla', { campo: campo, detalle: { respaldo: String(e && e.message || e).slice(0, 80) } });
    });
  }

  function olvidaBorrador(id) {
    if (!token() || navigator.onLine === false) return;
    fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'borra', visita: id })
    }).catch(function () {});
  }

  // Que falle el guardado es lo más grave que puede pasar aquí y hasta ahora no se decía. Se avisa
  // una vez por sesión: repetirlo en cada tecla sería inutilizable.
  var yaAvise = false;
  function avisaNoGuarda(e) {
    if (yaAvise) return;
    yaAvise = true;
    try { anota('diagnostico', { detalle: { guardar: 'falla', motivo: String(e && e.message || e).slice(0, 120) } }); } catch (x) {}
    alert('Este teléfono no está guardando la visita. Antes de seguir llenando: abra el enlace en ' +
          'Chrome, sin modo incógnito, o libere espacio. Lo que escriba ahora se puede perder.');
  }

  function resumenCorto() {
    return {
      codigo: D.cod_registro || '', direccion: D.direccion || '',
      municipio: textoValor('municipio'), clasif: D.eva_clasif_habitabilidad || '',
      colapso: D.estado_colapso || '', fotos: cuentaFotos()
    };
  }
  function cuentaFotos() {
    var n = 0;
    Object.keys(D).forEach(function (k) {
      var v = D[k];
      if (Array.isArray(v) && typeof v[0] === 'string' && v[0].slice(0, 5) === 'data:') n += v.length;
    });
    return n;
  }
  // Consecutivos de construcción nueva ya gastados en este teléfono, por manzana.
  //
  // Solo ve lo de este aparato: si dos personas levantan construcciones nuevas en la misma manzana,
  // las dos pueden sacar N01. Es un identificador temporal para distinguirlas dentro de una jornada,
  // no una llave; el radicado definitivo lo pone después quien consolida.
  var USADOS = {};
  function refrescaUsados() {
    if (!window.ALMACEN || !ALMACEN.visitas) return;
    ALMACEN.visitas.todas().then(function (todas) {
      var m = {};
      todas.forEach(function (v) {
        var d = v.D || {};
        var mz = String(d.manzana || '').trim().toUpperCase();
        var c = /^N(\d+)$/.exec(String(d.construccion_nueva || ''));
        if (!mz || !c) return;
        var n = Number(c[1]);
        if (!m[mz] || n > m[mz]) m[mz] = n;
      });
      USADOS = m;
    }).catch(function () {});
  }

  function CONSEC() {
    if (D.construccion_existe !== 'no') return '';
    var mz = String(D.manzana || '').trim().toUpperCase();
    if (!mz) return '';                       // sin manzana no hay dentro de qué contar
    var n = (USADOS[mz] || 0) + 1;
    return 'N' + (n < 10 ? '0' : '') + n;
  }

  function nuevaVisita() {
    sueltaRev();   // una visita enviada que siguiera abierta dejaría la nueva en solo lectura
    visita = { id: 'v' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
               estado: 'borrador', creada: Date.now(), tocada: Date.now(), D: {}, paso: 0 };
    D = {}; iPaso = 0;
    refrescaUsados();
    Object.keys(PERFIL).forEach(function (k) { if (!NO_ES_RESPUESTA[k]) D[k] = PERFIL[k]; });
    // Una visita que empieza con esta versión trae de otros pasos lo ya dicho (arrastra); la lista
    // de lo que ya se trajo es a la vez la señal: una visita de antes no la tiene y no gana nada.
    D.arrastre_hechos = [];
    recalcula();
    return guardaVisita(true);
  }

  // ---------------------------------------------------------------- pantallas
  function chrome(on) {
    document.getElementById('top').hidden = !on;
    document.getElementById('bot').hidden = !on;
    var m = document.getElementById('marca'); if (m) m.hidden = on;
    var pie = document.getElementById('pie'); if (pie) pie.hidden = on;
    // «Siguiente dato que falta» vive fuera de #main: sin esto se quedaría flotando sobre la lista
    var sf = document.getElementById('sigFalta'); if (sf && !on) sf.hidden = true;
  }
  function fechaCorta(ts) {
    return new Date(ts).toLocaleString('es-CO', { day: '2-digit', month: 'short',
      hour: '2-digit', minute: '2-digit' });
  }
  var ETIQ_ESTADO = { borrador: ['b', 'Sin terminar'], lista: ['l', 'Lista para enviar'],
                      enviada: ['e', 'Enviada'] };
  // Lo que se ve de una visita en la bandeja. «Lista para enviar» a secas no decía si estaba saliendo,
  // si esperaba la señal o si el servidor la había rechazado: el ingeniero de la prueba del 23-sep la
  // vio así y volvió a pulsar. Ahora dice en cuál de esas está.
  function estadoFila(v) {
    if (enVuelo[v.id]) return ['l', 'Enviando…'];
    if (v.estado === 'lista') {
      var u = ultimoEnvio[v.id];
      if (navigator.onLine === false || u === 'sinred') return ['l', 'En cola · sin señal'];
      if (u === 'clave') return ['l', 'En cola · falta la clave'];
      if (u === 'fallo') return ['l', 'En cola · se reintenta'];
    }
    return ETIQ_ESTADO[v.estado] || ETIQ_ESTADO.borrador;
  }

  // ---------------------------------------------------------------- recuperar del servidor
  //
  // Lo que el servidor tiene y este teléfono no. Pasa en tres casos, y los tres son reales: el
  // navegador perdió sus datos, el ingeniero cambió de aparato, o dejó la visita empezada en otro.
  //
  // NUNCA SE TRAE SOLO. Se pregunta, siempre. Pisar el trabajo de alguien sin avisar es peor que
  // tener dos versiones: la versión de más se resuelve mirando, la pisada no se resuelve.
  var RECUPERABLES = null;
  function miraElServidor() {
    if (!token() || navigator.onLine === false) return Promise.resolve([]);
    return fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'mios' })
    }).then(function (r) { return r.ok ? r.json() : { borradores: [] }; })
      .then(function (j) { return j.borradores || []; })
      .catch(function () { return []; });
  }
  // Solo se ofrece lo que aquí no está. Lo que ya existe en el teléfono NO se toca aunque el
  // servidor lo tenga más nuevo: quien está escribiendo ahora mismo es este teléfono, y ofrecerle
  // «traer» encima de lo suyo es justo la forma de perder trabajo.
  function faltanAqui(delServidor, aqui) {
    var mios = {};
    (aqui || []).forEach(function (v) { mios[v.id] = true; });
    return (delServidor || []).filter(function (b) { return !mios[b.visita_local]; });
  }
  function fechaCorta(iso) {
    try {
      var d = new Date(iso), hoy = new Date();
      var dia = d.toDateString() === hoy.toDateString() ? 'hoy'
        : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
      return dia + ' a las ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  function tarjetaRecuperar() {
    if (!RECUPERABLES || !RECUPERABLES.length) return '';
    var h = '<div class="card" style="border-color:var(--gen);margin-bottom:14px">' +
      '<div class="tit">Hay trabajo guardado en el servidor</div>' +
      '<p class="aviso" style="margin:6px 0 10px">' +
      (RECUPERABLES.length === 1
        ? 'Una visita empezada que no está en este teléfono. Puede traerla y seguir donde la dejó.'
        : RECUPERABLES.length + ' visitas empezadas que no están en este teléfono.') +
      ' Vuelven las respuestas; las fotografías, solo las que este teléfono no pudo guardar y se ' +
      'subieron al servidor. Las que no necesite, descártelas.</p>';
    RECUPERABLES.forEach(function (b) {
      h += '<div class="row" style="justify-content:space-between;gap:8px;margin-top:8px">' +
        '<div style="min-width:0"><b style="display:block">' + esc(b.resumen || 'Visita sin título') + '</b>' +
        '<small class="aviso">Guardada ' + esc(fechaCorta(b.actualizado_en)) + '</small></div>' +
        '<div class="row" style="gap:6px;flex-shrink:0">' +
        '<button type="button" class="sec" data-a="trae" data-n="' + esc(b.visita_local) + '">Traer</button>' +
        '<button type="button" class="sec" data-descarta="' + esc(b.visita_local) + '"' +
        ' style="color:var(--rojo,#B3261E)">Descartar</button></div></div>';
    });
    return h + '</div>';
  }
  // La otra salida de la tarjeta. Sin ella, lo que el ingeniero no quería traer se le seguía
  // ofreciendo en cada apertura, y la única forma de quitarlo era pedir que lo borraran en la base.
  // Usa la misma acción que el envío, así que se lleva también las fotografías que el servidor
  // tuviera de esa visita. Pregunta antes: no tiene vuelta atrás.
  function descartaBorrador(id) {
    if (!id) return;
    if (!token() || navigator.onLine === false) {
      alert('Para descartarla hace falta señal.');
      return;
    }
    if (!confirm('¿Descartar esta visita guardada en el servidor? Se borra y no se puede recuperar.')) return;
    fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'borra', visita: id })
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      RECUPERABLES = (RECUPERABLES || []).filter(function (x) { return x.visita_local !== id; });
      anota('diagnostico', { detalle: { borrador_descartado: id } });
      if (vista === 'predios') pintaPredios();
      else if (vista === 'bandeja') pintaBandeja();
    }).catch(function () {
      alert('No se pudo descartar. Inténtelo de nuevo cuando tenga señal.');
    });
  }
  // Su propio escucha: el botón no lleva data-a, así que el despachador general no lo ve.
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-descarta]') : null;
    if (!b) return;
    e.preventDefault();
    descartaBorrador(b.getAttribute('data-descarta'));
  });
  // Una sola vez por apertura, y repinta la pantalla en la que se esté: el ingeniero con
  // asignaciones —o sea, todos— aterriza en «Sus predios», no en la bandeja. La tarjeta estuvo
  // solo en la bandeja y por eso no la veía nadie.
  function compruebaElServidor() {
    if (RECUPERABLES !== null) return;
    RECUPERABLES = [];
    ALMACEN.visitas.todas().then(function (aqui) {
      return miraElServidor().then(function (delServidor) {
        var faltan = faltanAqui(delServidor, aqui);
        if (!faltan.length) return;
        RECUPERABLES = faltan;
        if (vista === 'predios') pintaPredios();
        else if (vista === 'bandeja') pintaBandeja();
      });
    }).catch(function () {});
  }

  // Las fotografías que el servidor tenga de ese borrador, de vuelta al mismo sitio del que
  // salieron. Se bajan por su URL firmada y se vuelven a meter en D como data URL, que es la
  // forma en la que el formulario y el envío las entienden.
  //
  // Si una falla no se para todo: más vale recuperar nueve de diez que ninguna.
  function traeFotos(id, D2) {
    // En un teléfono que no puede guardar fotografías, devolverlas al formulario no sirve:
    // `ALMACEN.visitas.guarda()` las quita antes de escribir, así que se perderían otra vez al
    // repintar. Se cuentan para poder decirlo, pero no se meten en D.
    var puedeQuedarselas = ALMACEN.conFotos;
    return fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'fotos', visita: id })
    }).then(function (r) { return r.ok ? r.json() : { fotos: [] }; })
      .then(function (j) {
        var fotos = (j.fotos || []).sort(function (a, b) { return a.orden - b.orden; });
        return fotos.reduce(function (cadena, f) {
          return cadena.then(function (n) {
            return fetch(f.url).then(function (r) { return r.blob(); }).then(function (b) {
              return new Promise(function (ok) {
                var fr = new FileReader();
                fr.onload = function () {
                  if (puedeQuedarselas) {
                    if (!Array.isArray(D2[f.campo])) D2[f.campo] = [];
                    // Un hueco se llena; una foto que el teléfono ya tiene en ese sitio no se toca.
                    if (!D2[f.campo][f.orden]) D2[f.campo][f.orden] = fr.result;
                  }
                  ok(n + 1);
                };
                fr.onerror = function () { ok(n); };
                fr.readAsDataURL(b);
              });
            }).catch(function () { return n; });
          });
        }, Promise.resolve(0));
      }).catch(function () { return 0; });
  }

  function traeBorrador(id) {
    if (!confirm('¿Traer esta visita del servidor? Se añadirá a su lista sin tocar nada de lo que ya tiene.')) return;
    fetch(API_BORRADOR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'trae', visita: id })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var b = j && j.borrador;
      if (!b) { alert('No se pudo traer esa visita. Inténtelo de nuevo.'); return; }
      // Si la visita ya está en el teléfono, lo que se trae SE SUMA y no la reemplaza: la copia del
      // servidor no lleva las fotografías, y guardarla encima con el mismo id las borraba (así se
      // perdieron las de cinco ingenieros entre el 23 y el 25-sep). Solo entran las respuestas que
      // aquí estén vacías; todo lo demás se queda como estaba.
      return ALMACEN.visitas.lee(b.visita_local).then(function (aqui) {
        var v = aqui ? sumaBorrador(aqui, b)
          : { id: b.visita_local, estado: 'borrador', creada: Date.now(), tocada: Date.now(),
              D: b.respuestas || {}, paso: b.paso || 0, resumen: b.resumen || '',
              asignacion: b.asignacion_id || null };
        return traeYGuarda(v, !!aqui);
      });
    }).catch(function () { alert('No se pudo traer esa visita. Inténtelo de nuevo.'); });

    function traeYGuarda(v, sumado) {
      return traeFotos(id, v.D).then(function (n) {
        if (n) {
          v.resumen = (v.resumen || '') + ' · ' + n +
            (n === 1 ? ' fotografía' : ' fotografías') +
            (ALMACEN.conFotos ? '' : ' en el servidor');
          if (!ALMACEN.conFotos) {
            alert('Se recuperaron las respuestas. Las ' + n + (n === 1 ? ' fotografía está' : ' fotografías están') +
                  ' guardadas en el servidor, pero este teléfono no puede conservarlas: ' +
                  'ábralo en un teléfono que sí pueda, o vuelva a tomarlas aquí.');
          }
        }
        return ALMACEN.visitas.guarda(v);
      }).then(function () {
        RECUPERABLES = (RECUPERABLES || []).filter(function (x) { return x.visita_local !== id; });
        // `diagnostico` y no un tipo nuevo: campo-sesion solo acepta los de su lista y
        // descarta el resto sin decir nada. Un evento inventado aquí no llegaría nunca.
        // `sumado`: la visita ya estaba en el teléfono. Si vuelve a salir, algo sigue ofreciendo
        // traer lo que no falta, y ahora se ve en los registros.
        anota('diagnostico', { visita: id, detalle: { borrador_traido: true, sumado: sumado } });
        pintaBandeja();
      }).catch(function () { alert('No se pudo guardar aquí la visita que se trajo.'); });
    }
  }

  // La visita del teléfono, completada con lo que tenga de más la copia del servidor. Nunca quita ni
  // cambia nada de lo que ya hay: solo llena las respuestas vacías. El paso es el más avanzado de los
  // dos, y el estado y la asignación, los del teléfono.
  function sumaBorrador(aqui, b) {
    var D = aqui.D || (aqui.D = {}), R = b.respuestas || {};
    var vacio = function (x) {
      return x === undefined || x === null || x === '' || (Array.isArray(x) && !x.length);
    };
    Object.keys(R).forEach(function (k) { if (vacio(D[k]) && !vacio(R[k])) D[k] = R[k]; });
    aqui.paso = Math.max(aqui.paso || 0, b.paso || 0);
    aqui.asignacion = aqui.asignacion || b.asignacion_id || null;
    aqui.resumen = aqui.resumen || b.resumen || '';
    return aqui;
  }

  function pintaBandeja() {
    sueltaRev();
    vista = 'bandeja'; chrome(false); visita = null;
    var p = PERFIL.evaluador_nombre;
    compruebaElServidor();
    ALMACEN.visitas.todas().then(function (todas) {
      // La lectura tarda (con fotos, en un teléfono, cientos de milisegundos) y la bandeja se repinta
      // sola cada vez que sale una visita: si entretanto el ingeniero ya está en otra pantalla, esta
      // bandeja llega tarde y no se pinta encima.
      if (vista !== 'bandeja') return;
      // primero lo que queda por hacer, después lo que espera envío, al final lo ya enviado
      var PESO = { borrador: 0, lista: 1, enviada: 2 };
      todas.sort(function (a, b) {
        var d = (PESO[a.estado] || 0) - (PESO[b.estado] || 0);
        return d !== 0 ? d : b.tocada - a.tocada;
      });
      var listas = todas.filter(function (v) { return v.estado === 'lista'; });
      var enviadas = todas.filter(function (v) { return v.estado === 'enviada'; });
      var h = '<div class="pantalla">' + barraRed() + avisoEntorno() + avisoEnvio() +
        '<div class="eyebrow">Evaluación rápida por inspección visual</div>' +
        '<h1>Visita post-sismo</h1>' + tarjetaRecuperar();

      if (!todas.length) {
        h += '<p class="lede">Una edificación por visita. El formulario se adapta a lo que usted' +
             ' responda: solo aparecen los apartados que corresponden. Todo se guarda en el' +
             ' teléfono, sin necesidad de señal.</p>';
      }
      if (!claveEnvio()) {
        // Dos situaciones distintas con la misma consecuencia. La de los ingenieros contratados es
        // la segunda: entran por su enlace personal, y si el teléfono pierde lo guardado el icono
        // de la pantalla de inicio abre la aplicación sin él. Decirles «falta la clave del equipo»
        // los manda a buscar algo que no existe: lo que falta es su enlace.
        h += token()
          ? '<div class="nota a">Falta la <b>clave del equipo</b>. Puede levantar visitas' +
            ' sin ella, pero no se podrán enviar. Se pone en «datos del evaluador».</div>'
          : '<div class="nota a"><b>Este teléfono no tiene su enlace personal.</b> Vuelva a abrir el' +
            ' enlace que le enviaron por WhatsApp o por correo, y desde esa página añádalo otra vez a' +
            ' la pantalla de inicio. Puede seguir levantando visitas, pero no se podrán enviar hasta' +
            ' que entre con su enlace.</div>';
      }
      h += '<button class="big" data-a="nueva">Nueva visita</button>';

      if (todas.length) {
        h += '<div class="seccion"><h2>Visitas en el teléfono</h2>' +
             '<span class="cuenta">' + todas.length + '</span></div><div class="lista">';
        todas.forEach(function (v) {
          var e = estadoFila(v);
          var r = v.resumen || {};
          var tit = r.codigo || r.direccion || 'Visita sin identificar';
          // Un borrador no tiene informe todavía: le falta lo que decide el dictamen. El botón del PDF
          // va debajo, a todo el ancho y de 46 px, como en «Sus visitas enviadas»: en la columna de la
          // derecha no cabía más que una píldora y le quitaba sitio a la dirección.
          var bts = v.estado === 'borrador' ? '' : '<div class="fila-bts"><button type="button" class="pdf"' +
            ' data-a="informe" data-id="' + esc(v.id) + '" aria-label="Descargar el informe del predio en PDF">' +
            'Descargar PDF</button></div>';
          h += '<div class="fila' + (bts ? ' con-bts' : '') + '" data-a="abrir" data-id="' + esc(v.id) +
               '" role="button" tabindex="0">' +
               '<div class="fila-txt"><b>' + esc(tit) + '</b>' +
               '<span>' + esc([r.direccion !== tit ? r.direccion : '', r.municipio]
                 .filter(Boolean).join(' · ') || fechaCorta(v.tocada)) + '</span></div>' +
               '<div class="fila-meta"><span class="chip ' + e[0] + '">' + e[1] + '</span>' +
               (r.fotos ? '<span class="mini">' + r.fotos + ' foto' + (r.fotos === 1 ? '' : 's') + '</span>' : '') +
               '</div>' +
               '<button class="tirar" data-a="borrar" data-id="' + esc(v.id) +
               '" aria-label="Borrar visita">&times;</button>' + bts + '</div>';
        });
        h += '</div>';
      }

      // Salen solas (al finalizar, al volver la señal y cada minuto mientras quede alguna): el botón
      // es para no tener que esperar, y mientras sale una tanda dice que está en ello.
      if (listas.length) {
        h += '<button class="big" data-a="enviar"' + (enviando ? ' disabled' : '') + '>' +
             (enviando ? 'Enviando…' : 'Enviar ahora ' + (listas.length === 1 ? 'la visita en cola'
               : 'las ' + listas.length + ' visitas en cola')) + '</button>';
      }
      if (enviadas.length) {
        h += '<button class="big sec" data-a="limpiar">' + (enviadas.length === 1
             ? 'Borrar del teléfono la visita ya enviada'
             : 'Borrar del teléfono las ' + enviadas.length + ' visitas ya enviadas') + '</button>';
      }
      if (SESION) h += '<button class="big sec" data-a="volverpredios">Volver a mis predios</button>';
      h += (SESION ? '' : '<button class="big sec" data-a="perfil">' + (p ? 'Cambiar' : 'Registrar') +
           ' datos del evaluador</button>') +
           (p ? '<p class="aviso">Evaluador: <b>' + esc(p) + '</b> · ' +
                esc(etiquetaLista('entidad', PERFIL.entidad) || '—') + '</p>' : '') +
           '<p class="aviso" id="espacio"></p></div>';
      document.getElementById('main').innerHTML = h;
      pintaEspacio();
      sincronizaSiPuede();
    });
  }

  // ---------------------------------------------------------------- se puede guardar aquí?
  // Tener la API no es poder usarla: en incógnito, y dentro del navegador que WhatsApp o Gmail
  // abren por su cuenta, IndexedDB existe y falla al escribir, o guarda en un cajón que se tira al
  // salir. Por eso se escribe y se vuelve a leer, en vez de preguntar.
  var ENTORNO = null;

  function esNavegadorDeOtraApp() {
    var ua = navigator.userAgent || '';
    if (/; wv\)/.test(ua)) return 'webview de Android';          // el navegador incrustado
    if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter/i.test(ua)) return 'navegador de otra aplicación';
    // iOS: el Safari de verdad termina en Safari/xxx; los incrustados, no
    if (/iPhone|iPad/.test(ua) && !/Safari\//.test(ua)) return 'navegador incrustado de iOS';
    return '';
  }

  function pruebaGuardado() {
    var marca = 'psismo.prueba', ok = { local: false, idb: false };
    try { localStorage.setItem(marca, '1'); ok.local = localStorage.getItem(marca) === '1';
          localStorage.removeItem(marca); } catch (e) { ok.local = false; }
    return ALMACEN.prueba()
      .then(function (v) { ok.idb = !!v; return ok; })
      .catch(function () { ok.idb = false; return ok; });
  }

  function diagnostica() {
    var dentro = esNavegadorDeOtraApp();
    return pruebaGuardado().then(function (ok) {
      ENTORNO = {
        local: ok.local, idb: ok.idb, dentro: dentro,
        instalada: !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      };
      // El espacio viaja con el diagnóstico: cuando alguien dice «ya liberé espacio», esto lo
      // contesta sin tener que pedirle una captura de pantalla.
      return ALMACEN.uso().then(function (u) {
        if (u && u.cuota) {
          ENTORNO.mb_libres = Math.round((u.cuota - u.usado) / 1048576);
          ENTORNO.mb_usados = Math.round(u.usado / 1048576);
        }
        return ok;
      }).catch(function () { return ok; });
    }).then(function (ok) {
      // Va al panel: así esto se ve desde el tablero y no hay que adivinarlo por teléfono.
      anota('diagnostico', { detalle: ENTORNO });
      // Se repinta la pantalla en la que esté, para que el aviso salga solo y no haya que
      // tocar nada para verlo.
      if (!ok.local || !ok.idb || dentro) {
        if (vista === 'predios') pintaPredios();
        else if (vista === 'bandeja') pintaBandeja();
      }
      return ENTORNO;
    });
  }

  // Cuántas fotografías de la visita abierta están SOLO en memoria.
  //
  // Con el respaldo en localStorage, `sinFotos()` las quita antes de guardar: no es que se
  // guarden mal, es que no se guardan. Decir el número las vuelve algo que se puede perder —
  // «se perderán las 14 que lleva» se entiende, «podría perder las fotos» no.
  function fotosEnRiesgo() {
    if (ALMACEN.conFotos || !D) return 0;
    var n = 0;
    Object.keys(D).forEach(function (k) {
      var x = D[k];
      if (Array.isArray(x) && typeof x[0] === 'string' && x[0].slice(0, 5) === 'data:') n += x.length;
    });
    return n;
  }

  // El aviso. Rojo y arriba, no una línea gris al pie: lo que está en juego es una tarde de trabajo.
  function avisoEntorno() {
    if (!ENTORNO) return '';
    if (ENTORNO.local && ENTORNO.idb && !ENTORNO.dentro) return '';
    // Tres casos distintos, tres avisos distintos. Decirle «no se guarda nada» a quien sí conserva
    // las respuestas lo manda a repetir trabajo que no hacía falta repetir.
    var que;
    if (!ENTORNO.local) {
      que = '<b>Este teléfono no está guardando nada.</b> Lo que escriba se perderá al cambiar de ' +
            'pantalla. Abra el enlace en <b>Chrome</b>, sin modo incógnito.';
    } else if (!ENTORNO.idb) {
      // Con fotos ya tomadas el aviso deja de ser una advertencia y pasa a ser un inventario de
      // lo que hay en juego en este momento.
      var n = fotosEnRiesgo();
      que = '<b>Las fotografías no se conservan al cerrar.</b> Las respuestas sí quedan guardadas, ' +
            'pero este navegador no puede retener las fotos: <b>tómelas y envíe la visita sin ' +
            'cerrar la aplicación</b>. ' +
            (n ? 'Ahora mismo hay <b>' + n + (n === 1 ? ' fotografía</b> que solo está'
                                                      : ' fotografías</b> que solo están') +
                 ' en la memoria del teléfono. '
               : 'Si la cierra antes de enviar, habrá que volver a tomarlas. ') +
            'Suele arreglarse añadiendo el enlace a la pantalla de inicio, o liberando espacio.';
    } else {
      que = '<b>Está abriendo el formulario dentro de otra aplicación</b> (WhatsApp, Gmail o ' +
            'similar). Ahí la cámara no abre y lo que escriba se pierde. Ábralo en <b>Chrome</b>.';
    }
    // La barra de conexión va en versalitas; un párrafo entero en mayúsculas no se lee.
    // `.red` es una píldora en línea y en versalitas: sirve para dos palabras, no para un párrafo.

    return '<div class="red off" style="display:block;align-self:stretch;border-radius:14px;' +

  var AVISO_ENVIO = { id: '', cuando: 0, tipo: '', res: null, sinDatos: false };
  function avisoEnvio() {
    var a = AVISO_ENVIO;

    var t, c = 'nota';
    if (a.tipo === 'enviando') {

    } else if (a.tipo === 'ok') {

      c = 'nota v';

          : est === 'en_curso' ? ' El predio sigue abierto en «Sus predios».' : '');
    } else if (a.tipo === 'sinred') {

    } else {

  }

  function barraRed() {

  function pintaEspacio() {

  function etiquetaLista(lista, v) {

  }

  var CAMPOS_PERFIL = [
    { name: 'entidad', label: 'Entidad', ui: 'tarjetas', lista: 'entidad', req: true,

    { name: 'clave_dispositivo', label: 'Clave del equipo', ui: 'clave', req: true,
      ayuda: 'La entrega el coordinador al asignar el teléfono. Se guarda aquí y no se ' +
             'vuelve a pedir. Sin ella se puede levantar visitas, pero no enviarlas.' }
  ];
  CAMPOS_PERFIL.forEach(function (f) {
    idxCampo[f.name] = f;
    (f.subs || []).forEach(function (s) { idxCampo[s.name] = s; });

  function pintaPerfil(mantenSitio) {
    vista = 'perfil'; chrome(false);

    var h = '<div class="pantalla"><div class="eyebrow">Se pide una sola vez</div>' +
      '<h1>Datos del evaluador</h1>' +

  function pintaFin() {
    // Una visita enviada no se «cierra» otra vez: su final es un resumen propio, sin el botón que

    vista = 'fin'; chrome(false);
    recalcula();
    var clas = D.eva_clasif_habitabilidad, colapso = D.estado_colapso;
    var v = { habitable: ['vv', 'Habitable', 'La edificación puede seguir siendo ocupada.'],

              no_habitable: ['vr', 'No habitable', 'La edificación NO debe ser ocupada.'] }[clas];
    if (colapso === 'total') v = ['vr', 'Colapso total', 'La edificación está totalmente colapsada.'];
    if (!v) v = ['vn', 'Sin clasificar', 'No se diligenció la evaluación rápida de daños.'];

    if (clas === 'habitable' && colapso !== 'total' && D.eva_habitable_reparaciones === 'si') {

    }

    // el volumen se calcula siempre, pero solo significa algo si se abrió demolición:
    // sin esta puerta una edificación habitable aparecía con escombros por demoler
    var hayDemolicion = E.pasos.some(function (p) {
      return p.id.indexOf('d') === 0 || p.id === 'c0_estado' ? visible(p) : false;
    });
    var vol = hayDemolicion ? D.volumen_final : '';
    var filas = [
      ['Código de registro', D.cod_registro],
