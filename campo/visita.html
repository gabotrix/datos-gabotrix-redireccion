<script>/* Visita post-sismo — motor de formulario XLSForm en el navegador */
(function () {
  'use strict';

  var E = window.ESQUEMA;

  // ------------------------------------------------------ reparabilidad: una parte, una ficha
  //
  // El módulo B preguntaba las medidas UNA vez y después "¿cuántos muros tienen estas
  // características?", y multiplicaba: rep_muro_total = área × elementos. Eso solo es cierto si
  // todos los muros son iguales, y en campo no lo son. Un muro de 2×3 con una fisura fina y otro
  // de 6×3 medio caído entraban como "2 muros" con el área del primero: el total salía inventado
  // y no quedaba forma de saber cuál era cuál ni cuál urgía.
  //
  // Ahora la cantidad abre esa misma ficha tantas veces como haga falta. Cada parte lleva sus
  // medidas, su material, su nivel de daño, su fotografía y sus notas, y el total deja de ser una
  // multiplicación para pasar a ser la suma de las partes.
  //
  // CÓMO ESTÁ HECHO. La ficha 1 son los campos que ya existían, sin renombrar: una visita vieja se
  // sigue leyendo igual y el panel sigue encontrando rep_muro_longitud donde siempre. De la 2 en
  // adelante se clonan con sufijo _2, _3… conservando tipo, lista, validación, unidad y relevancia
  // propia del original — clonar en vez de reescribir evita que una ficha se desvíe de otra.
  //
  // No hace falta inventar un constructo de repetición en el motor: salen campos normales y
  // corrientes con un relevant que dice "aparezco si mi número no pasa de la cantidad".
  // Relevancia, validación, guardado, fotografías y envío siguen funcionando sin tocar nada.
  var MAX_FICHAS = 20;
  //
  // UNO POR UNO O EL TOTAL (#30). Donde hay `modo`, la primera pregunta tras «¿hay daño?» es cómo se
  // mide: 'uno_a_uno' son las fichas de siempre; 'global' es una sola cifra para todo el apartado. Con
  // el total no se pregunta cuántos ni se abren las fichas 2 a 20, y la ficha 1 se queda sin sus
  // medidas (las que llevan «modo != global» en su condición) pero con lo que describe el daño:
  // material, destino, forma, nivel, foto y notas. `globales` dice qué total sale de qué cifra: sin
  // modo —todas las visitas anteriores— el total es la suma de las fichas, como siempre.
  //
  // CADA FICHA ES UN TIPO (observaciones del 23-sep). «Si las 12 columnas miden lo mismo, que no tenga
  // que abrir 12 fichas iguales»: la ficha describe un TIPO —sus medidas, su material, su daño— y dice
  // cuántos elementos son así (`iguales`, «¿Cuántas columnas tienen estas medidas?»). Vacío vale 1, que
  // es lo que enseña el contador y lo que vale en una visita vieja: cada ficha de antes es un tipo de un
  // elemento, y su total sale idéntico. El subtotal del tipo (<prefijo>subtotal) es la medida de UN
  // elemento, redondeada como se enseña, por cuántos son; el total del apartado es la suma de los
  // subtotales (sumaDeFichas) y <prefijo>cuantos cuenta los elementos de todos los tipos.
  var REPETIBLES = [
    { paso: 'b1_muro',     cuenta: 'rep_muro_elementos',   ficha: 'Muro',    nivel: 'rep_muro_nivel',
      pregunta: '¿Cuántos tipos distintos de muro divisorio hay que reparar?', iguales: 'rep_muro_iguales',
      varios: 'muros', genero: 'm',
      modo: 'rep_muro_modo', globales: { rep_muro_total: 'rep_muro_total_global' } },
    { paso: 'b2_Panete',   cuenta: 'rep_Panete_elementos', ficha: 'Zona',    nivel: 'rep_Panete_nivel',
      pregunta: '¿Cuántos tipos distintos de zona de pañete hay que reparar?', iguales: 'rep_Panete_iguales',
      varios: 'zonas', genero: 'f' },
    { paso: 'b3_columnas', cuenta: 'rep_col_elementos',    ficha: 'Columna', nivel: 'rep_col_nivel',
      pregunta: '¿Cuántos tipos distintos de columna hay que reparar?', iguales: 'rep_col_iguales',
      varios: 'columnas', genero: 'f',
      modo: 'rep_col_modo',
      globales: { rep_col_total_area: 'rep_col_total_global', rep_col_total_long: 'rep_col_total_global_long' } },
    { paso: 'b4_ventanas', cuenta: 'rep_ven_elementos',    ficha: 'Ventana', nivel: 'rep_ven_nivel',
      pregunta: '¿Cuántos tipos distintos de ventana hay que reparar?', iguales: 'rep_ven_iguales',
      varios: 'ventanas', genero: 'f' },
    { paso: 'b5_dinteles', cuenta: 'rep_din_elementos',    ficha: 'Dintel',  nivel: 'rep_din_nivel',
      pregunta: '¿Cuántos tipos distintos de dintel hay que reparar?', iguales: 'rep_din_iguales',
      varios: 'dinteles', genero: 'm' },
    // B.8 y B.9 (fase 3) se miden como el pañete y como las columnas: por zonas y por vigas. Su total
    // suma solo lo que se ve (soloVisible, ver sumaDeFichas): no tienen visitas viejas que cambiar.
    { paso: 'b8_cielo',    cuenta: 'rep_cielo_elementos',  ficha: 'Zona',    nivel: 'rep_cielo_nivel',
      pregunta: '¿Cuántos tipos distintos de zona de cielo raso hay que reparar?', soloVisible: true,
      iguales: 'rep_cielo_iguales', varios: 'zonas', genero: 'f' },
    { paso: 'b9_vigas',    cuenta: 'rep_vig_elementos',    ficha: 'Viga',    nivel: 'rep_vig_nivel',
      pregunta: '¿Cuántos tipos distintos de viga hay que reparar?', soloVisible: true,
      iguales: 'rep_vig_iguales', varios: 'vigas', genero: 'f',
      modo: 'rep_vig_modo',
      globales: { rep_vig_total_area: 'rep_vig_total_global', rep_vig_total_long: 'rep_vig_total_global_long' } }
  ];

  // La ficha 1 conserva los nombres de siempre; de ahí en adelante van con sufijo.
  function nombreFicha(n, i) { return i === 1 ? n : n + '_' + i; }

  // Cuántos elementos tiene el tipo, como expresión: vacío es 1. string-length y no «!= ''»: en
  // JavaScript 0 == '' es verdad, y un cero escrito pasaría por vacío.
  function exprIguales(n) {
    return 'if(string-length(${' + n + '}) > 0, ${' + n + '}, 1)';
  }
  // Lo mismo, con el valor: vacío es 1 y lo escrito, lo escrito (también un 0, que valida() rechaza).
  function valorIguales(v) {
    return v === undefined || v === null || v === '' ? 1 : Number(v);
  }

  // ------------------------------------------------------ la cuenta de cada tipo, con los números
  //
  // «2 × (0,30 + 0,30) × 2,40 = 2,88 m² por columna × 12 columnas = 34,56 m²». Que se vea de dónde
  // sale cada cifra: el ingeniero la comprueba en sitio y un lado mal escrito salta a la vista. Es la
  // MISMA cuenta que guardan <prefijo>subtotal y el total del apartado (esquema y sumaDeFichas): la
  // medida de un elemento redondeada a centésimas, por cuántos son, redondeado otra vez. Las
  // operaciones van en el mismo orden que en el esquema, para que den el mismo número hasta el último
  // decimal; una prueba lo compara ficha por ficha.
  function cifra(x) {
    return Number(x).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function centesimas(x) { return Math.round(Number(x) * 100) / 100; }
  function positivo(v) {
    var x = typeof v === 'number' ? v : aNumero(v);
    return typeof x === 'number' && isFinite(x) && x > 0 ? x : 0;
  }
  // pañete y cielo raso: el área o la longitud escritas, según la forma del daño
  function medidaZona(g) {
    var x;
    if (g('tipo') === 'lineal') { x = positivo(g('longitud')); return x ? { v: x, u: 'm', de: ' de fisura' } : null; }
    if (g('tipo') === 'area') { x = positivo(g('area')); return x ? { v: x, u: 'm²' } : null; }
    return null;
  }
  // columnas y vigas: lineal, la fisura; por área, la fórmula si están las medidas y, si no, el área escrita
  function medidaRecubrimiento(g, formula) {
    var x;
    if (g('tipo') === 'lineal') { x = positivo(g('longitud')); return x ? { v: x, u: 'm', de: ' de fisura' } : null; }
    if (g('tipo') !== 'area' || g('modo') === 'global') return null;
    var f = formula(g);
    if (f) return f;
    x = positivo(g('area'));
    return x ? { v: x, u: 'm²', de: ' (área escrita)' } : null;
  }
  // La tabla se arma la primera vez que hace falta y no al cargar: así sigue siendo una declaración de
  // función, que es lo que el arnés de pruebas (comun/motor.js) saca del archivo para probarla.
  var CUENTAS = null;
  function tablaCuentas() { return CUENTAS || (CUENTAS = {
    rep_muro_: { uno: 'muro', varios: 'muros', totales: [['rep_muro_total', 'm²', '']],
      medida: function (g) {
        var l = positivo(g('longitud')), h = positivo(g('altura'));
        return l && h ? { txt: cifra(l) + ' × ' + cifra(h), v: l * h, u: 'm²' } : null;
      } },
    rep_Panete_: { uno: 'zona', varios: 'zonas', medida: medidaZona,
      totales: [['rep_panete_total_area', 'm²', 'por área'], ['rep_panete_total_long', 'm', 'lineales']] },
    rep_col_: { uno: 'columna', varios: 'columnas',
      totales: [['rep_col_total_area', 'm²', 'por área'], ['rep_col_total_long', 'm', 'lineales']],
      medida: function (g) {
        return medidaRecubrimiento(g, function (g) {
          // lado B vacío: sección cuadrada, se toma el lado A
          var a = positivo(g('lado_a')), b = positivo(g('lado_b')) || a, h = positivo(g('altura'));
          return a && h ? { txt: '2 × (' + cifra(a) + ' + ' + cifra(b) + ') × ' + cifra(h), v: 2 * (a + b) * h, u: 'm²' } : null;
        });
      } },
    rep_ven_: { uno: 'ventana', varios: 'ventanas', totales: [['rep_ven_total', 'm²', '']],
      medida: function (g) {
        var a = positivo(g('alto')), b = positivo(g('ancho'));
        return a && b ? { txt: cifra(a) + ' × ' + cifra(b), v: a * b, u: 'm²' } : null;
      } },
    rep_din_: { uno: 'dintel', varios: 'dinteles', totales: [['rep_din_total', 'm', '']],
      medida: function (g) { var a = positivo(g('ancho')); return a ? { v: a, u: 'm', de: ' de vano' } : null; } },
    rep_cielo_: { uno: 'zona', varios: 'zonas', medida: medidaZona,
      totales: [['rep_cielo_total_area', 'm²', 'por área'], ['rep_cielo_total_long', 'm', 'lineales']] },
    rep_vig_: { uno: 'viga', varios: 'vigas',
      totales: [['rep_vig_total_area', 'm²', 'por área'], ['rep_vig_total_long', 'm', 'lineales']],
      medida: function (g) {
        return medidaRecubrimiento(g, function (g) {
          // las tres caras que se ven: la de abajo y los dos costados
          var b = positivo(g('base')), p = positivo(g('peralte')), l = positivo(g('largo'));
          return b && p && l ? { txt: '(' + cifra(b) + ' + 2 × ' + cifra(p) + ') × ' + cifra(l), v: (b + 2 * p) * l, u: 'm²' } : null;
        });
      } }
  }); }
  // [medida de un elemento, cuántos, subtotal] del tipo i, o null si faltan medidas.
  function cuentaDeTipo(pre, i) {
    var c = tablaCuentas()[pre], r = REPETIBLES.filter(function (x) { return x.iguales === pre + 'iguales'; })[0];
    if (!c || !r) return null;
    var m = c.medida(function (b) {
      // el modo es del apartado: no lleva el número de la ficha
      return b === 'modo' ? D[r.modo] : D[nombreFicha(pre + b, i)];
    });
    if (!m) return null;
    var n = valorIguales(D[nombreFicha(pre + 'iguales', i)]), pe = centesimas(m.v);
    return { m: m, n: n, porUno: pe, subtotal: centesimas(pe * n), c: c };
  }
  // [lo que da un elemento, por cuántos y el subtotal]: en pantalla van en dos renglones
  function fraseCuenta(x, uno, varios) {
    return [(x.m.txt ? x.m.txt + ' = ' : '') + cifra(x.porUno) + ' ' + x.m.u + (x.m.de || '') + ' por ' + uno,
            '× ' + x.n + ' ' + (x.n === 1 ? uno : varios) + ' = ' + cifra(x.subtotal) + ' ' + x.m.u];
  }
  // El detalle de A.3: dos medidas por elemento (d1 × d2), como su área de siempre.
  function cuentaDeA3(pre, i) {
    var d = DETALLABLES.filter(function (x) { return 'eva_det_' + x.k + '_' === pre; })[0];
    if (!d || !d.d1) return null;
    var a = positivo(D[pre + i + '_d1']), b = positivo(D[pre + i + '_d2']);
    if (!a || !b) return null;
    var n = valorIguales(D[pre + i + '_iguales']), pe = centesimas(a * b);
    return { m: { txt: cifra(a) + ' × ' + cifra(b), v: a * b, u: 'm²' }, n: n, porUno: pe,
             subtotal: centesimas(pe * n), c: { uno: d.sing.toLowerCase(), varios: d.plur } };
  }
  // El texto de una nota de cuenta (kind 'cuenta'): la de un tipo o, con `total`, la del apartado.
  function textoCuenta(f) { return partesCuenta(f).join(' '); }
  function partesCuenta(f) {
    if (!f || !f.cuenta) return [];
    if (f.total) {
      var c = tablaCuentas()[f.cuenta], r = REPETIBLES.filter(function (x) { return x.iguales === f.cuenta + 'iguales'; })[0];
      if (!c || !r) return [];
      var partes = c.totales.map(function (t) {
        var x = positivo(D[t[0]]);
        return x ? cifra(x) + ' ' + t[1] + (t[2] ? ' ' + t[2] : '') : '';
      }).filter(Boolean);
      var n = positivo(D[f.cuenta + 'cuantos']), tipos = positivo(D[r.cuenta]);
      return ['Total: ' + (partes.length ? partes.join(' y ') : '0,00 ' + c.totales[0][1]) +
              (n ? ' en ' + n + ' ' + (n === 1 ? c.uno : c.varios) + (tipos > 1 ? ' de ' + tipos + ' tipos' : '') : '') + '.'];
    }
    var x = f.cuenta.indexOf('eva_det_') === 0 ? cuentaDeA3(f.cuenta, f.ficha || 1) : cuentaDeTipo(f.cuenta, f.ficha || 1);

  // el espacio antes del <br> hace que el texto de la nota sea la frase entera, con sus espacios
  function htmlCuenta(f) { return partesCuenta(f).map(esc).join(' <br>'); }
  function notaCuenta(f) {
    return '<div class="nota cuenta" data-cuenta="' + esc(f.name) + '">' + htmlCuenta(f) + '</div>';
  }

  // Sufijar SOLO lo que pertenece a la ficha. La primera versión sufijaba todo lo que encontraba y
  // la puerta del bloque se convertía en ${rep_muro_dano_2}, un campo que no existe: de la ficha 2
  // en adelante no se veía ni un campo. Lo delató dibujarlo, no las pruebas — de ahí que la lista
  // de nombres propios viaje hasta aquí.
  function exprFicha(x, i, propios) {
    if (!x || i === 1) return x;
    return String(x).replace(/\$\{(\w+)\}/g, function (todo, n) {
      return propios && propios[n] ? '${' + n + '_' + i + '}' : todo;
    });
  }

  function clonaFicha(f, i, rotulo, visible, propios) {
    var c = {}, p;
    for (p in f) if (Object.prototype.hasOwnProperty.call(f, p)) c[p] = f[p];
    c.name = nombreFicha(f.name, i);
    // el número de la ficha: la cuenta del tipo (cuentaTipo) lo necesita para leer sus medidas
    c.ficha = i;
    // lo que solo va en la ficha 1 (el total medido de una vez) es de todo el apartado: sin «Muro 1»
    if (f.label) c.label = f.solo_ficha_1 ? f.label : rotulo + ' · ' + f.label;
    if (f.calc) c.calc = exprFicha(f.calc, i, propios);
    if (f.texto) c.texto = exprFicha(f.texto, i, propios);
    // «obligatorio si…» también mira los campos de SU ficha: el lado A de la columna 3 se pide si el
    // área escrita de la columna 3 está vacía, no la de la 1
    if (f.req_si) c.req_si = exprFicha(f.req_si, i, propios);
    if (f.tipo === 'calc') {
      // Un calculado nunca se esconde: si dejara de evaluarse al ocultar la ficha, el total se
      // quedaría con el valor de antes y nadie lo notaría. Lo que sí hace es devolver vacío
      // cuando su ficha no está en uso — si no, cada visita cargaría con medio centenar de ceros
      // de fichas que nadie abrió, y la ficha de detalle del panel los pintaría todos.
      // El redondeo no es cosmética: el área del muro se calculaba sin él y 1,5 × 2,4 salía en
      // pantalla como "3.5999999999999996 m²". Eso ya pasaba con la ficha única.
      // Un calculado de la ficha con condición propia (el subtotal del tipo: con daño, medido uno por
      // uno y con la forma del daño elegida) también vale vacío mientras no se cumple: un subtotal de
      // cero en cada visita con el total medido de una vez diría «0 m²» donde no se midió nada.
      var propiaC = exprFicha(f.relevant, i, propios);
      c.relevant = null;
      c.calc = 'if(' + (propiaC ? '(' + propiaC + ') and (' + visible + ')' : visible) + ', round(' +
               exprFicha(f.calc, i, propios) + ", 2), '')";
    } else {
      // se conserva la condición propia del campo — en B.2 y B.3 el área y la longitud dependen
      // de la forma del daño, y perder eso pediría las dos medidas a la vez
      var propia = exprFicha(f.relevant, i, propios);
      c.relevant = propia ? '(' + propia + ') and (' + visible + ')' : visible;
    }
    if (f.subs) {
      c.subs = f.subs.map(function (s) { return clonaFicha(s, i, rotulo, visible, propios); });
    }
    return c;
  }

  // El total era `round(algo * ${cantidad}, 2)`. Quitarle el factor de la cantidad deja la
  // expresión de UNA ficha, que es justo lo que hay que sumar. Cada término va envuelto en round()
  // para que un campo vacío entre como 0 y no como texto: sin eso "" + 3 da "3" en JavaScript y el
  // total se convierte en una cadena que luego nadie puede sumar.
  //
  // Con `relDe` (nombre -> condición del campo ya clonado), cada término cuenta solo si se ven las
  // medidas que usa. Sin eso, una medida que quedó escondida —se cambió la forma del daño, o se dijo
  // después que no hay daño— sigue sumando: el 22-sep pasaba en 2 visitas del pañete y las columnas.
  // Lo usan los apartados nuevos (soloVisible en REPETIBLES); los de antes suman como siempre, para
  // no cambiar el total de ninguna visita ya enviada.
  //
  // Con `iguales` (el «¿cuántos tienen estas medidas?» de la ficha), cada término es el subtotal del
  // tipo: la medida de un elemento redondeada, por cuántos son, redondeado otra vez —la misma cuenta
  // que enseña la pantalla y que guarda <prefijo>subtotal—. Sin el dato vale 1, y como
  // round(round(x, 2) * 1, 2) es round(x, 2), una visita vieja suma exactamente lo de siempre.
  function sumaDeFichas(calc, cuenta, n, propios, relDe, iguales) {
    var uno = String(calc).replace(/^\s*round\s*\(/, '').replace(/,\s*2\s*\)\s*$/, '');
    uno = uno.replace(new RegExp('\\s*\\*\\s*\\$\\{' + cuenta + '\\}'), '').trim();
    var t = [];
    for (var i = 1; i <= n; i++) {
      var x = exprFicha(uno, i, propios), g = [];
      if (relDe) {
        x.replace(/\$\{(\w+)\}/g, function (todo, nom) { if (relDe[nom]) g.push('(' + relDe[nom] + ')'); return todo; });
      }
      var y = g.length ? 'if(' + g.join(' and ') + ', ' + x + ', 0)' : x;
      t.push(iguales ? 'round(round(' + y + ', 2) * ' + exprIguales(nombreFicha(iguales, i)) + ', 2)'
                     : 'round(' + y + ', 2)');
    }
    return 'round(' + t.join(' + ') + ', 2)';
  }

  // ------------------------------------------------------ «Otro» siempre dice cuál
  //
  // El 22-sep, 55 de 120 visitas marcaron algún «Otro» y en 29 no quedó dicho cuál. En el material
  // de la estructura, del entrepiso, del soporte de la cubierta y del muro no había dónde
  // escribirlo; en los sistemas encadenados (estructura, entrepiso, cubierta) la casilla existía en
  // el esquema pero nunca se pintaba. Un «Otro» a secas no le dice nada a quien no estuvo allí.
  //
  // Por eso se le pide a TODA pregunta de lista que tenga una opción «otro», sin nombrarlas una por
  // una: salen de las propias listas (valores que acaban en otro, otros u otra), así que una lista
  // nueva con su «Otro» queda cubierta sin tocar esto. Cada una recibe un subcampo <campo>_otro,
  // obligatorio mientras la opción esté marcada; al desmarcarla se borra (limpiaOtros). Las que ya
  // traían su «¿cuál?» en el esquema —uso_otro, muros_otro, tipo_cubierta_otro…— se quedan con el
  // suyo: dos casillas para lo mismo acabarían guardando dos respuestas distintas.
  //
  // Va ANTES de expandir las fichas de reparabilidad: así el material de cada muro se clona con su
  // «¿cuál?» y el nombre sigue la regla de la ficha (rep_muro_material_otro_2, _3…), que es la que
  // conocen limpiaFichas() y el panel.
  function esOtro(v) { return /(^|_)(otro|otros|otra)$/.test(String(v)); }

  (function expandeOtro() {
    var usados = {};
    E.pasos.forEach(function (p) {
      p.campos.forEach(function (f) {
        usados[f.name] = true;
        (f.subs || []).forEach(function (s) { usados[s.name] = true; });
      });
    });
    E.pasos.forEach(function (p) {
      p.campos.forEach(function (f) {
        if (f.tipo !== 'select_one' && f.tipo !== 'select_multiple') return;
        var otros = (E.listas[f.lista] || []).filter(function (o) { return esOtro(o.v); });
        if (!otros.length) return;
        var yaTiene = (f.subs || []).some(function (s) { return (s.cuando || []).some(esOtro); });
        if (yaTiene || usados[f.name + '_otro'] || usados[f.name + '_otra']) return;
        f.subs = (f.subs || []).concat([{
          name: f.name + '_otro', label: '¿Cuál?' + (f.label ? ' · ' + f.label : ''), tipo: 'text', ui: 'texto',
          cuando: otros.map(function (o) { return o.v; }), req: true,
          ayuda: 'Marcó «' + otros[0].l + '»: escriba cuál es.', valida: null, vmsg: '',
          desde: '2026-09-23', otro: true
        }]);
        usados[f.name + '_otro'] = true;
      });
    });
  })();

  (function expandeReparabilidad() {
    REPETIBLES.forEach(function (r) {
      var paso = E.pasos.filter(function (p) { return p.id === r.paso; })[0];
      if (!paso) return;                       // si el esquema se reorganiza, esto no rompe nada
      var cuenta = paso.campos.filter(function (f) { return f.name === r.cuenta; })[0];
      if (!cuenta) return;
      var puerta = cuenta.relevant;            // "${rep_muro_dano}='si'"
      var mp = /\$\{(\w+)\}/.exec(puerta || '');
      var guarda = mp ? mp[1] : '';            // rep_muro_dano: la pregunta de si hay daño
      // cómo se mide (uno por uno o el total): es del apartado, no de cada ficha
      var modo = r.modo ? paso.campos.filter(function (f) { return f.name === r.modo; })[0] : null;
      var esTotal = function (f) { return f.tipo === 'calc' && f.name.indexOf('_total') > -1; };
      // también son del apartado, no de cada tipo: cuántos elementos suman todos los tipos
      // (cuenta_iguales) y la nota del total, que va tras la última ficha (al_final)
      var fuera = function (f) {
        return f.name === r.cuenta || f.name === guarda || esTotal(f) || f === modo ||
               !!f.cuenta_iguales || !!f.al_final;
      };

      // la ficha es todo lo que hay en el paso menos esas cosas

      if (!plantilla.length) return;

      // el nivel de daño por ficha no existía: el módulo solo guardaba una foto y unas notas, así
      // que dos partes del mismo tamaño con daños muy distintos quedaban igual de descritas
      var iFoto = plantilla.length;
      plantilla.forEach(function (f, j) { if (f.tipo === 'image' && j < iFoto) iFoto = j; });
      var nivel = {
        name: r.nivel, label: 'Nivel de daño', tipo: 'select_one', lista: 'nivel_nlms',
        ui: 'escala', relevant: null, req: false, ayuda: null, valida: null, vmsg: ''
      };
      // en un apartado nuevo el nivel también lo es: lleva el «desde» de su paso
      if (paso.desde) nivel.desde = paso.desde;
      plantilla = plantilla.slice(0, iFoto).concat([nivel], plantilla.slice(iFoto));
      r.nombres = plantilla.map(function (f) {
        return [f.name].concat((f.subs || []).map(function (s) { return s.name; }));
      });
      // los nombres que SÍ hay que sufijar: los de la propia ficha y nada más
      var propios = {};
      r.nombres.forEach(function (g) { g.forEach(function (n) { propios[n] = true; }); });

      cuenta.label = r.pregunta;
      cuenta.ayuda = 'Un tipo son los ' + r.varios + ' que miden lo mismo y tienen el mismo daño: se ' +
                     'llena una vez y se dice cuánt' + (r.genero === 'f' ? 'as' : 'os') + ' son así. Si todos ' +
                     'son iguales, es 1 tipo. Máximo ' + MAX_FICHAS + ' tipos.';

      // Con el total medido de una vez no hay cuántos ni fichas 2..20, y de la ficha 1 se van las
      // medidas: son los campos que el esquema marca con «modo != global». limpiaFichas() los borra.
      // Sin modo —las visitas de antes— estas condiciones dan lo mismo que las de siempre.
      var sinGlobal = modo ? "${" + r.modo + "}!='global'" : '';
      if (modo) {
        r.medidas = plantilla.filter(function (f) {
          return !f.solo_ficha_1 && String(f.relevant || '').indexOf(sinGlobal) > -1;
        }).map(function (f) { return f.name; });
        cuenta.relevant = '(' + puerta + ') and ' + sinGlobal;
      }

      var nuevos = paso.campos.filter(function (f) { return f.name === guarda; });
      if (modo) nuevos.push(modo);             // primero cómo se mide, luego cuántos
      nuevos.push(cuenta);                     // la cantidad sube: primero cuántas, luego cuáles
      var enUso = [];                          // cuándo la ficha i es un tipo medido uno por uno

      // vacío si el apartado no mide nada uno por uno (sin daño, sin fichas o con el total de una vez):
      // un «0» en cada visita llenaría la ficha del panel de ceros que nadie escribió.
      // «* 1» porque un número que llegara como texto se pegaría a los demás («3» + 1 = «31»).
      paso.campos.forEach(function (f) {
        if (!f.cuenta_iguales || !r.iguales) return;
        f.calc = 'if(' + enUso[0] + ', (' + enUso.map(function (vis, k) {
          return 'if(' + vis + ', ' + exprIguales(nombreFicha(r.iguales, k + 1)) + ' * 1, 0)';
        }).join(' + ') + "), '')";
        nuevos.push(f);
      });
      paso.campos = nuevos;
    });
  })();

  // Bajar la cantidad borra de verdad las fichas que sobran. Si solo se ocultaran, el envío
  // seguiría llevando un muro que el ingeniero ya había quitado y el total lo seguiría sumando.
  //
  // Con «el total, medido de una vez» pasa lo mismo, y por la misma razón: se van las fichas 2 a 20,
  // la cantidad y las medidas de la ficha 1, y se queda lo que describe el daño. Al volver a «uno por
  // uno», la ficha de ese total no se pierde: queda como la ficha 1, y solo faltan sus medidas.
  //
  // El «¿cuántos tienen estas medidas?» de cada tipo es de su ficha (r.nombres) y, donde hay modo,
  // una medida más (su condición lleva «modo != global»): se va con la ficha que sobra y con el total
  // medido de una vez, y un tipo que se quita no deja sus elementos contando en el total.
  function limpiaFichas() {
    REPETIBLES.forEach(function (r) {
      if (!r.nombres) return;
      var global = !!r.modo && D[r.modo] === 'global';
      if (r.modo && !global && pideValor({ name: r.cuenta }) && tieneGlobal(r)) D[r.cuenta] = 1;
      var n = Math.floor(Number(D[r.cuenta]) || 0);
      if (n < 0) n = 0;
      if (n > MAX_FICHAS) n = MAX_FICHAS;
      if (D[r.cuenta] !== undefined && D[r.cuenta] !== '' && Number(D[r.cuenta]) !== n) D[r.cuenta] = n;
      if (global) {
        delete D[r.cuenta];
        (r.medidas || []).forEach(function (nom) { delete D[nom]; });
        n = 1;
      }
      for (var i = n + 1; i <= MAX_FICHAS; i++) {
        r.nombres.forEach(function (grupo) {
          grupo.forEach(function (nom) { delete D[nombreFicha(nom, i)]; });
        });
      }
    });
  }
  // ¿Quedó escrito algún total medido de una vez? Es la señal de que la ficha 1 era la de ese total.
  function tieneGlobal(r) {
    return Object.keys(r.globales || {}).some(function (t) { return !pideValor({ name: r.globales[t] }); });
  }

  // Cambiar la forma del daño de un tipo (<prefijo>tipo: por área o fisura lineal) borra lo que se
  // midió para la otra forma en ESA ficha (revisión del 23-sep). Se quedaba escondido y guardado, y en
  // columnas y pañete el total suma también lo que no se ve (sumaDeFichas, para no mover el total de
  // ninguna visita enviada): un tipo de 2 m² × 4 columnas pasado a una fisura de 3 m seguía cobrando
  // 8 m² de pañete, mientras la nota de la pantalla y la tabla del informe lo enseñaban como fisura.
  // Solo lo hace el gesto del ingeniero sobre la forma: abrir una visita vieja no pasa por aquí
  // (cambio() no llega con ese campo), así que ningún total ya enviado cambia al abrirla.
  // Borra lo que la forma de antes pedía y la de ahora esconde (su condición nombra la forma de la
  // ficha): el área, los lados y la altura, o la longitud y el ancho de la fisura; en columnas medidas
  // de una vez, también el total de la otra forma. Devuelve si borró algo.
  // B.8 y B.9 (soloVisible) no lo necesitan: su total ya suma solo lo que se ve, y lo escondido se
  // queda como hasta ahora (las pruebas de la fase 3 cuentan con eso).
  function limpiaForma(ancla) {
    if (!ancla) return false;
    var borro = false;
    REPETIBLES.forEach(function (r) {
      if (!r.nombres || !r.iguales || r.soloVisible) return;
      var base = r.iguales.replace(/iguales$/, 'tipo'), ft = idxCampo[base];
      if (!ft || ft.lista !== 'tipo_panete_col_col') return;
      for (var i = 1; i <= MAX_FICHAS; i++) {
        if (nombreFicha(base, i) !== ancla) continue;
        r.nombres.forEach(function (g) {
          g.forEach(function (nom) {
            var c = nombreFicha(nom, i), f = idxCampo[c];
            if (!f || c === ancla || f.tipo === 'calc' || f.tipo === 'nota') return;
            if (String(f.relevant || '').indexOf('${' + ancla + '}') < 0) return;
            if (pideValor(f) || visible(f)) return;
            delete D[c];
            borro = true;
          });
        });
        return;
      }
    });
    return borro;
  }

  // ------------------------------------------------------ A.8 -> B.1: medir una vez
  //
  // Los muros se medían en A.8 y otra vez en B.1. La primera vez que la ficha 1 de B.1 se abre vacía
  // y en A.8 se marcaron muros, se llena con lo de A.8: el alto a la altura y el ancho a la longitud
  // o, si se eligió el total medido de una vez, el área al total. Es un arrastre y no un calc: el
  // ingeniero lo corrige si ese muro es otro, y lo corregido se queda. Una sola vez por visita
  // (arrastre_a8), y solo lo que B.1 aceptaría: un ancho de 58 m es el total de varios muros y no
  // cabe en un muro de B.1 (hasta 20 m), así que no se trae.
  //
  // Cuidado con contar dos veces: en las visitas del 22-sep el alto de A.8 coincidía con la altura
  // del muro 1 en 39 de 43, pero el ancho con su longitud en 1 de 43 —en A.8 se suele medir el
  // total—. Si el muro 1 sigue con lo de A.8 y hay más muros, B.6 lo advierte (rep_res_alerta_a8).
  function arrastraA8() {
    if (D.arrastre_a8 === 'si' || !SEL(D.eva_elementos_interv, 'muros') || D.rep_muro_dano !== 'si') return false;
    // hasta que no diga cómo mide no se sabe adónde va lo de A.8: a la altura y la longitud o al total
    if (!D.rep_muro_modo) return false;
    var b1 = E.pasos.filter(function (p) { return p.id === 'b1_muro'; })[0];
    if (!b1 || !visible(b1)) return false;
    var pares = D.rep_muro_modo === 'global'
      ? [['rep_muro_total_global', 'eva_area_muros']]
      : [['rep_muro_altura', 'eva_alto_muros'], ['rep_muro_longitud', 'eva_ancho_muros']];
    // B.1 vacío: la ficha 1 ya se ve y no tiene ninguna de esas medidas
    var campos = pares.map(function (x) { return idxCampo[x[0]]; });
    if (campos.some(function (f) { return !f || !visible(f) || !pideValor(f); })) return false;
    var puestos = 0;
    pares.forEach(function (x, k) {
      var v = D[x[1]], f = campos[k];
      if (typeof v !== 'number' || !(v > 0)) return;
      if (f.valida && ev(f.valida, v) === false) return;
      D[x[0]] = v;
      puestos++;
    });
    if (puestos) D.arrastre_a8 = 'si';
    return puestos > 0;
  }

  // ------------------------------------------------------ lo que ya se dijo en otro paso
  //
  // «A veces se tiene que escribir información ya suministrada anteriormente; se podría arrastrar de
  // antes y mostrarla, y si el ingeniero está de acuerdo dejarla igual o si no cambiarla» (23-sep).
  // Reparabilidad volvía a preguntar lo que la visita ya sabía: el material de los muros (paso 4), el
  // grado de daño de columnas, vigas y muros (A.3, A.4), el número de la unidad (la ficha elegida), el
  // contrapiso y el cielo raso de A.8. Ahora se trae y se enseña: el valor aparece puesto con
  // «Traído de A.3 · columnas: Leve — Está bien / Cambiar».
  //   · Solo se trae a un campo que se ve, está vacío y nunca se trajo (D.arrastre_hechos): nunca se
  //     pisa lo que el ingeniero escribió, y lo que él borró o cambió no vuelve.
  //   · Mientras no lo confirme ni lo toque (D.arrastre_pendientes), sigue a su origen: si corrige el
  //     grado en A.3, el traído se corrige con él; si el origen se vacía, el traído se va.
  //   · «Está bien» lo deja y lo hace suyo; «Cambiar» lo vacía para que elija. Tocar el control, o
  //     volver a tocar la opción traída, también lo hace suyo. Y llenar lo que cuelga de él: quien
  //     escribe las medidas de B.3 bajo un «Sí» traído de A.3 está de acuerdo con ese «Sí» (ver
  //     sueltaArrastre), y la puerta ya no se voltea sola escondiendo lo escrito.
  //   · Solo en las visitas que empiezan con esta versión: nuevaVisita() pone arrastre_hechos. Una
  //     visita enviada, o empezada antes, no gana datos que nadie escribió al abrirla o corregirla.
  // Y lo que ya se sabe no se pregunta a ciegas: si A.3 dice que la casa no tiene columnas o que están
  // sanas, «¿Se observa daño en el recubrimiento de columnas?» llega con «No» y dice por qué.
  //
  // `de` es de dónde sale ({i}: el número de la ficha), `si` una condición del formulario, `mapa`
  // traduce el valor (lo que no está en el mapa no se trae), `uno` exige que la respuesta múltiple
  // de origen tenga una sola opción, `valor` es un valor fijo y `fichas` repite la regla en cada tipo.
  // El orden importa: lo que abre un campo va antes que la regla que lo llena (el «sí» del contrapiso
  // antes que su área), y así una sola pasada por cambio() trae los dos.
  var GRADO_A_NIVEL = { l: 'l', m: 'm', s: 's' };
  var GRADO_A_SINO = { n: 'no', na: 'no', l: 'si', m: 'si', s: 'si' };
  var NOMBRE_GRADO = { n: 'Ninguno', l: 'Leve', m: 'Moderado', s: 'Severo', na: 'No aplica' };
  var ARRASTRES = [
    { a: 'rep_unidad', de: 'unidad_label', donde: 'de la ficha elegida', si: "${alcance}='ficha'" },
    { a: 'rep_muro_dano', de: 'eva_dano_muros_div', donde: 'de A.4', que: 'muros divisorios', mapa: GRADO_A_SINO },
    { a: 'rep_col_dano', de: 'eva_dano_columnas', donde: 'de A.3', que: 'columnas', mapa: GRADO_A_SINO },
    { a: 'rep_vig_dano', de: 'eva_dano_vigas', donde: 'de A.3', que: 'vigas', mapa: GRADO_A_SINO },
    // el cielo de A.4 incluye el falso (drywall, madera): un daño allí no dice que haya revoque que reparar
    { a: 'rep_cielo_dano', de: 'eva_dano_cielo_raso', donde: 'de A.4', que: 'cielo raso', mapa: { n: 'no', na: 'no' } },
    { a: 'rep_elec_dano', de: 'eva_dano_electricas', donde: 'de A.5', que: 'instalaciones eléctricas', mapa: GRADO_A_SINO },
    // el paso 4 dice de qué son los muros divisorios; si son de varios materiales, no se adivina cuál
    { a: 'rep_muro_material', fichas: true, de: 'muros_divisorios', uno: true, cual: 'rep_muro_material_otro',
      donde: 'del paso 4', que: 'muros divisorios',
      mapa: { ladrillo_hueco: 'ladrillo_hueco', ladrillo_macizo: 'ladrillo_macizo', bloque_concreto: 'bloque_concreto',
              drywall: 'drywall', piedra: ['otro', 'Mampostería en piedra'], madera_guadua: ['otro', 'Madera o guadua'],
              otro: ['otro', '${muros_otro}'] } },
    { a: 'rep_muro_nivel', fichas: true, de: 'eva_dano_muros_div', donde: 'de A.4', que: 'muros divisorios', mapa: GRADO_A_NIVEL },
    { a: 'rep_col_nivel', fichas: true, de: 'eva_dano_columnas', donde: 'de A.3', que: 'columnas', mapa: GRADO_A_NIVEL },
    { a: 'rep_vig_nivel', fichas: true, de: 'eva_dano_vigas', donde: 'de A.3', que: 'vigas', mapa: GRADO_A_NIVEL },
    { a: 'rep_cielo_nivel', fichas: true, de: 'eva_dano_cielo_raso', donde: 'de A.4', que: 'cielo raso', mapa: GRADO_A_NIVEL },
    // el lado de la sección y el peralte son la misma medida en A.3 y en B; la altura o el largo no:
    // en B se pide el tramo dañado, y traer la columna entera lo inflaría
    { a: 'rep_col_lado_a', fichas: true, de: 'eva_det_columnas_{i}_d2', donde: 'de A.3', que: 'lado de la sección, columna tipo {i}' },
    { a: 'rep_vig_peralte', fichas: true, de: 'eva_det_vigas_{i}_d2', donde: 'de A.3', que: 'peralte, viga tipo {i}' },
    { a: 'rep_enchape_contrapiso', valor: 'si', si: "selected(${eva_elementos_interv}, 'contrapiso')",
      donde: 'de A.8', que: 'el contrapiso está entre los elementos a intervenir' },
    { a: 'rep_enchape_contrapiso_area', de: 'eva_area_contrapiso', si: "selected(${eva_elementos_interv}, 'contrapiso')",
      donde: 'de A.8', que: 'contrapiso' },
    // un cielo falso se mide en A.8 y no tiene revoque: si el material lo dice, no se trae
    { a: 'rep_cielo_area', de: 'eva_area_cielo', donde: 'de A.8', que: 'cielo raso',
      si: "selected(${eva_elementos_interv}, 'cielo') and regex(${eva_mat_cielo}, '[Dd]ry ?[Ww]all|DRY ?WALL|[Yy]eso|YESO|[Pp][Vv][Cc]|[Mm]adera|MADERA|[Ii]copor|ICOPOR|[Ff]also|FALSO|[Ss]uper ?[Bb]oard|SUPER ?BOARD|[Ff]ibro|FIBRO') = false" }
  ];
  // Las reglas, una por campo de destino (las de `fichas`, en cada tipo). Se arma una vez.
  var REGLAS_ARRASTRE = null;
  function reglasArrastre() {
    if (REGLAS_ARRASTRE) return REGLAS_ARRASTRE;
    REGLAS_ARRASTRE = [];
    ARRASTRES.forEach(function (r) {
      for (var i = 1; i <= (r.fichas ? MAX_FICHAS : 1); i++) {
        var c = {}, p;
        for (p in r) if (Object.prototype.hasOwnProperty.call(r, p)) c[p] = r[p];
        c.a = r.fichas ? nombreFicha(r.a, i) : r.a;
        c.de = r.de ? r.de.replace('{i}', i) : r.de;
        c.cual = r.cual ? (r.fichas ? nombreFicha(r.cual, i) : r.cual) : null;
        c.que = r.que ? r.que.replace('{i}', i) : '';
        if (idxCampo[c.a]) REGLAS_ARRASTRE.push(c);
      }
    });
    return REGLAS_ARRASTRE;
  }
  function reglaDe(n) { return reglasArrastre().filter(function (r) { return r.a === n; })[0] || null; }
  // Qué traería la regla ahora: {v, cual} o null si no hay nada que traer.
  function valorArrastre(r) {
    if (r.si && ev(r.si) !== true) return null;
    if (Object.prototype.hasOwnProperty.call(r, 'valor')) return { v: r.valor };
    var x = D[r.de];
    if (x === undefined || x === null || x === '' || (Array.isArray(x) && !x.length)) return null;
    if (r.uno) {
      if (!Array.isArray(x) || x.length !== 1) return null;
      x = x[0];
    }
    if (r.mapa) {
      var m = r.mapa[x];
      if (m === undefined) return null;
      if (Array.isArray(m)) {
        var cual = m[1].replace(/\$\{(\w+)\}/g, function (_, n) { return String(D[n] == null ? '' : D[n]).trim(); });
        return cual ? { v: m[0], cual: cual } : null;   // un «Otro» sin cuál no se trae: quedaría a medias
      }
      return { v: m };
    }
    return { v: typeof x === 'string' ? x.trim() : x };
  }
  var PASO_DE = null;
  function pasoDeCampo(n) {
    if (!PASO_DE) {
      PASO_DE = {};
      E.pasos.forEach(function (p) { p.campos.forEach(function (f) { PASO_DE[f.name] = p; }); });
    }
    return PASO_DE[n] || null;
  }
  function puedeArrastrar() {
    return !REV && Array.isArray(D.arrastre_hechos) && !(visita && visita.estado === 'enviada');
  }
  // Devuelve si cambió algo, para volver a calcular. Lo llama cambio(), tras las limpiezas.
  function arrastra() {
    if (!puedeArrastrar()) return false;
    var hechos = D.arrastre_hechos.slice();
    var pend = Array.isArray(D.arrastre_pendientes) ? D.arrastre_pendientes.slice() : [];
    var hubo = false;
    reglasArrastre().forEach(function (r) {
      var f = idxCampo[r.a], x, k = pend.indexOf(r.a);
      if (k > -1) {
        // traído y sin confirmar: sigue a su origen mientras se vea y conserve lo traído
        if (pideValor(f) || !visible(f)) { pend.splice(k, 1); hubo = true; return; }
        x = valorArrastre(r);
        if (!x) {
          delete D[r.a];
          if (r.cual) delete D[r.cual];
          pend.splice(k, 1);
          var h = hechos.indexOf(r.a);
          if (h > -1) hechos.splice(h, 1);          // si el origen vuelve, se puede traer otra vez
          hubo = true;
        } else if (!mismoValor(D[r.a], x.v) || (r.cual && x.cual && D[r.cual] !== x.cual)) {
          D[r.a] = x.v;
          if (r.cual) { if (x.cual) D[r.cual] = x.cual; else delete D[r.cual]; }
          hubo = true;
        }
        return;
      }
      if (hechos.indexOf(r.a) > -1 || !pideValor(f)) return;
      var p = pasoDeCampo(r.a);
      if (!p || !visible(p) || !visible(f)) return;
      x = valorArrastre(r);
      if (!x) return;
      if (f.valida && ev(f.valida, x.v) === false) return;
      if (f.lista && !(E.listas[f.lista] || []).some(function (o) { return o.v === x.v; })) return;
      D[r.a] = x.v;
      if (r.cual && x.cual) D[r.cual] = x.cual;
      hechos.push(r.a);
      pend.push(r.a);
      hubo = true;
    });
    if (hubo) { D.arrastre_hechos = hechos; D.arrastre_pendientes = pend; }
    return hubo;
  }
  function pendienteArrastre(n) {
    return !!n && Array.isArray(D.arrastre_pendientes) && D.arrastre_pendientes.indexOf(n) > -1;
  }
  // Lo que el ingeniero toca deja de ser traído: es suyo, y no se vuelve a traer (sigue en hechos).
  //
  // Y también lo traído de lo que cuelga lo que toca (revisión del 23-sep). Llenar B.3 debajo de un
  // «Sí» traído de A.3 es estar de acuerdo con ese «Sí»: las medidas solo existen porque hay daño.
  // Antes la puerta seguía a su origen hasta que se tocara ELLA, aunque debajo ya estuviera todo
  // escrito; si después se corregía A.3 a «Ninguno», B.3 pasaba solo a «No» y se escondía con sus
  // áreas dentro, que las columnas siguen sumando (no suman solo lo que se ve, ver sumaDeFichas): el
  // informe cobraba retiro de pañete y pañete nuevo a unas columnas que la visita decía sin daño.
  // Lo traído que no es puerta de lo tocado (el nivel de daño de la ficha, el lado de la sección)
  // sigue pendiente y sigue a su origen, como antes: corregirlo en A.3 no esconde nada.
  function sueltaArrastre(n) {
    if (!n || !Array.isArray(D.arrastre_pendientes) || !D.arrastre_pendientes.length) return;
    var dep = dependeDe(n);
    var queda = D.arrastre_pendientes.filter(function (x) { return x !== n && !dep[x]; });
    if (queda.length !== D.arrastre_pendientes.length) D.arrastre_pendientes = queda;
  }
  // Los campos de los que depende que `n` se vea: los de su condición, la madre de un subcampo o de
  // una hija encadenada, y así hacia arriba. Un campo de la ficha 3 de B.3 lleva en su condición la
  // puerta del apartado (clonaFicha le pone la de la ficha), así que la encuentra sin recorrer nada
  // más. Se calcula una vez por campo: el esquema no cambia después de expandirse.
  var DEPENDE = {}, MADRE_DE = null;
  function dependeDe(n) {
    if (DEPENDE[n]) return DEPENDE[n];
    if (!MADRE_DE) {
      MADRE_DE = {};
      E.pasos.forEach(function (p) {
        p.campos.forEach(function (f) {
          (f.subs || []).forEach(function (s) { MADRE_DE[s.name] = f.name; });
          if (f.cadena) MADRE_DE[f.cadena] = f.name;
        });
      });
    }
    var out = {}, cola = [n], vistos = {};
    while (cola.length) {
      var x = cola.shift();
      if (vistos[x]) continue;
      vistos[x] = true;
      var f = idxCampo[x], refs = [];
      if (f && f.relevant) String(f.relevant).replace(/\$\{(\w+)\}/g, function (t, m) { refs.push(m); return t; });
      if (MADRE_DE[x]) refs.push(MADRE_DE[x]);
      refs.forEach(function (m) { if (m !== n && !out[m]) { out[m] = true; cola.push(m); } });
    }
    DEPENDE[n] = out;
    return out;
  }
  // «Cambiar»: se vacía para que elija, y lo que elija es suyo.
  function cambiaArrastre(n) {
    if (!pendienteArrastre(n)) return;
    var r = reglaDe(n);
    delete D[n];
    if (r && r.cual) delete D[r.cual];
    sueltaArrastre(n);
  }
  // La marca bajo la etiqueta: de dónde vino, y los dos botones. En una visita enviada no hay nada que
  // confirmar: lo que quedó sin confirmar al enviarla lo cuenta el panel (arrastre_pendientes).
  function marcaArrastre(n) {
    if (REV || !pendienteArrastre(n)) return '';

           '<button type="button" data-a="arrcambia" data-n="' + esc(n) + '">Cambiar</button></div>';
  }
  // «columnas: Leve», «muros divisorios: Mampostería de ladrillo hueco de arcilla», «contrapiso: 10,25 m²»
  function textoOrigen(r) {
    if (Object.prototype.hasOwnProperty.call(r, 'valor') || !r.de) return r.que || '';
    var x = D[r.de], f = idxCampo[r.de], t;
    if (Array.isArray(x)) t = x.map(function (v) { return f ? etiqueta(f, v) : v; }).join(', ');
    else if (f && f.lista === 'nivel_nlms') t = NOMBRE_GRADO[x] || String(x);
    else if (typeof x === 'number') {
      // las áreas de A.8 son calculados y no llevan unidad en el esquema
      var u = (f && f.unidad) || (/^eva_area_/.test(r.de) ? 'm²' : '');
      t = cifra(x) + (u ? ' ' + u : '');
    }
    else t = f && f.lista ? etiqueta(f, x) : String(x == null ? '' : x);
    return r.que ? r.que + ': ' + t : t;
  }

  // ------------------------------------------------- A.3: el daño, elemento por elemento
  //
  // A.3 pregunta un grado por TIPO de elemento: un "Severo" en columnas vale para todas las
  // columnas de la casa. En campo se queda corto — puede haber una columna reventada y el resto
  // intactas, y para presupuestar y para priorizar no es lo mismo. Aquí el ingeniero dice cuántas
  // quiere describir y describe cada una: dónde está, cuánto mide, qué daño tiene y su fotografía.
  //
  // MANDA EL PEOR, Y SE DICE. El grado general sigue siendo el que decide la habitabilidad, porque
  // es el que lee eva_sugerencia. Cuando el peor elemento detallado supera al grado general, el
  // formulario SUBE el general y lo explica en pantalla. Solo sube, nunca baja: quedarse corto es
  // el error peligroso, y una nota visible evita que alguien se encuentre un dictamen que no
  // tecleó. La regla es la misma que ya usaba el dictamen entre elementos distintos.
  //
  // Se generan campos normales, igual que en reparabilidad: el motor no los distingue de los del
  // esquema, así que relevancia, validación, guardado, fotografías y envío siguen igual.
  //
  // POR TIPOS (23-sep), como en reparabilidad: una visita del 22 describió doce columnas una a una.
  // Cada ficha es un tipo —dónde, cuánto mide, qué daño— y dice cuántos elementos son así
  // (eva_det_<k>_<i>_iguales, vacío = 1). El área total suma área × cuántos (…_subtotal) y
  // eva_numdet_<k> cuenta los elementos. Manda el peor sigue igual: el peor TIPO es el peor elemento.
  var DETALLABLES = [
    { k: 'columnas',        sing: 'Columna',       plur: 'columnas',        g: 'f', tipo: 'columna',
      d1: 'Altura',   d2: 'Lado de la sección' },
    { k: 'muros_portantes', sing: 'Muro portante', plur: 'muros portantes', g: 'm', tipo: 'muro portante',
      d1: 'Largo',    d2: 'Alto' },
    { k: 'vigas',           sing: 'Viga',          plur: 'vigas',           g: 'f', tipo: 'viga',
      d1: 'Longitud', d2: 'Peralte' },
    { k: 'riostras',        sing: 'Riostra',       plur: 'riostras',        g: 'f', tipo: 'riostra',
      d1: 'Longitud', d2: 'Peralte' },
    { k: 'entrepiso',       sing: 'Zona',          plur: 'zonas',           g: 'f', tipo: 'zona de entrepiso',
      d1: 'Largo',    d2: 'Ancho' },
    // un nodo es un punto: tiene sitio y tiene daño, pero no tiene dos medidas que valgan de algo
    { k: 'nodos',           sing: 'Nodo',          plur: 'nodos',           g: 'm', tipo: 'nodo',
      d1: null,       d2: null }
  ];

  var RANGO = { n: 0, l: 1, m: 2, s: 3 };
  function nDet(k, i, q) { return 'eva_det_' + k + '_' + i + '_' + q; }
  function etiquetaGrado(x) {
    return "if(" + x + "='s','Severo',if(" + x + "='m','Moderado',if(" + x +
           "='l','Leve',if(" + x + "='n','Ninguno',''))))";
  }

  function camposDetalle(d) {
    var k = d.k, cant = '${eva_cant_' + k + '}', gen = '${eva_dano_' + k + '}';

      var ig = nDet(k, i, 'iguales'), nIg = exprIguales(ig);

        valida: '. >= 1 and . <= 500 and round(., 0) = .', vmsg: 'Escriba cuántos, en número entero: de 1 a 500',
        ayuda: i === 1 ? 'Si es ' + (d.g === 'f' ? 'una sola' : 'uno solo') + ', déjelo en 1.' : null,
        desde: '2026-09-23'
      });

      if (d.d1) {
        campos.push(
          { name: nDet(k, i, 'subtotal'), tipo: 'calc', relevant: null, desde: '2026-09-23',
            calc: 'if(' + vis + ', round(round(${' + nDet(k, i, 'area') + '}, 2) * ' + nIg + ', 2), \'\')' },

  (function expandeDetalleA3() {

  var D = {};                  // respuestas de la visita abierta

  // ---------------------------------------------------------------- utilidades
  function esc(s) {

  // en dos renglones parecen dos números distintos.
  function codigoLegible(v) {
    var d = String(v == null ? '' : v).replace(/\D/g, '');

  // ---------------------------------------------------------------- expresiones
  var cache = {};

    var s = ' ' + x + ' ';
    s = s.replace(/(^|[^!<>=])=(?!=)/g, '$1==');
    s = s.replace(/\$\{(\w+)\}/g, 'V("$1")');
    // count-selected va antes que selected: si no, "selected(" parte el nombre por la mitad
    s = s.replace(/\bcount-selected\s*\(/g, 'CNT(')
         .replace(/\bselected\s*\(/g, 'SEL(')
         .replace(/\bstring-length\s*\(/g, 'SLEN(')
         .replace(/\bformat-date-time\s*\(/g, 'FDT(')
         .replace(/\bregex\s*\(/g, 'RX(')
         .replace(/\bconcat\s*\(/g, 'CONCAT(')
         .replace(/\bround\s*\(/g, 'ROUND(')
         .replace(/\bpulldata\s*\(/g, 'PULL(')
         .replace(/\barea\s*\(/g, 'AREA(')
         .replace(/\bconsec\s*\(/g, 'CONSEC(')
         .replace(/\bif\s*\(/g, 'IF(')
         .replace(/\btoday\s*\(\)/g, 'TODAY()')
         .replace(/\bnow\s*\(\)/g, 'NOW()');

  }

  function V(n) { var v = D[n]; return v === undefined || v === null ? '' : v; }

  function CONCAT() { return Array.prototype.slice.call(arguments).join(''); }

  function recalcula() {
    for (var v = 0; v < 2; v++) {

        // ellos. Comparando texto contra texto, "concreto,madera" no coincidía con nada y la lista

        var pv = V(m[2]);

  // ---------------------------------------------------------------- pisos de la edificación
