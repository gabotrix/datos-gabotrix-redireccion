                 respuestas: R, evaluador_nombre: R.evaluador_nombre || PERFIL.evaluador_nombre || '',
                 evaluador_documento: R.evaluador_num_doc || '', entidad: R.entidad || '',
                 version_formulario: (E.meta && E.meta.version) || '', direccion: R.direccion || '',
                 barrio_vereda: R.barrio_vereda || '', municipio: R.municipio || '' };

  function entraRev(j, recarga) {

    var antes = REV ? REV.antes : { D: D, iPaso: iPaso, visita: visita, corregidoAMano: corregidoAMano };
    var previo = REV;

      // Sin versión no se corrige: es el servidor viejo (sin bloqueo de cambios concurrentes ni

      version: (typeof j.version === 'number' && j.version >= 1 && Math.floor(j.version) === j.version)
        ? j.version : null,
      editable: !!j.editable, motivo: j.motivo || '', porque: j.porque || '', radicado: j.radicado || '',
      fotos: Array.isArray(j.fotos) ? j.fotos : [],
      documentos: Array.isArray(j.documentos) ? j.documentos : [],
      correcciones: Array.isArray(j.correcciones) ? j.correcciones : [],
      creadaEn: fechaLocal(fila.creada_en), editando: false, guardando: false,
      aviso: '', motivoTexto: '', errorGuardar: '', conflicto: false, porRehacer: null,

    // Contra esto se mide qué cambió. Es la visita YA recalculada: así un calculado solo viaja si
    // cambia por algo que hizo el ingeniero, y no porque la fórmula de hoy dé otra cosa que la del
    // día de la visita (guardar una tilde no puede reescribir un volumen).

        id: fila.id, editable: REV.editable, motivo: REV.motivo || null,
        faltan: av.faltan, nuevos: av.nuevos, revisar: av.revisar } });
    }

  }

  // Los campos de fotografías y documentos se llenan con lo que dicen las TABLAS (visita_fotos,
  // visita_documentos), no con las rutas de `respuestas`: son las filas las que tienen archivo
  // detrás. Una visita cuyas fotos no llegaron al almacén trae las rutas y no las fotos, y así sale
  // como lo que es: un obligatorio sin fotografía. Van con la forma de `respuestas` —la ruta sin
  // extensión, la ficha {nombre, tipo, bytes, ruta}—, que es la que entienden el motor y el informe.
  // Nada aquí es un data URL: ni el envío ni el almacén local los tomarían nunca por fotos propias.
  // Sin argumentos, las filas de la visita abierta (REV); la lista de enviadas le pasa otras para
  // contar lo que falta sin abrir cada visita.
  function adjuntosAD(fotos, documentos) {

    nombresAdjunto().forEach(function (n) { delete D[n]; });
    var porOrden = function (a, b) { return (a.orden || 0) - (b.orden || 0); };
    fotos.slice().sort(porOrden).forEach(function (x) {
      if (!x || !x.campo || !x.ruta) return;
      if (!Array.isArray(D[x.campo])) D[x.campo] = [];
      D[x.campo].push(sinExtension(x.ruta));
    });
    documentos.slice().sort(porOrden).forEach(function (d) {
      if (!d || !d.campo || !d.ruta) return;
      if (!Array.isArray(D[d.campo])) D[d.campo] = [];
      D[d.campo].push({ nombre: d.nombre || 'documento', tipo: d.tipo || '', bytes: d.bytes, ruta: d.ruta });
    });
  }
  // La visita enviada puesta en D como la deja el editor al abrirla. Es UNA función para que «Falta
  // información (N)» en la lista cuente exactamente lo mismo que el editor al abrir esa visita.
  function preparaEnviada(respuestas, fotos, documentos) {
    D = copia(respuestas || {});
    adjuntosAD(fotos, documentos);
    recalcula();
    // Y ya limpia, como la deja cambio() tras cualquier toque: el «¿cuál?» de un «Otro» que no está
    // marcado, lo que lleva borra_si_oculto, las fichas que sobran. Si no, el primer toque del
    // ingeniero lo borraría por su cuenta, viajaría en el guardado y el anexo del PDF lo contaría
    // como corrección suya (en las visitas del 22-sep, un uso_otro de una casa que no es «Otro»).
    // Lo escondido que trajo la visita se queda en el servidor tal como llegó.
    limpiaFichas(); limpiaDetalleA3(); limpiaOtros();
    recalcula();
    if (limpiaOcultos()) recalcula();
  }

  // ---------------------------------------------------------------- lo que le falta a cada enviada
  // Nota del 23-sep: «si algún formulario ya enviado le faltan campos debido a este cambio, que le
  // aparezca, falta información, le diga qué falta». Se calcula aquí, con el mismo motor que pinta el
  // formulario, sobre lo que manda «mias» (las respuestas y cuántas fotos hay en cada campo), sin abrir
  // una por una. Sin respuestas (un servidor de antes, o visitas por encima del tope) no se dice nada.
  function faltaDeFila(v) {
    if (!v || !v.respuestas || typeof v.respuestas !== 'object') return null;
    var guarda = { D: D, REV: REV, visita: visita };

      visita = null;

  // ---------------------------------------------------------------- lo que se ve arriba de cada paso
  function puedeCorregirRev() { return !!(REV && REV.editable && REV.version && !REV.editando); }

    } else {

          (r.local ? ' · copia del teléfono' : '') + ' · solo lectura</span>';
      // «Editar», y no «Corregir o completar»: es la palabra de la nota del 23-sep. Pregunta antes de

      '<div class="rev-t">' + t + '</div>' +
      '<div class="rev-t">' + esc(textoFaltan(av)) + '</div>' +

  // «Siguiente» en una visita enviada: se recorre para verla o completarla, así que no se exige nada

    var vis = pasosVisibles();
    REV.aviso = '';
    if (iPaso >= vis.length - 1) return pintaFin();
    iPaso++; pintaPaso();
  }

  function repintaRev() {
    if (!REV) return;
    if (vista === 'revfin') return pintaFinRev();
    if (vista === 'revguardar') return pintaGuardarRev();
    if (vista === 'paso') {
      var n = pasosVisibles().length;
      if (iPaso >= n) iPaso = Math.max(0, n - 1);
      repinta(null, false);
    }
  }

  // ---------------------------------------------------------------- el resumen del final

    if (!v) v = ['vn', 'Sin clasificar', 'No se diligenció la evaluación rápida de daños.'];

    var grupos = gruposDeCorrecciones(r.correcciones);
    var filas = [
      ['Código de registro', D.cod_registro],
      ['Enviada', fechaCorta(fila.creada_en)],
      ['Evaluador', fila.evaluador_nombre],
      ['Avance con el formulario de hoy', av.pct + ' %'],
      ['Correcciones', grupos.length ? String(grupos.length) : '']
    ].filter(function (x) { return x[1]; });

    var h = '<div class="pantalla"><div class="eyebrow">Visita enviada</div>' +
      '<h1>' + esc(D.direccion || fila.direccion || 'Visita sin dirección') + '</h1>' +
      '<div class="veredicto ' + v[0] + '"><div class="t">' + esc(v[1]) + '</div>' +
      '<div class="d">' + esc(v[2]) + '</div></div>' +
      (r.aviso ? '<div class="nota v">' + esc(r.aviso) + '</div>' : '') +
      (r.local ? '' : !r.editable ? '<div class="nota">' + esc(porqueRev()) + '</div>'
        : (!r.version ? '<div class="nota a">' + esc(SIN_VERSION_REV) + '</div>' : '')) +
      '<div class="res">' + filas.map(function (x) {

    h += '<div class="seccion"><h2>' + esc(textoFaltan(av)) + '</h2></div>';
    var conAlgo = av.pasos.map(function (p, i) { return [p, i]; })
      .filter(function (x) { return x[0].falta.length || x[0].revisar.length || x[0].bloqueados.length; });

        var p = x[0], est = estadoPaso(p), nombres = p.falta.concat(p.revisar, p.bloqueados)
          .map(function (k) { return (idxCampo[k] && idxCampo[k].label) || k; });
        return '<div class="fila" data-a="revpaso" data-i="' + x[1] + '" role="button" tabindex="0">' +
          '<div class="fila-txt"><b>' + esc(p.titulo) + '</b><span>' +
          esc(nombres.slice(0, 3).join('; ') + (nombres.length > 3 ? ' y ' + (nombres.length - 3) + ' más' : '')) +
          '</span></div><div class="fila-meta"><span class="chip ' + (est[0] === 'falta' ? 'l' : 'b') + '">' +
          esc(est[1]) + '</span></div></div>';
      }).join('') + '</div>';
    }

    if (grupos.length) {
      h += '<div class="seccion"><h2>Correcciones anteriores</h2><span class="cuenta">' + grupos.length +
           '</span></div><div class="res">' + grupos.slice(-12).reverse().map(function (g) {
             return '<div><span>' + esc(fechaCorta(g.fecha)) + '</span><span>' +
               esc((g.n === 1 ? '1 cambio' : g.n + ' cambios') + (g.motivo ? ' · ' + g.motivo : '')) + '</span></div>';
           }).join('') + '</div>' +
           '<p class="aviso">El detalle de cada corrección sale en el anexo del informe del predio.</p>';
    }

    if (r.editando) {
      h += '<button class="big" data-a="revguardar"' + (n ? '' : ' disabled') + '>Guardar cambios' +
           (n ? ' (' + n + ')' : '') + '</button>' +
           '<button class="big sec" data-a="revdescartar">Descartar los cambios</button>';
    } else if (puedeCorregirRev()) {
      h += '<button class="big" data-a="revcorregir">Editar</button>';
    } else if (r.local && token()) {
      h += '<button class="big" data-a="reveditar">Editar</button>';
    }
    h += '<button class="big sec" data-a="revpdf">Descargar PDF · Informe del predio</button>' +
         '<button class="big sec" data-a="revvolverpaso">Volver al formulario</button>' +
         '<button class="big sec" data-a="revsalir">' + (r.volver === 'bandeja' ? 'Volver a la bandeja'
           : 'Volver a sus visitas') + '</button></div>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0, 0);
  }

  // Una corrección = un guardado: sus filas de bitácora llevan la misma hora y el mismo motivo.
  function gruposDeCorrecciones(lista) {
    var g = [], ult = null;
    (lista || []).slice().sort(function (a, b) {
      return String(a.creada_en || '').localeCompare(String(b.creada_en || ''));
    }).forEach(function (c) {
      var k = String(c.creada_en || '') + '|' + (c.motivo || '');
      if (!ult || ult.k !== k) { ult = { k: k, fecha: c.creada_en, motivo: c.motivo || '', n: 0 }; g.push(ult); }
      ult.n++;
    });
    return g;
  }

  // ---------------------------------------------------------------- corregir
  function empiezaCorregir() {
    if (!puedeCorregirRev()) return;
    if (navigator.onLine === false) {
      alert('Para corregir hace falta conexión: los cambios se guardan en el servidor, no en el teléfono.');
      return;
    }
    REV.editando = true;
    REV.aviso = 'Cambie lo que esté mal y rellene lo que falte. Nada se guarda hasta que pulse «Guardar cambios».';
    if (vista !== 'paso') {
      // Desde el resumen se entra por el primer paso al que le falte algo: es a lo que se viene.
      var av = avance(), i = 0;
      while (i < av.pasos.length - 1 && !av.pasos[i].falta.length) i++;
      vista = 'paso'; iPaso = av.faltan ? i : 0;
      return pintaPaso();
    }
    repintaRev();
  }

  // Nota del 23-sep: «si quiere editar algo, preguntar ¿quiere editar este formulario?, y ahí sí
  // dejarlo editar». Verla nunca cambia nada; los campos se habilitan solo después de decir que sí.
  var PREGUNTA_EDITAR = '¿Quiere editar este formulario?\n\nLo que cambie se guarda en el servidor con la fecha' +
    ' y el motivo, y el informe del predio lo anota al final.';
  function preguntaEditar() {
    if (!puedeCorregirRev()) return;
    if (navigator.onLine === false) {
      alert('Para corregir hace falta conexión: los cambios se guardan en el servidor, no en el teléfono.');
      return;
    }
    if (!confirm(PREGUNTA_EDITAR)) return;
    empiezaCorregir();
  }
  // «Completar lo que falta» (la pregunta ya se hizo en la lista): entra corrigiendo y va derecho al
  // primer dato que falta, con lo que falta en rojo. Si la visita ya no se puede corregir, se queda en
  // solo lectura diciendo por qué.
  function empiezaCompletar() {
    if (!puedeCorregirRev()) { repintaRev(); return; }
    if (navigator.onLine === false) {
      alert('Para completarla hace falta conexión: los cambios se guardan en el servidor, no en el teléfono.');
      return;
    }
    REV.editando = true;
    REV.aviso = 'Complete lo que falta: está marcado en rojo. «Siguiente dato que falta» lo lleva al próximo.' +
      ' Nada se guarda hasta que pulse «Guardar cambios».';
    REV.ultFalta = -1;
    vaAlQueFalta();
  }
  // «Editar» en la copia del teléfono: la corrección va por el servidor, así que se abre la del
  // servidor (con lo que se le haya corregido desde entonces) y se entra a corregirla.
  function editaDesdeLocal() {
    var r = REV;
    if (!r || !r.local) return;
    if (navigator.onLine === false) {
      alert('Para editar hace falta conexión: los cambios se guardan en el servidor, no en el teléfono.');
      return;
    }
    // Un editar-visita de antes (ver idDelServidor) no deja corregir desde el teléfono: ni dice cuál de
    // sus visitas es esta, ni da la versión sin la que no se guarda nada. Se dice eso, lo mismo que
    // diría la visita abierta desde «Sus visitas enviadas», y no que la visita «no aparece».
    if (r.visitaLocal && !r.visitaLocal.servidor_id && editorViejo()) {
      r.aviso = SIN_VERSION_REV;
      return repintaRev();
    }
    if (!confirm(PREGUNTA_EDITAR)) return;
    avisoTrabajo('Abriendo la visita…');
    return idDelServidor(r.visitaLocal || { id: r.idLocal }).then(function (id) {
      if (id === SIN_ID_TELEFONO) throw errorEditor(SIN_VERSION_REV, 0, { motivo: 'editor_viejo' });
      if (!id) throw errorEditor('Esta visita no aparece entre sus visitas del servidor: avise al coordinador.', 404);
      return pideEditar({ accion: 'abrir', visita: id });
    }).then(function (j) {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      entraRev(j);
      REV.volver = r.volver; REV.idLocal = r.idLocal;
      if (!puedeCorregirRev()) return pintaPaso();     // no editable: la del servidor dice por qué
      empiezaCorregir();                               // repinta el paso ya corrigiendo
    }, function (e) {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      r.aviso = (e && e.message) || 'No se pudo abrir la visita del servidor.';
      repintaRev();
    });
  }

  // Lo que falta, en el orden del formulario: [{i: paso visible, campo, k: su puesto entre todos los
  // obligatorios}]. Con el puesto se sabe cuál es «el siguiente» aunque el de ahora ya se haya llenado.
  function faltantesEnOrden() {
    var out = [], k = 0;
    pasosVisibles().forEach(function (p, i) {
      var pos = {};
      validaPaso(p, function (f) { if (!(f.name in pos)) pos[f.name] = k++; }).forEach(function (m) {
        var f = idxCampo[m[0]] || { name: m[0] };
        // lo mismo que avance() cuenta como «falta»: vacío, y que se pueda corregir
        if (!pideValor(f) || (REV && bloqueadoRev(m[0]))) return;
        out.push({ i: i, campo: m[0], k: m[0] in pos ? pos[m[0]] : k });
      });
    });
    return out;
  }
  // Al siguiente dato que falta después del último al que se saltó (o al primero), en su paso, con el
  // campo a la vista y marcado. Devuelve si había alguno.
  function vaAlQueFalta() {
    var L = faltantesEnOrden();
    if (!L.length) {
      if (REV) REV.aviso = 'Ya no falta ningún dato. Revise y pulse «Guardar cambios».';
      repintaRev();
      return false;
    }
    var ult = REV && typeof REV.ultFalta === 'number' ? REV.ultFalta : -1;
    var sig = L.filter(function (x) { return x.k > ult; })[0] || L[0];
    if (REV) REV.ultFalta = sig.k;
    cierraIndice();
    vista = 'paso'; iPaso = sig.i;
    pintaPaso();
    var el = document.querySelector('#main [data-campo="' + sig.campo + '"]');
    if (el) {
      if (el.classList) el.classList.add('aqui');
      if (el.scrollIntoView) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } }
    }
    return true;
  }
  // El botón de la barra de abajo: mientras se corrige y falte algo, a un toque del siguiente.
  function pintaSigFalta() {
    var b = document.getElementById('sigFalta');
    var L = REV && REV.editando && vista === 'paso' ? faltantesEnOrden() : [];
    if (!L.length) { if (b) b.hidden = true; return; }
    if (!b) {
      b = document.createElement('button');
      b.type = 'button'; b.id = 'sigFalta';
      b.setAttribute('data-a', 'revsigfalta');
      var bot = document.getElementById('bot');
      bot.insertBefore(b, bot.firstChild);
    }
    b.hidden = false;
    b.textContent = 'Siguiente dato que falta · ' + L.length;
  }

  function descartaRev() {
    if (cuentaCambios() && !confirm('¿Descartar los cambios que no ha guardado?')) return;
    D = copia(REV.base);
    adjuntosAD();
    REV.editando = false; REV.errorGuardar = ''; REV.conflicto = false;
    REV.aviso = 'Cambios descartados: la visita queda como estaba.';
    if (vista === 'revguardar') vista = 'paso';
    repintaRev();
  }

  // Qué cambió respecto de lo que vino del servidor: solo campos del formulario, sin los que no se
  // corrigen, sin notas ni automáticos (la fecha de la visita, el consecutivo de este teléfono) y
  // sin fotografías ni documentos, que tienen sus propias llamadas. Los calculados SÍ van: el
  // servidor no recalcula respuestas, y un área que cambia con sus medidas tiene que viajar con ellas.
  function diferencias() {
    var base = REV.base, cambios = {}, datos = [], calc = 0, visto = {};
    Object.keys(base).concat(Object.keys(D)).forEach(function (k) {
      if (visto[k]) return;
      visto[k] = true;
      var f = campoEsq(k);
      if (!f || f.tipo === 'nota' || f.tipo === 'auto' || esAdjuntoRev(f) || bloqueadoRev(k)) return;
      if (igual(base[k], D[k])) return;
      cambios[k] = D[k] === undefined ? null : D[k];
      if (f.tipo === 'calc') calc++; else datos.push(k);
    });
    return { cambios: cambios, datos: datos, calc: calc };
  }
  function cuentaCambios() {
    var d = diferencias();
    return d.datos.length || (d.calc ? 1 : 0);
  }

  // Las fotografías y los documentos que se quedan sin ficha. Al bajar «¿cuántos muros?» de 5 a 4
  // el motor borra la ficha 5 (limpiaFichas), pero su foto está en el servidor y no viaja en el
  // guardado: seguiría colgada de un muro que ya no existe. Cuáles son se le pregunta al propio
  // motor, sobre una copia: lo que él borraría.
  function adjuntosHuerfanos() {
    var real = D, prueba = copia(D);
    REV.fotos.forEach(function (x) { if (x.campo && !prueba[x.campo]) prueba[x.campo] = [sinExtension(x.ruta)]; });
    REV.documentos.forEach(function (d) { if (d.campo && !prueba[d.campo]) prueba[d.campo] = [{ ruta: d.ruta }]; });
    D = prueba;
    try { limpiaFichas(); limpiaDetalleA3(); } finally { D = real; }
    var out = [];
    REV.fotos.forEach(function (x) {
      if (x.id && x.campo && !(x.campo in prueba)) out.push({ clase: 'foto', id: x.id, campo: x.campo });
    });
    REV.documentos.forEach(function (d) {
      if (d.id && d.campo && !(d.campo in prueba)) out.push({ clase: 'documento', id: d.id, campo: d.campo });
    });
    return out;
  }

  function etiquetaCampo(k) { return (idxCampo[k] && idxCampo[k].label) || k; }
  function textoDe(k, v) {
    if (vacio(v)) return '—';
    var f = idxCampo[k] || {}, t;
    if (Array.isArray(v)) {
      t = v.map(function (x) {
        return x && typeof x === 'object' ? (x.nombre || '') : (f.lista ? etiqueta(f, x) : String(x));
      }).join(', ');
    } else if (typeof v === 'object') {
      t = typeof v.lat === 'number' ? v.lat.toFixed(5) + ', ' + v.lon.toFixed(5) : JSON.stringify(v);
    } else if (typeof v === 'number') {
      t = numTexto(v) + (f.unidad ? ' ' + f.unidad : '');
    } else {
      t = f.lista ? String(etiqueta(f, v)) : String(v);
    }
    return t.length > 140 ? t.slice(0, 137) + '…' : t;
  }

  function pintaGuardarRev() {
    var r = REV;
    if (!r || !r.editando || !revEnPantalla()) return;
    var d = diferencias(), huer = adjuntosHuerfanos();
    if (!d.datos.length && !d.calc) {
      r.aviso = 'No ha cambiado ningún dato.';
      if (vista === 'revguardar') vista = 'paso';
      return repintaRev();
    }
    vista = 'revguardar'; chrome(false); cierraIndice();
    var h = '<div class="pantalla"><div class="eyebrow">Corregir la visita enviada</div>' +
      '<h1>Guardar los cambios</h1>' +
      '<p class="lede">Esto es lo que cambia. La fecha y la firma de la visita quedan como estaban, y el' +
      ' informe del predio añade al final un anexo con cada corrección, su fecha y su motivo.</p>' +
      '<div class="cambios">' + d.datos.map(function (k) {
        return '<div><b>' + esc(etiquetaCampo(k)) + '</b><s>' + esc(textoDe(k, r.base[k])) + '</s> &rarr; ' +
               esc(textoDe(k, D[k])) + '</div>';
      }).join('') +
      (d.calc ? '<div><b>Calculados</b>' + (d.calc === 1 ? 'Un valor calculado se actualiza'
        : d.calc + ' valores calculados se actualizan') + ' con estos cambios.</div>' : '') + '</div>' +
      (huer.length ? '<div class="nota a">' + (huer.length === 1 ? 'Una fotografía o documento queda'
        : huer.length + ' fotografías o documentos quedan') + ' sin ficha con este cambio: se quitan de la' +
        ' visita al guardar. El archivo no se borra.</div>' : '') +
      '<div class="f"><label class="lab" for="revMotivo">Por qué lo corrige <span class="req">*</span></label>' +
      '<div class="ctl"><textarea class="inp" id="revMotivo" rows="3" placeholder="Por ejemplo: marqué mal el' +
      ' nivel de daño; completo los ocupantes que faltaban.">' + esc(r.motivoTexto || '') + '</textarea></div></div>' +
      '<p class="aviso" id="revMsg">' + esc(r.errorGuardar || '') + '</p>' +
      (r.conflicto
        ? '<button class="big" data-a="revrecarga">Recargar la visita</button>'
        : '<button class="big" data-a="revconfirma">Guardar ' + (d.datos.length === 1 ? 'el cambio'
            : 'los ' + d.datos.length + ' cambios') + '</button>') +
      '<button class="big sec" data-a="revseguir">Seguir corrigiendo</button></div>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0, 0);
  }

  function confirmaGuardarRev(boton) {
    var r = REV;
    if (!r || r.guardando || !revEnPantalla()) return Promise.resolve();
    var t = document.getElementById('revMotivo'), msg = document.getElementById('revMsg');
    var motivo = String(t && typeof t.value === 'string' ? t.value : (r.motivoTexto || '')).trim();
    r.motivoTexto = motivo;
    function di(x) { if (msg) msg.textContent = x; }
    // El motivo no es un trámite: es lo que deja leer la bitácora dentro de seis meses y entender si
    // aquello fue un arreglo o un cambio de criterio. El servidor exige lo mismo.
    if (motivo.length < 10) { di('Escriba por qué lo corrige, con al menos 10 letras: es lo que queda en la bitácora.'); return Promise.resolve(); }
    if (navigator.onLine === false) {
      di('Sin conexión: no se guardó nada. Sus cambios siguen aquí; guárdelos cuando tenga señal.');
      return Promise.resolve();
    }
    r.guardando = true;
    if (boton) { boton.disabled = true; boton.textContent = 'Guardando…'; }
    return guardaRev(motivo).then(function (res) {
      r.guardando = false;
      if (REV !== r) return;
      var aviso = 'Guardado: ' + (res.cambios === 1 ? '1 cambio' : (res.cambios || 0) + ' cambios') +
        '. Queda anotado con la fecha y el motivo.' +
        (res.quitadas ? ' Se quitaron ' + res.quitadas + ' adjuntos que se quedaban sin ficha.' : '') +
        (res.fallos ? ' No se pudieron quitar ' + res.fallos + ' adjuntos sin ficha: avise al coordinador.' : '');
      return recargaRev('fin', aviso);
    }, function (e) {
      r.guardando = false;
      if (REV !== r) return;
      explicaErrorGuardar(e);
    });
  }

  // La corrección, en UNA llamada: solo lo que cambió —calculados incluidos—, el motivo y la versión
  // que se abrió. Si otro guardó entre medias, el servidor responde 409 y no pisa nada.
  function guardaRev(motivo) {
    var r = REV, d = diferencias(), huer = adjuntosHuerfanos();
    // `antes`: lo que el servidor tenía en cada campo cuando se abrió la visita (la fila de «abrir»,
    // no la base recalculada). Con eso el servidor detecta que otra puerta —la corrección de siete
    // datos, el panel— cambió ese mismo campo mientras la visita estaba abierta, y responde 409 en vez
    // de pisarlo. Sin él solo veía lo que cambiaba en los milisegundos del propio guardado.
    var R0 = (r.fila && r.fila.respuestas) || {};
    var cuerpo = { accion: 'guardar', visita: r.id, version: r.version, motivo: motivo, cambios: {} };
    cuerpo.antes = {};
    Object.keys(d.cambios).forEach(function (k) {
      cuerpo.cambios['respuestas.' + k] = d.cambios[k];
      cuerpo.antes['respuestas.' + k] = Object.prototype.hasOwnProperty.call(R0, k) ? R0[k] : null;
    });
    return pideEditar(cuerpo).then(function (j) {
      var ref = r.fila.id_dispositivo || r.id;
      // completa = rellenó lo que estaba vacío; corrige = cambió lo que ya tenía valor. Un mismo
      // guardado puede hacer las dos cosas, y se quiere saber cuál de las dos pasa más.
      var llenos = d.datos.filter(function (k) { return vacio(r.base[k]); });
      var cambiados = d.datos.filter(function (k) { return !vacio(r.base[k]); });
      if (llenos.length) {
        anota('completa_enviada', { visita: ref, detalle: { id: r.id, campos: llenos.length,
          nuevos: llenos.filter(function (k) { return esNuevo(idxCampo[k]); }).length } });
      }
      if (cambiados.length) anota('corrige_enviada', { visita: ref, detalle: { id: r.id, campos: cambiados.length } });
      if (typeof j.version === 'number') r.version = j.version;
      CORR.recargar = true;
      return quitaHuerfanos(r, huer, motivo).then(function (q) {
        return { cambios: typeof j.cambios === 'number' ? j.cambios : d.datos.length, quitadas: q.hechas, fallos: q.fallos };
      });
    });
  }

  // De uno en uno, y un fallo no para los demás. Si falla, la foto sigue colgada de la ficha que ya
  // no existe: es lo mismo que no hacer nada, y se dice.
  function quitaHuerfanos(r, lista, motivo) {
    var q = { hechas: 0, fallos: 0 };
    return lista.reduce(function (cadena, x) {
      return cadena.then(function () {
        var cuerpo = x.clase === 'foto'
          ? { accion: 'foto_quitar', visita: r.id, foto: x.id, motivo: 'Quedó sin ficha al corregir. ' + motivo }
          : { accion: 'doc_quitar', visita: r.id, documento: x.id, motivo: 'Quedó sin ficha al corregir. ' + motivo };
        return pideEditar(cuerpo).then(function () { q.hechas++; }, function () { q.fallos++; });
      });
    }, Promise.resolve()).then(function () { return q; });
  }

  function explicaErrorGuardar(e) {
    var r = REV, j = e.datos || {};
    r.conflicto = false; r.errorGuardar = '';
    if (e.status === 409) {
      // Otro guardó una corrección de esta visita después de que usted la abriera (desde otro
      // teléfono o desde el computador). Guardar encima perdería la suya sin que nadie se entere.
      r.conflicto = true;
      r.porRehacer = diferencias().datos.map(etiquetaCampo);
      // Si fue otra puerta (la corrección de siete datos, el panel), el servidor dice qué campos.
      var otros = (j.campos || []).map(function (k) { return etiquetaCampo(String(k).replace(/^respuestas\./, '')); });
      r.errorGuardar = 'No se guardó nada: mientras usted corregía, alguien guardó otra corrección de esta' +
        ' visita' + (otros.length ? ' (' + otros.slice(0, 4).join(', ') + ')' : '') +
        '. Para no pisarla, recárguela y vuelva a hacer lo suyo.';
    } else if (e.status === 403) {
      // Ya no se puede: la Alcaldía abrió un caso de demolición a partir de ella, o la corrigió desde el
      // panel, mientras el ingeniero escribía. Sus cambios no se pueden guardar y se dice por qué.
      noEditableRev(j, 'No se guardó: ' + (j.error || 'esta visita ya no se puede corregir.') +
        (j.radicado ? ' Radicado ' + j.radicado + '.' : ''));
      return pintaFinRev();
    } else if (e.status === 400 && j.campos && j.campos.length) {
      r.errorGuardar = (j.error || 'Hay datos que no se pueden guardar así.') + ' (' + j.campos.map(function (k) {
        return etiquetaCampo(String(k).replace(/^respuestas\./, ''));
      }).join(', ') + ')';
    } else {
      r.errorGuardar = (e.message || 'No se pudo guardar.') + ' Sus cambios siguen aquí.';
    }
    pintaGuardarRev();
  }

  // La visita dejó de ser corregible. Lo que el ingeniero cambió y no guardó se descarta: ya no se
  // puede guardar, y enseñarlo como si fuera la visita confundiría.
  function noEditableRev(j, aviso) {
    var r = REV;
    r.editable = false; r.editando = false;
    r.porque = (j && (j.porque || j.error)) || r.porque;
    r.radicado = (j && j.radicado) || r.radicado;
    D = copia(r.base);
    adjuntosAD();
    r.aviso = aviso || '';
  }

  function recargaRev(destino, aviso) {
    var r = REV;
    if (!r) return Promise.resolve();
    if (navigator.onLine === false) { alert('Para recargar la visita hace falta conexión.'); return Promise.resolve(); }
    var rehacer = r.porRehacer;
    avisoTrabajo('Cargando la visita…');
    return pideEditar({ accion: 'abrir', visita: r.id }).then(function (j) {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      entraRev(j, true);
      REV.aviso = aviso || ('Visita recargada.' + (rehacer && rehacer.length
        ? ' Lo que había cambiado sin guardar: ' + rehacer.join(', ') + '. Vuelva a hacerlo si sigue haciendo falta.' : ''));
      if (destino === 'fin') return pintaFinRev();
      pintaPaso();
    }, function (e) {
      quitaAvisoTrabajo();
      alert(e.message || 'No se pudo recargar la visita.');
    });
  }

  // Tras subir o quitar una fotografía o un documento: las filas nuevas (con su id y su URL) y la
  // bitácora. La versión NO se toma de aquí: un adjunto no invalida el formulario abierto (el
  // servidor lo sabe), y adoptar la versión de ahora escondería el guardado que otro hizo entre medias.
  function refrescaAdjuntosRev() {
    var r = REV;
    if (!r) return Promise.resolve();
    return pideEditar({ accion: 'abrir', visita: r.id }).then(function (j) {
      if (REV !== r) return;
      r.fotos = Array.isArray(j.fotos) ? j.fotos : [];
      r.documentos = Array.isArray(j.documentos) ? j.documentos : [];
      r.correcciones = Array.isArray(j.correcciones) ? j.correcciones : [];
      if (!j.editable && r.editable) {
        noEditableRev(j, 'Esta visita ya no se puede corregir: ' + (j.porque || '') + ' Lo que no había guardado se descartó.');
      } else {
        adjuntosAD();
      }
      repintaRev();
    }, function () { repintaRev(); });
  }

  // ---------------------------------------------------------------- fotografías y documentos
  // Se reduce con la misma achica() de siempre y sube directa al almacén con la URL firmada; después
  // se cuelga de la visita (foto_agregar), que la pone también en sus respuestas para el informe.
  function blobDeDataURL(u) {
    var i = u.indexOf(','), bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
    return new Blob([a], { type: 'image/jpeg' });
  }
  function subeFotoRev(r, campo, dataUrl) {
    var blob = blobDeDataURL(dataUrl);
    return pideEditar({ accion: 'foto_url', visita: r.id, campo: campo }).then(function (u) {
      return fetch(API_SUBIDA + 'fotos-visitas/' + encodeURI(u.path) + '?token=' + encodeURIComponent(u.token), {
        method: 'PUT', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: blob
      }).then(function (res) {
        if (!res.ok) throw new Error('La fotografía no llegó al almacén (' + res.status + '). Vuelva a intentarlo.');
        return pideEditar({ accion: 'foto_agregar', visita: r.id, campo: campo, ruta: u.ruta, bytes: blob.size });
      }, function () { throw new Error('La fotografía no subió: revise la señal e inténtelo otra vez.'); });
    });
  }
  function subeFotosRev(input) {
    // Los archivos se toman antes de vaciar el selector: así el mismo archivo se puede volver a elegir.
    var fs = Array.prototype.slice.call(input.files || []), n = destinoFoto, r = REV;
    input.value = '';
    if (!r || !r.editando || !n || !fs.length || bloqueadoRev(n)) return Promise.resolve();
    if (navigator.onLine === false) {
      alert('Sin conexión: en una visita enviada la fotografía sube al servidor en el momento. Tómela cuando tenga señal.');
      return Promise.resolve();
    }
    if (topeFoto) {
      var caben = Math.max(0, topeFoto - fotosRemotas(n).length);
      if (fs.length > caben) {
        fs = fs.slice(0, caben);
        alert(caben ? 'En este campo solo caben ' + topeFoto + '. Se suben las ' + caben + ' primeras.'
                    : 'En este campo ya están las ' + topeFoto + ' imágenes.');
      }
    }
    if (!fs.length) return Promise.resolve();
    avisoTrabajo(fs.length > 1 ? 'Subiendo ' + fs.length + ' fotografías…' : 'Subiendo la fotografía…');
    var hechas = 0, fallidas = [], errores = [], antes = fotosRemotas(n).length;
    return new Promise(function (listo) {
      var i = 0;
      (function siguiente() {
        if (i >= fs.length || REV !== r) return listo();
        achica(fs[i++], function (url, motivo) {
          if (!url) { fallidas.push(motivo); return siguiente(); }
          subeFotoRev(r, n, url).then(function () { hechas++; }, function (e) { errores.push(e); }).then(siguiente);
        });
      })();
    }).then(function () {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      if (hechas) {
        CORR.recargar = true;
        anota(antes ? 'corrige_enviada' : 'completa_enviada', { visita: r.fila.id_dispositivo || r.id, campo: n,
          detalle: { id: r.id, fotos: hechas } });
        r.aviso = hechas === 1 ? 'Fotografía añadida a la visita.' : hechas + ' fotografías añadidas a la visita.';
      }
      return refrescaAdjuntosRev().then(function () {
        if (fallidas.length) avisaFotoFallida(fallidas);
        if (errores.length) alert(errores[0].message);
      });
    });
  }

  function quitaFotoRev(id) {
    var r = REV, x = r.fotos.filter(function (f) { return f.id === id; })[0];
    if (!x || !r.editando || bloqueadoRev(x.campo)) return Promise.resolve();
    return quitaAdjuntoRev(r, x, 'foto', '¿Por qué quita esta fotografía? (al menos 10 letras)');
  }
  function quitaDocRev(id) {
    var r = REV, x = r.documentos.filter(function (d) { return d.id === id; })[0];
    if (!x || !r.editando || bloqueadoRev(x.campo)) return Promise.resolve();
    return quitaAdjuntoRev(r, x, 'documento', '¿Por qué quita «' + (x.nombre || 'este documento') + '»? (al menos 10 letras)');
  }
  // Quitar desliga el archivo de la visita, no lo borra: se queda en el almacén y la bitácora dice
  // quién lo quitó y por qué. Por eso pide motivo, como cualquier otra corrección.
  function quitaAdjuntoRev(r, x, clase, pregunta) {
    if (navigator.onLine === false) { alert('Para quitarla hace falta conexión.'); return Promise.resolve(); }
    var motivo = prompt(pregunta + '\n\nEl archivo no se borra: se desliga de la visita y queda anotado.', '');
    if (motivo === null) return Promise.resolve();
    motivo = String(motivo).trim();
    if (motivo.length < 10) {
      alert('Escriba el motivo con un poco más de detalle (al menos 10 letras). No se quitó nada.');
      return Promise.resolve();
    }
    avisoTrabajo('Quitando…');
    var cuerpo = clase === 'foto'
      ? { accion: 'foto_quitar', visita: r.id, foto: x.id, motivo: motivo }
      : { accion: 'doc_quitar', visita: r.id, documento: x.id, motivo: motivo };
    return pideEditar(cuerpo).then(function () {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      CORR.recargar = true;
      if (clase === 'foto') r.fotos = r.fotos.filter(function (f) { return f.id !== x.id; });
      else r.documentos = r.documentos.filter(function (d) { return d.id !== x.id; });
      adjuntosAD();
      anota('corrige_enviada', { visita: r.fila.id_dispositivo || r.id, campo: x.campo,
        detalle: { id: r.id, quita: clase } });
      r.aviso = clase === 'foto' ? 'Fotografía quitada de la visita. El archivo se conserva.'
                                 : 'Documento quitado de la visita. El archivo se conserva.';
      return refrescaAdjuntosRev();
    }, function (e) {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      if (e.status === 403) { noEditableRev(e.datos, 'No se quitó: ' + (e.datos.error || 'la visita ya no se puede corregir.')); return repintaRev(); }
      alert(e.message || 'No se pudo quitar.');
    });
  }

  function subeDocRev(r, campo, file) {
    var tipo = tipoDeArchivo(file), nombre = String(file.name || 'documento').slice(0, 200);
    return pideEditar({ accion: 'doc_url', visita: r.id, campo: campo, tipo: tipo, nombre: nombre }).then(function (u) {
      return fetch(API_SUBIDA + 'documentos-visitas/' + encodeURI(u.path) + '?token=' + encodeURIComponent(u.token), {
        method: 'PUT', headers: { 'Content-Type': tipo, 'x-upsert': 'false' }, body: file
      }).then(function (res) {
        if (!res.ok) throw new Error('«' + nombre + '» no llegó al almacén (' + res.status + '). Vuelva a intentarlo.');
        return pideEditar({ accion: 'doc_agregar', visita: r.id, campo: campo, ruta: u.ruta, tipo: tipo,
                            nombre: nombre, bytes: file.size });
      }, function () { throw new Error('«' + nombre + '» no subió: revise la señal e inténtelo otra vez.'); });
    });
  }
  // Las mismas reglas que al adjuntar en una visita en curso (recibeDocumentos): cuántos caben,
  // cuánto pesan y qué tipos admite el bucket, dichas en el momento.
  function subeDocsRev(input) {
    var fs = Array.prototype.slice.call(input.files || []), n = destinoDoc, r = REV;
    input.value = '';
    if (!r || !r.editando || !n || !fs.length || bloqueadoRev(n)) return Promise.resolve();
    if (navigator.onLine === false) {
      alert('Sin conexión: en una visita enviada el documento sube al servidor en el momento.');
      return Promise.resolve();
    }
    var caben = Math.max(0, MAX_DOCS - docsRemotos(n).length);
    if (fs.length > caben) {
      fs = fs.slice(0, caben);
      alert(caben ? 'Caben ' + MAX_DOCS + ' documentos por visita: se suben los ' + caben + ' primeros.'
                  : 'Ya están los ' + MAX_DOCS + ' documentos que caben en una visita.');
    }
    var grandes = fs.filter(function (f) { return f.size > MAX_DOC; });
    var ajenos = fs.filter(function (f) { return f.size <= MAX_DOC && !tipoDeArchivo(f); });
    fs = fs.filter(function (f) { return f.size <= MAX_DOC && !!tipoDeArchivo(f); });
    if (grandes.length) {
      alert('No se puede adjuntar ' + grandes.map(function (f) { return '«' + f.name + '»'; }).join(', ') +
            ': pasa de 5 MB.');
    }
    if (ajenos.length) {
      alert('No se puede adjuntar ' + ajenos.map(function (f) { return '«' + f.name + '»'; }).join(', ') +
            '. Se admiten PDF, Word, Excel, CSV, texto y fotografías.');
    }
    if (!fs.length) return Promise.resolve();
    avisoTrabajo(fs.length > 1 ? 'Subiendo ' + fs.length + ' documentos…' : 'Subiendo el documento…');
    var hechos = 0, errores = [], antes = docsRemotos(n).length;
    return fs.reduce(function (cadena, file) {
      return cadena.then(function () {
        if (REV !== r) return;
        return subeDocRev(r, n, file).then(function () { hechos++; }, function (e) { errores.push(e); });
      });
    }, Promise.resolve()).then(function () {
      quitaAvisoTrabajo();
      if (REV !== r) return;
      if (hechos) {
        CORR.recargar = true;
        anota(antes ? 'corrige_enviada' : 'completa_enviada', { visita: r.fila.id_dispositivo || r.id, campo: n,
          detalle: { id: r.id, documentos: hechos } });
        r.aviso = hechos === 1 ? 'Documento añadido a la visita.' : hechos + ' documentos añadidos a la visita.';
      }
      return refrescaAdjuntosRev().then(function () { if (errores.length) alert(errores[0].message); });
    });
  }

  // ---------------------------------------------------------------- el informe de una enviada
  // Como lo arma el panel: las fotografías son rutas y se abren con su URL firmada, el evaluador es
  // el que firmó (no quien la está mirando), la versión es la del formulario con que se levantó y,
  // si se corrigió, lleva el anexo de correcciones.
  function informeDeEnviada(ctx, rev) {
    rev = rev || REV;
    var f = rev.fila, R = f.respuestas || {}, url = {};
    rev.fotos.forEach(function (x) { if (x.url) url[sinExtension(x.ruta)] = x.url; });
    ctx.ref = f.id_dispositivo || f.id || '';
    ctx.version = f.version_formulario || ctx.version;
    ctx.perfil = { evaluador_nombre: f.evaluador_nombre || R.evaluador_nombre || '',
                   evaluador_num_doc: f.evaluador_documento || R.evaluador_num_doc || '',
                   evaluador_matricula: R.evaluador_matricula || '', entidad: f.entidad || R.entidad || '' };
    ctx.asignacion = { direccion: f.direccion, barrio: f.barrio_vereda, municipio: f.municipio,
                       npn: R.unit_Code || '', lat: f.lat, lon: f.lon };
    ctx.fotoSrc = function (campo, n, ruta) { return url[sinExtension(ruta)] || null; };
    ctx.correcciones = rev.correcciones;
  }

  // El PDF de una visita de la lista, sin abrirla en el formulario (nota del 23-sep: «poner de mejor
  // manera lo de descargar PDF»). Se pide la visita al servidor —sus fotos están allá—, se prepara
  // aparte como la prepara el editor, se arma el documento y se devuelve todo como estaba.
  function pdfDeEnviada(id) {
    if (!id) return Promise.resolve();
    if (navigator.onLine === false) {
      alert('Para armar el informe de una visita enviada hace falta conexión: sus fotografías están en el' +
            ' servidor. Si la visita sigue en este teléfono, descárguelo desde «Visitas en el teléfono».');
      return Promise.resolve();
    }
    avisoTrabajo('Preparando el informe…');
    return pideEditar({ accion: 'abrir', visita: id }).then(function (j) {
      quitaAvisoTrabajo();
      var guarda = { D: D, REV: REV, visita: visita }, ctx;
      var fila = (j && j.visita) || {};
      var rev = { fila: fila, fotos: Array.isArray(j.fotos) ? j.fotos : [],
                  documentos: Array.isArray(j.documentos) ? j.documentos : [],
                  correcciones: Array.isArray(j.correcciones) ? j.correcciones : [],
                  creadaEn: fechaLocal(fila.creada_en), editando: false };
      try {
        visita = null; REV = rev;
        preparaEnviada(fila.respuestas, rev.fotos, rev.documentos);
        ctx = ctxInforme();
      } finally {
        D = guarda.D; REV = guarda.REV; visita = guarda.visita;
      }
      // El contexto queda atado a su propia visita (ctxInforme): lo que venga después no la cambia.
      return descargaInforme(ctx);
    }, function (e) {
      quitaAvisoTrabajo();
      alert((e && e.message) || 'No se pudo abrir la visita.');
    });
  }

  // ---------------------------------------------------------------- salir
  // Todo vuelve a como estaba antes de entrar: las respuestas, el paso y la visita que hubiera.
  function saleRev() {
    var r = REV;
    if (!r) return;
    if (r.editando && cuentaCambios() &&
        !confirm('Tiene cambios sin guardar en esta visita. ¿Salir y descartarlos?')) return;
    sueltaRev();
    CORR.aviso = '';
    // de vuelta adonde se abrió: la bandeja, si era una enviada del teléfono
    if (r.volver === 'bandeja') return pintaBandeja();
    pintaCorrige();
  }

  // Lo mismo que saleRev, sin preguntar ni repintar. Lo llama cada pantalla que carga otra cosa en
  // el formulario —la bandeja, los predios, el buscador, una visita nueva o un borrador—: si la
  // visita enviada seguía abierta por debajo, la visita local salía en solo lectura y «Guardar
  // cambios» mandaba a la enviada las respuestas de otro predio. Lo que no se guardó se pierde, como
  // al salir con el botón: nunca llegó al servidor.
  function sueltaRev() {
    var r = REV;
    if (!r) return false;
    cierraIndice(); quitaAvisoTrabajo();
    var sf = document.getElementById('sigFalta'); if (sf) sf.hidden = true;
    REV = null;
    D = r.antes.D; iPaso = r.antes.iPaso; visita = r.antes.visita; corregidoAMano = r.antes.corregidoAMano;
    destinoFoto = null; destinoDoc = null;
    if (CORR.recargar) { CORR.filas = null; CORR.fallo = false; CORR.recargar = false; }
    return true;
  }

  // ¿La visita enviada es la que está en pantalla? Guardar solo se hace desde las pantallas del
  // editor y sin una visita local cargada: si no, lo que hay en D es el trabajo de otro predio.
  function revEnPantalla() {
    return !!REV && !visita && (vista === 'paso' || vista === 'revguardar' || vista === 'revfin');
  }

  // Los botones del editor de visitas enviadas.
  document.addEventListener('click', function (e) {
    var t = e.target;
    var b = t && t.closest ? t.closest('[data-a]') : null;
    if (!b) return;
    var a = b.dataset.a;
    if (a.indexOf('rev') !== 0 || b.disabled) return;
    e.preventDefault();
    if (a === 'revver') return abreEnviada(b.dataset.id);
    // Desde la lista de enviadas: completar lo que falta (pregunta antes, como «Editar») y el PDF.
    if (a === 'revcompletar') {
      if (navigator.onLine === false) {
        alert('Para completarla hace falta conexión: los cambios se guardan en el servidor, no en el teléfono.');
        return;
      }
      if (!confirm(PREGUNTA_EDITAR)) return;
      return abreEnviada(b.dataset.id, { alAbrir: 'completar' });
    }
    if (a === 'revpdflista') return pdfDeEnviada(b.dataset.id);
    if (!REV) return;
    if (a === 'revindice') return abreIndice();
    if (a === 'revcorregir') return preguntaEditar();
    if (a === 'reveditar') return editaDesdeLocal();
    if (a === 'revsigfalta') return vaAlQueFalta();
    if (a === 'revdescartar') return descartaRev();
    if (a === 'revguardar') return pintaGuardarRev();
    if (a === 'revconfirma') return confirmaGuardarRev(b);
    if (a === 'revrecarga') return recargaRev('paso');
    if (a === 'revquitafoto') return quitaFotoRev(b.dataset.id);
    if (a === 'revquitadoc') return quitaDocRev(b.dataset.id);
    if (a === 'revpdf') return abreInforme();
    if (a === 'revsalir') return saleRev();
    if (a === 'revpaso') return irAPaso(Number(b.dataset.i));
    if (a === 'revseguir') {
      var m = document.getElementById('revMotivo');
      if (m) REV.motivoTexto = m.value;
      // Tras un 409 el aviso se queda: volver a guardar sin recargar daría el mismo conflicto.
      if (!REV.conflicto) REV.errorGuardar = '';
      vista = 'paso';
      return pintaPaso();
    }
    if (a === 'revvolverpaso') {
      vista = 'paso'; iPaso = Math.max(0, pasosVisibles().length - 1);
      return pintaPaso();
    }
  });

  function pintaBuscador() {
    sueltaRev();
    vista = 'buscar'; chrome(false); visita = null;
    var h = '<div class="pantalla">' + barraRed() + avisoEntorno() +
      '<div class="eyebrow">Catastro de Manizales</div>' +
      '<h1>Buscar un predio</h1>' +
      '<p class="lede">Por dirección, barrio o código predial, o los que tenga cerca. Al tomar uno' +
      ' entra en <b>Sus predios</b> y desde ahí se levanta igual que los asignados.</p>' +
      '<input class="inp" id="qPredio" type="search" inputmode="search" autocomplete="off"' +
      ' enterkeyhint="search" placeholder="Carrera 23 # 15-43, Chipre, 1700101…"' +
      ' value="' + esc(BUSCA.texto) + '">' +
      '<button class="big" data-a="buscatexto">Buscar</button>' +
      '<button class="big sec" data-a="buscagps">Los que tengo cerca</button>';

    // El mapa va aquí, pegado a los botones de buscar, y no debajo de la lista: los resultados son
    // cuarenta filas y en un teléfono el botón quedaba a un rollo de distancia de lo que se acaba
    // de pedir. Sale solo cuando hay algo que dibujar.
    if (BUSCA.filas && BUSCA.filas.length && navigator.onLine !== false &&
        BUSCA.filas.some(function (p) { return typeof p.lat === 'number'; })) {
      h += '<button class="big sec" data-a="buscamapa">Verlos en el mapa</button>';
    }

    if (BUSCA.aviso) h += '<div class="nota">' + esc(BUSCA.aviso) + '</div>';

    if (BUSCA.filas && BUSCA.filas.length) {
      h += '<div class="seccion"><h2>Resultados</h2>' +
           '<span class="cuenta">' + BUSCA.filas.length + '</span></div><div class="lista">';
      BUSCA.filas.forEach(function (p) {
        // Cuando quien respondió fue una unidad, el título es ESA dirección: es la que se
        // tecleó y la única que la persona reconoce. La del catastro pasa al subtítulo, porque
        // hace falta para cotejar papeles pero no para identificar el edificio en la calle.
        var titulo = p.por_unidad ? sinUnidad(p.por_unidad) : p.direccion;
        // De otra zona se dice en la misma línea, corto: el nombre del gerente sale al tocarlo.
        var gz = zonaMia() ? gerenteDe(p.comuna, p.barrio, p.zona) : null;
        var otraZona = zonaMia() && !p.mio && !(gz && gz.id === zonaMia().id);
        var sub = [p.barrio,
                   p.por_unidad ? 'en el catastro: ' + p.direccion : null,
                   p.n_unidades > 1 ? p.n_unidades + ' fichas' : null,
                   otraZona ? 'de otra zona' : null]
                    .filter(Boolean).join(' · ');
        // «De otro» solo cuando de verdad no se puede tocar: una vivienda de una sola unidad.
        // Un edificio con otro ingeniero dentro sí se puede tomar, repartiéndose las fichas.
        var chip = p.mio ? ['e', 'Ya es suyo']
                 : (p.tomado && p.n_unidades > 1) ? ['l', 'Compartido']
                 : p.tomado ? ['l', 'De otro']
                 : p.ultima_visita ? ['b', 'Ya visitado'] : null;
        // La ficha que coincidió viaja con el resultado y se queda pegada a la fila, para que al
        // tomar el predio se pueda decir QUÉ buscó. La dirección del terreno suele ser otra —el
        // Edificio Plaza 51 se busca por «Carrera 23 49 71» y el catastro lo registra como
        // «C 51 22A 20 L L-06»—, así que sin esto la asignación aparece rotulada con una dirección
        // que el ingeniero no reconoce.
        h += '<div class="fila" data-a="tomar" data-npn="' + esc(p.npn) + '"' +
             (p.por_unidad ? ' data-unidad="' + esc(p.por_unidad) + '"' : '') +
             (p.consulta ? ' data-busca="' + esc(p.consulta) + '"' : '') +
             ' role="button" tabindex="0">' +
             '<div class="fila-txt"><b>' +
             esc(titulo || ('Predio ' + String(p.npn).slice(-8))) + '</b>' +
             '<span>' + esc(sub || ('Predio ' + String(p.npn).slice(-8))) + '</span></div>' +
             '<div class="fila-meta">' +
             (chip ? '<span class="chip ' + chip[0] + '">' + chip[1] + '</span>' : '') +
             (p.distancia_m == null ? ''
               : '<span class="mini">' + distanciaCorta(p.distancia_m) + '</span>') +
             '</div></div>';
      });
      h += '</div>';
      h += '<p class="aviso">Toque el predio que va a revisar y queda a su nombre. Los de' +
           ' <b>otro</b> son viviendas que ya tiene otro ingeniero y no se pueden tomar; los' +
           ' <b>compartidos</b> son edificios donde ya hay alguien trabajando y sí puede entrar,' +
           ' repartiéndose las fichas; los <b>ya visitados</b> tienen una visita anterior, que' +
           ' podrá leer en la ficha.</p>';
    }

    h += '<button class="big sec" data-a="volverpredios">Volver a sus predios</button>' +
         '</div>';
    document.getElementById('main').innerHTML = h;
    var q = document.getElementById('qPredio');
    if (q) {
      q.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); lanzaBusquedaTexto(); }
      });
    }
    sueltaEventos();
  }

  function pideBusqueda(cuerpo) {
    if (navigator.onLine === false) {
      BUSCA.filas = null;
      BUSCA.aviso = 'Buscar necesita conexión. Los predios que ya tomó siguen aquí sin señal.';
      return pintaBuscador();
    }
    cuerpo.accion = 'explorar';
    BUSCA.aviso = 'Buscando…';
    pintaBuscador();
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'No se pudo buscar');
        return j;
      });
    }).then(function (j) {
      BUSCA.filas = j.predios || [];
      // El mapa identifica cada punto por «id»; los resultados no son asignaciones y no lo traen.
      BUSCA.filas.forEach(function (p) { p.id = 'b:' + p.npn; VISTOS[p.npn] = p; });
      // Cuando la dirección exacta no está en el catastro, el servidor suelta el último dato y
      // devuelve la cuadra, avisando de que aflojó. Hay que decirlo: enseñar la cuadra como si
      // fuera lo que pidieron es mentirle a quien está parado en la puerta. La placa y el
      // catastro no siempre dicen lo mismo, y eso el ingeniero lo sabe resolver mirando.
      var p0 = BUSCA.filas[0];
      BUSCA.aviso = !BUSCA.filas.length
        ? 'No se encontró ningún predio con eso. Pruebe con menos datos, con el barrio,' +
          ' o con «Los que tengo cerca».'
        : (p0 && p0.exacta === false && p0.consulta)
          ? 'Esa dirección exacta no está en el catastro. Estos son los de ' +
            String(p0.consulta).toUpperCase() + ', que es la misma cuadra:'
          : '';
    }).catch(function (err) {
      BUSCA.filas = null;
      BUSCA.aviso = err.message || 'No se pudo buscar. Intente otra vez.';
    }).then(function () { pintaBuscador(); });
  }

  function lanzaBusquedaTexto() {
    var q = document.getElementById('qPredio');
    if (q) BUSCA.texto = q.value;
    if (String(BUSCA.texto).replace(/\s/g, '').length < 3) {
      BUSCA.aviso = 'Escriba al menos tres letras o números.';
      return pintaBuscador();
    }
    anota('busca_predio', { detalle: { texto: String(BUSCA.texto).slice(0, 40) } });
    var cuerpo = { texto: BUSCA.texto };
    // Con el punto puesto, el texto se ordena por cercanía: buscar «carrera 23» estando en la
    // carrera 23 tiene que traer la de al lado, no la del otro extremo de la ciudad.
    if (BUSCA.punto) { cuerpo.lat = BUSCA.punto.lat; cuerpo.lon = BUSCA.punto.lon; }
    return pideBusqueda(cuerpo);
  }

  function buscaCerca() {
    var q = document.getElementById('qPredio');
    if (q) BUSCA.texto = q.value;
    if (!navigator.geolocation) {
      BUSCA.aviso = 'Este teléfono no entrega la ubicación.';
      return pintaBuscador();
    }
    BUSCA.aviso = 'Tomando su ubicación…';
    pintaBuscador();
    navigator.geolocation.getCurrentPosition(function (p) {
      BUSCA.punto = { lat: p.coords.latitude, lon: p.coords.longitude };
      BUSCA.texto = '';
      anota('busca_predio', { detalle: { cerca: true, acc: Math.round(p.coords.accuracy || 0) } });
      pideBusqueda({ lat: BUSCA.punto.lat, lon: BUSCA.punto.lon });
    }, function () {
      BUSCA.aviso = 'No se pudo tomar su ubicación. Revise el permiso de localización.';
      pintaBuscador();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  // Tomar deja el predio a nombre del ingeniero y recarga la sesión, para que baje con su contorno
  // y sus fichas. De ahí en adelante es una asignación como cualquier otra: la ficha, el historial
  // y el cierre automático al enviar la visita no saben de dónde salió.
  function tomaPredio(npn, fila, unidad, busca) {
    if (navigator.onLine === false) {
      BUSCA.aviso = 'Tomar un predio necesita conexión.';
      return pintaBuscador();
    }
    if (fila) fila.style.opacity = '.45';
    var cab = { 'Content-Type': 'application/json', 'x-token-evaluador': token() };
    fetch(API_SESION, {
      method: 'POST', headers: cab,
      // `unidad` es la ficha que coincidio con lo que escribio; el servidor la deja escrita
      // en la nota de la asignacion para que reconozca el predio al verlo en su lista.
      body: JSON.stringify({ accion: 'tomar', npn: npn, unidad: unidad || null, consulta: busca || null })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'No se pudo tomar el predio');
        return j;
      });
    }).then(function (j) {
      anota('toma_predio', { detalle: { npn: npn, estado: j.estado } });
      return fetch(API_SESION, {
        method: 'POST', headers: cab, body: JSON.stringify({ accion: 'sesion' })
      }).then(function (r) {
        if (!r.ok) throw new Error('El predio quedó a su nombre, pero no se pudo recargar la lista');
        return r.json();
      }).then(function (s) {
        guardaLocal(LS_SESION, s);
        SESION = s;
        BUSCA.filas = null; BUSCA.aviso = '';
        var A = s.asignaciones || [];
        for (var i = 0; i < A.length; i++) if (A[i].id === j.id) return fichaPredio(j.id);
        return pintaPredios();
      });
    }).catch(function (err) {
      if (fila) fila.style.opacity = '';
      BUSCA.aviso = err.message || 'No se pudo tomar el predio.';
      pintaBuscador();
    });
  }

  // Quitarse de encima un predio que se tomo por equivocacion. Se pregunta antes porque es
  // irreversible desde el telefono: para volver a tenerlo hay que buscarlo y tomarlo otra vez.
  //
  // El servidor decide, no la app: aqui el boton solo aparece en lo que uno eligio, pero quien
  // manda es campo-sesion, que ademas se niega si ya hay una visita enviada. Si dice que no, se
  // enseña su motivo tal cual en vez de inventarse uno.
  function sueltaPredio(a) {
    if (!a || !a.id) return;
    if (navigator.onLine === false) {
      return alert('Quitar un predio de la lista necesita conexion.');
    }
    var donde = a.direccion || 'este predio';
    if (!window.confirm('¿Quitar ' + donde + ' de su lista?\n\n' +
                        'Dejara de aparecerle y volvera a quedar libre para otro ingeniero. ' +
                        'Si despues lo necesita, tendra que buscarlo y tomarlo de nuevo.')) return;
    var cab = { 'Content-Type': 'application/json', 'x-token-evaluador': token() };
    fetch(API_SESION, {
      method: 'POST', headers: cab,
      body: JSON.stringify({ accion: 'soltar', id: a.id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'No se pudo quitar el predio');
        return j;
      });
    }).then(function (j) {
      anota('suelta_predio', { detalle: { npn: a.npn } });
      return fetch(API_SESION, {
        method: 'POST', headers: cab, body: JSON.stringify({ accion: 'sesion' })
      }).then(function (r) {
        if (!r.ok) throw new Error('Se quito de su lista, pero no se pudo recargar. Vuelva a entrar.');
        return r.json();
      }).then(function (s) {
        guardaLocal(LS_SESION, s);
        SESION = s;
        predioAbierto = null;
        pintaPredios();
      });
    }).catch(function (err) {
      alert(err.message || 'No se pudo quitar el predio.');
    });
  }

  // ---------------------------------------------------------------- contorno del lote
  // El catastro trae el perímetro del predio, no solo el punto. Verlo dibujado
  // es lo que permite reconocer la edificación desde la calle: un punto en una
  // manzana de doce casas no dice cuál es.
  //
  // Llega con la asignación (unos cientos de bytes) y queda guardado en el
  // teléfono, así que también se dibuja sin señal una vez descargado.
  function contornoDe(a) {
    var c = a && a.contorno;
    if (!c || !c.length || !c[0] || !c[0].length) return null;
    return c;
  }

  function dibujaContorno(m, a, op) {
    var c = contornoDe(a);
    if (!c) return null;
    var color = (op && op.color) || '#0B3C5D';
    return L.polygon(c, {
      color: color, weight: (op && op.weight) || 3, opacity: .95,
      fillColor: color, fillOpacity: (op && op.fillOpacity) === undefined ? .12 : op.fillOpacity,
      dashArray: (op && op.dashArray) || null, interactive: !(op && op.interactive === false)
    }).addTo(m);
  }

  // La asignación de la visita que está abierta. Se busca por id y no se guarda
  // en las respuestas: si el teléfono se reinicia a mitad del formulario, la
  // sesión sigue en localStorage y el contorno se recupera igual.
  function asignacionActual() {
    if (!SESION || !visita || !visita.asignacion) return null;
    var A = SESION.asignaciones || [];
    for (var i = 0; i < A.length; i++) if (A[i].id === visita.asignacion) return A[i];
    return null;
  }

  // Dónde está el predio, dentro de su propia ficha. Solo con conexión: sin ella
  // la ficha sigue completa, únicamente sin el mapa.
  function pintaMapaFicha(a) {
    var caja = document.getElementById('mapaFicha');
    if (!caja || typeof a.lat !== 'number') return;
    if (navigator.onLine === false) {
      caja.innerHTML = '<div class="sinmapa">El mapa necesita conexión.</div>';
      return;
    }
    cargaLeaflet().then(function (ok) {
      caja = document.getElementById('mapaFicha');
      if (!caja) return;
      if (!ok) {
        caja.innerHTML = '<div class="sinmapa">No se pudo cargar el mapa.</div>';
        return;
      }
      var m = L.map(caja, {
        attributionControl: false, zoomControl: false, fadeAnimation: false,
        dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false
      }).setView([a.lat, a.lon], 18);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(m);
      var lote = dibujaContorno(m, a, { interactive: false });
      L.circleMarker([a.lat, a.lon], {
        radius: 8, color: '#fff', weight: 3, fillColor: '#0B3C5D', fillOpacity: .95
      }).addTo(m);
      // Encuadrar el lote y el punto juntos. No siempre coinciden: el punto
      // viene del GPS de la visita anterior y el lote del catastro, y en los
      // ejemplos se separan hasta 120 m. Cortar uno de los dos escondería justo
      // lo que el ingeniero tiene que comparar.
      if (lote) {
        m.fitBounds(lote.getBounds().extend([a.lat, a.lon]),
                    { padding: [26, 26], maxZoom: 19 });
      }
      setTimeout(function () { m.invalidateSize(); }, 80);
    });
  }

  // ---------------------------------------------------------------- fichas de la propiedad horizontal
  // En propiedad horizontal la inspeccion es por ficha catastral, no por predio: cada unidad tiene su propio
  // numero predial de 30 digitos, y los digitos 23 a 30 dicen edificio, piso y unidad.
  function etiquetaUnidad(u) {
    if (!u) return '';
    // Una vivienda declarada en campo no tiene ficha del catastro: su nombre es el que le puso el ingeniero.
    if (u.dc) {
      return [u.et || u.d, u.p ? 'Piso ' + u.p : null, 'sin ficha en el catastro'].filter(Boolean).join(' · ');
    }
    var partes = [];
    partes.push(u.d || ('Unidad ' + String(u.n || '').slice(-4)));
    if (u.p != null) partes.push(u.p < 0 ? 'Sotano ' + (-u.p) : 'Piso ' + u.p);
    if (u.s) partes.push(u.s);
    return partes.join(' · ');
  }

  // Las zonas comunes de un edificio —fachada, cubierta, escaleras, estructura— se levantan en una
  // visita propia que no es de ninguna vivienda. El 22-sep, 75 de 120 visitas eran fichas de un
  // edificio y cada una repetía el edificio entero; lo común va aparte, y cada apartamento en la
  // suya. Puede haber varias por edificio, y ninguna cierra el predio ni cuenta como vivienda.
  var FICHA_COMUNES = '__comunes';

  // Cuatro respuestas distintas, y la diferencia importa:
  //   una ficha      -> se evalua esa vivienda
  //   FICHA_COMUNES  -> las zonas comunes del edificio, que no son de ninguna ficha
  //   null           -> la edificacion completa, elegido a proposito
  //   undefined      -> todavia no ha elegido, y hay que pedirselo
  // Antes «no ha elegido» y «todo el predio» eran la misma cosa, y por ahi se cerraban edificios
  // enteros sin que nadie lo decidiera.
  function unidadElegida() {
    var sel = document.getElementById('selUnidad');
    if (!sel || !predioAbierto) return null;    // predio de una sola ficha: no hay nada que elegir
    if (sel.value === '') return undefined;
    if (sel.value === '__todo') return null;
    if (sel.value === FICHA_COMUNES) return FICHA_COMUNES;
    var U = predioAbierto.unidades || [];
    if (sel.value === '__otra') {
      // La lista viaja recortada en los predios enormes; aqui se escribe la ficha que falte.
      var suf = window.prompt('Escriba los 8 digitos finales de la ficha (edificio, piso y unidad):', '');
      suf = String(suf == null ? '' : suf).replace(/\D/g, '');
      if (suf.length !== 8) { sel.value = ''; return undefined; }
      var npn = String(predioAbierto.npn).slice(0, 22) + suf;
      for (var j = 0; j < U.length; j++) if (U[j].n === npn) return U[j];
      return { n: npn, p: null, e: suf.slice(0, 2), d: null, s: null };
    }
    for (var i = 0; i < U.length; i++) {
      if (U[i].n !== sel.value) continue;
      // El <option> ya va bloqueado; esto es por si la lista se repintó con datos viejos.
      if (U[i].y && !U[i].m) {
        alert('Esa ficha ya la levantó otro ingeniero. Elija otra.');
        sel.value = '';
        return undefined;
      }
      return U[i];
    }
    return undefined;
  }

  // «Todo el predio» no es lo que casi nadie quiere. La opcion se explica sola —«solo si evalua
  // la edificacion completa de una vez»— pero es una frase dentro de una lista, y quien acaba de
  // levantar un apartamento la lee como «este predio». Lo que no dice, y es lo que importa, es
  // que el servidor no va a cerrar un edificio dividido con esa visita: se descubre al final,
  // cuando ya envio y el predio le sigue apareciendo empezado.
  function pintaAvisoTodo() {
    var sel = document.getElementById('selUnidad');
    var av = document.getElementById('avisoTodo');
    if (!sel || !av) return;
    var a = predioAbierto || {};
    // Las zonas comunes se confunden con las otras dos salidas: con «todo el predio», porque
    // también miran el edificio entero, y con una vivienda, porque son una visita más. No son
    // ninguna de las dos, y hay que decirlo cuando se elige, no al enviar.
    if (sel.value === FICHA_COMUNES) {
      av.innerHTML = 'Esta visita es de las <b>zonas comunes</b> del edificio: fachada, cubierta, ' +
        'escaleras y estructura. <b>No cierra el predio ni cuenta como vivienda</b>: cada ' +
        'apartamento se levanta aparte, en su propia visita.';
      av.hidden = false;
      anota('elige_ficha', { detalle: { npn: a.npn, comunes: true } });
      return;
    }
    if (sel.value !== '__todo') { av.hidden = true; av.innerHTML = ''; return; }
    var n = (a.unidades || []).length + (a.unidades_mas || 0);
    // Un predio de una sola ficha no ensena selector, asi que esto no deberia pasar; si pasa,
    // callarse es mejor que avisar de «0 fichas».
    if (n < 2) { av.hidden = true; av.innerHTML = ''; return; }
    av.innerHTML = 'Ha elegido <b>todo el predio</b>: esta visita valdrá por las <b>' + n +
      (a.declaradas ? ' viviendas</b> a la vez.' : ' fichas</b> del catastro a la vez.') + ' Si solo levantó una vivienda, vuelva a la lista y ' +
      'elíjala &mdash; <b>si la deja así, el predio no se cerrará al enviar</b> y tendrá que ' +
      'cerrarlo el coordinador.';
    av.hidden = false;
    // Va como elige_ficha, que ya existe en el servidor: un tipo nuevo obligaría a redesplegar
    // campo-sesion con los ingenieros en la calle, y este aviso no lo merece.
    anota('elige_ficha', { detalle: { npn: a.npn, fichas: n, todo: true } });
  }

  // Enganchado al documento y una sola vez: la ficha del predio se repinta a cada rato, y un
  // listener por repintado se acaba llamando cinco veces seguidas.
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'selUnidad') pintaAvisoTodo();
  });

  // Se pide, no se adivina. El aviso dice qué hacer y deja el selector marcado y enfocado.
  function pideElegirFicha() {
    alert('Antes de empezar, elija en la lista qué va a inspeccionar: el apartamento, el local o ' +
          'la vivienda concreta.\n\nSi va a evaluar lo común del edificio —fachada, cubierta, ' +
          'escaleras, estructura—, elija «Zonas comunes del edificio».\n\nSi de verdad va a evaluar ' +
          'la edificación completa de una vez, elija «Todo el predio», que es la última opción de la lista.');
    var sel = document.getElementById('selUnidad');
    if (!sel) return;
    sel.style.borderColor = 'var(--rojo)';
    sel.addEventListener('change', function () { sel.style.borderColor = ''; }, { once: true });
    try { sel.focus(); } catch (e) {}
    // Va como error_validacion y no como tipo nuevo: así sale en «dónde se atascan» del panel,
    // que es justo donde el coordinador lo va a buscar.
    anota('error_validacion', { paso: 'ficha', campo: 'unidad_npn',
                                detalle: { mensaje: 'Falta elegir la ficha' } });
  }

  // ---------------------------------------------------------------- ficha
  function fichaPredio(id) {
    var a = (SESION.asignaciones || []).filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    predioAbierto = a;
    // La ficha es su propia pantalla. Se quedaba con la vista de donde se venía («predios», «mapa»), y
    // cualquier cosa que repinta «Sus predios» al llegar —la sesión refrescada tras un envío, el
    // diagnóstico del almacén— sacaba al ingeniero de la ficha que estaba leyendo.
    vista = 'ficha';
    anota('abre_predio', { detalle: { npn: a.npn } });

    function fila(k, v) {
      return v ? '<div><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>' : '';
    }
    // Treinta dígitos de corrido no se pueden cotejar con nada, y al partirse en
    // dos renglones parecían dos números distintos. Se agrupan como los lee el
    // catastro: municipio · zona-sector-comuna-barrio · manzana · terreno · unidad.
    function npnLegible(v) {
      var s = String(v || '');
      if (s.length !== 30) return s;
      return [s.slice(0, 5), s.slice(5, 13), s.slice(13, 17),
              s.slice(17, 21), s.slice(21)].join(' ');
    }
    var et = ETIQ_PREDIO[a.estado] || ETIQ_PREDIO.pendiente;
    var h = '<div class="pantalla">' +
      '<div class="eyebrow">Predio asignado</div>' +
      '<h1>' + esc(a.direccion || ('Predio ' + a.npn.slice(-8))) + '</h1>' +
      '<div style="margin:-6px 0 4px"><span class="chip ' + et[0] + '">' + et[1] + '</span></div>' +
      '<div class="res">' +
        fila('Barrio', a.barrio) +
        fila('Edificación', a.nombre_edificacion) +
        fila('Código predial', npnLegible(a.npn)) +
        fila('Uso', a.uso ? etiquetaLista('uso', a.uso) : null) +
        fila('Año de construcción', a.ano_construccion
              ? etiquetaLista('ano_construccion', a.ano_construccion) : null) +
        fila('Pisos', a.num_pisos == null ? null : String(a.num_pisos)) +
        fila('Sótanos', a.num_sotanos == null ? null : String(a.num_sotanos)) +
        fila('Tipo', a.tipo_edificacion ? etiquetaLista('tipo_edificacion', a.tipo_edificacion) : null) +
        // la clasificación, el tipo y quién la hizo: cualquiera de los tres dice que la hubo
        fila('Evaluación previa', [a.eva_previa_clasif ? etiquetaLista('habitabilidad', a.eva_previa_clasif) : '',
                                   a.eva_previa_tipo, a.eva_previa_entidad].filter(Boolean).join(' · ') || null) +
      '</div>';

    if (a.notas) h += '<div class="nota">' + esc(a.notas) + '</div>';
    h += '<p class="aviso">Estos datos vienen del catastro y de visitas anteriores. Al abrir el' +
         ' formulario quedan puestos, pero <b>confírmelos en sitio</b>: si algo no cuadra, corríjalo.</p>';

    if (typeof a.lat === 'number' && typeof a.lon === 'number') {
      h += '<div class="mapaficha" id="mapaFicha"></div>';
      // El mapa no se puede tocar, así que no hay forma de abrir las etiquetas de
      // Leaflet: la leyenda va escrita. Importa porque el punto y el lote no
      // siempre coinciden y sin explicación no se sabe cuál mirar.
      h += contornoDe(a)
        ? '<p class="leyenda"><b>El contorno</b> es el lote según el catastro;' +
          ' <b>el punto</b>, la ubicación guardada de la visita anterior. Si no' +
          ' coinciden, en el formulario podrá corregir el punto.</p>'
        : '<p class="leyenda"><b>El punto</b> es la ubicación guardada. Este predio no' +
          ' tiene contorno en el catastro.</p>';
      h += '<a class="big sec enlace" target="_blank" rel="noopener" href="' +
           esc(urlStreetView(a.lat, a.lon)) + '">Ver la fachada en Street View</a>';
    }

    // Aquí se inyecta el aviso de borrador en curso, cuando lo hay: hace falta
    // leer el almacén y eso no llega a tiempo para el primer pintado.
    var U = Array.isArray(a.unidades) ? a.unidades : [];
    // Un edificio dividido se cierra solo con su última vivienda (recibir-visita), y el orden natural
    // es levantar primero los apartamentos: sin esto, las zonas comunes ya no se podían levantar nunca.
    // Son lo único que se deja empezar sobre un predio cerrado, porque no cierran ni cuentan nada: el
    // servidor las recibe y deja la asignación como estaba.
    // Un edificio de una sola ficha que se dividió en campo: sus viviendas declaradas son sus fichas.
    var divididoEnCampo = !!a.declaradas;
    var comunesTrasCierre = a.estado === 'hecha' && (U.length > 1 || divididoEnCampo);
    if (a.estado === 'hecha') {
      h += '<div class="nota v"><b>Predio cerrado.</b> Ya levantó la visita y quedó registrada. No' +
           ' se puede evaluar otra vez desde aquí; si hay que reabrirlo, avise al coordinador.' +
           (comunesTrasCierre ? ' Las <b>zonas comunes</b> del edificio sí se pueden levantar: no reabren' +
             ' el predio ni cuentan como vivienda.' : '') + '</div>';
    }
    if (U.length > 1 || divididoEnCampo) {
      h += '<div class="eyebrow" style="margin-top:16px">' +
        (divididoEnCampo ? 'Vivienda que va a inspeccionar' : 'Ficha que va a inspeccionar') + '</div>' +
        // Decia «es de propiedad horizontal», y no siempre lo es: tambien se parte en fichas un
        // terreno con varias viviendas independientes, cada una con su puerta y su dictamen. Al
        // ingeniero que tiene delante cinco casas de bahareque, leer «propiedad horizontal» le
        // hace dudar de si esta en el predio correcto.
        (divididoEnCampo
          ? '<p class="aviso">El catastro tiene esta edificación como una sola ficha, y en campo se declararon <b>' +
            U.length + (U.length === 1 ? ' vivienda' : ' viviendas') + '</b>. A cada una le corresponde su propia' +
            ' inspección. <b>Elija cuál está evaluando.</b> Si levanta varias, hace una visita por cada una.</p>'
          : '<p class="aviso">Este predio tiene <b>' +
            String(U.length + (a.unidades_mas || 0)) + ' fichas</b> registradas y a cada una le corresponde' +
            ' su propia inspeccion: pueden ser unidades de propiedad horizontal o viviendas' +
            ' independientes sobre el mismo terreno. <b>Elija cual esta evaluando.</b> Si levanta' +
            ' varias, hace una visita por cada una.</p>') +
        '<select class="inp" id="selUnidad" style="width:100%">' +
        // Sin nada puesto de entrada, y «todo el predio» al final. Antes era la primera opcion y
        // venia elegida: quien no la tocaba cerraba el edificio entero con una sola visita y se
        // quedaba sin acceso a las demas viviendas. Le paso a seis ingenieros, uno de ellos con
        // un edificio de 72. Elegirlo tiene que ser una decision, no lo que pasa si no decides.
        '<option value="" disabled selected>&mdash; Elija que va a inspeccionar &mdash;</option>' +
        U.map(function (u) {
          // Una ficha que ya levantó otro se deja a la vista —para que se entienda que está
          // cubierta y no se busque— pero sin poder elegirla. Las propias sí: si hay que
          // rehacer una, es asunto suyo.
          var ajena = u.y && !u.m;
          return '<option value="' + esc(u.n) + '"' + (ajena ? ' disabled' : '') + '>' +
                 esc(etiquetaUnidad(u)) +
                 (u.m ? ' \u00b7 ya la hizo usted' : ajena ? ' \u00b7 YA EVALUADA' : '') +
                 '</option>';
        }).join('') +
        (a.unidades_mas ? '<option value="__otra">Otra ficha (escribir el codigo)</option>' : '') +
        // Lo común del edificio va en su propia visita, antes de «todo el predio» y separado de las
        // viviendas: no es ninguna ficha y no cierra el predio.
        '<option value="' + FICHA_COMUNES + '">Zonas comunes del edificio &mdash; fachada, cubierta,' +
        ' escaleras, estructura</option>' +
        '<option value="__todo">Todo el predio &mdash; solo si evalua la edificacion completa' +
        ' de una vez</option>' +
        '</select>' +
        // Vacio y escondido hasta que haga falta. Se llena al elegir, no al pintar: el aviso
        // tiene que llegar cuando se toma la decision.
        '<p class="nota a" id="avisoTodo" hidden></p>';
      if (a.unidades_mas) {
        h += '<p class="leyenda">Se listan ' + U.length + ' de ' +
             (U.length + a.unidades_mas) + ' fichas. Las demas se escriben a mano.</p>';
      }
      if (a.unidades_hechas) {
        h += '<p class="leyenda"><b>' + a.unidades_hechas + '</b> de estas fichas ya están ' +
             'levantadas y salen bloqueadas. Este edificio lo trabaja más de una persona: cada ' +
             'ficha es de una sola, pero el edificio es de todos.</p>';
      }
    }
    // Tomar un predio es un clic y equivocarse tambien. Lo tomado por error se quedaba en la
    // lista para siempre, estorbando aqui y bloqueandoselo a los demas, porque predio_tomar mira
    // si hay asignacion sin importar su estado. Solo aparece en lo que uno mismo eligio: lo que
    // reparte el coordinador no se devuelve sin avisarle.
    var suyoPorEleccion = String(a.notas || '').indexOf(MARCA_TOMADO) === 0;
    // En un edificio la asignacion sigue abierta mientras queden fichas, asi que `estado` no
    // basta para saber si ya trabajo aqui: se mira si alguna ficha esta marcada como suya. Sin
    // esto el boton saldria y el servidor lo rechazaria, que es peor que no ofrecerlo.
    var yaLevantoAlgo = (a.unidades || []).some(function (u) { return u.m === true; });
    h += bloqueDividir(a, U);
    h += '<div id="borradorPredio"></div>' +
         (a.estado === 'hecha'
           ? (comunesTrasCierre ? '<button class="big sec" data-a="evaluarcomunes">Levantar las zonas comunes del edificio</button>' : '')
           : '<button class="big" data-a="evaluar">Evaluar este predio</button>' +
             // Lo que el sismo no tocó no necesita la evaluación entera (expandeSinDanos).
             '<button class="big sec" data-a="sindanos">' +
             (U.length > 1 || divididoEnCampo ? 'Registrar unidades sin daños o ya reparadas' : 'Registrar sin daños o ya reparado') + '</button>' +
             '<p class="leyenda">' + (U.length > 1 || divididoEnCampo
               ? 'Para los apartamentos, locales o viviendas que no se afectaron o que ya se repararon: se marcan en una lista y se registran de una vez'
               : 'Si la edificación no se afectó, o se afectó y ya se reparó por completo') +
             ' con quién atendió, una foto y su firma. Sin evaluación de daños ni presupuesto.</p>') +
         '<div id="contactos"></div>' +
         '<div id="historial"></div>' +
         '<button class="big sec" data-a="volverpredios">Volver a la lista</button>' +
         (suyoPorEleccion && a.estado !== 'hecha' && !yaLevantoAlgo
           ? '<button class="big sec" data-a="soltar" style="color:var(--rojo,#B3261E)">' +
             'Quitar este predio de mi lista</button>' +
