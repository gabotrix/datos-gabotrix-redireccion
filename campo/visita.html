      ['Barrio / Vereda', D.barrio_vereda],
      ['Municipio', textoValor('municipio')],
      ['Fecha y hora', FDT(D.fecha_hora_inspeccion)],
      ['Evaluador', PERFIL.evaluador_nombre],
      ['Nivel de daño', textoValor('eva_nivel_dano')],
      ['Volumen de escombros', vol > 0 ? vol + ' m³' : '']
    ].filter(function (f) { return f[1]; });

    var resp = 0, tot = 0;
    E.pasos.forEach(function (p) {
      if (!visible(p)) return;
      p.campos.forEach(function (f) {
        if (f.tipo === 'calc' || f.tipo === 'auto' || f.tipo === 'nota' || !visible(f)) return;
        tot++; if (!pideValor(f)) resp++;
      });
    });

    var salida = JSON.stringify({ formulario: E.meta.form_id, version: E.meta.version,
      perfil: sinClave(PERFIL), respuestas: sinClave(sinFotos()) }, null, 1);

    // si el evaluador se apartó de la sugerencia automática, conviene dejarlo dicho
    var sug = D.eva_sugerencia || '';
    var mapa = { habitable: 'HABITABLE (Verde)', uso_restringido: 'USO RESTRINGIDO (Amarillo)',
                 no_habitable: 'NO HABITABLE (Rojo)' };
    var discrepa = clas && sug && sug.indexOf('Complete') === -1 && mapa[clas] !== sug;

    document.getElementById('main').innerHTML =
      '<div class="pantalla"><div class="eyebrow">Resumen de la visita</div>' +
      '<div class="veredicto ' + v[0] + '"><div class="t">' + esc(v[1]) + '</div>' +
      '<div class="d">' + esc(v[2]) + '</div></div>' +
      (discrepa ? '<div class="nota a">El sistema sugería <b>' + esc(sug) + '</b> y usted' +
        ' clasificó distinto. Es su decisión; queda registrada así.</div>' : '') +
      '<div class="res">' + filas.map(function (f) {
        return '<div><span>' + esc(f[0]) + '</span><span>' + esc(f[1]) + '</span></div>';
      }).join('') +
      '<div><span>Respondidas</span><span>' + resp + ' de ' + tot + '</span></div></div>' +
      // «Guardar y volver a la bandeja» dejaba la visita esperando a que algo la mandara, y ese algo
      // podía tardar un minuto o no llegar: Julián, el 23-sep, la vio «lista» y sin salir. Finalizar la
      // envía en el momento si hay señal; sin señal, queda en cola y sale sola.
      '<button class="big" data-a="finalizar">Finalizar visita</button>' +
      '<button class="big sec" data-a="informe">Descargar PDF · Informe del predio</button>' +
      '<p class="aviso">Al finalizar, la visita <b>se envía en ese momento</b> si hay señal. Si no la hay,' +
      ' queda guardada en el teléfono y <b>se envía sola</b> cuando vuelva la señal.</p>' +
      '<button class="big sec" data-a="volverpaso">Volver al formulario</button>' +
      '<details class="plegable"><summary>Ver las respuestas en crudo</summary>' +
      '<button class="big sec" data-a="copiar">Copiar respuestas</button>' +
      '<textarea class="json" readonly id="salida">' + esc(salida) + '</textarea></details>' +
      '</div>';
    window.scrollTo(0, 0);
  }
  function sinFotos() {
    var o = {};
    Object.keys(D).forEach(function (k) {
      var val = D[k];
      if (Array.isArray(val) && typeof val[0] === 'string' && val[0].slice(0, 5) === 'data:') {
        o[k] = val.length + ' fotografía(s)';
      } else if (Array.isArray(val) && val[0] && typeof val[0] === 'object' &&
                 typeof val[0].datos === 'string') {
        o[k] = val.map(function (d) { return d.nombre; }).join(', ');
      } else o[k] = val;
    });
    return o;
  }

  // ---------------------------------------------------------------- informe del predio
  // Lo arma campo/informe.js, compartido con el panel de la alcaldía: es el mismo documento y no
  // puede haber dos versiones. Aquí solo se le pasa lo que él no puede saber por su cuenta.
  // Lo que el informe no puede saber por su cuenta, de la visita que está cargada AHORA. Se ata a
  // ella: textoValor() lee D, y el archivo PDF se termina de armar cuando la página ya puede tener
  // otra visita delante (o la vista de impresión se abre después, si el archivo falló).
  function ctxInforme() {
    var logo = '';
    try { logo = document.querySelector('.marca .logo img').src; } catch (e) {}
    var Dctx = D;
    var ctx = {
      respuestas: Dctx,
      campos: idxCampo,
      listas: E.listas,
      ref: (visita && visita.id) || '',
      asignacion: asignacionActual() || {},
      logo: logo,
      perfil: PERFIL,
      version: (E.meta && E.meta.version) || '',
      // El módulo de demolición cuenta solo si de verdad se abrió: si no, una casa habitable
      // saldría con los metros cúbicos de otra cosa y con ellos se inflaría todo el cálculo.
      hayDemolicion: E.pasos.some(function (p) {
        return (p.id.indexOf('d') === 0 || p.id === 'c0_estado') ? visible(p) : false;
      }),
      esc: esc,
      textoValor: function (n) {
        var antes = D;
        D = Dctx;
        try { return textoValor(n); } finally { D = antes; }
      },
      anota: anota
    };
    // El de la enviada solo si no hay una visita local cargada: con REV olvidado debajo, el PDF de
    // un borrador salía con el anexo, la firma y el evaluador de la visita enviada.
    if (REV && !visita) informeDeEnviada(ctx, REV);
    return ctx;
  }
  function abreInforme() {
    if (!window.INFORME) { alert('El informe no está disponible. Abra la aplicación con señal una vez.'); return; }
    descargaInforme(ctxInforme());
  }
  // «Cuando le dé al informe predio del PDF, descargar automáticamente» (Julián, 23-sep). El archivo
  // lo arma informe.js (INFORME.descarga); si no puede —sin la librería, sin memoria—, se abre la
  // vista de impresión de siempre y se dice por qué. Con un informe.js de antes, que no sabe
  // descargar, la vista de siempre.
  var bajandoPdf = false;
  function descargaInforme(ctx) {
    var I = window.INFORME;
    if (!I) return Promise.resolve();
    if (typeof I.descarga !== 'function') { I.abre(ctx); return Promise.resolve(); }
    if (bajandoPdf) return Promise.resolve();
    bajandoPdf = true;
    return I.descarga(ctx).then(function () { bajandoPdf = false; }, function (e) {
      bajandoPdf = false;
      var m = String(e && e.message || e);
      if (m === 'ya_descargando') return;
      ctx.aviso = 'No se pudo descargar el PDF en este teléfono' +
        (m === 'sin_libreria' ? ' (falta una pieza que se baja con señal: abra la aplicación con señal una vez)'
          : m === 'tardo' ? ' (tardó demasiado)' : '') +
        '. Aquí está el mismo informe: toque «Guardar en PDF» y elija «Guardar como PDF».';
      I.abre(ctx);
    });
  }

  // ---------------------------------------------------------------- documentos de soporte
  // Un documento no se encoge como una fotografía: se guarda tal cual llega. Por eso hay tope, y
  // por eso se dice al adjuntarlo y no al enviarlo: lo que no cabe, no cabe, y es mejor saberlo
  // con el ingeniero todavía delante de quien le entregó el papel.
  var MAX_DOC = 5 * 1024 * 1024;
  var MAX_DOCS = 8;
  var destinoDoc = null;

  function pesaDoc(d) {
    if (!d) return 0;
    if (typeof d.bytes === 'number') return d.bytes;          // ya enviado: lo dice el servidor
    return d.datos ? Math.round(String(d.datos).length * 0.75) : 0;   // en el teléfono: base64
  }
  function pesoLegible(b) {
    if (!b) return '';
    return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB'
                        : Math.max(1, Math.round(b / 1024)) + ' KB';
  }
  function etiquetaDoc(tipo) {
    var t = String(tipo || '').toLowerCase();
    if (t.indexOf('pdf') > -1) return 'PDF';
    if (t.indexOf('word') > -1) return 'DOC';
    if (t.indexOf('sheet') > -1 || t.indexOf('excel') > -1) return 'XLS';
    if (t.indexOf('csv') > -1) return 'CSV';
    if (t.indexOf('image/') === 0) return 'IMG';
    if (t.indexOf('text/') === 0) return 'TXT';
    return 'ARCH';
  }
  function filasPara(val) {
    var t = String(val == null ? '' : val);
    if (!t) return 3;
    var lineas = t.split('\n').length + Math.floor(t.length / 55);
    return Math.max(3, Math.min(16, lineas + 1));
  }

  // El tipo del archivo, deducido por la extensión cuando el teléfono no lo declara.
  //
  // HACE FALTA. Un acta reenviada por WhatsApp o copiada desde el gestor de archivos suele llegar
  // con `file.type` vacío: el navegador no lo sabe y lo manda como «application/octet-stream»,
  // que el bucket rechaza. El documento se subía, fallaba en el servidor, y el ingeniero se
  // enteraba —si acaso— después de enviar la visita, con el dueño del papel ya en su casa.
  //
  // La lista es la del bucket `documentos-visitas`: si se amplía allí, se amplía aquí.
  var TIPO_POR_EXT = {
    pdf: 'application/pdf',
    doc: 'application/msword',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    xls: 'application/vnd.ms-excel',
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    csv: 'text/csv', txt: 'text/plain',
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp',
    heic: 'image/heic', heif: 'image/heif'
  };
  // Los que el bucket admite, sacados del propio mapa: una sola lista que mantener.
  var TIPOS_OK = {};
  Object.keys(TIPO_POR_EXT).forEach(function (k) { TIPOS_OK[TIPO_POR_EXT[k]] = true; });

  // Devuelve '' cuando el archivo NO se va a poder subir — por tipo desconocido o por tipo que el
  // bucket no admite. Comprobar solo que haya tipo no bastaba: un .zip y un .mp4 traen el suyo,
  // pasaban el filtro y los rechazaba el servidor después de enviar la visita.
  function tipoDeArchivo(file) {
    var t = String(file.type || '').toLowerCase();
    if (t && t !== 'application/octet-stream') return TIPOS_OK[t] ? t : '';
    var m = /\.([A-Za-z0-9]+)$/.exec(String(file.name || ''));
    return (m && TIPO_POR_EXT[m[1].toLowerCase()]) || '';
  }

  function recibeDocumentos(input) {
    // En una visita ya enviada el documento no se queda en el teléfono: sube al servidor.
    if (REV) return subeDocsRev(input);
    var fs = Array.prototype.slice.call(input.files || []), n = destinoDoc;
    if (!n || !fs.length) { input.value = ''; return; }
    if (!Array.isArray(D[n])) D[n] = [];

    var caben = Math.max(0, MAX_DOCS - D[n].length);
    if (fs.length > caben) {
      fs = fs.slice(0, caben);
      alert(caben ? 'Caben ' + MAX_DOCS + ' documentos por visita: se agregan los ' + caben + ' primeros.'
                  : 'Ya están los ' + MAX_DOCS + ' documentos que caben en una visita.');
    }
    var grandes = fs.filter(function (f) { return f.size > MAX_DOC; });
    fs = fs.filter(function (f) { return f.size <= MAX_DOC; });
    if (grandes.length) {
      alert('No se puede adjuntar ' + grandes.map(function (f) { return '«' + f.name + '»'; }).join(', ') +
            ': pasa de 5 MB. Redúzcalo o mándelo por otro medio, y anótelo en las observaciones.');
    }
    // Lo que el servidor va a rechazar se dice AQUÍ, con el ingeniero todavía delante de quien le
    // entregó el papel. Antes el filtro del selector lo escondía sin explicar nada; ahora se deja
    // elegir cualquier cosa y se da el motivo en el momento, que es lo que se puede resolver.
    var ajenos = fs.filter(function (f) { return !tipoDeArchivo(f); });
    fs = fs.filter(function (f) { return !!tipoDeArchivo(f); });
    if (ajenos.length) {
      alert('No se puede adjuntar ' + ajenos.map(function (f) { return '«' + f.name + '»'; }).join(', ') +
            '. Se admiten PDF, Word, Excel, CSV, texto y fotografías. Si es otra cosa, hágale una ' +
            'fotografía o un pantallazo y adjunte esa imagen.');
    }
    if (!fs.length) { input.value = ''; return; }

    avisoTrabajo(fs.length > 1 ? 'Adjuntando ' + fs.length + ' documentos…' : 'Adjuntando el documento…');
    var i = 0, fallidos = [];
    (function siguiente() {
      if (i >= fs.length) {
        input.value = '';
        quitaAvisoTrabajo();
        cambio(n);
        if (fallidos.length) {
          alert('No se pudo leer ' + fallidos.map(function (x) { return '«' + x + '»'; }).join(', ') +
                '. Vuelva a intentarlo; si sigue igual, avísele al coordinador.');
        }
        return;
      }
      var file = fs[i++];
      var fr = new FileReader();
      fr.onload = function () {
        // El tipo deducido, no el que declaró el teléfono: si venía vacío, `fr.result` trae un
        // data URL sin MIME que el servidor no sabe leer y el documento se pierde al subirlo.
        var tipo = tipoDeArchivo(file);
        var datos = String(fr.result).replace(/^data:[^;,]*;/, 'data:' + tipo + ';');
        D[n].push({ nombre: String(file.name || 'documento').slice(0, 200), tipo: tipo, datos: datos });
        anota('documento', { campo: n, kb: Math.round(file.size / 1024), formato: tipo,
                             detalle: { declarado: file.type || '(vacío)' } });
        siguiente();
      };
      fr.onerror = function () {
        fallidos.push(file.name);
        anota('documento_falla', { campo: n, kb: Math.round(file.size / 1024), formato: file.type || '' });
        siguiente();
      };
      try { fr.readAsDataURL(file); } catch (e) { fr.onerror(); }
    })();
  }

  // ---------------------------------------------------------------- fotos
  var destinoFoto = null;

  // Preparar una fotografía podía fallar de cuatro maneras y las cuatro eran mudas. La peor: si el
  // teléfono no consigue decodificar la imagen no llega ni `onload` ni `onerror`, así que la
  // función no devolvía nunca y el ingeniero se quedaba mirando un botón que no respondía. Ahora
  // hay reloj, hay motivo, y el motivo viaja como evento: la próxima vez se lee desde el panel en
  // lugar de adivinarlo por teléfono.
  var ESPERA_FOTO = 25000;

  function achica(file, cb) {
    var hecho = false, reloj = null;

    function acaba(url, motivo, extra) {
      if (hecho) return;                 // el reloj y el fallo pueden llegar los dos
      hecho = true;
      if (reloj) clearTimeout(reloj);
      if (!url) {
        var d = { motivo: motivo, kb: Math.round((file.size || 0) / 1024), formato: file.type || '' };
        if (extra) for (var k in extra) d[k] = extra[k];
        anota('foto_falla', d);
      }
      cb(url || null, motivo || '');
    }
    reloj = setTimeout(function () { acaba(null, 'tardo'); }, ESPERA_FOTO);

    function reduce(fuente, w0, h0) {
      if (!w0 || !h0) return acaba(null, 'sin_medidas');
      var max = 1280, w = w0, h = h0;
      if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      var url;
      try {
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(fuente, 0, 0, w, h);
        url = c.toDataURL('image/jpeg', 0.72);
      } catch (e) { return acaba(null, 'lienzo', { px: w0 + 'x' + h0 }); }
      // Un lienzo que se queda en blanco por falta de memoria no da error: devuelve una cadena
      // perfectamente válida y diminuta. Pero una pared lisa comprime casi igual de poco, así que
      // no se descarta —tirar una fachada buena sería peor—: se anota con sus medidas y desde el
      // panel se ve si a alguien le están saliendo todas en gris.
      if (url.length < 900 + (w * h) / 220) {
        anota('foto_sospechosa', { kb: Math.round(url.length / 1024), px: w + 'x' + h });
      }
      acaba(url);
    }

    // El camino viejo: pasar la fotografía entera a texto y decodificarla desde ahí. Una de 48 MP
    // son decenas de MB de cadena antes de empezar. Queda solo como respaldo.
    function porLector() {
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () { reduce(im, im.width, im.height); };
        im.onerror = function () { acaba(null, 'no_decodifica'); };
        im.src = fr.result;
      };
      fr.onerror = function () { acaba(null, 'no_lee'); };
      try { fr.readAsDataURL(file); } catch (e) { acaba(null, 'no_lee'); }
    }

    // createImageBitmap decodifica el archivo sin convertirlo antes en texto y, cuando no puede,
    // rechaza en vez de quedarse callado. Es justo lo que faltaba.
    var p = null;
    if (window.createImageBitmap) { try { p = createImageBitmap(file); } catch (e) { p = null; } }
    if (p && p.then) {
      p.then(function (bm) {
        reduce(bm, bm.width, bm.height);
        if (bm.close) { try { bm.close(); } catch (e) {} }
      }, porLector);
    } else porLector();
  }

  // Entre pulsar el botón y ver la miniatura no había ningún signo de vida. En un teléfono lento
  // son varios segundos, y el ingeniero vuelve a pulsar, que es lo peor que puede hacer.
  function avisoTrabajo(texto) {
    var d = document.getElementById('aviso-trabajo');
    if (!d) { d = document.createElement('div'); d.id = 'aviso-trabajo'; document.body.appendChild(d); }
    d.textContent = texto;
    d.style.display = 'block';
  }
  function quitaAvisoTrabajo() {
    var d = document.getElementById('aviso-trabajo');
    if (d) d.style.display = 'none';
  }

  // Decirlo, y decir qué hacer. Callar dejaba al ingeniero creyendo que la fotografía estaba.
  function avisaFotoFallida(motivos) {
    var deTamano = motivos.some(function (m) {
      return m === 'tardo' || m === 'lienzo';
    });
    alert((motivos.length === 1
            ? 'No se pudo preparar la fotografía. '
            : 'No se pudieron preparar ' + motivos.length + ' fotografías. ')
      + (deTamano
          ? 'Este teléfono no alcanzó a convertirla. Pruébelo de una en una, y si sigue igual baje la '
            + 'resolución de la cámara en Ajustes → Cámara → Formatos.'
          : 'Este navegador no pudo leer el archivo. Pruébelo con el botón «Tomar foto» en vez de la galería.')
      + ' Queda anotado: avísele al coordinador si se repite.');
  }
  // Cuántas caben en el campo que se está llenando. Se apunta al pulsar el botón, que es quien
  // lo sabe: al recibir los archivos ya no hay forma de volver a la definición del campo.
  var topeFoto = 0;
  var pick = document.getElementById('filePick');
  var pickGal = document.getElementById('fileGal');

  function recibeFotos(input) {
    // En una visita ya enviada la fotografía no se guarda en el teléfono: se reduce igual y sube
    // directa al servidor, colgada de esa visita.
    if (REV) return subeFotosRev(input);
    var fs = Array.prototype.slice.call(input.files || []), n = destinoFoto;
    if (!n || !fs.length) { input.value = ''; return; }

    // El tope se respeta también aquí. El botón solo sabía esconderse cuando ya estaban todas, y
    // desde la galería se pueden marcar diez de una vez. Si sobran se dice: descartarlas en
    // silencio dejaría al ingeniero creyendo que subió unas fotografías que no están.
    if (topeFoto) {
      var caben = Math.max(0, topeFoto - (Array.isArray(D[n]) ? D[n].length : 0));
      if (fs.length > caben) {
        fs = fs.slice(0, caben);
        alert(caben
          ? 'En este campo solo caben ' + topeFoto + '. Se agregan las ' + caben + ' primeras.'
          : 'En este campo ya están las ' + topeFoto + ' imágenes.');
      }
    }
    if (!fs.length) { input.value = ''; return; }

    // De una en una. Procesarlas a la vez multiplicaba la memoria por el número de fotografías
    // marcadas en la galería, y en un teléfono justo eso es exactamente lo que tumba la conversión.
    avisoTrabajo(fs.length > 1 ? 'Preparando ' + fs.length + ' fotografías…'
                              : 'Preparando la fotografía…');
    var i = 0, fallidas = [];
    (function siguiente() {
      if (i >= fs.length) {
        input.value = '';
        quitaAvisoTrabajo();
        cambio(n);
        // El aviso va después de repintar: así las que sí entraron ya se ven mientras se lee.
        if (fallidas.length) avisaFotoFallida(fallidas);
        return;
      }
      achica(fs[i++], function (url, motivo) {
        if (url) {
          if (!Array.isArray(D[n])) D[n] = [];
          D[n].push(url); anota('foto', { campo: n });
          subeFoto(n, D[n].length - 1, url);
        }
        else fallidas.push(motivo);
        siguiente();
      });
    })();
  }

  var pickDoc = document.getElementById('fileDoc');
  pickDoc.addEventListener('change', function () { recibeDocumentos(pickDoc); });

  pick.addEventListener('change', function () { recibeFotos(pick); });
  pickGal.addEventListener('change', function () { recibeFotos(pickGal); });

  // ---------------------------------------------------------------- eventos
  // Responder obliga a repintar el paso: al contestar se abren y se cierran
  // preguntas enteras. Pero la página no debe moverse — el dedo está donde está,
  // y subir al principio en cada toque hace inusable un paso largo.
  //
  // Se ancla en el campo que se acaba de tocar y no en el scroll a secas: si lo
  // que desapareció estaba más arriba, conservar el scroll dejaría la respuesta
  // fuera de la pantalla.
  function repinta(ancla, comoPerfil) {
    var main = document.getElementById('main');
    var el = ancla ? main.querySelector('[data-campo="' + ancla + '"]') : null;
    var antes = el ? el.getBoundingClientRect().top : null;
    var y = window.pageYOffset;
    if (comoPerfil) pintaPerfil(true); else pintaPaso(true);
    if (antes !== null) {
      var ahora = main.querySelector('[data-campo="' + ancla + '"]');
      if (ahora) {
        window.scrollTo(0, Math.max(0,
          window.pageYOffset + ahora.getBoundingClientRect().top - antes));
        return;
      }
    }
    window.scrollTo(0, y);
  }

  // Al cambiar el material, el sistema que colgaba de él puede dejar de existir en la lista. Si no
  // se limpia, queda guardada una combinación que el formulario nunca ofreció y que nadie ve hasta
  // que alguien cruza los datos meses después: hay una visita con «Bahareque o tapia» y «Estructura
  // en madera» por exactamente esto.
  function limpiaCascada(padre) {
    if (!padre) return;
    (E.pasos || []).forEach(function (p) {
      (p.campos || []).forEach(function (f) {
        if (!f.filtro || f.filtro.indexOf('${' + padre + '}') < 0) return;
        var v = D[f.name];
        if (v === undefined || v === null || v === '') return;
        var validas = opciones(f).map(function (o) { return o.v; });
        if (Array.isArray(v)) {
          var q = v.filter(function (x) { return validas.indexOf(x) > -1; });
          if (q.length !== v.length) D[f.name] = q;
        } else if (validas.indexOf(v) < 0) {
          D[f.name] = '';
        }
        // y el «¿cuál?» que solo aparecía por la opción que acaba de irse
        (f.subs || []).forEach(function (sb) {
          var sigue = (sb.cuando || []).some(function (c) { return SEL(D[f.name], c); });
          if (!sigue && D[sb.name]) D[sb.name] = '';
        });
      });
    });
  }

  // Desmarcar «Otro» borra su «¿cuál?». Si solo se ocultara, el envío seguiría llevando «bodega»
  // en una casa que ahora es residencial: el informe, que ya no ve «Otro», no lo diría, y el panel
  // lo enseñaría sin que se supiera a qué respondía. Solo se tocan las casillas de texto de una
  // opción «otro»; las fotografías y los datos del propietario, que también cuelgan de una
  // respuesta, no se pierden por un roce.
  function limpiaOtros() {
    E.pasos.forEach(function (p) {
      p.campos.forEach(function (f) {
        (f.subs || []).forEach(function (s) {
          if (s.tipo !== 'text' || !(s.cuando || []).some(esOtro)) return;
          if (D[s.name] === undefined || D[s.name] === '') return;
          if (s.cuando.some(function (c) { return SEL(D[f.name], c); })) return;
          delete D[s.name];
        });
      });
    });
  }

  // Lo que una respuesta nueva esconde y lleva `borra_si_oculto` se borra, igual que el «¿cuál?» de
  // un «Otro». El nombre y el teléfono de un vecino que atendió no pueden seguir en la visita cuando
  // ahora dice que atendió el propietario —el informe los imprimiría juntos—, ni una matrícula
  // anotada para «no coincide» cuando ahora coincide. Solo en los campos que lo piden: el resto del
  // formulario conserva lo oculto, como siempre. Devuelve si borró algo, para volver a calcular.
  function limpiaOcultos() {
    var borro = false;
    E.pasos.forEach(function (p) {
      p.campos.forEach(function (f) {
        if (!f.borra_si_oculto || D[f.name] === undefined || D[f.name] === '') return;
        if (!visible(f)) { delete D[f.name]; borro = true; }
      });
    });
    return borro;
  }

  function cambio(ancla) {
    sueltaTraido(ancla);          // lo que el ingeniero toca deja de ser «traído de otra visita»
    sueltaArrastre(ancla);        // y deja de ser «traído de otro paso»
    limpiaForma(ancla);           // lo medido para la otra forma del daño no se queda escondido sumando
    limpiaCascada(ancla);
    limpiaFichas();
    limpiaDetalleA3();
    limpiaOtros();
    recalcula();
    // lo escondido se mira con los calculados al día; si se borró algo, se calcula otra vez
    if (limpiaOcultos()) recalcula();
    // las medidas de A.8 pasan a la ficha 1 de B.1 la primera vez que esta se abre vacía
    if (arrastraA8()) recalcula();
    // lo que ya se dijo en otro paso llega a los campos que se acaban de abrir (una vuelta basta:
    // las reglas van en orden, y el «sí» del contrapiso abre su área antes de que llegue su regla)
    if (arrastra()) recalcula();
    podaTraidos();
    // Manda el peor: si el elemento peor descrito supera al grado general, el general
    // sube, y eso cambia el dictamen de habitabilidad. Por eso hay que volver a
    // calcular antes de guardar, o se guardaría un dictamen de hace un momento.
    if (aplicaPeor()) recalcula();
    guardaVisita();
    if (vista === 'paso') repinta(ancla, false);
    else if (vista === 'perfil') repinta(ancla, true);
  }

  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, n = b.dataset.n;
    // Visita enviada en modo ver: el control está desactivado y aquí no hace nada. No basta con
    // `disabled`: si el toque cae en un hijo del botón (la escala lleva dos <span> dentro), no todos
    // los navegadores se callan igual.
    if (REV && b.disabled) return;

    if (a === 'trae') return traeBorrador(n);
    if (a === 'traeedificio') return traeDatosEdificio();
    if (a === 'noedificio') return descartaDatosEdificio();
    // lo traído de otro paso: «Está bien» lo deja como está y lo hace suyo; «Cambiar» lo vacía
    if (a === 'arrok') { sueltaArrastre(n); return cambio(n); }
    if (a === 'arrcambia') { cambiaArrastre(n); return cambio(n); }
    // Un control al que le falta un dato de otro paso (los pisos, del paso 3) lleva allí.
    if (a === 'irpaso') {
      var vp = pasosVisibles();
      for (var ip = 0; ip < vp.length; ip++) {
        if (vp[ip].id === b.dataset.p) { iPaso = ip; pintaPaso(); return; }
      }
      return;
    }
    if (a === 'uno') {
      // en una obligatoria, volver a tocar la opción elegida no la borra: en campo
      // un roce de más dejaría la respuesta en blanco sin que nadie se entere
      var campo = idxCampo[n];
      // volver a tocar la opción que se trajo de otro paso es confirmarla (cambio() la suelta)
      if (D[n] === b.dataset.v && pendienteArrastre(n)) return cambio(n);
      if (D[n] === b.dataset.v) { if (campo && obligatorio(campo)) return; D[n] = ''; }
      else D[n] = b.dataset.v;
      return cambio(n);
    }
    if (a === 'multi') {
      var arr = Array.isArray(D[n]) ? D[n].slice() : [], i = arr.indexOf(b.dataset.v);
      if (i > -1) arr.splice(i, 1); else arr.push(b.dataset.v);
      // "Ninguna" no convive con nada: se aceptaba a la vez "Ninguna" y "Evacuar
      // edificación", y eso llegaba tal cual a la base. Un roce de más producía
      // un dictamen que se contradice a sí mismo.
      if (EXCLUSIVAS.indexOf(b.dataset.v) > -1) arr = arr.indexOf(b.dataset.v) > -1 ? [b.dataset.v] : [];
      else arr = arr.filter(function (v) { return EXCLUSIVAS.indexOf(v) === -1; });
      D[n] = arr; return cambio(n);
    }
    if (a === 'mas') {
      // Un contador vacío con `defecto` ya vale ese número (es el gris que se ve): el + parte de ahí y
      // no de cero, y el − no baja de `minimo`. Sin eso, «+» en un tipo de «1» gris daba 1, no 2.
      var fm = idxCampo[n] || {};
      var cur = fm.defecto != null && pideValor({ name: n }) ? Number(fm.defecto) : (Number(D[n]) || 0);
      var piso = fm.minimo != null ? Number(fm.minimo) : 0, nv = cur + Number(b.dataset.d);
      D[n] = nv < piso ? piso : nv; return cambio(n);
    }
    if (a === 'foto' || a === 'galeria') {
      destinoFoto = n;
      topeFoto = Number(b.dataset.tope || 0) || 0;
      (a === 'foto' ? pick : pickGal).click();
      return;
    }
    if (a === 'quitafoto') { D[n].splice(Number(b.dataset.i), 1); return cambio(n); }
    if (a === 'documento') { destinoDoc = n; pickDoc.click(); return; }
    if (a === 'quitadoc') { D[n].splice(Number(b.dataset.i), 1); return cambio(n); }
    if (a === 'gps') {
      if (!navigator.geolocation) { alert('Este teléfono no permite obtener la ubicación.'); return; }
      b.textContent = 'Ubicando…'; b.disabled = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        D[n] = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
        anota('gps', { campo: n, detalle: { precision: Math.round(pos.coords.accuracy) } });
        cambio(n);
      }, function () {
        b.disabled = false; b.textContent = 'Reintentar';
        alert('No se pudo obtener la ubicación. Revise que el GPS y el permiso estén activos.');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      return;
    }
    if (a === 'nueva') {
      return nuevaVisita().then(function () { vista = 'paso'; pintaPaso(); });
    }
    // El informe se arma con la visita cargada en memoria. Desde la bandeja hay que leerla primero; al terminar
    // se vuelve a la bandeja, que deja la visita cerrada otra vez. Desde la bandeja sale de la copia del
    // teléfono —al instante y sin señal—; la versión del servidor, con sus correcciones, está en «Sus
    // visitas enviadas».
    if (a === 'informe') {
      e.preventDefault(); e.stopPropagation();
      var idInf = b.dataset.id;
      if (!idInf) return abreInforme();
      return ALMACEN.visitas.lee(idInf).then(function (v) {
        if (!v) return;
        visita = v; D = v.D || {};
        Object.keys(PERFIL).forEach(function (k) { if (!NO_ES_RESPUESTA[k] && !D[k]) D[k] = PERFIL[k]; });
        recalcula(); abreInforme(); pintaBandeja();
      });
    }
    if (a === 'abrir') {
      // Un borrador del teléfono: la visita enviada, si seguía abierta, se suelta antes de cargarlo.
      sueltaRev();
      var idAb = b.dataset.id;
      // La que está saliendo en este momento no se abre: lo que se tocara ahora se guardaría encima de
      // la copia que el envío va a marcar como enviada, y la devolvería a la cola.
      if (enVuelo[idAb]) { alert('Esta visita se está enviando en este momento. Ábrala en unos segundos.'); return; }
      return ALMACEN.visitas.lee(idAb).then(function (v) {
        if (!v) return pintaBandeja();
        // Y otra vez con ella ya leída: si la cola la tomó mientras se leía, lo que se escribiera ahora
        // no saldría (la cola manda lo que releyó) y la dejaría en «lista» sobre la enviada.
        if (enVuelo[idAb] && v.estado !== 'enviada') {
          alert('Esta visita se está enviando en este momento. Ábrala en unos segundos.');
          return;
        }
        // Una visita enviada no se abre para escribir encima (nota del 23-sep): se ve entera, de solo
        // lectura, y para cambiarla está «Editar», que va por el servidor con su motivo. Antes se abría
        // como un borrador más: lo que se tocara no llegaba a ninguna parte y «Guardar y volver» la
        // mandaba otra vez.
        if (v.estado === 'enviada') return abreEnviadaLocal(v);
        visita = v; D = v.D || {}; iPaso = v.paso || 0;
        Object.keys(PERFIL).forEach(function (k) { if (!NO_ES_RESPUESTA[k] && !D[k]) D[k] = PERFIL[k]; });
        recalcula(); vista = 'paso'; pintaPaso();
      });
    }
    if (a === 'borrar') {
      e.stopPropagation();
      if (enVuelo[b.dataset.id]) { alert('Esta visita se está enviando en este momento.'); return; }
      if (!confirm('¿Borrar esta visita del teléfono? No se puede deshacer.')) return;
      return ALMACEN.visitas.borra(b.dataset.id).then(pintaBandeja);
    }
    if (a === 'enviar') return enviaPendientes(b);
    if (a === 'limpiar') {
      if (!confirm('¿Borrar del teléfono las visitas ya enviadas? Seguirán en el servidor.')) return;
      return ALMACEN.visitas.todas().then(function (t) {
        return Promise.all(t.filter(function (v) { return v.estado === 'enviada'; })
          .map(function (v) { return ALMACEN.visitas.borra(v.id); }));
      }).then(pintaBandeja);
    }
    // «guardarvisita» es el nombre de antes del mismo botón: una pantalla pintada por la versión
    // anterior justo antes de actualizarse todavía lo lleva.
    if (a === 'finalizar' || a === 'guardarvisita') return finalizaVisita();
    if (a === 'perfil') return pintaPerfil();
    if (a === 'guardaperfil') {
      var malos = [];
      CAMPOS_PERFIL.forEach(function (f) {
        if (f.req && pideValor(f)) malos.push([f.name, 'Complete este dato']);
        (f.subs || []).forEach(function (s) {
          if (s.req && s.cuando.some(function (c) { return SEL(D[f.name], c); }) && pideValor(s)) {
            malos.push([f.name, 'Complete el dato que falta']);
          }
        });
      });
      if (malos.length) return marca(malos);
      PERFIL = {};
      CAMPOS_PERFIL.forEach(function (f) {
        PERFIL[f.name] = D[f.name];
        (f.subs || []).forEach(function (s) { if (D[s.name]) PERFIL[s.name] = D[s.name]; });
      });
      ALMACEN.perfil.guarda(PERFIL);
      return pintaBandeja();
    }
    if (a === 'copiar') {
      var t = document.getElementById('salida');
      t.select(); t.setSelectionRange(0, 999999);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) {}
      if (navigator.clipboard) { navigator.clipboard.writeText(t.value).catch(function () {}); ok = true; }
      b.textContent = ok ? 'Copiado ✓' : 'Seleccione y copie el texto';
      setTimeout(function () { b.textContent = 'Copiar respuestas'; }, 2200);
      return;
    }
    if (a === 'volverpaso') { vista = 'paso'; iPaso = Math.max(0, pasosVisibles().length - 1); return pintaPaso(); }
    if (a === 'bandeja') { return guardaVisita(true).then(pintaBandeja); }
  });

  document.getElementById('main').addEventListener('input', function (e) {
    var el = e.target; if (el.dataset.a !== 'txt') return;
    var n = el.dataset.n;
    D[n] = el.dataset.num ? aNumero(el.value)
         : el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
    // escribirlo lo hace suyo: la marca de «traído» se va en el próximo repintado, sin quitar el foco
    sueltaTraido(n);
    sueltaArrastre(n);
    // Crece con lo que se escribe. Sin esto, «sin límite» es mentira: caben tres renglones y
    // el resto se escribe a ciegas, dentro de una caja que no se puede agrandar con el dedo.
    if (el.tagName === 'TEXTAREA') {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight + 2, window.innerHeight * 0.6) + 'px';
    }
    recalcula();
    refrescaVivas();
    var f = document.querySelector('.f[data-campo="' + n + '"]');
    if (f) f.classList.remove('err');
  });
  document.getElementById('main').addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.a === 'sel') { D[el.dataset.n] = el.value; return cambio(el.dataset.n); }
    if (el.dataset.a === 'txt') { guardaVisita(); if (vista === 'paso') repinta(el.dataset.n, false); }
  });

  document.getElementById('bSig').addEventListener('click', function () {
    if (REV) return sigueRev();
    var malos = valida();
    if (malos.length) return marca(malos);
    guardaVisita();
    var vis = pasosVisibles();
    anota('paso', { paso: vis[iPaso] ? vis[iPaso].titulo : String(iPaso),
                    ms: pasoDesde ? Date.now() - pasoDesde : undefined });
    pasoDesde = Date.now();
    if (iPaso >= vis.length - 1) return pintaFin();
    iPaso++; pintaPaso();
  });
  document.getElementById('bAtras').addEventListener('click', function () {
    if (iPaso > 0) { iPaso--; pintaPaso(); }
  });
  // salir al listado sin perder nada: la visita queda como borrador
  // Dejar el formulario a medias es el dato que más dice del piloto: sin él no
  // se sabe en qué paso se rinde la gente. Se anota al salir a mano y al cerrar
  // la aplicación; no al pasar de un paso a otro, que no es abandonar.
  function anotaAbandono(comoSeFue) {
    if (vista !== 'paso' || !visita || visita.estado === 'enviada') return;
    var vis = pasosVisibles();
    anota('abandona', {
      paso: vis[iPaso] ? vis[iPaso].titulo : String(iPaso),
      ms: pasoDesde ? Date.now() - pasoDesde : undefined,
      detalle: { salida: comoSeFue }
    });
  }

  document.getElementById('bSalir').addEventListener('click', function () {
    if (REV) return saleRev();
    anotaAbandono('boton');
    // Con enlace personal la casa es «Sus predios»; sin él, la bandeja. Antes esto pintaba la bandeja
    // y otro manejador saltaba a los predios 60 ms después: dos pantallas seguidas, cada una con su
    // propio intento de enviar la cola, y cuál quedaba a la vista dependía de lo que tardara el guardado.
    guardaVisita(true).then(function () { return SESION ? pintaPredios() : pintaBandeja(); });
  });


  // ---------------------------------------------------------------- envío
  // Se envía de una en una, no todas juntas: con red mala cada visita que llega
  // queda confirmada por su cuenta y no se pierde el trabajo de las demás.
  //
  // Devuelve {r, res}: r es 'ok', 'fallo' o 'clave', y res lo que dijo el servidor de ESA visita.
  // Desde recibir-visita v16, res trae además cómo quedó su predio (asignacion_estado, fichas) y el
  // id de la visita en el servidor también cuando ya estaba; un servidor de antes no lo trae y todo
  // sigue igual (ver aplicaAsignacion).
  function enviaUna(v) {
    return fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-clave-dispositivo': claveEnvio() },
      body: JSON.stringify({
        version: E.meta.version,
        visita: { id: v.id, creada: v.creada, perfil: sinClave(PERFIL),
                  asignacion: v.asignacion || null, respuestas: sinClave(v.D) }
      })
    }).then(function (r) {
      if (r.status === 401) return r.json().then(function () { return { r: 'clave' }; });
      if (!r.ok) return { r: 'fallo' };
      return r.json().then(function (j) {
        var res = ((j && j.resultados) || [])[0] || {};
        // "ya_estaba" cuenta como enviada: llegó en un intento anterior cuya
        // respuesta se perdió por el camino
        var d = String(res.documentos || '').split('/');
        if (d.length === 2 && Number(d[0]) < Number(d[1])) {
          var perdidos = Number(d[1]) - Number(d[0]);
          anota('documento_perdido', { visita: v.id, perdidos: perdidos });
          alert('La visita llegó, pero ' + (perdidos === 1 ? 'un documento no se pudo guardar'
                : perdidos + ' documentos no se pudieron guardar') +
                '. Avísele al coordinador con la dirección del predio.');
        }
        return { r: (res.estado === 'recibida' || res.estado === 'ya_estaba') ? 'ok' : 'fallo', res: res };
      });
    }).catch(function () { return { r: 'fallo' }; });
  }

  // UNA sola tanda de envío a la vez, y la marca se pone ANTES de leer el almacén.
  //
  // La cola la arrancan el botón, «Finalizar visita», la bandeja y «Sus predios» al pintarse, la
  // vuelta de la señal y el reintento de cada minuto. La marca de «enviando» se ponía después de
  // leer las visitas —en un teléfono con fotos, cientos de milisegundos—, así que dos arranques en ese
  // hueco leían la misma visita «lista» y la mandaban los dos (el servidor descarta la repetida por su
  // id, pero no debería llegarle). Ahora un segundo arranque no lee nada: la tanda en curso, al acabar
  // su lista, vuelve a mirar el almacén y manda también lo que se finalizó entretanto.
  //
  // enVuelo: lo que está saliendo ahora (la bandeja lo dice y no deja abrirlo ni borrarlo).
  // ultimoEnvio: cómo le fue a cada una la última vez ('ok', 'fallo', 'clave', 'sinred').
  var enviando = false, envioActual = null, otraVuelta = false, enVuelo = {}, ultimoEnvio = {};
  var reintento = null;
  // Al terminar el envío se repinta la bandeja SOLO si es lo que está en pantalla. La cola sale sola
  // al pintar «Sus predios» (sincronizaSiPuede), y mientras sube el ingeniero puede estar en otra
  // cosa: saltar a la bandeja por debajo de él lo sacaba del formulario, y si tenía abierta una
  // visita enviada la dejaba puesta detrás, con la visita nueva en solo lectura y «Guardar cambios»
  // apuntando a la enviada con las respuestas de otro predio.
  function repintaBandejaSiSeVe() { if (vista === 'bandeja') pintaBandeja(); }
  function enviaPendientes(boton) {
    if (enviando) { otraVuelta = true; return envioActual || Promise.resolve(); }
    enviando = true;
    otraVuelta = false;
    var hechas = 0, fallos = 0, claveMala = false, faltaClave = false, sinRed = false, intentadas = {};
    function di(t) {
      var b = boton && boton.isConnected !== false ? boton : document.querySelector('[data-a="enviar"]');
      if (b) { b.textContent = t; b.disabled = true; }
    }
    // Lo que queda por mandar. La visita que está abierta en el formulario no sale: se está escribiendo
    // (una «lista» que se abrió para corregir algo), y saldrá al finalizarla o en la próxima tanda.
    function pendientes(todas) {
      return todas.filter(function (v) {
        return v.estado === 'lista' && !intentadas[v.id] && !(visita && visita.id === v.id);
      });
    }
    // La lista se lee al empezar la tanda, y cada visita espera su turno detrás de las demás: con fotos
    // y mala señal, minutos. Mientras espera no está «Enviando…», así que el ingeniero puede abrirla y
    // corregirla, o borrarla. Mandar la copia leída al empezar perdía la corrección (en el servidor y
    // también en el teléfono, que la reescribía como «enviada» con los datos de antes) y resucitaba la
    // borrada (llegaba al servidor y volvía a salir en la bandeja como «Enviada»). Por eso se relee
    // justo antes de mandarla, y se manda y se marca lo releído. Se salta si ya no está, si ya no está
    // en cola o si está abierta en el formulario: no cuenta como intentada, así que la vuelta del
    // final la toma si para entonces se cerró. `enVuelo` va ANTES de releer: desde ese instante la
    // bandeja ya no deja abrirla ni borrarla, y lo releído es lo que sale.
    function una(v0) {
      if (claveMala) return Promise.resolve();
      enVuelo[v0.id] = true;
      return relee(v0).then(function (v) {
        if (!v || v.estado !== 'lista' || (visita && visita.id === v.id)) {
          delete enVuelo[v0.id];
          return;
        }
        return mandaUna(v);
      });
    }
    // Lo que hay ahora en el teléfono de esa visita. Si no se encuentra por su id, antes de darla por
    // borrada se mira otra vez la lista de la que salió: solo se salta la que de verdad ya no está. Si
    // leer falla, sale la copia de la lista, como antes.
    function relee(v0) {
      return ALMACEN.visitas.lee(v0.id).then(function (v) {
        if (v) return v;
        return ALMACEN.visitas.todas().then(function (t) {
          return (t || []).filter(function (x) { return x && x.id === v0.id; })[0] || null;
        });
      }).then(null, function () { return v0; });
    }
    function mandaUna(v) {
      intentadas[v.id] = true;
      // Cada intento de verdad gasta el minuto: las pantallas que se repintan al terminar no vuelven
      // a intentar enseguida lo que acaba de fallar (para eso está el reintento de cada minuto).
      ultimoIntento = Date.now();
      if (navigator.onLine === false) {
        delete enVuelo[v.id];
        sinRed = true; ultimoEnvio[v.id] = 'sinred';
        if (AVISO_ENVIO.id === v.id) { AVISO_ENVIO.tipo = 'sinred'; AVISO_ENVIO.cuando = Date.now(); }
        return Promise.resolve();
      }
      di('Enviando…');
      repintaBandejaSiSeVe();
      return enviaUna(v).then(function (x) {
        delete enVuelo[v.id];
        ultimoEnvio[v.id] = x.r;
        if (x.r !== 'ok') {
          if (x.r === 'clave') claveMala = true; else fallos++;
          if (AVISO_ENVIO.id === v.id) { AVISO_ENVIO.tipo = x.r === 'clave' ? 'clave' : 'fallo'; AVISO_ENVIO.cuando = Date.now(); }
          return;
        }
        hechas++;
        v.estado = 'enviada';
        v.enviada = Date.now();
        // el id de la visita en el servidor: con él, el editor la abre sin tener que buscarla
        if (x.res && x.res.visita) v.servidor_id = String(x.res.visita);
        anota('envia', { visita: v.id });
        olvidaBorrador(v.id);   // ya está en `visitas`: la copia del servidor sobra
        aplicaAsignacion(v, x.res || {});
        if (AVISO_ENVIO.id === v.id) { AVISO_ENVIO.tipo = 'ok'; AVISO_ENVIO.res = x.res || {}; AVISO_ENVIO.cuando = Date.now(); }
        // Si el almacén no deja escribir, la visita sigue «lista» en el teléfono y el próximo intento el
        // servidor la contesta como «ya_estaba»: se reintenta sola, no se pierde. Lo que no puede pasar
        // es que un fallo aquí deje la marca de «enviando» puesta para siempre.
        return ALMACEN.visitas.guarda(v).then(null, function () {});
      }).then(repintaBandejaSiSeVe);
    }
    function vuelta() {
      return ALMACEN.visitas.todas().then(function (todas) {
        var lista = pendientes(todas);
        if (!lista.length) return;
        if (!claveEnvio()) {
          faltaClave = true;
          ultimoIntento = Date.now();      // sin clave no hay que volver a mirar en cada pantalla
          lista.forEach(function (v) {
            ultimoEnvio[v.id] = 'clave';
            if (AVISO_ENVIO.id === v.id) { AVISO_ENVIO.tipo = 'clave'; AVISO_ENVIO.cuando = Date.now(); }
          });
          return;
        }
        var antes = Object.keys(intentadas).length;
        return lista.reduce(function (c, v) { return c.then(function () { return una(v); }); }, Promise.resolve())
          // y lo que se finalizó mientras tanto, en esta misma tanda. Solo si esta pasada mandó algo: la
          // que se salta (abierta, borrada) no cuenta como intentada, y sin esa condición una que se
          // saltara siempre se volvería a leer sin fin.
          .then(function () { if (!claveMala && Object.keys(intentadas).length > antes) return vuelta(); });
      });
    }
    envioActual = vuelta().then(null, function () {}).then(function () {
      enviando = false;
      envioActual = null;
      var algo = Object.keys(intentadas).length > 0 || faltaClave;
      // Si no había nada que mandar, el minuto entre intentos no se gasta —la próxima pantalla que se
      // pinte vuelve a mirar— y la bandeja no se repinta: repintarla arranca otra tanda, que tampoco
      // encontraría nada y la volvería a repintar, sin fin.
      // (Si mientras tanto alguien pidió otra —«Finalizar» justo al terminar esta—, se hace.)
      if (!algo) {
        ultimoIntento = 0;
        if (otraVuelta) { otraVuelta = false; return enviaPendientes(); }
        return;
      }
      if (claveMala) {
        alert('La clave de este teléfono ya no es válida. Nada se ha perdido: las' +
              ' visitas siguen guardadas. Pida una clave nueva antes de reintentar.');
      }
      // El predio de lo que salió, al día con lo que dice el servidor (ver aplicaAsignacion).
      if (hechas) pideSesion(true);
      if (fallos || sinRed) programaReintento();
      repintaBandejaSiSeVe();
      if (otraVuelta && !claveMala && !faltaClave) { otraVuelta = false; return enviaPendientes(); }
      otraVuelta = false;
    });
    return envioActual;
  }

  // Mientras quede algo en la cola se vuelve a intentar cada minuto. El aviso de «volvió la señal» no
  // llega siempre —un teléfono puede creer que tiene señal y no tenerla, y entonces el envío falla sin
  // que cambie nada—, y «se enviará sola» tiene que ser verdad sin que el ingeniero toque nada.
  function programaReintento() {
    if (reintento) return;
    reintento = setTimeout(function () { reintento = null; sincronizaSiPuede(true); }, 60000);
  }

  // Al abrir con conexión, se intenta vaciar la cola sin que haya que pedirlo. `forzar`: sin esperar
  // el minuto entre intentos (volvió la señal, o es el reintento programado).
  var ultimoIntento = 0;
  function sincronizaSiPuede(forzar) {
    if (navigator.onLine === false || enviando) return;
    if (!forzar && Date.now() - ultimoIntento < 60000) return;
    // La marca del minuto se pone YA, antes de leer nada: se ponía después de leer el almacén y dos
    // pantallas pintadas seguidas (la bandeja y «Sus predios») pasaban las dos por el hueco.
    ultimoIntento = Date.now();
    enviaPendientes(document.querySelector('[data-a="enviar"]'));
  }

  // El predio de la visita que acaba de llegar, al día en la sesión guardada del teléfono. En la
  // prueba del 23-sep el servidor cerró la asignación y «Sus predios» siguió diciendo «Empezada»: la
  // sesión solo se pedía al abrir la aplicación. recibir-visita v16 dice en su respuesta cómo quedó
  // (asignacion_estado; en un edificio, cuántas fichas van) y se aplica aquí mismo; después se pide la
  // sesión entera otra vez (enviaPendientes). Con un servidor de antes no llega asignacion_estado y
  // solo se marca la ficha levantada, que es un hecho: el estado lo trae la sesión.
  function aplicaAsignacion(v, res) {
    if (!SESION || !v || !v.asignacion) return false;
    var a = (SESION.asignaciones || []).filter(function (x) { return x.id === v.asignacion; })[0];
    if (!a) return false;
    var R = v.D || {}, cambio = false;
    var ficha = String(R.unidad_npn || '');
    if (ficha && R.alcance !== 'zonas_comunes' && Array.isArray(a.unidades)) {
      a.unidades.forEach(function (u) {
        if (u && u.n === ficha && !(u.y && u.m)) { u.y = true; u.m = true; cambio = true; }
      });
      var fx = /^(\d+)\/(\d+)$/.exec(String((res && res.fichas) || ''));
      var hechas = fx ? Number(fx[1]) : a.unidades.filter(function (u) { return u && u.y; }).length;
      if (hechas && hechas !== a.unidades_hechas) { a.unidades_hechas = hechas; cambio = true; }
    }
    var est = String((res && res.asignacion_estado) || '');
    if ((est === 'hecha' || est === 'en_curso' || est === 'pendiente') && a.estado !== est) {
      a.estado = est;
      if (est === 'hecha' && !a.hecha_en) a.hecha_en = new Date().toISOString();
      cambio = true;
    }
    if (cambio) guardaLocal(LS_SESION, SESION);
    return cambio;
  }

  // «Finalizar visita» (antes «Guardar y volver a la bandeja»): comprueba que no falte nada, deja la
  // visita lista y la manda en ese momento si hay señal. Sin señal queda en cola y la bandeja lo dice.
  // Una visita ya enviada no vuelve nunca a la cola: esa era la otra forma de mandarla dos veces.
  function finalizaVisita() {
    if (!visita || REV) return Promise.resolve();
    if (visita.estado === 'enviada') return Promise.resolve(pintaBandeja());
    recalcula();
    var av = avance();
    if (av.faltan || av.revisar) return Promise.resolve(llevaAlQueFalta(av));
    var v = visita;
    if (D.sin_danos === 'si') marcaSinDanos(v);
    v.estado = 'lista';
    AVISO_ENVIO = { id: v.id, cuando: Date.now(), tipo: navigator.onLine === false ? 'sinred' : 'enviando',
                    res: null, sinDatos: false };
    return guardaVisita(true).then(function () {
      return clonesSinDanos(v);
    }).then(function () {
      pintaBandeja();
      return enviaPendientes();
    }).then(function () {
      // Si la tanda no llegó a tocarla (el almacén no la guardó como lista), el aviso no puede seguir
      // diciendo «Enviando…» cinco minutos.
      if (AVISO_ENVIO.id === v.id && AVISO_ENVIO.tipo === 'enviando') {
        AVISO_ENVIO.tipo = navigator.onLine === false ? 'sinred' : 'fallo';
        AVISO_ENVIO.cuando = Date.now();
        repintaBandejaSiSeVe();
      }
    });
  }
  // Lo que el servidor y el mapa leen de toda visita: habitable, sin daño, sin intervención. Se pone al
  // final y no al empezar, porque son campos de pasos que el registro sin daños esconde.
  function marcaSinDanos(v) {
    // Ya reparado queda igual de habitable; la marca es sin_danos_situacion, que viaja en las respuestas.
    if (!D.sin_danos_situacion) D.sin_danos_situacion = 'sin_danos';
    if (D.sin_danos_situacion !== 'reparado') { delete D.reparado_que; delete D.reparado_quien; delete D.reparado_detalle; }
    D.eva_clasif_habitabilidad = 'habitable';
    D.eva_nivel_dano = 'ninguno_menor';
    D.eva_tipo_intervencion = 'ninguna';
    if (!D.estado_colapso) D.estado_colapso = 'ninguno';
    // Calculados de la localización, que aquí no se diligencia: saldrían «-N-» en el código de registro.
    delete D.cod_registro; delete D.area_huella_mapa;
    var lote = Array.isArray(D.sin_danos_lote) ? D.sin_danos_lote : null;
    // La lista pasa de las respuestas a la visita: al servidor no le sirve y cada ficha va en su visita.
    if (lote) { v.lote = lote; delete D.sin_danos_lote; }
    if (lote && lote.length > 1) D.sin_danos_grupo = v.id;   // las visitas que se registraron juntas
  }
  // Una visita por cada ficha marcada, además de la primera: la misma constancia (quién atendió, fotos,
  // firma) con su ficha, su dirección y su matrícula. Quedan «listas» y salen con la cola de siempre.
  function clonesSinDanos(v) {
    var lote = Array.isArray(v.lote) ? v.lote : [];
    if (lote.length < 2) return Promise.resolve();
    var base = JSON.stringify(v);
    return lote.slice(1).reduce(function (p, u, k) {
      return p.then(function () {
        if (!u || !u.n) return;
        var c = JSON.parse(base);
        c.id = v.id + '-' + (k + 2);
        c.lote = null;
        c.tocada = Date.now();
        c.D.unidad_npn = u.n;
        c.D.unidad_label = u.et || '';
        if (u.d) c.D.direccion = u.d;
        if (u.mt) c.D.matricula_catastro = u.mt; else delete c.D.matricula_catastro;
        c.resumen = Object.assign({}, v.resumen || {}, { direccion: c.D.direccion || '' });
        return ALMACEN.visitas.guarda(c).catch(avisaNoGuarda);
      });
    }, Promise.resolve()).then(function () {
      // Sin señal, la sesión nueva no llega y la lista seguiría ofreciendo esas fichas como libres: se
      // marcan ya como suyas. Van a salir igual, porque quedaron «listas» en el teléfono; aplicaAsignacion
      // hace lo mismo cuando el servidor confirma cada una.
      var a = SESION && (SESION.asignaciones || []).filter(function (x) { return x.id === v.asignacion; })[0];
      if (!a || !Array.isArray(a.unidades)) return;
      var ns = {};
      lote.forEach(function (u) { if (u && u.n) ns[u.n] = true; });
      a.unidades.forEach(function (u) { if (u && ns[u.n]) { u.y = true; u.m = true; } });
      guardaLocal(LS_SESION, SESION);
    });
  }
  // Algo quedó sin llenar (una pregunta que se abrió al volver atrás y cambiar otra respuesta): se
  // dice, y se lleva al primer paso donde falta, con lo que falta en rojo.
  function llevaAlQueFalta(av) {
    var i = 0;
    while (i < av.pasos.length - 1 && !av.pasos[i].falta.length && !av.pasos[i].revisar.length) i++;
    alert('Antes de finalizar, complete lo que falta: ' + textoFaltan(av) + '. Lo llevamos al primer dato.');
    vista = 'paso'; iPaso = i; pintaPaso();
    marca(valida());
  }

  function copiaAlPortapapeles(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).then(function () { return true; })
        .catch(function () { return respaldoCopia(txt); });
    }
    return Promise.resolve(respaldoCopia(txt));
  }
  function respaldoCopia(txt) {
    try {
      var t = document.createElement('textarea');
      t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(t);
      return ok;
    } catch (e) { return false; }
  }

  // ---------------------------------------------------------------- conexión
  // Al volver la señal sale la cola, esté donde esté el ingeniero: el envío ya no cambia de pantalla
  // ni toca la visita abierta, así que no hace falta esperar a que vuelva a la bandeja.
  window.addEventListener('online', function () {
    refrescaRed();
    repintaBandejaSiSeVe();
    sincronizaSiPuede(true);
  });
  window.addEventListener('offline', function () { refrescaRed(); repintaBandejaSiSeVe(); });
  // guardar antes de que el navegador descarte la página

    // Para revisarlas en el computador, que es donde se afinan las observaciones: el mismo enlace de
    // siempre con la llave del editor de este teléfono detrás. Solo al pedirlo, y dicho que es personal.
    if (!basicas && llaveEditor() && token()) {
      h += CORR.enlacePC
        ? '<div class="nota"><b>Enlace para el computador.</b> Ábralo allí y verá estas mismas visitas. Es' +
          ' personal: quien lo tenga puede corregir sus visitas, así que no lo reenvíe a nadie.</div>' +
          '<textarea class="inp" id="enlacePC" rows="3" readonly>' + esc(enlacePC()) + '</textarea>' +
          '<button class="big sec" data-a="copiaenlacepc">Copiar el enlace</button>'
        : '<button class="big sec" data-a="enlacepc">Revisarlas en el computador</button>';
    }
    h += '<button class="big sec" data-a="volverpredios">Volver</button></div>';
    document.getElementById('main').innerHTML = h;
    sueltaEventos();
    if (busca) buscaEnviadas();
    else programaFaltas();
  }
  function enlacePC() {
    return location.origin + location.pathname + '?e=' + encodeURIComponent(token()) + '#k=' + llaveEditor();
  }

  // El respaldo (visita-corregir) solo si editar-visita no se alcanzó por la red. Cualquier respuesta
  // del servidor —un 403, un 500, un 429— es una respuesta: caer al respaldo con ella era la forma de
  // saltarse el bloqueo por caso de demolición o por corrección de la Alcaldía, porque la v1 de
  // visita-corregir no lo mira. Con la respuesta se dice lo que pasó y se deja reintentar.
  function buscaEnviadas() {
    return pideEditar({ accion: 'mias' }).then(function (j) {
      guardaMias(j); CORR.aviso = '';
    }, function (e) {
      if (e && e.status !== 0) throw e;
      return pideCorrige({ accion: 'lista' }).then(function (j) {
        CORR.filas = j.visitas || []; CORR.fuente = 'corregir';
        CORR.aviso = 'El editor completo no respondió: por ahora solo se pueden corregir los datos básicos.';
      });
    }).catch(function (e) {
      CORR.aviso = (e && e.message) || 'No se pudo consultar';
      CORR.fallo = true;
    }).then(function () {
      CORR.pidiendo = false;
      if (vista === 'corrige') pintaCorrige();
    });
  }

  // Una visita de la lista de editar-visita: si se puede corregir y, si no, el porqué del servidor
  // con su radicado. Decir «no se puede» y callar el motivo es lo que llena el WhatsApp de preguntas.
  //
  // Desde el 23-sep, además: «Falta información (N)» cuando el formulario de hoy le pide datos que no
  // trae —casi todas las de antes, por las preguntas nuevas—, con qué le falta, y el botón que la abre
  // justo ahí; y el PDF a la vista, sin tener que abrirla.
  //
  // En el teléfono (revisión de Julián del 23-sep): la tarjeta va apilada. Arriba se lee entera —la
  // dirección, el porqué y lo que falta ya no se cortan con «…»— y abajo van los botones, de 46 px y
  // parejos: «Completar lo que falta» a todo el ancho y «Ver visita» y «↓ PDF» lado a lado. «Descargar
  // PDF» no cabe al lado de «Ver visita» en 360 px sin partirse; el nombre completo va en aria-label.
  // Antes eran dos columnas con cuatro botones de tamaños distintos, y el «Ver» era una píldora de
  // 26 px. Tocar la tarjeta fuera de los botones la abre igual.
  function filaEnviada(v) {
    var sub = [v.barrio_vereda, v.creada_en ? fechaCorta(v.creada_en) : '',
               etiquetaLista('habitabilidad', v.habitabilidad), v.corregida_en ? 'corregida' : '']
      .filter(Boolean).join(' · ');
    var chip = v.es_prueba ? ['l', 'Práctica'] : v.editable ? ['e', 'Se puede corregir'] : ['b', 'Solo ver'];
    var fa = CORR.faltas[v.id], n = fa && fa.faltan > 0 ? fa.faltan : 0;
    var id = esc(v.id);
    return '<div class="fila" data-a="revver" data-id="' + id + '">' +
      '<div class="env-cab"><b>' + esc(v.direccion || v.codigo_registro || 'Visita sin dirección') + '</b>' +
      (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="env-chips"><span class="chip ' + chip[0] + '">' + chip[1] + '</span>' +
      (n ? '<span class="chip f">Falta información (' + n + ')</span>' : '') + '</div>' +
      (v.editable ? '' : '<p class="env-porque">' + esc(v.porque || 'Ya no se puede corregir desde el teléfono.') +
        (v.radicado ? ' Radicado ' + esc(v.radicado) + '.' : '') + '</p>') +
      (n ? '<p class="env-falta">Falta: ' + esc(nombresCortos(fa.nombres, n)) + '</p>' : '') +
      '<div class="env-acc">' +
      (n && v.editable ? '<button type="button" class="env-pri" data-a="revcompletar" data-id="' + id +
        '">Completar lo que falta</button>' : '') +
      '<button type="button" class="env-ver" data-a="revver" data-id="' + id + '">Ver visita</button>' +
      '<button type="button" class="pdf" data-a="revpdflista" data-id="' + id +
      '" aria-label="Descargar el informe del predio en PDF">PDF</button></div></div>';
  }
  // «Destino del muro 1; Tipo de daño del muro 1 y 4 más»: lo bastante para saber de qué se trata.
  function nombresCortos(nombres, n) {
    var l = (nombres || []).slice(0, 2);
    return l.join('; ') + (n > l.length ? (l.length ? ' y ' : '') + (n - l.length) + (n - l.length === 1 ? ' dato más' : ' datos más') : '');
  }

  // La de siempre (visita-corregir), para cuando la lista viene del respaldo.
  function filaBasica(v) {
    var sub = [v.barrio_vereda, v.creada_en ? fechaCorta(v.creada_en) : '',
               v.corregida_en ? 'corregida' : ''].filter(Boolean).join(' · ');
    return '<div class="fila" data-a="corrigeuna" data-id="' + esc(v.id) + '"' +
      ' role="button" tabindex="0"><div class="fila-txt"><b>' +
      esc(v.direccion || 'Visita sin dirección') + '</b><span>' + esc(sub) + '</span></div>' +
      '<div class="fila-meta"><span class="mini">' + esc(etiquetaLista('habitabilidad', v.habitabilidad) || '—') +
      '</span></div></div>';
  }

  function pintaCorrigeUna(id) {
    var v = (CORR.filas || []).filter(function (x) { return x.id === id; })[0];
    if (!v) return pintaCorrige();
    CORR.abierta = v; vista = 'corrige1'; chrome(false);
    var h = '<div class="pantalla">' + barraRed() +
      '<div class="eyebrow">Visita enviada</div><h1>' + esc(v.direccion || 'Sin dirección') + '</h1>' +
      '<p class="lede">Cambie solo lo que esté mal. Lo demás se queda como lo dejó en campo.</p>';

    CORR_CAMPOS.forEach(function (c) {
      var val = v[c.n]; val = (val === null || val === undefined) ? '' : String(val);
      h += '<div class="f"><label class="lab" for="c_' + c.n + '">' + esc(c.l) +
           (c.unidad ? ' (' + c.unidad + ')' : '') + '</label><div class="ctl">';
      if (c.t === 'lista') {
        var ops = (E.listas && E.listas[c.lista]) || [];
        // Si lo guardado no está en la lista de hoy —hay visitas viejas con estado_colapso «no»,
        // que ya no existe— se añade como opción. Sin esto, el select arranca en «sin dato», eso
        // cuenta como un cambio y con solo abrir la pantalla y guardar cualquier otra cosa se
        // borraba el valor anterior. Un dato no se pierde por haber envejecido.
        var estaEnLista = ops.some(function (o) { return o.v === val; });
        h += '<select class="inp" id="c_' + c.n + '"><option value="">— sin dato —</option>' +
          (val && !estaEnLista
            ? '<option value="' + esc(val) + '" selected>' + esc(val) + ' (como está hoy)</option>'
            : '') +
          ops.map(function (o) {
            return '<option value="' + esc(o.v) + '"' + (o.v === val ? ' selected' : '') + '>' +
                   esc(o.l) + '</option>';
          }).join('') + '</select>';
      } else {
        h += '<input class="inp" id="c_' + c.n + '"' +
             (c.t === 'numero' ? ' inputmode="decimal"' : '') +
             ' value="' + esc(val) + '">';
      }
      h += '</div></div>';
    });

    h += '<div class="f"><label class="lab" for="c_motivo">Por qué lo corrige <span class="req">*</span></label>' +
         '<div class="ctl"><textarea class="inp" id="c_motivo" rows="2" placeholder="Por ejemplo: me equivoqué al teclear la dirección."></textarea></div></div>' +
         '<p class="aviso" id="corrMsg"></p>' +
         '<button class="big" data-a="corrigeenvia">Guardar la corrección</button>' +
         '<button class="big sec" data-a="volvercorrige">Volver sin cambiar nada</button></div>';
    document.getElementById('main').innerHTML = h;
  }

  function enviaCorreccion(boton) {
    var v = CORR.abierta; if (!v || CORR.guardando) return;
    var msg = document.getElementById('corrMsg');
    var motivo = (document.getElementById('c_motivo') || {}).value || '';
    if (motivo.trim().length < 5) {
      msg.textContent = 'Escriba por qué lo corrige.'; return;
    }
    // Solo viaja lo que de verdad cambió: así la bitácora no se llena de líneas donde el valor es
    // el mismo, y el servidor puede negarse si no llega nada.
    var cambios = {}, n = 0;
    CORR_CAMPOS.forEach(function (c) {
      var el = document.getElementById('c_' + c.n); if (!el) return;
      var antes = (v[c.n] === null || v[c.n] === undefined) ? '' : String(v[c.n]);
      var ahora = String(el.value || '').trim();
      if (ahora === antes) return;
      cambios[c.n] = ahora === '' ? '' : (c.t === 'numero' ? Number(ahora.replace(',', '.')) : ahora);
      n++;
    });
    if (!n) { msg.textContent = 'No cambió ningún dato.'; return; }

    CORR.guardando = true; boton.disabled = true; boton.textContent = 'Guardando…';
    msg.textContent = '';
    pideCorrige({ accion: 'corregir', id: v.id, motivo: motivo.trim(), cambios: cambios })
      .then(function () {
        CORR.guardando = false; CORR.filas = null;
        CORR.aviso = 'Corregido. Queda anotado con la fecha y el motivo.';
        pintaCorrige();
      })
      .catch(function (e) {
        CORR.guardando = false; boton.disabled = false; boton.textContent = 'Guardar la corrección';
        msg.textContent = e.message || 'No se pudo guardar.';
      });
  }

  // ================================================================ visita enviada: verla, corregirla, completarla
  //
  // Lo pidió el coordinador el 22-sep: «que los ingenieros puedan abrir alguna de esas ya cerradas,
  // ver cómo la llenó, y poder editar si se equivocó; y como va a haber campos extra, que se muestre
  // si falta algún dato aunque la visita ya esté cerrada, y pueda rellenarlo».
  //
  // SE ABRE EN EL MISMO FORMULARIO, paso a paso, y no en una ficha aparte: así se ve como se llenó,
  // con las mismas preguntas, y lo que el formulario de HOY pide y la visita no trae se señala en su
  // sitio. Cambia de dónde salen los datos (editar-visita) y a dónde van: de vuelta a editar-visita,
  // nunca al almacén del teléfono.
  //
  // AISLADA DEL TRABAJO EN CURSO. Mientras hay una visita enviada abierta, `visita` es null: el
  // guardado local, el borrador en línea y la cola de envío miran esa variable y no hacen nada. Al
  // entrar se aparta lo que había (D, paso, visita) y al salir se devuelve tal cual.
  //
  // QUIÉN DECIDE. Si se puede corregir lo dice el servidor (visita_editable) y aquí solo se pinta.
  // Los campos que no se corrigen —la ficha, la fecha, la firma, el perfil— también se cierran
  // aquí, pero la puerta de verdad está allá: esta pantalla es para dibujar, no para decidir.
  var API_EDITAR = 'https://ymbzpuxyvquvawfdntly.supabase.co/functions/v1/editar-visita';
  // Las fotografías y los documentos suben directos al almacén, con la URL firmada que da
  // editar-visita (foto_url / doc_url): así el archivo no pasa por la función.
  var API_SUBIDA = 'https://ymbzpuxyvquvawfdntly.supabase.co/storage/v1/object/upload/sign/';
  // Lo que no se corrige nunca: la ficha y el predio dicen QUÉ se evaluó, la fecha y la firma son
  // del acto de firmar, y el perfil (evaluador_*) es de la persona. La misma lista que el servidor.
  var BLOQUEADOS_REV = ['unit_Code', 'unidad_npn', 'unidad_label', 'alcance', 'fecha_hora_inspeccion',
                        'evaluador_firma', 'entidad', 'entidad_otra'];
  var ESQ_CAMPOS = null, ADJUNTOS_ESQ = null;

  function bloqueadoRev(n) {
    return BLOQUEADOS_REV.indexOf(n) > -1 || String(n).indexOf('evaluador_') === 0;
  }
  function esAdjuntoRev(f) {
    return !!f && (f.tipo === 'image' || f.tipo === 'archivo' ||
                   f.ui === 'camara' || f.ui === 'firma' || f.ui === 'documentos');
  }
  function soloLecturaRev(f) { return !REV.editando || bloqueadoRev(f.name); }
  // Todos los controles de un trozo de HTML, desactivados. Los enlaces (Street View, un documento)
  // se quedan: mirar no cambia nada.
  function desactiva(h) {
    return String(h).replace(/<(button|input|select|textarea)\b/g, '<$1 disabled');
  }
  function copia(o) { return JSON.parse(JSON.stringify(o === undefined ? null : o)); }
  function vacio(v) {
    return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
  }
  function igual(a, b) { return (vacio(a) && vacio(b)) || JSON.stringify(a) === JSON.stringify(b); }
  function sinExtension(r) { return String(r || '').replace(/\.[A-Za-z0-9]+$/, ''); }

  // Los campos del formulario (con sus subcampos), sin el perfil: idxCampo también guarda los datos
  // del evaluador, y esos no son de la visita.
  function campoEsq(n) {
    if (!ESQ_CAMPOS) {
      ESQ_CAMPOS = {}; ADJUNTOS_ESQ = [];
      E.pasos.forEach(function (p) {
        p.campos.forEach(function (f) {
          [f].concat(f.subs || []).forEach(function (g) {
            ESQ_CAMPOS[g.name] = g;
            if (esAdjuntoRev(g)) ADJUNTOS_ESQ.push(g.name);
          });
        });
      });
    }
    return Object.prototype.hasOwnProperty.call(ESQ_CAMPOS, n) ? ESQ_CAMPOS[n] : null;
  }
  function nombresAdjunto() { campoEsq(''); return ADJUNTOS_ESQ; }

  // ---------------------------------------------------------------- la llave del editor
  // editar-visita ya no acepta la cédula: sale impresa en todos los informes, y con un PDF en la mano
  // se abrían y se reescribían las visitas de ese ingeniero. Pide una llave larga, que este teléfono
  // saca UNA vez de campo-sesion (llave_editor) con la sesión que ya tiene, y guarda aquí. El
  // ingeniero no teclea nada. Si otro teléfono la pidió antes, campo-sesion responde «ya_emitida» y se
  // le dice que avise al coordinador, que la revoca para que se pueda pedir otra.
  //
  // No se pide dentro del navegador de WhatsApp o de otra aplicación, ni si este navegador no guarda
  // nada: la llave se perdería al cerrarlo y el editor quedaría bloqueado para todos sus teléfonos.
  var LS_LLAVE = 'psismo.llave_editor';
  var sinLlaveEnServidor = false;     // campo-sesion viejo, sin llave_editor: se usa el token de siempre
  function llaveEditor() {
    try { return localStorage.getItem(LS_LLAVE) || ''; } catch (e) { return ''; }
  }
  function guardaLlave(k) {
    try { if (k) localStorage.setItem(LS_LLAVE, k); else localStorage.removeItem(LS_LLAVE); } catch (e) {}
  }
  function puedeGuardarLlave() {
    if (esNavegadorDeOtraApp()) return false;
    try { localStorage.setItem('psismo.prueba_llave', '1'); var ok = localStorage.getItem('psismo.prueba_llave') === '1';
          localStorage.removeItem('psismo.prueba_llave'); return ok; } catch (e) { return false; }
  }
  function errorEditor(msg, status, datos) {
    var e = new Error(msg); e.status = status; e.datos = datos || {};
    return e;
  }
  var SIN_ALMACEN = 'Para ver o corregir sus visitas enviadas, abra la aplicación en el navegador del teléfono' +
    ' (Chrome o Safari) o desde el icono de la pantalla de inicio: aquí, dentro de otra aplicación, no se puede' +
    ' guardar la llave del editor.';
  // La llave, pedida si hace falta. Resuelve '' si no la hay ni se puede pedir aquí (se sigue con el
  // token de siempre, y si el servidor no lo acepta se dice por qué); rechaza si campo-sesion se niega.
  function pideLlave() {
    var k = llaveEditor();
    if (k || sinLlaveEnServidor || !puedeGuardarLlave()) return Promise.resolve(k);
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'llave_editor' })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok && j.llave) { guardaLlave(j.llave); anota('diagnostico', { detalle: { llave_editor: 'emitida' } }); return j.llave; }
        // «Acción desconocida» (un campo-sesion de antes de la llave) o una respuesta sin llave: se
        // sigue con el token de siempre, y si editar-visita no lo acepta lo dirá él.
        if (r.ok || r.status === 400) { sinLlaveEnServidor = true; return ''; }
        anota('diagnostico', { detalle: { llave_editor: j.motivo || String(r.status) } });
        throw errorEditor(j.error || 'No se pudo preparar el editor de visitas enviadas.', r.status, j);
      });
    }, function () {
      throw errorEditor('No se pudo hablar con el servidor: revise la señal e inténtelo otra vez.', 0);
    });
  }

  // ---------------------------------------------------------------- abrir
  function pideEditar(cuerpo, reintento) {
    return pideLlave().then(function (llave) {
      return fetch(API_EDITAR, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-token-evaluador': llave || token() },
        body: JSON.stringify(cuerpo)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) {
            // La llave que había ya no vale (el coordinador la revocó) o el servidor ya no acepta el
            // token de siempre: se pide una y se repite, una sola vez.
            if (r.status === 401 && j.motivo === 'llave_requerida' && !puedeGuardarLlave()) {
              throw errorEditor(SIN_ALMACEN, 401, { motivo: 'sin_almacen' });
            }
            if (r.status === 401 && !reintento && (j.motivo === 'llave_revocada' || j.motivo === 'llave_requerida')) {
              if (j.motivo === 'llave_revocada') guardaLlave('');
              sinLlaveEnServidor = false;
              return pideEditar(cuerpo, true);
            }
            throw errorEditor(j.error || ('El servidor no aceptó el cambio (' + r.status + ').'), r.status, j);
          }
          return j;
        });
      }, function () {
        throw errorEditor('No se pudo hablar con el servidor: revise la señal e inténtelo otra vez.', 0);
      });
    });
  }

  // op.volver: de dónde se viene y adónde se vuelve al salir ('corrige', la lista de enviadas, o
  // 'bandeja', una enviada que sigue en el teléfono). op.local: esa visita del teléfono, que se ve si
  // la del servidor no se puede abrir. op.alAbrir: 'completar' (entra corrigiendo, en el primer dato
  // que falta; la pregunta de editar ya se hizo en la lista).
  function abreEnviada(id, op) {
    op = op || {};
    var desde = op.volver || 'corrige';
    if (!id || CORR.abriendo) return Promise.resolve();
    if (navigator.onLine === false) {
      if (op.local) { entraRevLocal(op.local, SIN_SENAL_LOCAL); return Promise.resolve(); }
      CORR.aviso = 'Para abrir una visita enviada hace falta conexión: está en el servidor, no en el teléfono.';
      pintaCorrige();
      return Promise.resolve();
    }
    CORR.abriendo = true;
    if (desde === 'corrige') { CORR.aviso = 'Abriendo la visita…'; pintaCorrige(); }
    else avisoTrabajo('Abriendo la visita…');
    return pideEditar({ accion: 'abrir', visita: id }).then(function (j) {
      CORR.abriendo = false; quitaAvisoTrabajo();
      if (desde === 'corrige') CORR.aviso = '';
      if (vista !== desde) return;          // se fue a otra pantalla mientras cargaba
      entraRev(j);
      REV.volver = desde;
      if (op.local) REV.idLocal = op.local.id;
      pintaPaso();
      if (op.alAbrir === 'completar') empiezaCompletar();
    }, function (e) {
      CORR.abriendo = false; quitaAvisoTrabajo();
      if (op.local && vista === desde) {
        return entraRevLocal(op.local, 'No se pudo abrir la del servidor (' + (e.message || 'sin respuesta') +
          '): esta es la copia que quedó en el teléfono al enviarla.');
      }
      CORR.aviso = e.message || 'No se pudo abrir la visita.';
      if (vista === 'corrige') pintaCorrige();
    });
  }

  // ---------------------------------------------------------------- una enviada que sigue en el teléfono
  // Nota del 23-sep: «cuando se abra, que puedan ver todo lo que llenaron sin editar». Se abre en el
  // mismo editor de las enviadas, de solo lectura. Con señal manda la del servidor, que es la que vale
  // (trae las correcciones que se le hayan hecho); sin señal, o si el servidor no responde, la copia
  // que quedó en el teléfono al enviarla, dicho así.
  var SIN_SENAL_LOCAL = 'Sin señal: esta es la copia que quedó en el teléfono al enviarla. Las correcciones' +
    ' que se le hayan hecho después no se ven aquí.';
  function abreEnviadaLocal(v) {
    if (navigator.onLine === false || !token()) return Promise.resolve(entraRevLocal(v, SIN_SENAL_LOCAL));
    avisoTrabajo('Abriendo la visita…');
    return idDelServidor(v).then(function (id) {
      quitaAvisoTrabajo();
      if (vista !== 'bandeja') return;
      if (id === SIN_ID_TELEFONO) return entraRevLocal(v, COPIA_SIN_ID);
      if (!id) return entraRevLocal(v, 'No aparece entre sus visitas del servidor: esta es la copia que quedó en' +
                                       ' el teléfono al enviarla.');
      return abreEnviada(id, { volver: 'bandeja', local: v });
    }, function (e) {
      quitaAvisoTrabajo();
      if (vista !== 'bandeja') return;
      entraRevLocal(v, 'No se pudo consultar el servidor (' + (e && e.message || 'sin respuesta') +
                       '): esta es la copia que quedó en el teléfono al enviarla.');
    });
  }
  // El id de la visita en el servidor. Desde este lote lo guarda el propio envío (servidor_id); las
  // enviadas antes se buscan por su id del teléfono en «mias» (que desde editar-visita v4 lo trae).
  //
  // Con el editar-visita de antes (el que está desplegado el 23-sep: su «mias» no trae id_dispositivo
  // ni respuestas, y su «abrir» no trae versión) no hay manera de saber cuál de sus visitas del
  // servidor es esta, y la búsqueda daba «no aparece»: falso, la visita está allí. Entonces se dice

  var SIN_ID_TELEFONO = '-';

  // La copia del teléfono puesta en el editor como si viniera del servidor: sus fotografías y su firma

      } else if (x[0] && typeof x[0] === 'object' && typeof x[0].datos === 'string') {
