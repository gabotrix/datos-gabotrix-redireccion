             '<p class="leyenda">Lo eligio usted desde la busqueda. Si se equivoco, quitelo: ' +
             'desaparece de su lista y vuelve a quedar libre para otro. No se puede quitar si ya ' +
             'envio una visita.</p>'
           : '') + '</div>';

    document.getElementById('main').innerHTML = h;
    pintaMapaFicha(a);
    avisaBorrador(a);
    pintaHistorial(a.npn);
    pintaContactos(a);
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- viviendas sin ficha propia
  // Un edificio de apartamentos que nunca se constituyó en propiedad horizontal es UNA ficha en el catastro
  // (hay 506 así). Con una sola ficha la primera visita cerraba el predio y los demás apartamentos ya no se
  // podían levantar: le pasó a Faber Rozo en la K 23 75 145, con 15. Aquí el ingeniero las declara; cada
  // una recibe su ficha en el servidor (campo-sesion, declarar_unidades) y desde ahí es una ficha más: se
  // elige en la lista, la ve otro ingeniero y el predio se cierra con la última.
  var DEC = { guardando: false };

  function bloqueDividir(a, U) {
    if (!a || a.estado === 'hecha') return '';
    if (a.declaradas) {
      return '<button class="big sec" type="button" data-a="declarar">Agregar o quitar viviendas</button>';
    }
    if (U.length > 1) return '';            // el catastro ya lo parte en fichas: se elige la ficha en la lista
    return '<div class="eyebrow" style="margin-top:16px">¿Son varias viviendas?</div>' +
      '<p class="aviso">El catastro tiene esta edificación como <b>una sola ficha</b>. Si en realidad son' +
      ' varios apartamentos, locales u oficinas —un edificio que nunca se registró como propiedad' +
      ' horizontal—, <b>divídala antes de empezar</b>: cada vivienda llevará su propia visita. Si levanta' +
      ' una sola visita, esa visita cierra el predio.</p>' +
      '<button class="big sec" type="button" data-a="declarar">Dividir en viviendas</button>';
  }

  // ---------------------------------------------------------------- unidades sin daños, de una vez
  // En un edificio se marcan en una lista las fichas que el sismo no tocó y se registran juntas: un
  // solo recorrido por el formulario corto (quién atendió, foto, firma) y, al finalizar, una visita por
  // cada ficha, que es como el servidor cuenta las levantadas y cierra el edificio con la última.
  // Las ya levantadas —por usted o por otro— salen a la vista pero sin poder marcarse.
  function pintaSinDanos(a) {
    if (!a) return pintaPredios();
    vista = 'sindanos'; chrome(false);
    var U = a.unidades || [];
    var libres = U.filter(function (u) { return !u.y; }).length;
    var h = '<div class="pantalla">' + barraRed() +
      '<div class="eyebrow">Registro sin daños o ya reparado</div>' +
      '<h1>' + esc(sinUnidad(a.direccion) || ('Predio ' + String(a.npn).slice(-8))) + '</h1>' +
      '<p class="lede">Marque las unidades que <b>no se afectaron</b> o que <b>ya quedaron reparadas</b>. Se registran' +
      ' juntas con quién atendió, una foto y su firma, sin evaluación de daños ni presupuesto; cada una queda como su' +
      ' propia visita. Todas las que marque quedan con la misma respuesta: si unas se repararon y otras no se' +
      ' afectaron, regístrelas en dos tandas. Las que tengan algún daño sin reparar, levántelas con «Evaluar este predio».</p>' +
      '<div class="seccion"><h2>Unidades</h2><span class="cuenta">' + libres + ' por levantar</span></div>' +
      (libres > 1 ? '<div class="sd-todas"><button type="button" class="big sec" data-a="sdtodas" data-v="1">Marcar todas</button>' +
        '<button type="button" class="big sec" data-a="sdtodas" data-v="0">Quitar todas</button></div>' : '') +
      '<div class="dec-lista">' + U.map(function (u, i) {
        var hecha = !!u.y;
        return '<label class="dec-fila sd-fila' + (hecha ? ' hecha' : '') + '">' +
          '<input type="checkbox" class="sd-chk" value="' + i + '"' + (hecha ? ' disabled' : '') + '>' +
          '<span><b>' + esc(etiquetaUnidad(u)) + '</b>' +
          (hecha ? '<i>' + (u.m ? 'Ya la levantó usted' : 'Ya levantada') + '</i>' : '') + '</span></label>';
      }).join('') + '</div>' +
      (a.unidades_mas ? '<p class="leyenda">La lista trae ' + U.length + ' de ' + (U.length + a.unidades_mas) +
        ' fichas. Las que no salen se levantan una por una desde «Evaluar este predio».</p>' : '') +
      '<button class="big" type="button" data-a="sdsigue" id="sdSigue" disabled>Marque al menos una</button>' +
      '<button class="big sec" type="button" data-a="decvolver">Volver a la ficha</button></div>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0, 0);
  }
  function sinDanosMarcadas() {
    return Array.prototype.slice.call(document.querySelectorAll('.sd-chk:checked'))
      .map(function (c) { return (predioAbierto.unidades || [])[+c.value]; })
      .filter(function (u) { return u && !u.y; });
  }
  function pintaCuentaSinDanos() {
    var b = document.getElementById('sdSigue'); if (!b) return;
    var n = sinDanosMarcadas().length;
    b.disabled = !n;
    b.textContent = n ? 'Registrar ' + (n === 1 ? '1 unidad' : n + ' unidades') + ' sin daños' : 'Marque al menos una';
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('sd-chk')) pintaCuentaSinDanos();
  });

  function pintaDeclarar(a) {
    if (!a) return pintaPredios();
    vista = 'declarar'; chrome(false);
    var U = (a.unidades || []).filter(function (u) { return u && u.dc; });
    var h = '<div class="pantalla">' + barraRed() +
      '<div class="eyebrow">Viviendas sin ficha propia</div>' +
      '<h1>' + esc(sinUnidad(a.direccion) || ('Predio ' + String(a.npn).slice(-8))) + '</h1>' +
      '<p class="lede">El catastro tiene esta edificación como una sola ficha. Anote las viviendas, locales' +
      ' u oficinas que de verdad tiene: cada una queda con su propia ficha y se levanta en su propia visita.' +
      ' Los demás ingenieros también las verán.</p>';
    if (U.length) {
      h += '<div class="seccion"><h2>Ya declaradas</h2><span class="cuenta">' + U.length + '</span></div>' +
        '<div class="dec-lista">' + U.map(function (u) {
          return '<div class="dec-fila"><span><b>' + esc(u.et || u.d) + '</b>' +
            (u.p ? '<i>Piso ' + esc(String(u.p)) + '</i>' : '') + '</span>' +
            // la que ya tiene visita no se puede quitar: la visita se quedaría sin su vivienda
            (u.y ? '<span class="chip e">Evaluada</span>'
                 : '<button type="button" class="big sec" data-a="quitaunidad" data-n="' + esc(u.n) + '"' +
                   ' aria-label="Quitar ' + esc(u.et || '') + '">Quitar</button>') +
            '</div>';
        }).join('') + '</div>';
    }
    h += '<div class="seccion"><h2>' + (U.length ? 'Agregar más' : 'Armar la lista') + '</h2></div>' +
      '<div class="dec-arma">' +
        '<label>Pisos con viviendas<input class="inp" id="decPisos" type="number" inputmode="numeric" min="1" max="60"></label>' +
        '<label>Viviendas por piso<input class="inp" id="decPorPiso" type="number" inputmode="numeric" min="1" max="40"></label>' +
      '</div>' +
      '<button class="big sec" type="button" data-a="decarma">Armar la lista (Apto 101, 102…)</button>' +
      '<label class="dec-lbl" for="decLista" style="margin-top:14px">Una vivienda por renglón. Corrija lo que no' +
      ' cuadre, o escríbala a mano: Local 1, Casa 2, Apto 301…</label>' +
      '<textarea class="inp" id="decLista" rows="8" placeholder="Apto 101&#10;Apto 102&#10;Apto 201"></textarea>' +
      '<button class="big" type="button" data-a="decguarda">Guardar las viviendas</button>' +
      '<button class="big sec" type="button" data-a="decvolver">Volver a la ficha</button></div>';
    document.getElementById('main').innerHTML = h;
    window.scrollTo(0, 0);
  }

  // «3 pisos, 5 por piso» -> Apto 101…105, 201…205, 301…305. Se añade a lo que ya haya escrito.
  function armaDeclaradas() {
    var np = parseInt((document.getElementById('decPisos') || {}).value, 10);
    var nv = parseInt((document.getElementById('decPorPiso') || {}).value, 10);
    var t = document.getElementById('decLista');
    if (!t) return;
    if (!(np > 0 && np <= 60 && nv > 0 && nv <= 40)) {
      alert('Escriba cuántos pisos tienen viviendas y cuántas hay por piso.');
      return;
    }
    var L = [];
    for (var p = 1; p <= np; p++) for (var k = 1; k <= nv; k++) L.push('Apto ' + (p * 100 + k));
    t.value = (t.value.replace(/\s+$/, '') ? t.value.replace(/\s+$/, '') + '\n' : '') + L.join('\n');
  }

  // Las líneas escritas, sin repetidas. El piso sale del número («Apto 301» es el 3) o de «Piso N».
  function lineasDeclaradas() {
    var t = (document.getElementById('decLista') || {}).value || '';
    var vistas = {}, out = [];
    t.split(/\n+/).forEach(function (l) {
      var et = l.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!et || vistas[et.toLowerCase()]) return;
      vistas[et.toLowerCase()] = 1;
      var piso = null, m = /piso\s*(\d{1,2})\b/i.exec(et), n = /\b(\d{3,4})\b/.exec(et);
      if (m) piso = +m[1];
      else if (n) piso = Math.floor(+n[1] / 100);
      if (piso != null && !(piso >= 0 && piso <= 98)) piso = null;
      out.push({ etiqueta: et, piso: piso });
    });
    return out;
  }

  function pideCampo(cuerpo) {
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'No se pudo');
        return j;
      });
    });
  }
  // La sesión otra vez, para que las viviendas lleguen con sus fichas y sus marcas; queda guardada en el
  // teléfono, así que de ahí en adelante se levantan sin señal como cualquier ficha.
  function recargaSesion(id) {
    return pideCampo({ accion: 'sesion' }).then(function (s) {
      guardaLocal(LS_SESION, s);
      SESION = s;
      var a = (s.asignaciones || []).filter(function (x) { return x.id === id; })[0] || null;
      if (a) predioAbierto = a;
      return a;
    });
  }

  function guardaDeclaradas() {
    var a = predioAbierto;
    if (!a || DEC.guardando) return;
    var L = lineasDeclaradas();
    if (!L.length) return alert('Escriba al menos una vivienda, una por renglón.');
    if (navigator.onLine === false) return alert('Para guardar las viviendas hace falta señal.');
    if (L.length === 1 && !a.declaradas &&
        !window.confirm('Solo anotó una vivienda. Con una sola, la edificación se sigue levantando como un solo' +
                        ' predio. ¿Guardarla así?')) return;
    DEC.guardando = true;
    avisoTrabajo('Guardando las viviendas…');
    pideCampo({ accion: 'declarar_unidades', id22: String(a.npn).slice(0, 22), unidades: L }).then(function (j) {
      anota('declara_unidades', { detalle: { npn: a.npn, nuevas: j.nuevas, total: j.total } });
      return recargaSesion(a.id);
    }).then(function (b) {
      quitaAvisoTrabajo(); DEC.guardando = false;
      return b ? fichaPredio(b.id) : pintaPredios();
    }).catch(function (e) {
      quitaAvisoTrabajo(); DEC.guardando = false;
      alert((e && e.message) || 'No se pudieron guardar las viviendas. Inténtelo otra vez con señal.');
    });
  }

  function quitaDeclarada(npn) {
    var a = predioAbierto;
    if (!a || !npn || DEC.guardando) return;
    var u = (a.unidades || []).filter(function (x) { return x.n === npn; })[0];
    if (navigator.onLine === false) return alert('Para quitar una vivienda hace falta señal.');
    if (!window.confirm('¿Quitar «' + ((u && u.et) || 'esta vivienda') + '» de la lista?')) return;
    DEC.guardando = true;
    pideCampo({ accion: 'quitar_unidad', npn: npn }).then(function () {
      anota('quita_unidad', { detalle: { npn: npn } });
      return recargaSesion(a.id);
    }).then(function (b) {
      DEC.guardando = false;
      return b ? pintaDeclarar(b) : pintaPredios();
    }).catch(function (e) {
      DEC.guardando = false;
      alert((e && e.message) || 'No se pudo quitar la vivienda.');
    });
  }

  // El predio quedaba marcado «Empezada» y el botón seguía diciendo «Evaluar este
  // predio»: quien cerraba la aplicación a mitad de una visita y volvía a entrar
  // por la lista de predios arrancaba una segunda, sin enterarse, y se enviaban
  // dos visitas del mismo predio. Ahora se ofrece seguir con la que ya existe.
  function avisaBorrador(a) {
    ALMACEN.visitas.todas().then(function (todas) {
      var caja = document.getElementById('borradorPredio');
      if (!caja || predioAbierto !== a) return;
      var abierta = todas.filter(function (v) {
        return v.asignacion === a.id && v.estado !== 'enviada';
      }).sort(function (x, y) { return y.tocada - x.tocada; })[0];
      if (!abierta) return;
      // fechaCorta ya termina en punto ("04:56 p. m."): si no se quita, la frase
      // queda con dos.
      var cuando = String(fechaCorta(abierta.tocada) || '').replace(/\.$/, '');
      caja.innerHTML = '<div class="nota a">Ya hay una visita de este predio empezada en el' +
        ' teléfono' + (cuando ? ', del ' + esc(cuando) : '') + '. Siga con esa para no' +
        ' levantarla dos veces.</div>' +
        '<button class="big" data-a="abrir" data-id="' + esc(abierta.id) + '">' +
        'Seguir con la visita empezada</button>';
      // con un borrador abierto, empezar otra deja de ser lo principal
      var otra = caja.parentNode.querySelector('[data-a="evaluar"]');
      if (otra) { otra.className = 'big sec'; otra.textContent = 'Empezar otra visita aparte'; }
    });
  }

  // ---------------------------------------------------------------- prellenado
  // La matrícula inmobiliaria del catastro tiene la forma «100-123456»: el círculo registral y el
  // número. De las 66.468 fichas que se visitan y tienen matrícula en propietarios, 4.932 traen
  // «\N-\N» o «100-0», restos de la importación que no son de ningún inmueble: enseñarlas como «la
  // del catastro» pondría al ingeniero a verificar contra basura. Esas cuentan como que no hay.
  function matriculaValida(m) {
    var s = String(m == null ? '' : m).trim();
    return /^\d{3}-[1-9]\d{0,8}$/.test(s) ? s : '';
  }

  // La dirección de una ficha: la de una vivienda declarada es la del edificio con su nombre
  // («K 23 75 145 Apto 301»); la de una ficha del catastro, la suya si la trae.
  function direccionFicha(a, u) {
    if (u && u.dc) return (sinUnidad(a.direccion) + ' ' + (u.et || '')).trim();
    if (u && u.d) return u.d;
    return a.direccion || '';
  }

  // `lote`: la visita es un registro sin daños (ver expandeSinDanos). Es la lista de fichas que cubre
  // —una sola, o [null] para la casa entera— y al finalizar se hace una visita por cada una.
  function evaluaPredio(a, u, lote) {
    var comunes = u === FICHA_COMUNES;
    return nuevaVisita().then(function () {
      visita.asignacion = a.id;
      D.unit_Code = a.npn;
      // La ficha de la unidad viaja aparte del codigo del predio: el historial del edificio se sigue consultando
      // por el predio, y la inspeccion queda registrada contra la unidad que de verdad se evaluo.
      //
      // `alcance` le dice al servidor qué cubre la visita: 'zonas_comunes' nunca cierra el predio ni
      // cuenta como vivienda; 'ficha' y 'todo' siguen la regla de siempre. Sin ficha, sus notas y su
      // cuenta de demolición son las del edificio, como en «todo el predio».
      if (comunes) {
        D.unidad_npn = ''; D.unidad_label = 'Zonas comunes del edificio'; D.alcance = 'zonas_comunes';
      } else if (u && u.n) {
        D.unidad_npn = u.n; D.unidad_label = etiquetaUnidad(u); D.alcance = 'ficha';
      } else {
        D.alcance = 'todo';
      }
      D.departamento = a.departamento || '17';
      D.municipio = a.municipio || '17001';
      if (a.direccion) D.direccion = a.direccion;
      if (!comunes && u && (u.dc || u.d)) D.direccion = direccionFicha(a, u);
      if (a.barrio) D.barrio_vereda = a.barrio;
      if (a.nombre_edificacion) D.nombre_edificacion = a.nombre_edificacion;
      if (a.zona) D.zona = a.zona === 'R' ? 'rural' : 'urbano';
      if (a.manzana) D.manzana = a.manzana;
      if (typeof a.lat === 'number' && typeof a.lon === 'number') {
        D.predio_lat = a.lat; D.predio_lon = a.lon;
      }
      if (typeof a.num_pisos === 'number') D.num_pisos = a.num_pisos;
      if (typeof a.num_sotanos === 'number') D.num_sotanos = a.num_sotanos;
      if (enLista('uso', a.uso)) D.uso = a.uso;
      if (enLista('ano_construccion', a.ano_construccion)) D.ano_construccion = a.ano_construccion;
      if (enLista('tipo_edificacion', a.tipo_edificacion)) D.tipo_edificacion = a.tipo_edificacion;
      // La evaluación anterior llega con quién la hizo y de qué tipo fue. Sin eso la clasificación
      // no se puede usar para decidir nada, y cuando la Alcaldía la anotó con una categoría que el
      // formulario no tiene («Habitable post-intervención»), la entidad y el tipo son lo único que
      // queda de ella: por eso bastan para marcar que la hubo.
      var previaEnt = String(a.eva_previa_entidad == null ? '' : a.eva_previa_entidad).trim();
      var previaTipo = String(a.eva_previa_tipo == null ? '' : a.eva_previa_tipo).trim();
      var previaClas = enLista('habitabilidad', a.eva_previa_clasif);
      if (previaClas || previaEnt || previaTipo) {
        D.eva_previa = 'si';
        if (previaClas) D.eva_previa_clasif = a.eva_previa_clasif;
        if (a.eva_previa_fecha) D.eva_previa_fecha = a.eva_previa_fecha;
        if (previaEnt) D.eva_previa_entidad = previaEnt;
        if (previaTipo) D.eva_previa_tipo = previaTipo;
      }
      // La matrícula viaja en la sesión, así que está sin señal: la de la ficha elegida (u.mt) o, si
      // la visita no es de una ficha —todo el predio, las zonas comunes o un predio de una sola—, la
      // de la asignación. Una ficha sin matrícula se queda sin ella: la del predio sería la de otro
      // inmueble. El paso 3 la enseña y pregunta si coincide con la de los papeles.
      var mt = matriculaValida(u && u.n ? u.mt : a.matricula);
      if (mt) D.matricula_catastro = mt;
      D.origen_prellenado = 'asignacion';
      if (lote) {
        D.sin_danos = 'si';
        // La lista viaja en las respuestas (y no solo en la visita) para que sobreviva al respaldo
        // del servidor si el teléfono pierde la visita a medias. Se quita al finalizar.
        D.sin_danos_lote = lote.map(function (x) {
          return x ? { n: x.n, et: etiquetaUnidad(x), d: direccionFicha(a, x), mt: matriculaValida(x.mt) || '' } : null;
        });
        D.sin_danos_unidades = lote[0] ? (lote.length === 1 ? 'Unidad: ' : lote.length + ' unidades: ') +
          lote.map(function (x) { return etiquetaUnidad(x); }).join(' · ') : 'Toda la edificación';
      }
      recalcula();
      // Lo que dejó el catastro en los datos del edificio, para saber después qué cambió el ingeniero:
      // traer los de otra visita pisa esto, nunca lo que él escribió. Vive en la visita y no en D, así
      // que no viaja al servidor.
      visita.precarga = {};
      camposEdificio().forEach(function (n) { if (D[n] !== undefined) visita.precarga[n] = copiaValor(D[n]); });
      return guardaVisita(true);
    }).then(function () {
      // Un tipo de evento nuevo obligaría a redesplegar campo-sesion: el registro sin daños va como
      // inicia_visita con su marca en el detalle.
      anota('inicia_visita', { detalle: { npn: a.npn, ficha: (u && u.n) || null, alcance: D.alcance,
                                          sin_danos: lote ? lote.length : undefined } });
      if (u && u.n) anota('elige_ficha', { detalle: { npn: a.npn, ficha: u.n } });
      // Unas zonas comunes sobre un edificio cerrado no lo reabren: ni aquí ni en el servidor.
      if (!(comunes && a.estado === 'hecha')) marcaEstado(a, 'en_curso');
      // si otra visita ya dijo cómo es el edificio, se ofrece; al registro sin daños no le hace falta
      if (!lote) pideDatosEdificio(a, visita);
      iPaso = 1;                       // el código ya viene de la asignación
      pasoDesde = Date.now();
      vista = 'paso'; pintaPaso();
    });
  }

  // ---------------------------------------------------------------- los datos del edificio, de otra visita
  // El 22-sep, 75 de ~120 visitas eran una ficha de un edificio y cada una repetía el principio
  // entero: localización, identificación y sistema estructural, que son del edificio y no de la
  // vivienda. Al empezar una visita, si hay señal, se pide a campo-sesion lo que dijo la última
  // visita de ese predio —de quien sea— y se ofrece traerlo. El ingeniero decide, y lo traído queda
  // marcado para que lo confirme en sitio: se propone, no se copia a ciegas.
  //
  // Solo se trae esta lista (la misma del servidor, CAMPOS_EDIFICIO en campo-sesion) con el «¿cuál?»
  // de sus «Otro». Nunca la dirección, la ficha ni la ubicación: esas son de cada visita, aunque el
  // servidor mandara algo más.
  var CAMPOS_EDIFICIO = ['departamento', 'municipio', 'barrio_vereda', 'zona', 'manzana', 'construccion_existe',
    'estado_colapso', 'inclinacion', 'nombre_edificacion', 'tipo_edificacion', 'uso', 'ano_construccion',
    'num_pisos', 'num_sotanos', 'dim_frente', 'dim_fondo', 'mat_estructural', 'sist_estructural',
    'mat_entrepiso', 'sist_entrepiso', 'mat_sop_cubierta', 'sop_cubierta', 'tipo_cubierta', 'muros_divisorios'];
  // Los pasos donde está lo que se trae: la oferta se enseña en ellos mientras no se decida. Si la
  // respuesta tarda y el ingeniero ya pasó al paso 3, la sigue viendo allí.
  var PASOS_EDIFICIO = ['s1_evaluacion', 's2_localizacion', 's3_edificacion', 's4_tipologia'];

  // «Otro» de cada pregunta de la lista: los del esquema (uso_otro, muros_otro…) y los que pone el motor.
  function otrosDe(f) {
    return (f.subs || []).filter(function (s) { return s.tipo === 'text' && (s.cuando || []).some(esOtro); });
  }
  function camposEdificio() {
    var out = [];
    CAMPOS_EDIFICIO.forEach(function (n) {
      var f = idxCampo[n];
      if (!f) return;
      out.push(n);
      otrosDe(f).forEach(function (s) { out.push(s.name); });
    });
    return out;
  }
  function copiaValor(x) { return Array.isArray(x) ? x.slice() : x; }
  function mismoValor(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }

  // Lo que manda el servidor se trata como lo que es, la visita de otro: solo entra un valor que el
  // formulario habría aceptado —de su lista, un número dentro de su rango, un texto—, y nada más.
  function valorValido(f, x) {
    if (!f || x === undefined || x === null || x === '') return undefined;
    if (f.tipo === 'select_one') return typeof x === 'string' && enLista(f.lista, x) ? x : undefined;
    if (f.tipo === 'select_multiple') {
      if (!Array.isArray(x)) return undefined;
      var ok = x.filter(function (y) { return typeof y === 'string' && enLista(f.lista, y); });
      return ok.length ? ok : undefined;
    }
    if (f.tipo === 'integer' || f.tipo === 'decimal') {
      var n = typeof x === 'number' ? x : aNumero(x);
      if (n === '' || !isFinite(n) || (f.tipo === 'integer' && Math.floor(n) !== n)) return undefined;
      return f.valida && ev(f.valida, n) === false ? undefined : n;
    }
    if (f.tipo === 'text') return typeof x === 'string' && x.trim() ? x.slice(0, 500) : undefined;
    return undefined;
  }

  // {visita: {id, fecha, evaluador}, campos: {...}} -> la oferta, o null si no hay nada que ofrecer.
  function ofertaDe(j) {
    var v = j && j.visita;
    if (!v || typeof v !== 'object' || !v.id || !j.campos || typeof j.campos !== 'object') return null;
    var campos = {}, n = 0;
    camposEdificio().forEach(function (k) {
      var x = valorValido(idxCampo[k], j.campos[k]);
      if (x !== undefined) { campos[k] = x; n++; }
    });
    if (!n) return null;
    return { id: String(v.id).slice(0, 80), fecha: String(v.fecha || ''), campos: campos,
             evaluador: String(v.evaluador == null ? '' : v.evaluador).slice(0, 80), estado: 'pendiente' };
  }

  // Sin esperar: la visita ya está abierta. Sin señal, sin visita anterior o con un campo-sesion que
  // todavía no tiene la acción (contesta 400, «Acción desconocida»), no se ofrece nada y todo sigue.
  function pideDatosEdificio(a, v) {
    var id22 = String(a && a.npn || '').replace(/\D/g, '').slice(0, 22);
    if (id22.length !== 22 || !v || !token() || navigator.onLine === false) return Promise.resolve(null);
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'datos_edificio', id22: id22 })
    }).then(function (r) {
      return r.ok ? r.json().catch(function () { return null; }) : null;
    }).then(function (j) {
      var of = ofertaDe(j);
      // Llega cuando llega: si ya no es la visita abierta, o ya tiene su oferta, no se toca nada.
      if (!of || visita !== v || v.edificio || v.estado === 'enviada') return null;
      v.edificio = of;
      guardaVisita();
      // se enseña al momento si el paso es de los suyos, salvo que esté escribiendo: repintar le
      // quitaría el foco, y la tarjeta sale igual en el siguiente repintado
      var p = pasosVisibles()[iPaso], foco = document.activeElement;
      var escribe = !!(foco && /^(INPUT|TEXTAREA|SELECT)$/.test(String(foco.tagName || '')));
      if (vista === 'paso' && p && PASOS_EDIFICIO.indexOf(p.id) > -1 && !escribe) pintaPaso(true);
      return of;
    }).catch(function () { return null; });
  }

  function fechaDia(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d)) return '';
    var M = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre',
             'octubre', 'noviembre', 'diciembre'];
    return d.getDate() + ' de ' + M[d.getMonth()] +
           (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : '');
  }
  function tarjetaEdificio(p) {
    var of = visita && visita.edificio;
    if (!of || of.estado !== 'pendiente' || visita.estado === 'enviada') return '';
    if (!p || PASOS_EDIFICIO.indexOf(p.id) < 0) return '';
    var cuando = fechaDia(of.fecha);
    return '<div class="oferta"><p>Traer los datos del edificio de la visita ' +
           (cuando ? 'del ' + esc(cuando) : 'anterior') + (of.evaluador ? ' (' + esc(of.evaluador) + ')' : '') +
           ': localización, identificación y sistema estructural. Revíselos en sitio.</p>' +
           '<div class="bts"><button type="button" class="big" data-a="traeedificio">Traer</button>' +
           '<button type="button" class="big sec" data-a="noedificio">No, gracias</button></div></div>';
  }

  // Traer: lo del edificio gana a lo que puso el catastro al empezar (visita.precarga), pero no a lo
  // que el ingeniero ya cambió en esta visita, que es suyo. D.copiado_de dice de qué visita salió y
  // D.copiado_campos qué se trajo; un campo sale de esa lista en cuanto el ingeniero lo toca.
  function traeDatosEdificio() {
    var of = visita && visita.edificio;
    if (!of || of.estado !== 'pendiente') return;
    var pre = visita.precarga || {}, traidos = [];
    CAMPOS_EDIFICIO.forEach(function (n) {
      var f = idxCampo[n];
      if (!f || !(n in of.campos)) return;
      if (!pideValor(f) && !mismoValor(D[n], pre[n])) return;
      D[n] = copiaValor(of.campos[n]);
      traidos.push(n);
      otrosDe(f).forEach(function (s) {
        if (s.name in of.campos) { D[s.name] = of.campos[s.name]; traidos.push(s.name); }
      });
    });
    // los sistemas cuelgan del material: lo que no case con el material que quedó, se quita
    CAMPOS_EDIFICIO.forEach(function (n) { limpiaCascada(n); });
    of.estado = 'traido';
    if (traidos.length) { D.copiado_de = of.id; D.copiado_campos = traidos; }
    anota('copia_edificio', { detalle: { de: of.id, acepta: true, campos: traidos.length } });
    cambio(null);
  }
  function descartaDatosEdificio() {
    var of = visita && visita.edificio;
    if (!of || of.estado !== 'pendiente') return;
    of.estado = 'descartado';
    anota('copia_edificio', { detalle: { de: of.id, acepta: false } });
    guardaVisita();
    if (vista === 'paso') repinta(null, false);
  }

  // La marca de lo traído, bajo la etiqueta. Se va cuando el ingeniero cambia el dato: desde ese
  // momento ya no es de la otra visita.
  function marcaTraido(n) {
    var c = D.copiado_campos;
    return Array.isArray(c) && c.indexOf(n) > -1
      ? '<p class="traido">Traído de la visita anterior — confírmelo</p>' : '';
  }
  function sueltaTraido(n) {
    var c = D.copiado_campos;
    if (!n || !Array.isArray(c) || c.indexOf(n) < 0) return;
    D.copiado_campos = c.filter(function (x) { return x !== n; });
  }
  // ni lo que se vació al cambiar otra cosa: el «¿cuál?» de un «Otro» que se desmarcó, un sistema
  // que ya no casa con el material
  function podaTraidos() {
    var c = D.copiado_campos;
    if (!Array.isArray(c)) return;
    var q = c.filter(function (n) { return !pideValor({ name: n }); });
    if (q.length !== c.length) D.copiado_campos = q;
  }

  function marcaEstado(a, estado) {
    var antes = a.estado;
    a.estado = estado;
    guardaLocal(LS_SESION, SESION);
    if (navigator.onLine === false) return;
    fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'estado', id: a.id, estado: estado })
    }).then(function (r) {
      // 409: el predio ya estaba cerrado. Puede pasar con una sesión guardada de antes; se
      // devuelve el estado que manda, que es el del servidor, y no el que creía el teléfono.
      if (r.status === 409) { a.estado = 'hecha'; guardaLocal(LS_SESION, SESION); }
      else if (!r.ok) a.estado = antes;
    }).catch(function () {});
  }

  // ---------------------------------------------------------------- mapa
  // Leaflet se carga solo al abrir el mapa y solo si hay red: la app tiene que
  // poder arrancar sin una sola petición externa.
  function cargaLeaflet() {
    if (window.L) return Promise.resolve(true);
    return new Promise(function (ok) {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(css);
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      s.onload = function () { ok(true); };
      s.onerror = function () { ok(false); };
      document.head.appendChild(s);
      setTimeout(function () { ok(!!window.L); }, 8000);
    });
  }

  // ---------------------------------------------------------------- mapa de trabajo
  // El mapa de la sala de datos, metido en el teléfono: los polígonos del catastro, el relieve en 3D y los filtros,
  // no un punto sobre un mapa genérico. Lo que se pinta coloreado y lo único que se puede abrir es lo asignado a
  // este ingeniero: ni los predios de otro ni el estado de daño del resto de la ciudad salen de aquí.
  //
  // Las teselas están cifradas y la clave NO está en este archivo, que es público. La entrega campo-sesion contra
  // el token personal y vive solo en memoria mientras la aplicación esté abierta: al recargar se vuelve a pedir.
  var MAPA_DATA = 'https://manizalesconstruye.camacolcaldas.com/mapa/data/';
  var SALT_MAPA = '/KDCR7XNPhjKjDjmr/q2Mg==', ITER_MAPA = 600000;
  var COLOR_EST = { pendiente: '#0B3C5D', en_curso: '#C98A00', hecha: '#1F7A44', no_aplica: '#8A94A6' };
  var FILTROS_MAPA = [
    ['todos', 'Todos'], ['pendiente', 'Por visitar'], ['en_curso', 'Empezadas'], ['hecha', 'Hechas']
  ];

  var mlMapa = null, mlKey = null, mlBuild = '', mlPM = null, mlProto = false;
  var mlFiltro = 'todos', ml3D = false, mlSat = false, mlVigila = null, mlSel = null, mlFoco = 0;

  // El mapa sirve a dos cosas con el mismo motor: los predios asignados y los resultados de una
  // búsqueda en el catastro. Cambian la lista y el significado del color; las teselas cifradas, el
  // 3D, el satélite, el contorno del lote y «mi ubicación» son exactamente los mismos.
  var mlModo = 'mios';

  function mlAsig() {
    if (mlModo === 'busca') return (BUSCA && BUSCA.filas) ? BUSCA.filas : [];
    return (SESION && SESION.asignaciones) ? SESION.asignaciones : [];
  }

  // Buscando, el color no dice el avance de la visita —no hay visita todavía— sino si el predio
  // se puede tomar. Gris es de otro: el que no hay que pisar.
  function mlColorFila(a) {
    if (mlModo === 'busca') {
      // Gris solo lo que de verdad no se puede tomar; un edificio compartido sigue disponible.
      return a.mio ? COLOR_EST.hecha
           : (a.tomado && !(a.n_unidades > 1)) ? COLOR_EST.no_aplica
           : COLOR_EST.pendiente;
    }
    return COLOR_EST[a.estado] || COLOR_EST.pendiente;
  }
  function mlId22(a) { return String(a && a.npn || '').slice(0, 22); }

  function mlVisibles() {
    var A = mlAsig();
    if (mlModo === 'busca' || mlFiltro === 'todos') return A;
    return A.filter(function (a) { return (a.estado || 'pendiente') === mlFiltro; });
  }
  function mlPorId(id) {
    var A = mlAsig();
    for (var i = 0; i < A.length; i++) if (String(A[i].id) === String(id)) return A[i];
    return null;
  }

  // El catastro parte un mismo predio en varios polígonos y les cambia el final del número predial; los 22
  // primeros dígitos son los que identifican el terreno. Por eso todo se compara recortado a 22.
  function mlClave(campo) { return ['slice', ['to-string', ['get', campo]], 0, 22]; }

  function mlIds(lista) {
    var ids = [], visto = {};
    lista.forEach(function (a) {
      var k = mlId22(a);
      if (k.length === 22 && !visto[k]) { visto[k] = 1; ids.push(k); }
    });
    return ids;
  }

  function mlFiltroDe(campo) {
    return ['in', mlClave(campo), ['literal', mlIds(mlVisibles())]];
  }

  // Color por el estado de la asignación: azul lo que falta, ámbar lo empezado, verde lo hecho.
  function mlColorDe(campo) {
    var e = ['match', mlClave(campo)], visto = {}, n = 0;
    mlAsig().forEach(function (a) {
      var k = mlId22(a);
      if (k.length !== 22 || visto[k]) return;
      visto[k] = 1; n++;
      e.push(k, mlColorFila(a));
    });
    if (!n) return COLOR_EST.pendiente;
    e.push(COLOR_EST.pendiente);
    return e;
  }

  function mlAnillos(a) {
    var c = contornoDe(a);
    if (!c) return null;
    var out = [];
    for (var i = 0; i < c.length; i++) {
      var an = [];
      for (var j = 0; j < c[i].length; j++) an.push([c[i][j][1], c[i][j][0]]);   // el contorno viene [lat, lon]
      if (an.length < 3) continue;
      var p = an[0], u = an[an.length - 1];
      if (p[0] !== u[0] || p[1] !== u[1]) an.push([p[0], p[1]]);                 // GeoJSON pide el anillo cerrado
      out.push(an);
    }
    return out.length ? out : null;
  }

  function mlPuntos() {
    var f = [];
    mlVisibles().forEach(function (a) {
      if (typeof a.lat !== 'number' || typeof a.lon !== 'number') return;
      f.push({
        type: 'Feature',
        properties: {
          id: String(a.id), c: mlColorFila(a),
          t: a.direccion || ('Predio ' + String(a.npn || '').slice(-8))
        },
        geometry: { type: 'Point', coordinates: [a.lon, a.lat] }
      });
    });
    return { type: 'FeatureCollection', features: f };
  }

  function mlLotes() {
    var f = [];
    mlVisibles().forEach(function (a) {
      var an = mlAnillos(a);
      if (!an) return;
      f.push({
        type: 'Feature',
        properties: { id: String(a.id), c: mlColorFila(a) },
        geometry: { type: 'Polygon', coordinates: an }
      });
    });
    return { type: 'FeatureCollection', features: f };
  }

  // ---- afectación y zona --------------------------------------------------------------------------------------
  // Los colores de la afectación son los del mapa de la sala, para que un predio se lea igual en los dos. El
  // estado viene horneado en la tesela y lo que cambió desde entonces llega de campo-sesion (estado_vivo) y se
  // pinta encima, como hace la capa viva de la sala.
  var EST_AF = {
    DEM: ['Demolición', '#b8202f'], PEL: ['Peligro de colapso', '#e6492b'], NOH: ['No habitable', '#f9752f'],
    HPI: ['Habitable post-intervención', '#d98324'], RES: ['Uso restringido', '#f6c330'],
    HAB: ['Habitable', '#94dc4b'], SV: ['Solicitud sin visita', '#9c72de'], NA: ['Sin información', '#d9dee5']
  };
  var ORDEN_AF = ['DEM', 'PEL', 'NOH', 'HPI', 'RES', 'HAB', 'SV'];
  var NIVEL_AF = { R: 'Reconstrucción', A: 'Intervención alta', M: 'Intervención media', B: 'Intervención baja',
                   '0': 'Nivel cero', S: 'Pendiente de visita', N: 'Sin información' };
  var mlVivo = null, mlLeyAbierta = false, mlIrZona = false, mlAfPedido = null;
  // Lo que se ha visto de cada predio (búsqueda o mapa): con su comuna y su barrio se sabe, al tomarlo, si
  // es de la zona del ingeniero.
  var VISTOS = {};

  function mlColorAf(conVivo) {
    var e = ['match', conVivo ? ['coalesce', ['feature-state', 'est'], ['get', 'est']] : ['get', 'est']];
    ORDEN_AF.forEach(function (k) { e.push(k, EST_AF[k][1]); });
    e.push(EST_AF.NA[1]);
    return e;
  }

  function zonaSesion() {
    return (SESION && SESION.zona && Array.isArray(SESION.zona.gerentes)) ? SESION.zona : null;
  }
  function zonaMia() {
    var z = zonaSesion();
    if (!z || !z.mio) return null;
    for (var i = 0; i < z.gerentes.length; i++) if (z.gerentes[i].id === z.mio) return z.gerentes[i];
    return null;
  }
  // La misma regla que gerente_de_predio() en la base: el barrio gana a la comuna, y lo rural va aparte.
  function gerenteDe(comuna, barrio, zona) {
    var z = zonaSesion();
    if (!z) return null;
    var porComuna = null, rural = null;
    for (var i = 0; i < z.gerentes.length; i++) {
      var g = z.gerentes[i], A = g.areas || [];
      for (var j = 0; j < A.length; j++) {
        if (A[j].t === 'barrio' && A[j].c === comuna && A[j].b === barrio) return g;
        if (A[j].t === 'comuna' && A[j].c === comuna) porComuna = g;
        if (A[j].t === 'rural') rural = g;
      }
    }
    return porComuna || (String(zona || '').trim() === 'R' ? rural : null);
  }
  // La zona partida en lo que el mapa necesita: sus comunas, sus barrios sueltos, los barrios de sus comunas
  // que el acuerdo le dio a otro gerente (huecos dentro de la zona) y si lleva la zona rural.
  function zonaPartes() {
    var g = zonaMia(), z = zonaSesion();
    if (!g) return null;
    var p = { comunas: [], barrios: [], fuera: [], rural: false, urbana: false };
    (g.areas || []).forEach(function (a) {
      if (a.t === 'comuna') { p.comunas.push(a.c); p.urbana = true; }
      else if (a.t === 'barrio') { p.barrios.push(a.c + '|' + a.b); p.urbana = true; }
      else if (a.t === 'rural') p.rural = true;
    });
    z.gerentes.forEach(function (o) {
      if (o.id === g.id) return;
      (o.areas || []).forEach(function (a) {
        if (a.t === 'barrio' && p.comunas.indexOf(a.c) > -1) p.fuera.push(a.c + '|' + a.b);
      });
    });
    return p;
  }
  // ¿Este polígono está en la zona? c y b leen su comuna y su barrio; r dice si es rural (o null).
  function zonaExpr(p, c, b, r) {
    var clave = ['concat', ['coalesce', c, ''], '|', ['coalesce', b, '']];
    var o = ['any'];
    if (p.barrios.length) o.push(['in', clave, ['literal', p.barrios]]);
    if (p.comunas.length) {
      o.push(['all', ['in', ['coalesce', c, ''], ['literal', p.comunas]],
                     ['!', ['in', clave, ['literal', p.fuera.length ? p.fuera : ['~']]]]]);
    }
    if (p.rural && r) o.push(r);
    return o.length > 1 ? o : false;
  }
  // «Comunas 10 · La Fuente y 09 · Universitaria, y el barrio Campoamor», en palabras.
  function zonaDescribe(g) {
    var c = [], b = [], r = false, p = zonaPartes();
    (g.areas || []).forEach(function (a) {
      if (a.t === 'comuna') c.push(a.c);
      else if (a.t === 'barrio') b.push(enTitulo(a.b) + ' (' + String(a.c).replace(/^\d+ · /, '') + ')');
      else if (a.t === 'rural') r = true;
    });
    function lista(x) { return x.length < 2 ? x.join('') : x.slice(0, -1).join(', ') + ' y ' + x[x.length - 1]; }
    var partes = [];
    if (c.length) partes.push((c.length > 1 ? 'Comunas ' : 'Comuna ') + lista(c));
    if (b.length) partes.push((b.length > 1 ? 'los barrios ' : 'el barrio ') + lista(b));
    if (r) partes.push('la zona rural');
    var t = partes.join(', ');
    t = t.charAt(0).toUpperCase() + t.slice(1);
    if (p && p.fuera.length) {
      t += ', menos ' + lista(p.fuera.map(function (k) { return enTitulo(k.split('|')[1]); })) +
           ', que ' + (p.fuera.length > 1 ? 'son' : 'es') + ' de otro gerente';
    }
    return t + '.';
  }
  function enTitulo(x) {
    return String(x || '').toLowerCase().replace(/(^|[\s(])([a-záéíóúñ])/g, function (m, a, l) { return a + l.toUpperCase(); });
  }
  function miles(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  // Antes de tomar: si el predio es de otra zona se dice, y el ingeniero decide. Lo decidió Julián: avisar, no
  // bloquear. Sin zona asignada, o sin saber dónde queda el predio, no hay nada que avisar.
  function confirmaZona(npn) {
    var mia = zonaMia(), p = VISTOS[npn];
    if (!mia || !p || p.mio) return true;
    var g = gerenteDe(p.comuna, p.barrio, p.zona);
    if (g && g.id === mia.id) return true;
    var ok = window.confirm((p.direccion || 'Este predio') + ' está ' +
      (g ? 'en la zona de ' + g.nombre : 'fuera de las zonas repartidas') +
      (p.comuna ? ' (' + p.comuna + (p.barrio ? ', ' + enTitulo(p.barrio) : '') + ')' : '') + '.\n\n' +
      'Su zona es la de ' + mia.nombre + '. ¿Tomarlo de todas formas?');
    anota('toma_fuera_zona', { detalle: { npn: npn, zona: g ? g.nombre : null, acepta: ok } });
    return ok;
  }

  function mlEstadoVivo() {
    if (mlVivo) return Promise.resolve(mlVivo);
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'estado_vivo' })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { mlVivo = (j && j.cambios) || []; return mlVivo; })
      .catch(function () { return []; });
  }
  // setFeatureState lanza mientras el estilo no ha cargado, y aquí el estilo puede tardar: se reintenta por
  // reloj, no esperando un evento que con mala señal puede no llegar (lo mismo que aprendió la sala).
  function mlPintaVivo(n) {
    if (!mlMapa || !mlVivo || !mlVivo.length) return;
    try {
      mlVivo.forEach(function (c) {
        if (c.n) mlMapa.setFeatureState({ source: 'mz', sourceLayer: 'terrenos', id: c.n }, { est: c.e });
      });
    } catch (e) {
      if ((n || 0) < 120) setTimeout(function () { mlPintaVivo((n || 0) + 1); }, 1000);
    }
  }

  function mlLeyendaHTML() {
    var h = '<h3>Afectación del predio</h3>';
    ORDEN_AF.concat(['NA']).forEach(function (k) {
      h += '<div><i style="background:' + EST_AF[k][1] + '"></i>' + esc(EST_AF[k][0]) + '</div>';
    });
    h += '<h3>' + (mlModo === 'busca' ? 'La búsqueda (borde y punto)' : 'Sus predios (borde y punto)') + '</h3>';
    var P = mlModo === 'busca'
      ? [[COLOR_EST.pendiente, 'Se puede tomar'], [COLOR_EST.hecha, 'Ya es suyo'], [COLOR_EST.no_aplica, 'De otro']]
      : [[COLOR_EST.pendiente, 'Por visitar'], [COLOR_EST.en_curso, 'Empezada'], [COLOR_EST.hecha, 'Hecha']];
    P.forEach(function (x) { h += '<div><i class="ley-punto" style="background:' + x[0] + '"></i>' + x[1] + '</div>'; });
    var g = zonaMia();
    h += '<h3>Su zona</h3>';
    if (g) {
      h += '<div><i class="ley-borde"></i>Límite de la zona de ' + esc(g.nombre) + '</div>' +
           '<div><i class="ley-fuera"></i>Fuera de su zona (más tenue)</div>';
    } else {
      h += '<p>Usted todavía no está en la zona de ningún gerente. Avise al coordinador.</p>';
    }
    h += '<p>Toque cualquier predio para ver su afectación' + (SESION && SESION.explora ? ' y tomarlo' : '') + '.</p>';
    return h;
  }
  function mlLeyenda(abrir) {
    mlLeyAbierta = !!abrir;
    var p = document.getElementById('mlLey'), b = document.getElementById('mlLeyBt');
    if (p) { p.hidden = !mlLeyAbierta; if (mlLeyAbierta) p.innerHTML = mlLeyendaHTML(); }
    if (b) b.setAttribute('aria-expanded', mlLeyAbierta ? 'true' : 'false');
  }

  function mlVerZona(inicial) {
    var z = zonaSesion();
    if (!mlMapa || !z || !z.caja || z.caja.length !== 4) return;
    var c = z.caja;
    mlMapa.fitBounds([[c[0], c[1]], [c[2], c[3]]], {
      padding: { top: 70, bottom: 110, left: 30, right: 64 }, maxZoom: 16, duration: inicial ? 0 : 700
    });
    mlResalta(null);
    if (!inicial) anota('ve_zona');
  }

  // La hoja de un predio que no es de la lista: su afectación y su zona. Con la búsqueda, además, la
  // dirección y el botón para tomarlo: se le pregunta al servidor por su código predial, que es lo que
  // traen las teselas (no llevan dirección).
  function mlHojaAf(f, fila) {
    var h = document.getElementById('mlHoja');
    if (!h) return;
    var p = f.properties || {}, st = f.state || {};
    var id22 = String(p.id22 || p.npn || '').slice(0, 22);
    if (id22.length !== 22) return mlCierraHoja();
    mlSel = null;
    mlResalta({ npn: id22 });
    var est = EST_AF[st.est || p.est] ? (st.est || p.est) : 'NA';
    var rural = p.z === 'R';
    var g = gerenteDe(p.com, p.bar, p.z), mia = zonaMia();
    var zonaTxt = g ? (mia && g.id === mia.id ? 'Su zona' : 'Zona de ' + g.nombre) : 'Sin gerente';
    var datos = [['Zona', zonaTxt]];
    if (p.dest) datos.push(['Destino', String(p.dest)]);
    if (+p.nu > 1) datos.push(['Unidades', String(p.nu)]);
    if (p.niv && p.niv !== 'N' && NIVEL_AF[p.niv]) datos.push(['Nivel', NIVEL_AF[p.niv]]);
    if (fila && fila.ultima_visita) datos.push(['Última visita', String(fila.ultima_visita)]);
    var titulo0 = fila ? ((fila.direccion) || ('Predio ' + id22.slice(-9))) : 'Predio ' + id22.slice(-9);
    var sub = rural ? 'Zona rural' : [enTitulo(p.bar), p.com].filter(Boolean).join(' · ');
    var bts = '';
    if (SESION && SESION.explora) {
      if (!fila) {
        bts = '<div class="nota">' + (navigator.onLine === false ? 'Sin señal no se puede buscar su dirección.'
                                                                   : 'Buscando la dirección…') + '</div>';
      } else {
        var bloqueado = fila.tomado && !fila.mio && !(fila.n_unidades > 1);
        bts = bloqueado
          ? '<div class="nota">Esa vivienda ya está asignada a otro ingeniero.</div>'
          : '<button class="big" type="button" data-a="tomar" data-npn="' + esc(fila.npn) + '">' +
            (fila.mio ? 'Abrir la ficha' : (fila.tomado ? 'Entrar a este edificio' : 'Tomarlo y abrir la ficha')) +
            '</button>';
        if (typeof fila.lat === 'number' && typeof fila.lon === 'number') {
          bts += '<a class="big sec" target="_blank" rel="noopener"' +
                 ' href="https://www.google.com/maps/dir/?api=1&destination=' + fila.lat + ',' + fila.lon + '">Cómo llegar</a>';
        }
      }
    }
    h.innerHTML =
      '<button class="mh-x" type="button" data-a="mlcierra" aria-label="Cerrar">&#215;</button>' +
      '<div class="mh-top"><div class="mh-tit"><b>' + esc(titulo0) + '</b>' +
        (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<span class="chip af" style="--c:' + EST_AF[est][1] + '">' + esc(EST_AF[est][0]) + '</span></div>' +
      // la zona va a lo ancho: el nombre del gerente cortado con «…» no sirve de nada
      '<div class="mh-datos">' + datos.map(function (d, i) {
        return '<div' + (i === 0 ? ' class="ancho"' : '') + '><span>' + esc(d[0]) + '</span><b>' + esc(d[1]) + '</b></div>';
      }).join('') + '</div>' +
      (bts ? '<div class="mh-bts">' + bts + '</div>' : '');
    h.hidden = false;
    var lienzo = h.parentNode;
    lienzo.classList.add('con-hoja');
    lienzo.style.setProperty('--hoja', (h.offsetHeight + 18) + 'px');
    if (fila || !(SESION && SESION.explora) || navigator.onLine === false) return;
    anota('mapa_predio', { campo: id22 });
    var pedido = id22;
    mlAfPedido = pedido;
    fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'explorar', texto: id22 })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var F = (j && j.predios) || [], x = null;
      for (var i = 0; i < F.length; i++) if (String(F[i].npn).slice(0, 22) === pedido) x = F[i];
      var hh = document.getElementById('mlHoja');
      // otra hoja abierta mientras tanto (otro predio, o uno de los suyos): esta respuesta ya no vale
      if (!hh || hh.hidden || mlAfPedido !== pedido || mlSel) return;
      if (!x) {
        var n = hh.querySelector('.mh-bts .nota');
        if (n) n.textContent = 'No se encontró este predio en el catastro vigente.';
        return;
      }
      VISTOS[x.npn] = x;
      mlHojaAf(f, x);
    }).catch(function () {
      var hh = document.getElementById('mlHoja'), n = hh && hh.querySelector('.mh-bts .nota');
      if (n) n.textContent = 'No se pudo traer la dirección. Revise la señal.';
    });
  }

  // ---- la lista de su zona, en Excel o en PDF ------------------------------------------------------------------
  // Los predios de la zona con afectación o solicitud que el ingeniero puede reclamar (campo-sesion,
  // zona_lista). Las librerías se bajan solo al pedir el archivo: son 900 KB (Excel) y 400 KB (PDF) que el
  // teléfono no tiene por qué cargar para trabajar, y la lista necesita señal de todas formas.
  var LIB_XLSX = ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  var LIB_PDF = ['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
                 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js'];
  var zonaBajando = false;

  function cargaScripts(lista) {
    return lista.reduce(function (p, src) {
      return p.then(function () {
        if (document.querySelector('script[data-lib="' + src + '"]')) return;
        return new Promise(function (ok, mal) {
          var s = document.createElement('script');
          s.src = src; s.setAttribute('data-lib', src);
          s.onload = function () { ok(); };
          s.onerror = function () { s.parentNode && s.parentNode.removeChild(s); mal(new Error('sin_libreria')); };
          document.head.appendChild(s);
          setTimeout(function () { mal(new Error('tardo')); }, 45000);
        });
      });
    }, Promise.resolve());
  }

  var DISPONIBLE = { libre: 'Libre', compartido: 'Edificio con otro ingeniero (puede entrar)', suyo: 'Ya es suyo' };
  function filaZona(p, i) {
    return {
      n: i + 1,
      dir: p.direccion || '',
      otras: p.nomenclaturas || '',
      barrio: enTitulo(p.barrio || (String(p.zona).trim() === 'R' ? 'Zona rural' : '')),
      comuna: p.comuna || '',
      af: (EST_AF[p.estado] || EST_AF.NA)[0],
      est: p.estado,
      nivel: NIVEL_AF[p.nivel] || '',
      sol: p.n_solicitudes || 0,
      visita: p.ultima_visita || '',
      fichas: p.n_fichas || 1,
      disp: DISPONIBLE[p.disponible] || p.disponible || '',
      npn: String(p.npn || ''),
      mapa: (typeof p.lat === 'number' && typeof p.lon === 'number')
        ? 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lon : ''
    };
  }
  function nombreZona(ext) {
    var g = zonaMia(), f = new Date();
    var dia = f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' + ('0' + f.getDate()).slice(-2);
    return 'Predios de la zona de ' + (g ? g.nombre : 'su gerente') + ' ' + dia + '.' + ext;
  }
  function avisoZona(txt) {
    var a = document.getElementById('zonaAviso');
    if (a) a.textContent = txt || '';
  }
  function descargaBlob(nombre, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 0);
    setTimeout(function () { URL.revokeObjectURL(url); }, 180000);
    return url;
  }

  function bajaZona(tipo) {
    if (zonaBajando) return;
    if (!zonaMia()) return alert('Usted todavía no está en la zona de ningún gerente. Avise al coordinador.');
    if (navigator.onLine === false) return avisoZona('La lista se arma con los datos de hoy: hace falta señal.');
    zonaBajando = true;
    avisoZona('Preparando la lista…');
    var libs = cargaScripts(tipo === 'pdf' ? LIB_PDF : LIB_XLSX);
    fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'zona_lista' })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || 'No se pudo preparar la lista');
        return j.predios || [];
      });
    }).then(function (P) {
      return libs.then(function () { return P; });
    }).then(function (P) {
      var F = P.map(filaZona);
      var nombre = tipo === 'pdf' ? zonaPDF(F) : zonaXLSX(F);
      anota('descarga_zona', { detalle: { tipo: tipo, predios: F.length } });
      avisoZona('Listo: «' + nombre + '», ' + miles(F.length) + ' predios. Está en Descargas.');
    }).catch(function (e) {
      var m = String(e && e.message || e);
      avisoZona(m === 'sin_libreria' || m === 'tardo'
        ? 'No se pudo bajar la pieza que arma el archivo. Revise la señal e inténtelo otra vez.'
        : m);
    }).then(function () { zonaBajando = false; });
  }

  var COLS_ZONA = [
    ['n', '#', 5], ['dir', 'Dirección (catastro)', 38], ['otras', 'Otras nomenclaturas del predio', 44],
    ['barrio', 'Barrio', 20], ['comuna', 'Comuna', 20], ['af', 'Afectación', 22], ['nivel', 'Nivel de intervención', 20],
    ['sol', 'Solicitudes', 11], ['visita', 'Última visita', 13], ['fichas', 'Fichas', 8], ['disp', 'Disponibilidad', 26],
    ['npn', 'Código predial', 33], ['mapa', 'Ubicación', 16]
  ];
  function zonaXLSX(F) {
    var g = zonaMia(), X = window.XLSX;
    if (!X) throw new Error('sin_libreria');
    var hoy = new Date().toLocaleDateString('es-CO');
    var aoa = [
      ['Predios con afectación o solicitud que puede reclamar · Zona de ' + g.nombre],
      [zonaDescribe(g) + ' Corte: ' + hoy + '. ' + F.length + ' predios. Sin los que ya tiene otro ingeniero.'],
      [],
      COLS_ZONA.map(function (c) { return c[1]; })
    ];
    F.forEach(function (f) {
      aoa.push(COLS_ZONA.map(function (c) { return c[0] === 'mapa' ? (f.mapa ? 'Abrir en Google Maps' : '') : f[c[0]]; }));
    });
    var ws = X.utils.aoa_to_sheet(aoa);
    ws['!cols'] = COLS_ZONA.map(function (c) { return { wch: c[2] }; });
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: COLS_ZONA.length - 1 } },
                     { s: { r: 1, c: 0 }, e: { r: 1, c: COLS_ZONA.length - 1 } }];
    var ultima = X.utils.encode_col(COLS_ZONA.length - 1);
    ws['!autofilter'] = { ref: 'A4:' + ultima + (4 + F.length) };
    var cNpn = COLS_ZONA.map(function (c) { return c[0]; }).indexOf('npn');
    var cMapa = COLS_ZONA.length - 1;
    F.forEach(function (f, i) {
      var r = 4 + i;
      var celda = ws[X.utils.encode_cell({ r: r, c: cNpn })];
      if (celda) { celda.t = 's'; celda.v = f.npn; }             // 30 dígitos: como texto, o Excel los redondea
      var m = ws[X.utils.encode_cell({ r: r, c: cMapa })];
      if (m && f.mapa) m.l = { Target: f.mapa };
    });
    var wb = X.utils.book_new();

  // ---- carga de la librería y de la clave -------------------------------------------------------------------
  function cargaMapLibre() {
    return new Promise(function (ok) {
      if (window.maplibregl && window.pmtiles) return ok(true);
      if (navigator.onLine === false) return ok(false);
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css';
      document.head.appendChild(css);
      var n = 0;
      function cuenta() { if (++n >= 2) ok(!!(window.maplibregl && window.pmtiles)); }
      function pon(src) {
        var s = document.createElement('script');
        s.src = src; s.onload = cuenta; s.onerror = function () { ok(false); };
        document.head.appendChild(s);
      }
      pon('https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js');
      pon('https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js');
      setTimeout(function () { ok(!!(window.maplibregl && window.pmtiles)); }, 15000);
    });
  }

  function b64a(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  // La clave de las teselas se cambia por el token del ingeniero. Si el token no está activo no hay mapa, que es
  // exactamente lo que debe pasar.
  function claveMapa() {
    if (mlKey) return Promise.resolve(mlKey);
    // el número de publicación sirve de rompe-caché: si la sala publicó teselas nuevas, el teléfono no se queda
    // con las viejas guardadas por el navegador
    fetch(MAPA_DATA + 'version.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) { if (v && v.build) mlBuild = String(v.build); })
      .catch(function () {});
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'mapa' })
    }).then(function (r) {
      if (!r.ok) throw new Error('sin clave');
      return r.json();
    }).then(function (j) {
      if (!j || !j.clave) throw new Error('sin clave');
      return crypto.subtle.importKey('raw', new TextEncoder().encode(j.clave), 'PBKDF2', false, ['deriveKey']);
    }).then(function (km) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64a(SALT_MAPA), iterations: ITER_MAPA, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (k) { mlKey = k; return k; });
  }

  function mlRegistra(key) {
    if (mlProto) return;
    mlProto = true;
    mlPM = new pmtiles.PMTiles(MAPA_DATA + 'manizales.pmtiles' + (mlBuild ? '?v=' + mlBuild : ''));
    maplibregl.addProtocol('enc', function (params) {
      var vacio = { data: new Uint8Array() };
      var m = /^enc:\/\/(\d+)\/(\d+)\/(\d+)$/.exec(params.url);
      if (!m) return Promise.resolve(vacio);
      return mlPM.getZxy(+m[1], +m[2], +m[3]).then(function (r) {
        if (!r || !r.data) return null;
        var u = new Uint8Array(r.data);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12));
      }).then(function (pt) {
        if (!pt) return vacio;
        return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')))
          .arrayBuffer().then(function (g) { return { data: new Uint8Array(g) }; });
      }).catch(function () { return vacio; });
    });
  }

        '</div>' +
        '<div class="mapa-bts">' +
          '<button type="button" data-a="ml3d" id="ml3d" aria-pressed="false">3D</button>' +
          '<button type="button" data-a="mlsat" id="mlsat" aria-pressed="false">Sat</button>' +
          '<button type="button" data-a="mlyo" aria-label="Mi ubicación">&#9678;</button>' +
          '<button type="button" data-a="mlfit" aria-label="Ver todos mis predios">&#9635;</button>' +
          (zonaMia() && zonaSesion().caja
            ? '<button type="button" data-a="mlzona" aria-label="Ver su zona entera" style="font-size:10.5px">Zona</button>'
            : '') +
        '</div>' +
        '<div class="mapa-paso" id="mlPaso" hidden></div>' +
        // La leyenda se abre: son la afectación, lo suyo y su zona, y no caben en una píldora.
        '<button type="button" class="mapa-leyenda" id="mlLeyBt" data-a="mlley" aria-expanded="false"' +
          ' aria-controls="mlLey">' +
          ['DEM', 'NOH', 'RES', 'HAB'].map(function (k) { return '<i style="background:' + EST_AF[k][1] + '"></i>'; }).join('') +
          '&nbsp;Colores' + (zonaMia() ? ' y su zona' : '') + '<span class="ley-flecha">&#9650;</span></button>' +
        '<div class="mapa-ley" id="mlLey" hidden></div>' +
        '<div class="mapa-hoja" id="mlHoja" hidden></div>' +
        '<div class="mapa-carga" id="mlCarga"></div>' +
      '</div>';

    // Sin predios propios el mapa sigue sirviendo si hay zona: es la afectación de su zona lo que se mira.
    if (!A.length && !(mlModo === 'mios' && zonaMia())) return mlFin(mlModo === 'busca'
      ? 'La búsqueda no dejó ningún predio que dibujar.'
      : 'Todavía no le han asignado predios.');
    mlLeyAbierta = false;
    if (navigator.onLine === false) return mlFin('El mapa necesita conexión. La lista funciona sin ella.');
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
      return mlFin('Este navegador no puede abrir el mapa cifrado. Use la lista.');
    }

    mlPaso('Cargando el mapa…');
    cargaMapLibre().then(function (ok) {
      if (!ok) throw new Error('No se pudo descargar el mapa. Revise la conexión.');
      if (vista !== 'mapa') return null;
      mlPaso('Pidiendo permiso de los datos…');
      return claveMapa();
    }).then(function (key) {
      if (!key || vista !== 'mapa') return null;
      mlRegistra(key);
      mlPaso('Descifrando el catastro…');
      return mlFondo();
    }).then(function (pos) {
      if (vista !== 'mapa' || !document.getElementById('mlMapa')) return;
      mlArranca(mlEstilo(pos));
    }).catch(function (e) {
      mlFin((e && e.message) || 'No se pudo abrir el mapa.');
    });
    anota('abre_mapa');
  }

  function mlArranca(estilo) {
    // Buscando por cercanía el mapa se abre sobre el ingeniero, que es el sitio que le importa.
    var centro = null, A = mlAsig();
    if (mlModo === 'busca' && BUSCA.punto) centro = [BUSCA.punto.lon, BUSCA.punto.lat];
    for (var i = 0; !centro && i < A.length; i++) {
      if (typeof A[i].lat === 'number' && typeof A[i].lon === 'number') centro = [A[i].lon, A[i].lat];
    }
    var zc = zonaSesion() && zonaSesion().caja;
    if (!centro && zc && zc.length === 4) centro = [(zc[0] + zc[2]) / 2, (zc[1] + zc[3]) / 2];
    if (!centro) centro = [-75.5138, 5.0689];
    mlMapa = new maplibregl.Map({
      container: 'mlMapa', style: estilo, center: centro, zoom: 15.2,
      minZoom: 10, maxZoom: 20, attributionControl: { compact: true },
      maxBounds: [[-76.2, 4.5], [-74.8, 5.7]], pitchWithRotate: true, dragRotate: true
    });
    window.__mapa = mlMapa;   // asidero para diagnosticar desde la consola, como en la sala
    mlMapa.addControl(new maplibregl.NavigationControl({ showZoom: false, visualizePitch: true }), 'top-right');
    mlMapa.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    mlMapa.on('error', function (e) {
      if (e && e.error) console.warn('mapa:', e.error.message || e.error);
    });
    mlMapa.on('load', function () {
      mlFin(null);
      mlEstadoVivo().then(function () { mlPintaVivo(0); });
      // Pedido desde «Ver su zona en el mapa», o sin predios propios: la zona entera.
      if (mlModo === 'mios' && (mlIrZona || !mlAsig().length)) {
        mlIrZona = false;
        mlVerZona(true);
        setTimeout(function () { if (mlMapa) mlMapa.resize(); }, 120);
        return;
      }
      // Se abre sobre un predio y no sobre todos: repartidos por la ciudad, el encuadre general deja el
      // lote en menos de un píxel y no se ve ni el terreno ni la edificación, que es lo que hay que mirar.
      if (mlModo === 'busca') {
        // El punto azul del ingeniero se pinta de entrada, sin esperar a que lo pida: lo que se
        // está mirando es «qué tengo alrededor», y sin el «yo» eso no se lee.
        if (BUSCA.punto && mlMapa.getSource('yo')) {
          mlMapa.getSource('yo').setData({
            type: 'FeatureCollection',
            features: [{ type: 'Feature', properties: {},
              geometry: { type: 'Point', coordinates: [BUSCA.punto.lon, BUSCA.punto.lat] } }]
          });
        }
        mlEncuadra(true);               // aquí sí conviene verlos todos: están en una manzana
      } else {
        var A = mlVisibles(), i = 0;
        for (var k = 0; k < A.length; k++) {
          if ((A[k].estado || 'pendiente') === 'pendiente' || A[k].estado === 'en_curso') { i = k; break; }
        }
        mlVaA(i, true);
      }
      setTimeout(function () { if (mlMapa) mlMapa.resize(); }, 120);
    });
    mlMapa.on('click', function (e) {
      var capas = ['mis-pt', 'mis-cons', 'mis-3d', 'mis-fill', 'lote-fill'].filter(function (c) {
        return mlMapa.getLayer(c);
      });
      var f = mlMapa.queryRenderedFeatures(e.point, { layers: capas });
      if (mlLeyAbierta) mlLeyenda(false);
      if (!f.length) {
        // cualquier otro predio: su afectación, su zona y, con la búsqueda, tomarlo
        var g = mlMapa.getLayer('af-fill') ? mlMapa.queryRenderedFeatures(e.point, { layers: ['af-fill'] }) : [];
        if (g.length) {
          // sin relleno propio, el terreno de uno de los suyos también cae aquí: se abre su hoja de siempre
          var k = String(g[0].properties.npn || g[0].properties.id22 || '').slice(0, 22), A = mlAsig();
          for (var i = 0; i < A.length; i++) if (mlId22(A[i]) === k) return mlHoja(A[i]);
          return mlHojaAf(g[0]);
        }
        return mlCierraHoja();
      }
      mlAbre(f[0]);
    });
  }

  // De un polígono del catastro a la asignación: por el id de la capa propia, o por los 22 dígitos del predio.
  function mlAbre(f) {
    var p = f.properties || {}, a = null;
    if (p.id) a = mlPorId(p.id);
    if (!a) {
      var k = String(p.npn || p.id22 || '').slice(0, 22);
      var A = mlAsig();
      for (var i = 0; i < A.length && !a; i++) if (mlId22(A[i]) === k) a = A[i];
    }
    if (!a) return mlCierraHoja();
    mlHoja(a);
  }

  function mlResalta(a) {
    if (!mlMapa || !mlMapa.getLayer('sel-line')) return;
    var k = a ? [mlId22(a)] : [];
    mlMapa.setFilter('sel-line', ['in', mlClave('npn'), ['literal', k]]);
  }

  function mlCierraHoja() {
    var h = document.getElementById('mlHoja');
    if (h) {
      h.hidden = true;
      h.parentNode.classList.remove('con-hoja');
      h.parentNode.style.removeProperty('--hoja');
    }
    mlSel = null; mlResalta(null);
  }

  // La hoja de un predio de la búsqueda: lo justo para decidir sin salir del mapa, y el botón que
  // lo toma. Tomar y abrir la ficha es un solo gesto — desde la ficha ya se empieza la visita.
  function mlHojaBusca(h, a) {
    var et = a.mio ? ['e', 'Ya es suyo']
           : (a.tomado && a.n_unidades > 1) ? ['l', 'Compartido']
           : a.tomado ? ['b', 'De otro'] : ['b', 'Se puede tomar'];
    var sub = [a.barrio, a.comuna,
               a.por_unidad ? 'en el catastro: ' + a.direccion : null]
                .filter(Boolean).join(' · ');
    var datos = [];
    if (a.distancia_m != null) datos.push(['Distancia', distanciaCorta(a.distancia_m)]);
    if (a.n_unidades > 1) datos.push(['Fichas', String(a.n_unidades)]);
    if (a.ultima_visita) datos.push(['Última visita', String(a.ultima_visita)]);
    var tabla = datos.length
      ? '<div class="mh-datos">' + datos.map(function (d) {
          return '<div><span>' + esc(d[0]) + '</span><b>' + esc(d[1]) + '</b></div>';
        }).join('') + '</div>'
      : '';
    var ir = (typeof a.lat === 'number' && typeof a.lon === 'number')
      ? '<a class="big sec" target="_blank" rel="noopener"' +
        ' href="https://www.google.com/maps/dir/?api=1&destination=' + a.lat + ',' + a.lon + '">Cómo llegar</a>'
      : '';
    // Solo se niega cuando no hay nada que repartir: una vivienda de una sola unidad.
    var bloqueado = a.tomado && !a.mio && !(a.n_unidades > 1);
    var accion = bloqueado
      ? '<div class="nota">Esa vivienda ya está asignada a otro ingeniero.</div>'
      : '<button class="big" type="button" data-a="tomar" data-npn="' + esc(a.npn) + '">' +
        (a.mio ? 'Abrir la ficha'
               : (a.tomado ? 'Entrar a este edificio' : 'Tomarlo y abrir la ficha')) + '</button>' +
        (a.tomado && !a.mio
          ? '<div class="nota">Ya hay otro ingeniero en este edificio. Al entrar verá bloqueadas' +
            ' las fichas que ya levantó.</div>'
          : '');
    h.innerHTML =
      '<button class="mh-x" type="button" data-a="mlcierra" aria-label="Cerrar">&#215;</button>' +
      '<div class="mh-top"><div class="mh-tit"><b>' +
        esc((a.por_unidad ? sinUnidad(a.por_unidad) : a.direccion) ||
            ('Predio ' + String(a.npn || '').slice(-8))) + '</b>' +
        (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<span class="chip ' + et[0] + '">' + et[1] + '</span></div>' +
      tabla +
      '<div class="mh-bts">' + accion + ir + '</div>';
    h.hidden = false;
    var lienzo = h.parentNode;
    lienzo.classList.add('con-hoja');
    lienzo.style.setProperty('--hoja', (h.offsetHeight + 18) + 'px');
    anota('mapa_predio', { campo: String(a.npn || '') });
  }

  function mlHoja(a) {
    var h = document.getElementById('mlHoja');
    if (!h) return;
    mlSel = a; mlResalta(a);
    if (mlModo === 'busca') return mlHojaBusca(h, a);
    var et = ETIQ_PREDIO[a.estado] || ETIQ_PREDIO.pendiente;
    var sub = [a.barrio, a.nombre_edificacion].filter(Boolean).join(' · ');
    var datos = [];
    if (a.uso) datos.push(['Uso', etiquetaLista('uso', a.uso)]);
    if (a.num_pisos) datos.push(['Pisos', String(a.num_pisos)]);
    if (a.unidades && a.unidades.length) datos.push(['Fichas', String(a.unidades.length + (a.unidades_mas || 0))]);
    if (a.eva_previa_clasif) datos.push(['Visita previa', etiquetaLista('habitabilidad', a.eva_previa_clasif)]);
    var tabla = datos.length
      ? '<div class="mh-datos">' + datos.map(function (d) {
          return '<div><span>' + esc(d[0]) + '</span><b>' + esc(d[1]) + '</b></div>';
        }).join('') + '</div>'
      : '';
    var ir = (typeof a.lat === 'number' && typeof a.lon === 'number')
      ? '<a class="big sec" target="_blank" rel="noopener"' +
        ' href="https://www.google.com/maps/dir/?api=1&destination=' + a.lat + ',' + a.lon + '">Cómo llegar</a>'
      : '';
    h.innerHTML =
      '<button class="mh-x" type="button" data-a="mlcierra" aria-label="Cerrar">&#215;</button>' +
      '<div class="mh-top"><div class="mh-tit"><b>' +
        esc(a.direccion || ('Predio ' + String(a.npn || '').slice(-8))) + '</b>' +
        (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<span class="chip ' + et[0] + '">' + et[1] + '</span></div>' +
      tabla +
      '<div class="mh-bts"><button class="big" type="button" data-a="predio" data-id="' + esc(a.id) + '">' +
      'Ver la ficha</button>' + ir + '</div>';
    h.hidden = false;
    // los botones flotantes se suben por encima de la hoja: si no, quedan tapados justo cuando hacen falta
    var lienzo = h.parentNode;
    lienzo.classList.add('con-hoja');
    lienzo.style.setProperty('--hoja', (h.offsetHeight + 18) + 'px');
    anota('mapa_predio', { campo: String(a.id) });
  }

  function mlAplicaFiltro() {
    var c = document.getElementById('mlChips');
    if (c) c.innerHTML = mlChips();
    if (!mlMapa || !mlMapa.isStyleLoaded()) return;
    ['mis-fill', 'mis-line'].forEach(function (id) {
      if (mlMapa.getLayer(id)) mlMapa.setFilter(id, mlFiltroDe('npn'));
    });
    var conPisos = ['!=', ['to-number', ['get', 'pisos'], 1], 0];
    ['mis-cons', 'mis-3d'].forEach(function (id) {
      if (mlMapa.getLayer(id)) mlMapa.setFilter(id, ['all', mlFiltroDe('id22'), conPisos]);
    });
    if (mlMapa.getSource('mios')) mlMapa.getSource('mios').setData(mlPuntos());
    if (mlMapa.getSource('lotes')) mlMapa.getSource('lotes').setData(mlLotes());
    mlCierraHoja();
    mlVaA(0);
  }

  function mlPon3D(on) {
    ml3D = !!on;
    var b = document.getElementById('ml3d');
    if (b) { b.classList.toggle('on', ml3D); b.setAttribute('aria-pressed', ml3D ? 'true' : 'false'); }
    if (!mlMapa) return;
    ['ctx-3d', 'mis-3d'].forEach(function (id) {
      if (mlMapa.getLayer(id)) mlMapa.setLayoutProperty(id, 'visibility', ml3D ? 'visible' : 'none');
    });
    ['ctx-cons', 'mis-cons', 'af-cons'].forEach(function (id) {
      if (mlMapa.getLayer(id)) mlMapa.setLayoutProperty(id, 'visibility', ml3D ? 'none' : 'visible');
    });
    mlMapa.easeTo({ pitch: ml3D ? 55 : 0, zoom: Math.max(mlMapa.getZoom(), ml3D ? 16 : 0), duration: 600 });
    anota('mapa_3d', { paso: ml3D ? 'on' : 'off' });
  }

  function mlPonSat(on) {
    mlSat = !!on;
    var b = document.getElementById('mlsat');
    if (b) { b.classList.toggle('on', mlSat); b.setAttribute('aria-pressed', mlSat ? 'true' : 'false'); }
    if (mlMapa && mlMapa.getLayer('sat')) {
      mlMapa.setLayoutProperty('sat', 'visibility', mlSat ? 'visible' : 'none');
    }
  }

  // Centrar el mapa en la asignación i, a escala de calle: el lote dibujado, la edificación y el número.
  function mlVaA(i, inmediato) {
    var A = mlVisibles();
    if (!mlMapa || !A.length) return;
    mlFoco = ((i % A.length) + A.length) % A.length;
    var a = A[mlFoco], centro = null;
    var an = mlAnillos(a);
    if (an) {                                  // el centro del lote manda sobre el punto de la visita
      var sx = 0, sy = 0, n = 0;
      an[0].forEach(function (p) { sx += p[0]; sy += p[1]; n++; });
      if (n) centro = [sx / n, sy / n];
    }
    if (!centro && typeof a.lat === 'number' && typeof a.lon === 'number') centro = [a.lon, a.lat];
    if (!centro) return;
    mlMapa.easeTo({ center: centro, zoom: 17.6, duration: inmediato ? 0 : 700 });
    mlResalta(a);
    mlPintaPaso();
  }

  function mlPintaPaso() {
    var c = document.getElementById('mlPaso'), A = mlVisibles();
    if (!c) return;
    if (A.length < 2) { c.hidden = true; return; }
    c.hidden = false;
    var a = A[mlFoco] || A[0];
    c.innerHTML = '<button type="button" data-a="mlant" aria-label="Predio anterior">&#8249;</button>' +
      '<span><b>' + esc(a.direccion || ('Predio ' + String(a.npn || '').slice(-8))) + '</b>' +
      '<i>' + (mlFoco + 1) + ' de ' + A.length + '</i></span>' +
      '<button type="button" data-a="mlsig" aria-label="Predio siguiente">&#8250;</button>';
  }

  function mlEncuadra(inicial) {
    if (!mlMapa) return;
    var b = null;
    function suma(lon, lat) {
      if (!b) b = new maplibregl.LngLatBounds([lon, lat], [lon, lat]);
      else b.extend([lon, lat]);
    }
    mlVisibles().forEach(function (a) {
      if (typeof a.lat === 'number' && typeof a.lon === 'number') suma(a.lon, a.lat);
      var an = mlAnillos(a);
      if (an) an.forEach(function (r) { r.forEach(function (p) { suma(p[0], p[1]); }); });
    });
    if (!b) return;
    mlMapa.fitBounds(b, { padding: { top: 96, bottom: 150, left: 40, right: 60 }, maxZoom: 17.5, duration: inicial ? 0 : 700 });
    mlResalta(null);
  }

  function mlUbicame() {
    if (!navigator.geolocation || !mlMapa) return;
    if (mlVigila !== null) { try { navigator.geolocation.clearWatch(mlVigila); } catch (e) {} mlVigila = null; }
    mlVigila = navigator.geolocation.watchPosition(function (p) {
      if (!mlMapa || !mlMapa.getSource('yo')) return;
      var c = [p.coords.longitude, p.coords.latitude];
      mlMapa.getSource('yo').setData({
        type: 'FeatureCollection',
        features: [{ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: c } }]
      });
      mlMapa.easeTo({ center: c, zoom: Math.max(mlMapa.getZoom(), 16.5), duration: 600 });
    }, function () {
      alert('No se pudo tomar su ubicación. Revise el permiso de localización.');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
  }

  // ---------------------------------------------------------------- tutorial
  // Onboarding de bienvenida. Antes eran seis pantallas de texto corrido; ahora cada una lleva su
  // ilustracion, su progreso y se puede pasar deslizando, que es como se leen estas cosas en un telefono.
  function art(cuerpo) {
    return '<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + cuerpo + '</svg>';
  }
  var PASOS_TUTORIAL = [
