    ['Sus predios', 'El trabajo le llega asignado', 'No tiene que buscar direcciones. En &laquo;Sus predios&raquo; están los que le corresponden, con el lote dibujado como lo tiene el catastro y lo que ya se sabe de visitas anteriores.',
     art('<rect x="22" y="22" width="156" height="76" rx="8" fill="none" stroke="#DCE4EC" stroke-width="3"/><circle cx="62" cy="50" r="8" fill="#1F7A44"/><circle cx="104" cy="72" r="8" fill="#C98A00"/><circle cx="142" cy="44" r="8" fill="#B3261E"/><path d="M62 50l42 22 38-28" stroke="#0B3C5D" stroke-width="2" stroke-dasharray="4 4" fill="none"/>')],
    ['Sin señal', 'Se guarda solo, siempre', 'No hay botón de guardar. Cada toque queda en el teléfono aunque no haya señal, aunque cierre la aplicación o se acabe la batería. Las visitas se envían solas cuando vuelva la conexión.',
     art('<rect x="66" y="16" width="68" height="90" rx="9" fill="none" stroke="#0B3C5D" stroke-width="3"/><path d="M84 62l12 12 24-26" stroke="#1F7A44" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 40a26 26 0 0 1 0 40M22 30a38 38 0 0 1 0 60" stroke="#DCE4EC" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M168 40a26 26 0 0 0 0 40M178 30a38 38 0 0 0 0 60" stroke="#DCE4EC" stroke-width="3" fill="none" stroke-linecap="round"/>')],
    ['La escala', 'N, L, M, S y la fotografía', 'En cada elemento marque Ninguno, Leve, Moderado o Severo. Al marcar L, M o S se abre la cámara para ese elemento. La foto no es obligatoria, pero es lo que sostiene el dictamen: tómela siempre que pueda.',
     art('<rect x="16" y="46" width="38" height="38" rx="6" fill="#1F7A44"/><rect x="60" y="46" width="38" height="38" rx="6" fill="#86A81E"/><rect x="104" y="46" width="38" height="38" rx="6" fill="#C98A00"/><rect x="148" y="46" width="38" height="38" rx="6" fill="#B3261E"/><text x="35" y="72" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">N</text><text x="79" y="72" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">L</text><text x="123" y="72" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="167" y="72" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">S</text><circle cx="167" cy="26" r="10" fill="#0B3C5D"/><circle cx="167" cy="26" r="4" fill="#fff"/>')],
    ['Propiedad horizontal', 'Una ficha, una inspección', 'En un edificio cada apartamento o local tiene su propia ficha catastral. Antes de empezar, elija la unidad que está evaluando: la inspección queda registrada contra esa ficha y no contra el edificio entero.',
     art('<rect x="60" y="18" width="80" height="88" rx="5" fill="none" stroke="#0B3C5D" stroke-width="3"/><path d="M60 46h80M60 74h80" stroke="#DCE4EC" stroke-width="2.5"/><rect x="64" y="50" width="34" height="20" rx="3" fill="#C98A00" opacity=".9"/><circle cx="150" cy="60" r="14" fill="none" stroke="#0B3C5D" stroke-width="3"/><path d="M160 70l12 12" stroke="#0B3C5D" stroke-width="3" stroke-linecap="round"/>')],
    ['Cuantificar', 'Cuánto material y cuánta mano de obra', 'Las áreas, longitudes y volúmenes que registre no son un trámite: de ahí sale cuántas tejas, cuánto cemento y cuántos jornales hacen falta para recuperar el inmueble. Tómelos con cuidado.',
     art('<rect x="24" y="30" width="60" height="14" rx="3" fill="#0B3C5D" opacity=".85"/><rect x="24" y="52" width="92" height="14" rx="3" fill="#0B3C5D" opacity=".6"/><rect x="24" y="74" width="44" height="14" rx="3" fill="#0B3C5D" opacity=".4"/><path d="M132 92V44l22-14 22 14v48z" fill="none" stroke="#C98A00" stroke-width="3" stroke-linejoin="round"/><path d="M132 58h44" stroke="#C98A00" stroke-width="3"/>')],
    ['Al cerrar', 'Queda el informe y se envía sola', 'Al terminar, pulse &laquo;Finalizar visita&raquo;: sale en ese momento si hay señal y, si no, queda en el teléfono y se envía sola al volver. El informe del predio, con el dictamen, las cantidades y el registro fotográfico, se descarga en PDF. Puede levantar predios todo el día sin conexión.',
     art('<rect x="52" y="14" width="76" height="94" rx="6" fill="#fff" stroke="#0B3C5D" stroke-width="3"/><path d="M64 38h52M64 54h52M64 70h34" stroke="#DCE4EC" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="86" r="20" fill="#1F7A44"/><path d="M133 86l7 7 13-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>')]
  ];
  var iTuto = 0;

  function pintaTutorial() {
    var p = PASOS_TUTORIAL[iTuto], ultimo = iTuto === PASOS_TUTORIAL.length - 1;
    vista = 'tutorial'; chrome(false);
    var puntos = '';
    for (var i = 0; i < PASOS_TUTORIAL.length; i++) {
      puntos += '<i class="' + (i === iTuto ? 'on' : (i < iTuto ? 'ya' : '')) + '"></i>';
    }
    document.getElementById('main').innerHTML =
      '<div class="pantalla onb">' +
      '<div class="onb-art">' + p[3] + '</div>' +
      '<div class="eyebrow">' + esc(p[0]) + '</div>' +
      '<h1>' + esc(p[1]) + '</h1>' +
      '<p class="lede">' + p[2] + '</p>' +
      '<div class="onb-dots">' + puntos + '</div>' +
      '<button class="big" data-a="tutosig">' + (ultimo ? 'Empezar' : 'Siguiente') + '</button>' +
      (iTuto === 0
        ? '<button class="big sec" data-a="tutosalta">Ya lo sé, saltar</button>'
        : '<button class="big sec" data-a="tutoatras">Atras</button>') +
      '</div>';
    window.scrollTo(0, 0);
    anota('tutorial_paso', { paso: String(iTuto + 1) });
  }

  // Deslizar para pasar de lámina, que es como se espera en un teléfono.
  (function () {
    var x0 = null;
    document.addEventListener('touchstart', function (e) {
      x0 = (vista === 'tutorial' && e.touches.length === 1) ? e.touches[0].clientX : null;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (x0 === null || vista !== 'tutorial') return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) < 55) return;
      if (dx < 0 && iTuto < PASOS_TUTORIAL.length - 1) { iTuto++; pintaTutorial(); }
      else if (dx > 0 && iTuto > 0) { iTuto--; pintaTutorial(); }
    }, { passive: true });
  })();

  // ---------------------------------------------------------------- eventos
  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!b) return;
    var a = b.dataset.a;
    // Tomar un predio de otra zona se pregunta ANTES de soltar el mapa: si dice que no, sigue donde estaba.
    if (a === 'tomar' && !confirmaZona(b.dataset.npn)) { e.preventDefault(); return; }
    // salir del mapa suelta la tarjeta gráfica: dejarlo vivo detrás de la ficha recalienta el teléfono
    if (mlMapa && a.indexOf('ml') !== 0) mlDestruye();

    if (a === 'predio') { e.preventDefault(); return fichaPredio(b.dataset.id); }
    if (a === 'volverpredios') return pintaPredios();
    if (a === 'vercontactos') return cargaContactos();
    if (a === 'aceptadatos') return aceptaTratamiento();
    if (a === 'noaceptadatos' || a === 'ocultacontactos') return cierraContactos();
    if (a === 'buscar') { BUSCA.filas = null; BUSCA.aviso = ''; return pintaBuscador(); }
    if (a === 'buscatexto') return lanzaBusquedaTexto();
    if (a === 'buscagps') return buscaCerca();
    if (a === 'buscamapa') {
      if (!BUSCA.filas || !BUSCA.filas.length) return pintaBuscador();
      return pintaMapaPredios('busca');
    }
    if (a === 'volverbusca') return pintaBuscador();
    if (a === 'corrige') { CORR.filas = null; CORR.aviso = ''; CORR.fallo = false; CORR.enlacePC = false; return pintaCorrige(); }
    if (a === 'enlacepc') { CORR.enlacePC = true; return pintaCorrige(); }
    if (a === 'copiaenlacepc') {
      return copiaAlPortapapeles(enlacePC()).then(function (ok) {
        b.textContent = ok ? 'Copiado ✓' : 'Seleccione el enlace y cópielo';
      });
    }
    if (a === 'corrigeuna') { e.preventDefault(); return pintaCorrigeUna(b.dataset.id); }
    if (a === 'volvercorrige') return pintaCorrige();
    if (a === 'corrigeenvia') return enviaCorreccion(b);
    if (a === 'tomar') { e.preventDefault(); return tomaPredio(b.dataset.npn, b, b.dataset.unidad, b.dataset.busca); }
    if (a === 'mapa') return pintaMapaPredios();
    if (a === 'mlfil') { mlFiltro = b.dataset.f || 'todos'; return mlAplicaFiltro(); }
    if (a === 'ml3d') return mlPon3D(!ml3D);
    if (a === 'mlsat') return mlPonSat(!mlSat);
    if (a === 'mlyo') return mlUbicame();
    if (a === 'mlfit') return mlEncuadra();
    if (a === 'mlant') return mlVaA(mlFoco - 1);
    if (a === 'mlsig') return mlVaA(mlFoco + 1);
    if (a === 'mlcierra') return mlCierraHoja();
    if (a === 'mlley') return mlLeyenda(!mlLeyAbierta);
    if (a === 'mlzona') { mlLeyenda(false); return mlVerZona(); }
    if (a === 'zonamapa') { mlIrZona = true; return pintaMapaPredios(); }
    if (a === 'zonaxlsx') return bajaZona('xlsx');
    if (a === 'zonapdf') return bajaZona('pdf');
    if (a === 'evaluar') {
      if (!predioAbierto) return;
      var elegida = unidadElegida();
      if (elegida === undefined) return pideElegirFicha();
      evaluaPredio(predioAbierto, elegida);
      return;
    }
    // Registro sin daños: en un edificio se eligen las fichas; en una casa va directo al formulario corto.
    if (a === 'sindanos') {
      if (!predioAbierto) return;
      var Us = predioAbierto.unidades || [];
      if (Us.length > 1 || predioAbierto.declaradas) return pintaSinDanos(predioAbierto);
      evaluaPredio(predioAbierto, null, [null]);
      return;
    }
    if (a === 'sdtodas') {
      Array.prototype.forEach.call(document.querySelectorAll('.sd-chk'), function (c) { if (!c.disabled) c.checked = b.dataset.v === '1'; });
      return pintaCuentaSinDanos();
    }
    if (a === 'sdsigue') {
      if (!predioAbierto) return;
      var lote = sinDanosMarcadas();
      if (!lote.length) return pintaCuentaSinDanos();
      evaluaPredio(predioAbierto, lote[0], lote);
      return;
    }
    // Las zonas comunes de un edificio ya cerrado: la única visita que se deja empezar ahí.
    if (a === 'evaluarcomunes') {
      if (!predioAbierto) return;
      evaluaPredio(predioAbierto, FICHA_COMUNES);
      return;
    }
    if (a === 'soltar') { if (predioAbierto) sueltaPredio(predioAbierto); return; }
    if (a === 'declarar') return pintaDeclarar(predioAbierto);
    if (a === 'decarma') return armaDeclaradas();
    if (a === 'decguarda') return guardaDeclaradas();
    if (a === 'quitaunidad') return quitaDeclarada(b.dataset.n);
    if (a === 'decvolver') return predioAbierto ? fichaPredio(predioAbierto.id) : pintaPredios();
    if (a === 'tutorial') { iTuto = 0; return pintaTutorial(); }
    if (a === 'tutoatras') { if (iTuto > 0) iTuto--; return pintaTutorial(); }
    if (a === 'tutosalta') {
      anota('tutorial_salta');
      if (SESION) SESION.tutorial_visto = true;
      guardaLocal(LS_SESION, SESION);
      return SESION ? pintaPredios() : pintaBandeja();
    }
    if (a === 'tutosig') {
      if (iTuto < PASOS_TUTORIAL.length - 1) { iTuto++; return pintaTutorial(); }
      anota('tutorial_fin');
      if (SESION) SESION.tutorial_visto = true;
      guardaLocal(LS_SESION, SESION);
      sueltaEventos();
      return SESION ? pintaPredios() : pintaBandeja();
    }
  });

  window.addEventListener('online', function () { sueltaEventos(); pideSesion(); });

  // El botón de salir del formulario vuelve a los predios cuando hay sesión: lo decide su propio
  // manejador (más arriba), en una sola pantalla y sin temporizador.

  arrancaPiloto();
  refrescaUsados();

  // ================================================================ punto en el mapa
  // Control para corregir la ubicación de un predio cuando el punto que trae la
  // base no corresponde a la edificación que se está evaluando.
  //
  // Dos formas de marcarlo, porque en campo la señal no está garantizada:
  //   · con el GPS, estando frente a la edificación — funciona sin datos;
  //   · moviendo el punto sobre el mapa — necesita conexión para las teselas.
  //
  // Se guarda {lat, lon, origen, acc} para saber después cómo se obtuvo: un punto
  // tomado con GPS a tres metros no vale lo mismo que uno arrastrado a ojo.

  var mapaPunto = null, marcaPunto = null, campoPunto = null;

  function pintaPunto(f, val) {
    var n = f.name;
    var h = '<div class="gps">';

    if (val && typeof val.lat === 'number') {
      var comoSeTomo = val.origen === 'gps'
        ? 'tomado con GPS' + (val.acc ? ' (±' + Math.round(val.acc) + ' m)' : '')
        : 'marcado en el mapa';
      h += '<div class="fix"><span class="buena">Punto corregido</span><br>' +
           val.lat.toFixed(6) + ', ' + val.lon.toFixed(6) + '<br>' + comoSeTomo + '</div>';
    }

    h += '<button type="button" data-a="puntogps" data-n="' + esc(n) + '">' +
         (val ? 'Volver a tomarlo aquí' : 'Estoy frente a la edificación') + '</button>';

    if (navigator.onLine !== false && typeof D.predio_lat === 'number') {
      h += '<a class="secundario enlace" target="_blank" rel="noopener" href="' +
           esc(urlStreetView(D.predio_lat, D.predio_lon)) +
           '">Ver el punto de la base en Street View</a>';
    }
    if (navigator.onLine !== false) {
      h += '<button type="button" class="secundario" data-a="puntomapa" data-n="' + esc(n) + '">' +
           (val ? 'Ajustar en el mapa' : 'Marcarlo en el mapa') + '</button>' +
           '<div class="mapapunto" id="mp_' + esc(n) + '" hidden></div>';
    } else {
      h += '<div class="fix">Sin conexión no se puede abrir el mapa. Tome el punto con el' +
           ' GPS estando frente a la edificación.</div>';
    }
    return h + '</div>';
  }

  // Punto de partida del mapa: lo ya corregido, si no la ubicación del evaluador,
  // si no el punto que trae la base.
  function centroDePartida(n) {
    var v = D[n];
    if (v && typeof v.lat === 'number') return [v.lat, v.lon];
    if (D.ubicacion && typeof D.ubicacion.lat === 'number') return [D.ubicacion.lat, D.ubicacion.lon];
    if (typeof D.predio_lat === 'number') return [D.predio_lat, D.predio_lon];
    return [5.0689, -75.5174];
  }

  function abreMapaPunto(n) {
    var caja = document.getElementById('mp_' + n);
    if (!caja) return;
    if (!caja.hidden && mapaPunto) { caja.hidden = true; return; }   // cerrar
    caja.hidden = false;
    campoPunto = n;

    cargaLeaflet().then(function (ok) {
      caja = document.getElementById('mp_' + n);
      if (!caja) return;
      if (!ok) {
        caja.innerHTML = '<div class="sinmapa">No se pudo cargar el mapa. Tome el punto' +
                         ' con el GPS estando frente a la edificación.</div>';
        return;
      }
      caja.innerHTML = '';
      var c = centroDePartida(n);
      mapaPunto = L.map(caja, { attributionControl: false, fadeAnimation: false }).setView(c, 18);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      }).addTo(mapaPunto);

      // el perímetro del lote según el catastro: es la referencia que dice si el
      // punto cae en la edificación correcta o en la del vecino
      var lote = dibujaContorno(mapaPunto, asignacionActual() || {},
                                { weight: 2, fillOpacity: .1, dashArray: '5,4' });
      if (lote) lote.bindTooltip('Lote según el catastro');

      // el punto que dice la base, como referencia fija
      if (typeof D.predio_lat === 'number') {
        L.circleMarker([D.predio_lat, D.predio_lon], {
          radius: 7, color: '#fff', weight: 2, fillColor: '#8A949C', fillOpacity: .85
        }).addTo(mapaPunto).bindTooltip('Punto de la base');
      }

      // dónde está el ingeniero ahora mismo, para orientarse
      if (D.ubicacion && typeof D.ubicacion.lat === 'number') {
        L.circleMarker([D.ubicacion.lat, D.ubicacion.lon], {
          radius: 6, color: '#fff', weight: 2, fillColor: '#0089C2', fillOpacity: .9
        }).addTo(mapaPunto).bindTooltip('Usted está aquí');
      }

      marcaPunto = L.marker(c, { draggable: true }).addTo(mapaPunto);
      marcaPunto.on('dragend', function () {
        var p = marcaPunto.getLatLng();
        fijaPunto(n, p.lat, p.lng, 'mapa');
      });
      mapaPunto.on('click', function (e) {
        marcaPunto.setLatLng(e.latlng);
        fijaPunto(n, e.latlng.lat, e.latlng.lng, 'mapa');
      });
      // Si aún no hay punto marcado, encuadrar el lote junto con el punto de la
      // base: comparar los dos es justamente la decisión que se está tomando.
      if (lote && !(D[n] && typeof D[n].lat === 'number')) {
        var enc = lote.getBounds();
        if (typeof D.predio_lat === 'number') enc = enc.extend([D.predio_lat, D.predio_lon]);
        mapaPunto.fitBounds(enc, { padding: [30, 30], maxZoom: 19 });
      }
      setTimeout(function () { mapaPunto.invalidateSize(); }, 80);
    });
  }

  // Se guarda sin repintar el paso: repintar mataría el mapa que se está usando.
  function fijaPunto(n, lat, lon, origen, acc) {
    D[n] = { lat: lat, lon: lon, origen: origen };
    if (acc) D[n].acc = acc;
    // Corregir el punto es decir "la edificación está aquí, no donde dice la base".
    // Las columnas lat/lon salen de ${ubicacion}, así que mandan sobre lo que haya
    // tomado el GPS en segundo plano: si no, se guardaría el punto que ya se sabe malo.
    if (n === 'ubicacion_correcta') {
      corregidoAMano = true;
      D.ubicacion = { lat: lat, lon: lon, origen: origen };
      if (acc) D.ubicacion.acc = acc;
    }
    recalcula();
    guardaVisita();
    var caja = document.querySelector('[data-campo="' + n + '"]');
    if (caja) {
      caja.classList.remove('err');
      var fix = caja.querySelector('.fix');
      var texto = origen === 'gps'
        ? 'tomado con GPS' + (acc ? ' (±' + Math.round(acc) + ' m)' : '')
        : 'marcado en el mapa';
      var html = '<span class="buena">Punto corregido</span><br>' +
                 lat.toFixed(6) + ', ' + lon.toFixed(6) + '<br>' + texto;
      if (fix) fix.innerHTML = html;
      else {
        var d = document.createElement('div');
        d.className = 'fix'; d.innerHTML = html;
        caja.querySelector('.gps').insertBefore(d, caja.querySelector('.gps').firstChild);
      }
    }
    anota('punto_corregido', { campo: n, detalle: { origen: origen } });
  }

  // La pregunta del GPS desapareció cuando el predio viene asignado: se confirma
  // o se corrige el punto y con eso basta. Pero las columnas lat/lon de la base
  // salen de ${ubicacion}, así que se toma igual en segundo plano, sin pedir nada.
  // Si el GPS falla, queda el punto corregido y, en último caso, el de la base.
  var pidiendoFondo = false, corregidoAMano = false;
  function capturaUbicacionFondo() {
    // Al corregir una visita enviada el ingeniero ya no está frente al predio: un GPS tomado ahora
    // movería el punto de la visita a donde esté sentado.
    if (REV) return;
    if (corregidoAMano) return;
    if (pidiendoFondo || (D.ubicacion && typeof D.ubicacion.lat === 'number')) return;
    function respaldo() {
      var c = D.ubicacion_correcta;
      if (c && typeof c.lat === 'number') D.ubicacion = { lat: c.lat, lon: c.lon, origen: 'corregido' };
      else if (typeof D.predio_lat === 'number') {
        D.ubicacion = { lat: D.predio_lat, lon: D.predio_lon, origen: 'base' };
      }
      recalcula(); guardaVisita();
    }
    if (!navigator.geolocation) return respaldo();
    pidiendoFondo = true;
    navigator.geolocation.getCurrentPosition(function (pos) {
      pidiendoFondo = false;
      if (corregidoAMano) return;   // llegó tarde: ya se marcó el punto bueno a mano
      D.ubicacion = { lat: pos.coords.latitude, lon: pos.coords.longitude,
                      acc: pos.coords.accuracy, origen: 'gps' };
      recalcula(); guardaVisita();
      anota('gps', { campo: 'ubicacion',
                     detalle: { precision: Math.round(pos.coords.accuracy), fondo: true } });
    }, function () { pidiendoFondo = false; respaldo(); },
       { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  }

  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!b) return;
    var n = b.dataset.n;

    if (b.dataset.a === 'uno' && n === 'predio_coincide') {
      setTimeout(capturaUbicacionFondo, 50);   // tras el repintado del paso
      return;                                   // el resto lo maneja app.js
    }

    if (b.dataset.a === 'puntomapa') { e.preventDefault(); return abreMapaPunto(n); }

    if (b.dataset.a === 'puntogps') {
      e.preventDefault();
      if (!navigator.geolocation) { alert('Este teléfono no permite obtener la ubicación.'); return; }
      var t = b.textContent;
      b.textContent = 'Ubicando…'; b.disabled = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        b.disabled = false; b.textContent = 'Volver a tomarlo aquí';
        fijaPunto(n, pos.coords.latitude, pos.coords.longitude, 'gps', pos.coords.accuracy);
        if (marcaPunto) marcaPunto.setLatLng([pos.coords.latitude, pos.coords.longitude]);
        if (mapaPunto) mapaPunto.setView([pos.coords.latitude, pos.coords.longitude], 18);
      }, function () {
        b.disabled = false; b.textContent = t;
        alert('No se pudo obtener la ubicación. Revise que el GPS y el permiso estén activos.');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      return;
    }
  });

  // ================================================================ contactos del predio
  // Con quién hablar para coordinar la visita: la administración o quien atendió visitas anteriores, quien la pidió,
  // y los propietarios y arrendatarios por apartamento (RUD, catastro y el censo de la Alcaldía). Los da la función
  // campo-contactos, que solo responde si el predio está en la lista del ingeniero y si aceptó el tratamiento de datos
  // (Ley 1581): la primera vez sale el texto y hay que marcar «Acepto». La regla está en el servidor, no aquí.
  //
  // No se guardan en el teléfono —ni IndexedDB ni localStorage—: viven en memoria mientras la app está abierta. Es
  // lo que el texto le pide al ingeniero («no los guarde en su teléfono»), y un teléfono de campo se presta y se pierde.
  // Cada consulta queda registrada en el servidor con quién, qué predio y cuándo.

  var CONTACTOS = {};       // id22 -> lo que devolvió el servidor (solo en memoria)
  var TRATAMIENTO = null;   // el texto vigente, cuando el servidor pide aceptarlo antes de dar los contactos

  function pideContactos(cuerpo) {
    return fetch(API_CONTACTOS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j._estado = r.status; return j; });
    });
  }

  function cajaContactos() { return document.getElementById('contactos'); }

  function tituloContactos(n) {
    return '<div class="seccion"><h2>Contactos del predio</h2>' +
           (n != null ? '<span class="cuenta">' + n + '</span>' : '') + '</div>';
  }

  function pintaContactos(a) {
    var caja = cajaContactos();
    if (!caja) return;
    var id22 = String(a.npn || '').replace(/\D/g, '').slice(0, 22);
    caja.dataset.id22 = id22;
    if (CONTACTOS[id22]) return muestraContactos(id22);
    caja.innerHTML = tituloContactos() +
      '<p class="leyenda">Con quién hablar para coordinar la visita: la administración, quien atendió visitas ' +
      'anteriores, quien la pidió y los propietarios y arrendatarios por apartamento.</p>' +
      '<button class="big sec" data-a="vercontactos">Ver contactos</button>';
  }

  function avisoContactos(texto, reintentar) {
    var caja = cajaContactos();
    if (!caja) return;
    caja.innerHTML = tituloContactos() + '<div class="nota r">' + esc(texto) + '</div>' +
      (reintentar ? '<button class="big sec" data-a="vercontactos">Intentar de nuevo</button>' : '');
  }

  function cargaContactos() {
    var caja = cajaContactos();
    if (!caja) return;
    var id22 = caja.dataset.id22;
    if (navigator.onLine === false || !token()) {
      return avisoContactos('Los contactos necesitan conexión. Ábralos cuando tenga señal.', true);
    }
    caja.innerHTML = tituloContactos() + '<div class="cargando">Buscando contactos…</div>';
    pideContactos({ accion: 'ver', id22: id22 }).then(function (j) {
      if (cajaContactos() !== caja) return;              // ya se fue a otra pantalla
      if (j._estado === 428) { TRATAMIENTO = j; return pintaTratamiento(); }
      if (j._estado !== 200) return avisoContactos(j.error || 'No se pudieron consultar los contactos.', j._estado >= 500);
      CONTACTOS[id22] = j;
      muestraContactos(id22);
    }).catch(function () {
      avisoContactos('No se pudieron consultar los contactos. Revise la señal e inténtelo de nuevo.', true);
    });
  }

  function pintaTratamiento() {
    var caja = cajaContactos();
    if (!caja) return;
    var t = TRATAMIENTO || {};
    caja.innerHTML = '<div class="seccion"><h2>' + esc(t.titulo || 'Tratamiento de datos personales') + '</h2></div>' +
      '<p class="leyenda">Antes de ver los contactos lea esto y acéptelo. Se pide una sola vez.</p>' +
      '<div class="tratamiento">' + esc(t.texto || '') + '</div>' +
      '<label class="acepto"><input type="checkbox" id="aceptoDatos">' +
      '<span>Leí y acepto el tratamiento de datos personales, y me comprometo a usarlos solo para ' +
      'coordinar esta visita.</span></label>' +
      '<button class="big" data-a="aceptadatos" id="btnAceptoDatos" disabled>Aceptar y ver contactos</button>' +
      '<button class="big sec" data-a="noaceptadatos">Ahora no</button>';
    var chk = document.getElementById('aceptoDatos');
    chk.addEventListener('change', function () {
      document.getElementById('btnAceptoDatos').disabled = !chk.checked;
    });
  }

  function aceptaTratamiento() {
    var chk = document.getElementById('aceptoDatos'), btn = document.getElementById('btnAceptoDatos');
    if (!chk || !chk.checked || !TRATAMIENTO) return;
    btn.disabled = true; btn.textContent = 'Guardando…';
    pideContactos({ accion: 'acepta', version: TRATAMIENTO.version }).then(function (j) {
      if (j._estado === 409) { TRATAMIENTO = j; return pintaTratamiento(); }   // el texto cambió mientras lo leía
      if (j._estado !== 200) {
        btn.disabled = false; btn.textContent = 'Aceptar y ver contactos';
        return alert(j.error || 'No se pudo registrar la aceptación. Inténtelo de nuevo.');
      }
      TRATAMIENTO = null;
      cargaContactos();
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Aceptar y ver contactos';
      alert('No se pudo registrar la aceptación. Revise la señal e inténtelo de nuevo.');
    });
  }

  function cierraContactos() {
    var caja = cajaContactos();
    if (!caja) return;
    delete CONTACTOS[caja.dataset.id22];
    TRATAMIENTO = null;
    pintaContactos({ npn: caja.dataset.id22 });
  }

  function telLegible(t) {
    t = String(t);
    if (t.length === 10) return t.slice(0, 3) + ' ' + t.slice(3, 6) + ' ' + t.slice(6);
    if (t.length === 7) return t.slice(0, 3) + ' ' + t.slice(3);
    return t;
  }
  // Un fijo viejo de 7 dígitos es de Manizales: se marca con el indicativo 606.
  function telEnlace(t) { t = String(t); return 'tel:+57' + (t.length === 7 ? '606' + t : t); }

  // «K 23 66 64 Ap 102» y «CARRERA 23 #66-64 APT 102» -> «Ap 102»: el catastro y el RUD escriben la misma unidad
  // de formas distintas, y sin unificarlas la persona salía con «Ap 102 · APT 102». Sin unidad, null.
  var TIPO_UNIDAD = { ap: 'Ap', apto: 'Ap', apt: 'Ap', apartamento: 'Ap', pq: 'Pq', parq: 'Pq', parqueadero: 'Pq',
    lc: 'Local', local: 'Local', of: 'Of', oficina: 'Of', dp: 'Dp', bq: 'Bloque', bl: 'Bloque', bloque: 'Bloque',
    to: 'Torre', torre: 'Torre', casa: 'Casa', int: 'Int', interior: 'Int' };
  function unidadCorta(u) {
    // (?=\b|\d): también «AP102», pegado
    var m = /\b(apartamento|apto|apt|ap|parqueadero|parq|pq|local|lc|oficina|of|dp|bloque|bq|bl|torre|to|casa|interior|int)(?=\b|\d)\.?\s*(.*)$/i
      .exec(String(u || ''));
    return m ? (TIPO_UNIDAD[m[1].toLowerCase()] + ' ' + m[2].replace(/\s+/g, ' ')).trim() : null;
  }
  function unidadesDe(p) {
    var cortas = [], enteras = [], vistas = {};
    (p.unidades || []).forEach(function (u) {
      var c = unidadCorta(u), lista = c === null ? enteras : cortas, texto = c === null ? String(u) : c;
      var llave = (c === null ? 'e:' : 'c:') + texto.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!vistas[llave]) { vistas[llave] = 1; lista.push(texto); }
    });
    return cortas.length ? cortas : enteras;
  }

  function fechaContacto(f) {
    if (!f) return '';
    try { return new Date(f + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }); }
    catch (e) { return ''; }
  }

  function tarjetaContacto(nombre, detalle, tels) {
    var con = tels && tels.length;
    return '<div class="contacto' + (con ? '' : ' sin-tel') + '">' +
      '<div class="c-nombre">' + esc(nombre || 'Sin nombre') + '</div>' +
      (detalle ? '<div class="c-rol">' + esc(detalle) + '</div>' : '') +
      (con ? '<div class="c-tels">' + tels.map(function (t) {
               return '<a href="' + esc(telEnlace(t)) + '">' + esc(telLegible(t)) + '</a>';
             }).join('') + '</div>'
           : '<div class="c-sintel">Sin teléfono registrado</div>') +
      '</div>';
  }

  function muestraContactos(id22) {
    var caja = cajaContactos(), d = CONTACTOS[id22];
    if (!caja || !d) return;
    var C = d.coordinar || [], P = d.personas || [];
    var h = tituloContactos(C.length + P.length) +
      '<div class="nota a">Datos personales: úselos solo para coordinar esta visita. No los copie, no les haga ' +
      'capturas y no los comparta.</div>';
    if (!C.length && !P.length) {
      h += '<div class="nota">No hay contactos registrados para este predio.</div>';
    }
    if (C.length) {
      h += '<div class="seccion"><h2>Para coordinar</h2></div>';
      C.forEach(function (c) {
        var f = fechaContacto(c.fecha);
        h += tarjetaContacto(c.nombre, (c.rol || '') + (f ? ' · ' + f : ''), c.telefonos);
      });
    }
    if (P.length) {
      h += '<div class="seccion"><h2>Por apartamento o unidad</h2></div>';
      P.forEach(function (p) {
        var partes = [];
        if (p.roles && p.roles.length) partes.push(p.roles.join(' y '));
        var u = unidadesDe(p);
        if (u.length) partes.push(u.join(' · '));
        if ((p.fuentes || []).indexOf('RUD') >= 0) partes.push('inscrito en el RUD');
        h += tarjetaContacto(p.nombre, partes.join(' · '), p.telefonos);
      });
    }
    h += '<button class="big sec" data-a="ocultacontactos">Ocultar contactos</button>';
    caja.innerHTML = h;
  }

  // ================================================================ historial del predio
  // Lo que ya se sabe antes de ir: las visitas anteriores de la Alcaldía con sus
  // fotografías, y un enlace a Street View para ver la fachada desde la calle.
  //
  // Las fotos son adjuntos de los Survey123 de la Alcaldía y pesan varios MB, así
  // que no se cargan solas: se abre una cuando alguien la toca. En campo los datos
  // se pagan.

  var HIST = {};          // npn -> {anteriores, nuestras}  (memoria de la sesión)

  var CAT_PREVIA = {
    HAB:  ['v', 'Habitable'],
    RES:  ['a', 'Uso restringido'],
    COL:  ['r', 'No habitable / peligro de colapso'],
    DEM:  ['r', 'Demolición'],
    PDEM: ['a', 'Posible demolición']
  };
  var DANO_PREVIO = {
    'Ninguno': 'Sin daño', 'Parcial_<50%': 'Parcial, menos del 50 %',
    'Parcial_>50%': 'Parcial, más del 50 %', 'Total': 'Total'
  };

  // Los valores llegan como códigos del formulario original: varias opciones
  // separadas por coma y con guiones bajos. Se muestran como lista legible.
  function legible(v) {
    if (!v) return [];
    return String(v).split(",").map(function (x) {
      x = x.trim().replace(/_/g, " ").trim();
      return x ? x.charAt(0).toUpperCase() + x.slice(1).toLowerCase() : "";
    }).filter(Boolean);
  }

  function urlStreetView(lat, lon) {
    return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' +
           lat.toFixed(6) + ',' + lon.toFixed(6);
  }

  function pideHistorial(npn) {
    if (HIST[npn]) return Promise.resolve(HIST[npn]);
    if (navigator.onLine === false || !token()) return Promise.resolve(null);
    return fetch(API_SESION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token-evaluador': token() },
      body: JSON.stringify({ accion: 'historial', npn: npn })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) HIST[npn] = d; return d; })
      .catch(function () { return null; });
  }

  function pintaHistorial(npn) {
    var caja = document.getElementById('historial');
    if (!caja) return;

    if (navigator.onLine === false) {
      caja.innerHTML = '<div class="nota">Las visitas anteriores y sus fotografías' +
        ' necesitan conexión. Revíselas antes de salir a campo.</div>';
      return;
    }
    caja.innerHTML = '<div class="cargando">Buscando visitas anteriores…</div>';

    pideHistorial(npn).then(function (d) {
      caja = document.getElementById('historial');
      if (!caja) return;
      if (!d) {
        caja.innerHTML = '<div class="nota">No se pudo consultar el historial.</div>';
        return;
      }
      var a = d.anteriores || [], propias = (d.nuestras || []).filter(function (x) { return !x.es_prueba; });
      if (!a.length && !propias.length) {
        caja.innerHTML = '<div class="nota">Este predio no tiene visitas anteriores registradas.</div>';
        return;
      }
      anota('ve_historial', { detalle: { npn: npn, anteriores: a.length } });

      var h = '<div class="seccion"><h2>Revisiones anteriores</h2>' +
              '<span class="cuenta">' + a.length + '</span></div>';

      a.forEach(function (v, i) {
        var c = CAT_PREVIA[v.categoria] || ['b', v.habitabilidad || 'Sin clasificar'];
        h += '<div class="previa">' +
             '<div class="previa-cab"><span class="chip ' + c[0] + '">' + esc(c[1]) + '</span>' +
             '<span class="cuando">' + esc(fechaCorta(new Date(v.fecha).getTime())) + '</span></div>';
        var datos = [
          ['Daño', DANO_PREVIO[v.nivel_dano] || v.nivel_dano],
          ['Pisos', v.num_pisos], ['Uso', legible(v.uso).join(', ')],
          ['Sistema', legible(v.sistema).join(', ')]
        ].filter(function (x) { return x[1]; });
        if (datos.length) {
          h += '<div class="previa-datos">' + datos.map(function (x) {
            return '<span><b>' + esc(x[0]) + ':</b> ' + esc(x[1]) + '</span>';
          }).join('') + '</div>';
        }
        var texto = v.conclusiones || v.descripcion;
        if (texto) h += '<p class="previa-txt">' + esc(texto) + '</p>';
        var recs = legible(v.recomendaciones);
        if (recs.length) {
          h += '<div class="previa-recs"><b>Recomendó</b>' +
               recs.map(function (r) { return '<span>' + esc(r) + '</span>'; }).join('') +
               '</div>';
        }
        if (v.fotos && v.fotos.length) {
          h += '<div class="previa-fotos">' + v.fotos.map(function (u, j) {
            return '<button type="button" data-a="verfoto" data-u="' + esc(u) +
                   '" data-cap="' + esc(c[1] + ' · ' + fechaCorta(new Date(v.fecha).getTime())) +
                   '">Foto ' + (j + 1) + '</button>';
          }).join('') + '</div>' +
          '<p class="previa-aviso">Cada fotografía pesa unos 3 MB: se abre solo la que toque.</p>';
        }
        h += '</div>';
      });

      if (propias.length) {
        h += '<div class="seccion"><h2>Ya levantada por nosotros</h2></div>';
        propias.forEach(function (v) {
          h += '<div class="previa"><div class="previa-cab">' +
               '<span class="chip b">' + esc(v.habitabilidad || 'sin clasificar') + '</span>' +
               '<span class="cuando">' + esc(fechaCorta(new Date(v.creada_en).getTime())) +
               '</span></div></div>';
        });
      }
      caja.innerHTML = h;
    });
  }

  // ---------------------------------------------------------------- visor de fotos
  function abreFoto(url, cap) {
    var v = document.getElementById('visorFoto');
    if (!v) {
      v = document.createElement('div');
      v.id = 'visorFoto'; v.className = 'visor';
      document.body.appendChild(v);
    }
    v.innerHTML = '<button class="visor-x" type="button" data-a="cierrafoto">&times;</button>' +
                  '<div class="visor-cap">' + esc(cap || '') + '</div>' +
                  '<div class="visor-carga">Cargando la fotografía…</div>';
    v.classList.add('abierto');
    var im = new Image();
    im.onload = function () {
      var c = v.querySelector('.visor-carga');
      if (c) { c.replaceWith(im); }
    };
    im.onerror = function () {
      var c = v.querySelector('.visor-carga');
      if (c) c.textContent = 'No se pudo cargar la fotografía.';
    };
    im.src = url;
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!b) return;
    if (b.dataset.a === 'verfoto') {
      e.preventDefault();
      return abreFoto(b.dataset.u, b.dataset.cap);
    }
    if (b.dataset.a === 'cierrafoto') {
      var v = document.getElementById('visorFoto');
      if (v) v.classList.remove('abierto');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var v = document.getElementById('visorFoto');
    if (v) v.classList.remove('abierto');
  });

  // ================================================================ firma
  // El XLSForm declara la firma como appearance="signature": en Survey123 se
  // traza con el dedo. Aquí estaba montada como cámara, así que el ingeniero
  // tenía que firmar en papel y fotografiarlo en cada visita. Se traza.
  //
  // Sale un PNG, como cualquier otra imagen del formulario, y viaja por el
  // mismo camino: se guarda en el teléfono y se sube al enviar. Todo pasa en el
  // navegador, así que funciona sin señal.

  var TRAZO = 2.2;              // grosor en píxeles de css
  var ALTO_FIRMA = 170;

  function pintaFirma(f, val) {
    var n = f.name, hay = Array.isArray(val) && val.length;
    return '<div class="firma">' +
      '<canvas class="firma-lienzo" data-firma="' + esc(n) + '" ' +
        'aria-label="Recuadro para firmar" role="img"></canvas>' +
      '<div class="firma-pie">' +
        '<span class="firma-guia">' + (hay ? 'Firmado. Puede rehacerla.'
                                           : 'Firme con el dedo dentro del recuadro') + '</span>' +
        '<button type="button" class="firma-borra" data-a="borrafirma" data-n="' + esc(n) +
        '"' + (hay ? '' : ' disabled') + '>Borrar</button>' +
      '</div></div>';
  }

  // El lienzo se vuelve a crear en cada repintado del paso, así que hay que
  // dimensionarlo y devolverle lo ya firmado cada vez.
  function montaFirmas() {
    var cs = document.querySelectorAll('canvas[data-firma]');
    for (var i = 0; i < cs.length; i++) montaUnaFirma(cs[i]);
  }

  function montaUnaFirma(cv) {
    if (cv.dataset.lista) return;
    cv.dataset.lista = '1';
    var n = cv.dataset.firma;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var ancho = Math.round(cv.getBoundingClientRect().width) || 320;
    cv.width = Math.round(ancho * dpr);
    cv.height = Math.round(ALTO_FIRMA * dpr);
    var g = cv.getContext('2d');
    g.scale(dpr, dpr);
    g.lineWidth = TRAZO; g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#111827';

    // lo ya firmado: se repinta sobre el lienzo nuevo
    var guardado = Array.isArray(D[n]) ? D[n][0] : null;
    if (guardado) {
      var im = new Image();
      im.onload = function () { g.drawImage(im, 0, 0, ancho, ALTO_FIRMA); };
      im.src = guardado;
    }

    var trazando = false, ultX = 0, ultY = 0, huboTrazo = false;

    function punto(e) {
      var r = cv.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      trazando = true; huboTrazo = true;
      var p = punto(e); ultX = p[0]; ultY = p[1];
      // un toque seco sin arrastre también deja marca
      g.beginPath(); g.arc(ultX, ultY, TRAZO / 2, 0, Math.PI * 2); g.fillStyle = '#111827'; g.fill();
      if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} }
    });
    cv.addEventListener('pointermove', function (e) {
      if (!trazando) return;
      e.preventDefault();
      var p = punto(e);
      g.beginPath(); g.moveTo(ultX, ultY); g.lineTo(p[0], p[1]); g.stroke();
      ultX = p[0]; ultY = p[1];
    });
    function suelta() {
      if (!trazando) return;
      trazando = false;
      if (huboTrazo) guardaFirma(n, cv);
    }
    cv.addEventListener('pointerup', suelta);
    cv.addEventListener('pointercancel', suelta);
    cv.addEventListener('pointerleave', suelta);
  }

  // Se guarda sin repintar el paso: repintar destruiría el lienzo a medio firmar.
  function guardaFirma(n, cv) {
    // fondo blanco, para que la firma no salga transparente sobre negro al
    // imprimirla o al abrirla desde el panel
    var fondo = document.createElement('canvas');
    fondo.width = cv.width; fondo.height = cv.height;
    var gf = fondo.getContext('2d');
    gf.fillStyle = '#ffffff'; gf.fillRect(0, 0, fondo.width, fondo.height);
    gf.drawImage(cv, 0, 0);
    D[n] = [fondo.toDataURL('image/png')];
    recalcula();
    guardaVisita();
    var caja = document.querySelector('[data-campo="' + n + '"]');
    if (caja) {
      caja.classList.remove('err');
      var g = caja.querySelector('.firma-guia');
      if (g) g.textContent = 'Firmado. Puede rehacerla.';
      var b = caja.querySelector('.firma-borra');
      if (b) b.disabled = false;
    }
  }

  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-a="borrafirma"]') : null;
    if (!b) return;
    e.preventDefault();
    var n = b.dataset.n;
    var cv = document.querySelector('canvas[data-firma="' + n + '"]');
    if (cv) {
      var g = cv.getContext('2d');
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, cv.width, cv.height);
      g.restore();
    }
    D[n] = [];
    recalcula(); guardaVisita();
    var caja = document.querySelector('[data-campo="' + n + '"]');
    if (caja) {
      var gu = caja.querySelector('.firma-guia');
      if (gu) gu.textContent = 'Firme con el dedo dentro del recuadro';
    }
    b.disabled = true;
  });

})();
</script>
<script>
// El service worker solo existe si la app se sirve desde un servidor propio.
// En una página suelta o en un archivo local no hay ninguno, y no pasa nada:
// el archivo ya se abre sin red y los datos viven en el propio teléfono.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
